er":["E"],"answerStr":"E","rationale":"硫酸镁可解除血管痉挛、降低血压并抗惊厥，是子痫的首选药物。","expl":{"A":"错，地西泮仅作辅助。","B":"错，硫喷妥钠为麻醉药。","C":"错，水合氯醛非首选。","D":"错，吗啡抑制呼吸，不宜用于子痫。","E":"正确，硫酸镁为子痫首选药。"}},{"id":"ch12_q30","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"B","num":30,"stem":"作用维持最长的巴比妥药物","options":{"A":"苯巴比妥","B":"司可巴比妥","C":"戊巴比妥","D":"硫喷妥","E":"异戊巴比妥"},"answer":["A"],"answerStr":"A","rationale":"苯巴比妥为长效巴比妥类，作用维持时间最长（约6~8小时）。","expl":{"A":"正确，苯巴比妥属长效类，作用维持最长。","B":"错误，司可巴比妥属短效类，维持约2~3小时。","C":"错误，戊巴比妥属中效类，维持约3~6小时。","D":"错误，硫喷妥属超短效类，仅维持约15分钟。","E":"错误，异戊巴比妥属中效类，维持时间短于苯巴比妥。"}},{"id":"ch12_q31","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"B","num":31,"stem":"作用维持最短的巴比妥类药物","options":{"A":"苯巴比妥","B":"司可巴比妥","C":"戊巴比妥","D":"硫喷妥","E":"异戊巴比妥"},"answer":["D"],"answerStr":"D","rationale":"硫喷妥钠为超短效巴比妥类，静脉给药后迅速入脑、再快速再分布，作用仅维持约15分钟，故维持最短。","expl":{"A":"错误，苯巴比妥为长效类。","B":"错误，司可巴比妥为短效类。","C":"错误，戊巴比妥为中效类。","D":"正确，硫喷妥为超短效类，作用维持最短。","E":"错误，异戊巴比妥为中效类。"}},{"id":"ch12_q32","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"C","num":32,"stem":"三唑仑的用途是","options":{"A":"镇静催眠","B":"治疗破伤风惊厥","C":"两者均可","D":"两者均否"},"answer":["C"],"answerStr":"C","rationale":"三唑仑为苯二氮卓类，具有镇静催眠作用，也具有抗惊厥作用，可用于破伤风惊厥。","expl":{"A":"不完整，镇静催眠是其用途之一。","B":"不完整，治疗破伤风惊厥是其用途之一。","C":"正确，两者均可。","D":"错，三唑仑具镇静催眠及抗惊厥作用。"}},{"id":"ch12_q33","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"C","num":33,"stem":"水合氯醛的用途是","options":{"A":"镇静催眠","B":"治疗破伤风惊厥","C":"两者均可","D":"两者均否"},"answer":["C"],"answerStr":"C","rationale":"水合氯醛既有镇静催眠作用，又有抗惊厥作用，可用于破伤风惊厥。","expl":{"A":"不完整，镇静催眠为其用途之一。","B":"不完整，治疗破伤风惊厥为其用途之一。","C":"正确，两者均可。","D":"错，水合氯醛两者均可。"}},{"id":"ch12_q34","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"C","num":34,"stem":"治疗癫痫持续状态和小儿惊厥","options":{"A":"氯丙嗪","B":"苯巴比妥","C":"两者均可","D":"两者均否"},"answer":["B"],"answerStr":"B","rationale":"苯巴比妥可治疗癫痫持续状态和小儿惊厥，氯丙嗪无此作用。","expl":{"A":"错，氯丙嗪不用于癫痫和小儿惊厥。","B":"正确，苯巴比妥两者均可治疗。","C":"错，仅苯巴比妥有效。","D":"错，苯巴比妥有效。"}},{"id":"ch12_q35","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"C","num":35,"stem":"治疗晕车晕船引起的呕吐","options":{"A":"氯丙嗪","B":"苯巴比妥","C":"两者均可","D":"两者均否"},"answer":["D"],"answerStr":"D","rationale":"氯丙嗪镇吐对前庭性晕动病无效，苯巴比妥无抗晕动作用，故两者均不宜。","expl":{"A":"错，氯丙嗪对晕动病呕吐无效。","B":"错，苯巴比妥无抗晕动镇吐作用。","C":"错，两者均不能治疗晕动病呕吐。","D":"正确，两者均否。"}},{"id":"ch12_q36","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"X","num":36,"stem":"苯二氮卓类具有下列哪些药理作用？","options":{"A":"镇静催眠作用","B":"抗焦虑作用","C":"抗惊厥作用","D":"镇吐作用","E":"抗晕动作用"},"answer":["A","B","C"],"answerStr":"ABC","rationale":"苯二氮卓类具有镇静催眠、抗焦虑、抗惊厥作用，但无镇吐和抗晕动作用。","expl":{"A":"正确，有镇静催眠作用。","B":"正确，有抗焦虑作用。","C":"正确，有抗惊厥作用。","D":"错，无镇吐作用。","E":"错，无抗晕动作用。"}},{"id":"ch12_q37","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"X","num":37,"stem":"地西泮用作麻醉前给药的优点有","options":{"A":"安全范围大","B":"镇静作用发生快","C":"使病人对手术中不良反应不复记忆","D":"减少麻醉药的用量","E":"缓解病人对手术的恐惧情绪"},"answer":["A","B","C","D","E"],"answerStr":"ABCDE","rationale":"地西泮安全范围大、起效快、有遗忘作用，可减少麻醉药用量并缓解恐惧，均是其麻醉前给药的优点。","expl":{"A":"正确，安全范围大。","B":"正确，镇静作用发生快。","C":"正确，产生顺行性遗忘。","D":"正确，可减少麻醉药用量。","E":"正确，缓解对手术的恐惧。"}},{"id":"ch12_q38","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"X","num":38,"stem":"关于苯二氮卓类抗焦虑作用，下列叙述哪些正确？","options":{"A":"小于镇静剂量即有良好的抗焦虑作用","B":"抗焦虑作用的部位在边缘系统","C":"对持续性症状且选用长效类药物","D":"对间断性严重焦虑者宜选用中、短效类药物","E":"地西泮和氯氮卓是常用的抗焦虑药"},"answer":["A","B","C","D","E"],"answerStr":"ABCDE","rationale":"苯二氮卓类小剂量即抗焦虑、作用部位在边缘系统，持续性选长效、间断性选短效，地西泮和氯氮卓为常用药。","expl":{"A":"正确，小于镇静剂量即抗焦虑。","B":"正确，抗焦虑部位在边缘系统。","C":"正确，持续性症状宜选长效类。","D":"正确，间断性严重焦虑宜选中短效类。","E":"正确，两者均为常用抗焦虑药。"}},{"id":"ch12_q39","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"X","num":39,"stem":"苯二氮卓类可能引起下列哪些不良反应？","options":{"A":"嗜睡","B":"共济失调","C":"依赖性","D":"成瘾性","E":"长期使用后突然停药可出现戒断症状"},"answer":["A","B","C","D","E"],"answerStr":"ABCDE","rationale":"苯二氮卓类可引起嗜睡、共济失调，长期使用可产生依赖和成瘾，骤停出现戒断症状。","expl":{"A":"正确，可致嗜睡。","B":"正确，可致共济失调。","C":"正确，可产生依赖性。","D":"正确，可产生成瘾性。","E":"正确，骤停可出现戒断症状。"}},{"id":"ch12_q40","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"X","num":40,"stem":"关于苯二氮卓类的不良反应特点，下列哪些是正确的？","options":{"A":"过量致急性中毒和呼吸抑制","B":"安全范围比巴妥类大","C":"可透过胎盘屏障和随乳汁分泌，孕妇和哺乳妇女忌用","D":"长期作药仍可产生耐受性","E":"与巴比妥类相比，其戒断症状发生较迟、较轻"},"answer":["A","B","C","D","E"],"answerStr":"ABCDE","rationale":"苯二氮卓类过量可致中毒和呼吸抑制，安全范围大于巴比妥类，可透过胎盘和乳汁，长期用可耐受，戒断较轻迟。","expl":{"A":"正确，过量可急性中毒和呼吸抑制。","B":"正确，安全范围比巴比妥类大。","C":"正确，可透过胎盘和乳汁，孕妇哺乳忌用。","D":"正确，长期使用仍可耐受。","E":"正确，戒断症状较迟、较轻。"}},{"id":"ch12_q41","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"X","num":41,"stem":"巴比妥类可能出现下列哪些不良反应","options":{"A":"眩晕、困倦","B":"精神运动不协调","C":"偶见致剥脱性皮炎","D":"中等剂量即可轻度抑制呼吸中枢","E":"严重肺功能不全或颅脑损伤致呼吸抑制者禁用"},"answer":["A","B","C","D","E"],"answerStr":"ABCDE","rationale":"巴比妥类可引起眩晕困倦、共济失调、偶见剥脱性皮炎，中等剂量抑制呼吸，肺功能不全者禁用。","expl":{"A":"正确，可引起眩晕、困倦。","B":"正确，可引起精神运动不协调。","C":"正确，偶可致剥脱性皮炎。","D":"正确，中等剂量即轻度抑制呼吸。","E":"正确，严重肺功能不全者禁用。"}},{"id":"ch12_q42","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"X","num":42,"stem":"巴比妥类镇静催眠药的特点是","options":{"A":"连续久服可引起习惯性","B":"突然停药易发生反跳现象","C":"长期使用突然停药可使梦魇增多","D":"长期使用突然停药可使快动眼时间延长","E":"长期使用可以成瘾"},"answer":["A","B","C","D","E"],"answerStr":"ABCDE","rationale":"巴比妥类久用可成瘾和产生习惯性，停药易反跳、REM延长、梦魇增多。","expl":{"A":"正确，连续久服可引起习惯性。","B":"正确，突然停药易反跳。","C":"正确，停药可使梦魇增多。","D":"正确，停药使REM时间延长。","E":"正确，长期使用可成瘾。"}},{"id":"ch12_q43","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"X","num":43,"stem":"关于巴比妥类剂量的叙述，下列哪些是正确的？","options":{"A":"小剂量产生镇静作用","B":"必须用到镇静剂量才有抗焦虑作用","C":"剂量由小到大，可相继出现镇静、催眠、抗惊厥、麻醉作用","D":"中等量可轻度抑制呼吸中枢","E":"10 倍催眠剂量可致病人死亡"},"answer":["A","B","C","D","E"],"answerStr":"ABCDE","rationale":"巴比妥类剂量由小到大相继出现镇静、催眠、抗惊厥、麻醉作用，中等量抑制呼吸，10倍催眠量可致死。","expl":{"A":"正确，小剂量产生镇静。","B":"正确，镇静剂量才有抗焦虑作用。","C":"正确，随剂量增大出现镇静至麻醉作用。","D":"正确，中等量轻度抑制呼吸。","E":"正确，10倍催眠量可致死。"}},{"id":"ch12_q44","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"X","num":44,"stem":"关于苯二氮卓类的作用机制，下列哪些是正确的？","options":{"A":"促进 GABA 与 GABAA 受体结合","B":"促进 Cl－通道开放","C":"使 Cl－开放时间处长","D":"使用权 Cl－ 内流增大","E":"使用权 Cl－通道开放的频率增加"},"answer":["A","E"],"answerStr":"AE","rationale":"苯二氮卓类促进GABA与GABAA受体结合，并增加氯离子通道开放频率；延长开放时间的是巴比妥类。","expl":{"A":"正确，促进GABA与GABAA受体结合。","B":"错，不直接促进通道开放，而是增频。","C":"错，延长Cl-开放时间是巴比妥类作用。","D":"错，并非直接增大Cl-内流。","E":"正确，增加Cl-通道开放频率。"}},{"id":"ch12_q45","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"X","num":45,"stem":"关于苯二氮卓类体内过程，下列叙述哪些正确？","options":{"A":"口服吸收良好","B":"与血浆蛋白结合率高","C":"分布容积大","D":"脑脊液中浓度与血清游离药物浓度相等","E":"主要在肝脏进行生物转化"},"answer":["A","B","C","D","E"],"answerStr":"ABCDE","rationale":"苯二氮卓类口服吸收良好、血浆蛋白结合率高、分布容积大，脑脊液浓度与游离药物浓度相等，主要经肝代谢。","expl":{"A":"正确，口服吸收良好。","B":"正确，血浆蛋白结合率高。","C":"正确，分布容积大。","D":"正确，脑脊液浓度与血清游离浓度相等。","E":"正确，主要在肝内生物转化。"}},{"id":"ch12_q46","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"X","num":46,"stem":"短期内反复应用巴比妥类产生耐受性的主要原因是","options":{"A":"血浆蛋白结合率高，消除缓慢","B":"神经组织对药物产生适应症","C":"促进肝细胞葡萄糖醛酸转移酶的生成","D":"诱导肝药酶加速自身代谢","E":"以上均不是"},"answer":["B","D"],"answerStr":"BD","rationale":"短期内反复应用产生耐受性，与神经组织适应性和诱导肝药酶加速自身代谢有关。","expl":{"A":"错，蛋白结合率高、消除缓慢非耐受原因。","B":"正确，神经组织产生适应性。","C":"错，促进葡萄糖醛酸转移酶是利胆机制。","D":"正确，诱导肝药酶加速自身代谢。","E":"错，B、D正确。"}},{"id":"ch12_q47","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"X","num":47,"stem":"下述哪些疾病可应用苯巴比妥？","options":{"A":"甲亢病人 的精神紧张","B":"神经衰弱所致的失眠","C":"小儿高热所致的失眠","D":"癫痫持续状态","E":"以是均不是"},"answer":["A","B","C","D"],"answerStr":"ABCD","rationale":"苯巴比妥可镇静抗焦虑、抗惊厥和抗癫痫，故可用于甲亢精神紧张、神经衰弱失眠、小儿高热惊厥及癫痫持续状态。","expl":{"A":"正确，可镇静缓解甲亢精神紧张。","B":"正确，可用于神经衰弱失眠。","C":"正确，可用于小儿高热惊厥。","D":"正确，可用于癫痫持续状态。","E":"错，A~D均可应用。"}},{"id":"ch12_q48","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"X","num":48,"stem":"下列关于地西泮的描述，正确的是","options":{"A":"对精神分裂症无效","B":"可用作麻醉前给药","C":"有中枢性骨骼肌松弛作用","D":"无成瘾性","E":"以上均是"},"answer":["A","B","C"],"answerStr":"ABC","rationale":"地西泮对精神分裂症无效，可用作麻醉前给药并有中枢性肌松作用，但长期用可成瘾。","expl":{"A":"正确，对精神分裂症无效。","B":"正确，可用作麻醉前给药。","C":"正确，有中枢性骨骼肌松弛作用。","D":"错，地西泮可产生依赖性。","E":"错，D项不正确。"}},{"id":"ch12_q49","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"X","num":49,"stem":"解救口服巴比妥类药物中毒的病人，应采取","options":{"A":"补液并加利尿药","B":"用硫酸钠导泻","C":"用碳酸氢钠碱化尿液","D":"用中枢兴奋药维持呼吸","E":"洗胃"},"answer":["A","B","C","D","E"],"answerStr":"ABCDE","rationale":"解救巴比妥类中毒应洗胃、硫酸钠导泻、碱化尿液加速排泄、补液利尿，必要时用中枢兴奋药维持呼吸。","expl":{"A":"正确，补液并用利尿药促排泄。","B":"正确，用硫酸钠导泻（忌硫酸镁）。","C":"正确，碳酸氢钠碱化尿液促排泄。","D":"正确，中枢兴奋药维持呼吸。","E":"正确，应及时洗胃。"}},{"id":"ch12_q50","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"X","num":50,"stem":"对快波睡眠时相影响极小的药物是","options":{"A":"苯巴比妥","B":"水合氯醛","C":"甲丙氮酯","D":"地西泮","E":"戊巴比妥"},"answer":["B","D"],"answerStr":"BD","rationale":"水合氯醛和地西泮对快波睡眠（REM）时相影响极小，其余药物可缩短REM。","expl":{"A":"错，苯巴比妥明显缩短REM。","B":"正确，水合氯醛对REM影响小。","C":"错，甲丙氨酯可缩短REM。","D":"正确，地西泮对REM影响较小。","E":"错，戊巴比妥缩短REM。"}}]},{"title":"第十六章 抗癫痫药和抗惊厥药","questions":[{"id":"ch13_q01","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"A","num":1,"stem":"硫酸镁抗惊厥的作用机制是","options":{"A":"特异性地竞争 Ca2＋受点，拮抗 Ca2＋的作用","B":"阻碍高频异常放电的神经元的 Na＋通道","C":"作用同苯二氮卓类","D":"抑制中枢多突触反应，减弱易化，增强抑制","E":"以是都不是"},"answer":["A"],"answerStr":"A","rationale":"硫酸镁通过竞争性拮抗Ca2+结合位点，抑制神经肌肉接头兴奋传递和中枢兴奋性，从而产生抗惊厥作用。","expl":{"A":"正确，硫酸镁特异竞争Ca2+结合位点、拮抗Ca2+作用，是其抗惊厥的关键机制。","B":"阻滞高频异常放电神经元Na+通道是苯妥英钠等抗癫痫药的机制，与硫酸镁无关。","C":"硫酸镁不作用于苯二氮卓类受体-氯通道复合物，作用机制与苯二氮卓类不同。","D":"抑制中枢多突触反应、增强GABA抑制是苯二氮卓类和巴比妥类的作用特点。","E":"该项否定正确答案，表述错误。"}},{"id":"ch13_q02","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"A","num":2,"stem":"苯妥英钠是何种疾病的首选药物？","options":{"A":"癫痫小发作","B":"癫痫大发作","C":"癫痫精神运动性发作","D":"帕金森病发作","E":"小儿惊厥"},"answer":["B"],"answerStr":"B","rationale":"苯妥英钠是癫痫大发作（强直-阵挛发作）的首选药物，疗效确切。","expl":{"A":"癫痫小发作首选乙琥胺，苯妥英钠无效甚至可加重小发作。","B":"正确，苯妥英钠是癫痫大发作的首选药物。","C":"精神运动性发作首选卡马西平，苯妥英钠非首选。","D":"帕金森病与抗癫痫药无关，苯妥英钠不适用。","E":"小儿惊厥常用地西泮或苯巴比妥，苯妥英钠非首选。"}},{"id":"ch13_q03","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"A","num":3,"stem":"苯妥英钠可能使下列何种癫痫症状恶化？","options":{"A":"大发作","B":"失神小发作","C":"部分性发作","D":"中枢疼痛综合症","E":"癫痫持续状态"},"answer":["B"],"answerStr":"B","rationale":"苯妥英钠可加重失神小发作，因此失神小发作患者禁用或慎用该药。","expl":{"A":"癫痫大发作是苯妥英钠的适应症，不会使之恶化。","B":"正确，苯妥英钠可加重失神小发作。","C":"部分性发作是苯妥英钠的适应症，可有效控制。","D":"中枢疼痛综合征可用苯妥英钠治疗，不属恶化。","E":"癫痫持续状态可静脉注射苯妥英钠，不使之恶化。"}},{"id":"ch13_q04","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"A","num":4,"stem":"乙琥胺是治疗何种癫痫的常用药物？","options":{"A":"失神小发作","B":"大发作","C":"癫痫持续状态","D":"部分性发作","E":"中枢疼痛综合症"},"answer":["A"],"answerStr":"A","rationale":"乙琥胺是失神小发作的首选药，疗效好且不良反应相对较少。","expl":{"A":"正确，乙琥胺是治疗失神小发作的首选药。","B":"癫痫大发作首选苯妥英钠，乙琥胺无效。","C":"癫痫持续状态首选地西泮，乙琥胺不适用。","D":"部分性发作常用卡马西平或苯妥英钠，乙琥胺无效。","E":"中枢疼痛综合征常用苯妥英钠或卡马西平，乙琥胺无效。"}},{"id":"ch13_q05","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"A","num":5,"stem":"硫酸镁中毒时，特异性的解救措施是","options":{"A":"静脉输注 NaHCO3 ，加快排泄","B":"静脉滴注毒扁豆碱","C":"静脉缓慢注射氯化钙","D":"进行人工呼吸","E":"静脉注射呋塞米，加速药物排泄"},"answer":["C"],"answerStr":"C","rationale":"硫酸镁中毒时静注钙剂可竞争性拮抗Mg2+对Ca2+结合位点的作用，是特异性解救措施。","expl":{"A":"输注碳酸氢钠碱化尿液主要用于促进某些弱酸性药排泄，不拮抗镁中毒。","B":"毒扁豆碱是胆碱酯酶抑制剂，用于解救阿托品中毒，与镁中毒无关。","C":"正确，静脉缓慢注射氯化钙可拮抗镁离子，是硫酸镁中毒的特异性解救。","D":"人工呼吸只是维持呼吸的辅助措施，非特异性拮抗。","E":"呋塞米利尿不能特异性拮抗镁离子对钙结合位点的作用。"}},{"id":"ch13_q06","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"A","num":6,"stem":"治疗中枢疼痛综合症的首选药物是","options":{"A":"苯妥英钠","B":"吲哚美辛","C":"苯巴比妥","D":"乙琥胺","E":"地西泮"},"answer":["A"],"answerStr":"A","rationale":"苯妥英钠能稳定神经细胞膜、抑制异常放电，对中枢性疼痛综合征有良好疗效，被列为首选药。","expl":{"A":"正确，苯妥英钠是治疗中枢性疼痛综合征的首选药。","B":"吲哚美辛是解热镇痛抗炎药，对神经病理性疼痛疗效差，非首选。","C":"苯巴比妥主要抗癫痫、镇静催眠，不用于中枢性疼痛。","D":"乙琥胺仅用于失神小发作，对神经痛无效。","E":"地西泮是镇静抗焦虑药，非中枢疼痛综合征首选。"}},{"id":"ch13_q07","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"A","num":7,"stem":"治疗三叉神经痛和舌咽神经痛的首选药物是","options":{"A":"卡马西平","B":"阿司匹林","C":"苯巴比妥","D":"戊巴比妥钠","E":"乙琥胺"},"answer":["A"],"answerStr":"A","rationale":"卡马西平对三叉神经痛和舌咽神经痛疗效显著，是治疗该类神经痛的首选药物。","expl":{"A":"正确，卡马西平对三叉神经痛和舌咽神经痛疗效好，是首选药。","B":"阿司匹林对神经病理性疼痛疗效差，非首选。","C":"苯巴比妥不用于神经痛。","D":"戊巴比妥钠主要镇静催眠，不用于神经痛。","E":"乙琥胺仅用于失神小发作，对神经痛无效。"}},{"id":"ch13_q08","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"A","num":8,"stem":"下列哪种药物属于广谱抗癫痫药？","options":{"A":"卡马西平","B":"丙戊酸钠","C":"苯巴比妥","D":"苯妥英钠","E":"乙琥胺"},"answer":["B"],"answerStr":"B","rationale":"丙戊酸钠对各型癫痫均有效，属广谱抗癫痫药，其余药物作用谱较窄。","expl":{"A":"卡马西平对失神发作无效，非广谱。","B":"正确，丙戊酸钠对各型癫痫均有效，属广谱抗癫痫药。","C":"苯巴比妥对失神发作无效，非广谱。","D":"苯妥英钠对失神发作无效甚至加重，非广谱。","E":"乙琥胺仅对失神小发作有效，非广谱。"}},{"id":"ch13_q09","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"A","num":9,"stem":"适用于治疗癫痫不典型不发作和婴儿痉挛的药物是","options":{"A":"地西泮","B":"苯妥英钠","C":"硝西泮","D":"丙戊酸钠","E":"卡马西平"},"answer":["C"],"answerStr":"C","rationale":"硝西泮属苯二氮卓类，对癫痫不典型失神发作和婴儿痉挛有较好疗效。","expl":{"A":"地西泮主要用于癫痫持续状态，非此类发作的首选。","B":"苯妥英钠对失神发作及婴儿痉挛无效甚至加重。","C":"正确，硝西泮对不典型失神发作和婴儿痉挛有效。","D":"丙戊酸钠虽广谱，但婴儿痉挛常选硝西泮等苯二氮卓类。","E":"卡马西平对失神发作无效。"}},{"id":"ch13_q10","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"A","num":10,"stem":"关于苯妥英钠作用的叙述，下列哪项是错误的？","options":{"A":"降低各种细胞膜的兴奋必性","B":"能阴滞 Na＋通道，减少 Na＋ ，内流","C":"对正常的低频异常放电的 Na＋通道阻滞作用明显","D":"对正常的低频放电也有明显阻滞作用","E":"也能阻滞T型 Na＋通道，阻滞 Ca2＋内流"},"answer":["D"],"answerStr":"D","rationale":"苯妥英钠选择性阻滞高频异常放电神经元的Na+通道，对正常低频放电无明显影响，故D项错误。","expl":{"A":"正确，苯妥英钠能降低各种细胞膜的兴奋性。","B":"正确，其能阻滞Na+通道、减少Na+内流。","C":"正确，对高频异常放电神经元的Na+通道阻滞作用明显。","D":"错误，苯妥英钠对正常低频放电无明显阻滞作用，此为该题答案。","E":"正确，高浓度时也能阻滞钙通道、减少Ca2+内流。"}},{"id":"ch13_q11","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"A","num":11,"stem":"关于苯妥英钠体内过程，下列叙述哪项不正确？","options":{"A":"口服吸收慢而不规则，宜肌肉注射","B":"癫痫持续状态时可作静脉注射","C":"血浆蛋白结合率高","D":"生物利用度有明显个体差异","E":"主要在肝脏代谢"},"answer":["A"],"answerStr":"A","rationale":"苯妥英钠口服吸收慢而不规则，但刺激性大、肌注吸收差且易沉淀，不宜肌内注射，故A项不正确。","expl":{"A":"错误，苯妥英钠不宜肌内注射（刺激性大、吸收差），此为该题答案。","B":"正确，癫痫持续状态时可静脉注射苯妥英钠。","C":"正确，血浆蛋白结合率约90%，结合率高。","D":"正确，生物利用度有明显个体差异。","E":"正确，主要在肝脏经药酶代谢。"}},{"id":"ch13_q12","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"A","num":12,"stem":"列何种抗癫痫药没有明显的阻滞 Na＋通道的作用？","options":{"A":"苯妥英钠","B":"卡马西平","C":"苯巴比妥","D":"丙戊酸钠","E":"乙琥胺"},"answer":["E"],"answerStr":"E","rationale":"乙琥胺主要阻滞T型钙通道，无明显阻滞Na+通道作用，其余药物均有Na+通道阻滞作用。","expl":{"A":"苯妥英钠主要阻滞Na+通道。","B":"卡马西平能阻滞Na+通道。","C":"苯巴比妥高浓度时也能阻滞Na+通道。","D":"丙戊酸钠也能阻滞Na+通道。","E":"正确，乙琥胺阻滞T型钙通道，无明显阻滞Na+通道作用。"}},{"id":"ch13_q13","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"B","num":13,"stem":"对子痫有良好的治疗作用","options":{"A":"卡马西平","B":"硫酸镁","C":"苯巴比妥","D":"扑米酮","E":"戊巴比妥钠"},"answer":["B"],"answerStr":"B","rationale":"硫酸镁可抗惊厥并降压，是子痫（妊娠高血压综合征）的首选药。","expl":{"A":"卡马西平主要抗癫痫、治神经痛，不用于子痫。","B":"正确，硫酸镁对子痫有良好治疗作用，是首选药。","C":"苯巴比妥虽有抗惊厥作用，但非子痫首选。","D":"扑米酮用于癫痫大发作，不用于子痫。","E":"戊巴比妥钠主要用于镇静催眠，不用于子痫。"}},{"id":"ch13_q14","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"B","num":14,"stem":"对三叉神经痛和舌咽神经痛有较好疗效","options":{"A":"卡马西平","B":"硫酸镁","C":"苯巴比妥","D":"扑米酮","E":"戊巴比妥钠"},"answer":["A"],"answerStr":"A","rationale":"卡马西平对三叉神经痛和舌咽神经痛疗效较好，是治疗此类神经痛的常用药。","expl":{"A":"正确，卡马西平对三叉神经痛和舌咽神经痛有较好疗效。","B":"硫酸镁用于子痫抗惊厥，不用于神经痛。","C":"苯巴比妥不用于神经痛。","D":"扑米酮不用于神经痛。","E":"戊巴比妥钠不用于神经痛。"}},{"id":"ch13_q15","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"B","num":15,"stem":"治疗癫痫持续状态的首选药物","options":{"A":"卡马西平","B":"苯妥英钠","C":"地西泮","D":"乙琥胺","E":"扑米酮"},"answer":["C"],"answerStr":"C","rationale":"地西泮静脉注射起效快、疗效好，是治疗癫痫持续状态的首选药物。","expl":{"A":"卡马西平不宜用于癫痫持续状态。","B":"苯妥英钠可用于持续状态，但非首选。","C":"正确，地西泮静注是癫痫持续状态的首选药。","D":"乙琥胺仅用于失神小发作。","E":"扑米酮不用于癫痫持续状态。"}},{"id":"ch13_q16","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"B","num":16,"stem":"治疗癫痫小发作的首选药物","options":{"A":"卡马西平","B":"苯妥英钠","C":"地西泮","D":"乙琥胺","E":"扑米酮"},"answer":["D"],"answerStr":"D","rationale":"乙琥胺对失神小发作疗效好、毒性较低，是治疗癫痫小发作的首选药物。","expl":{"A":"卡马西平对失神发作无效。","B":"苯妥英钠对失神发作无效甚至加重。","C":"地西泮用于癫痫持续状态，非小发作首选。","D":"正确，乙琥胺是癫痫小发作（失神）的首选药。","E":"扑米酮用于大发作，对小发作无效。"}},{"id":"ch13_q17","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"B","num":17,"stem":"治疗癫痫精神运动性发作的首选药物","options":{"A":"卡马西平","B":"苯妥英钠","C":"地西泮","D":"乙琥胺","E":"扑米酮"},"answer":["A"],"answerStr":"A","rationale":"卡马西平对精神运动性（复杂部分性）发作疗效良好，是首选药物。","expl":{"A":"正确，卡马西平是癫痫精神运动性发作的首选药。","B":"苯妥英钠非精神运动性发作的首选。","C":"地西泮不作为精神运动性发作首选。","D":"乙琥胺仅用于失神小发作。","E":"扑米酮不作为精神运动性发作首选。"}},{"id":"ch13_q18","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"C","num":18,"stem":"对各种类型的癫痫都有效","options":{"A":"苯妥英钠","B":"丙戊酸钠","C":"两者均是","D":"两者均否"},"answer":["B"],"answerStr":"B","rationale":"丙戊酸钠是广谱抗癫痫药，对各型癫痫均有效；苯妥英钠对失神发作无效，故答案仅B。","expl":{"A":"苯妥英钠对失神小发作无效甚至加重，非对各型均有效。","B":"正确，丙戊酸钠为广谱抗癫痫药，对各种类型癫痫均有效。","C":"苯妥英钠并非对各型均有效，故两者均是错误。","D":"丙戊酸钠确实广谱，故两者均否错误。"}},{"id":"ch13_q19","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"C","num":19,"stem":"妊娠早期用药有致畸胎作用","options":{"A":"苯妥英钠","B":"丙戊酸钠","C":"两者均是","D":"两者均否"},"answer":["C"],"answerStr":"C","rationale":"苯妥英钠可致胎儿海因综合征，丙戊酸钠可致神经管畸形，两者妊娠早期应用均有致畸作用。","expl":{"A":"苯妥英钠有致畸作用（胎儿海因综合征）。","B":"丙戊酸钠有致畸作用（神经管畸形）。","C":"正确，两者妊娠早期应用均有致畸胎作用。","D":"两者确有致畸作用，故两者均否错误。"}},{"id":"ch13_q20","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"X","num":20,"stem":"下列哪些药物对癫痫失神发作无效","options":{"A":"苯妥英钠","B":"卡马西平","C":"苯巴比妥","D":"扑米酮","E":"丙戊酸钠"},"answer":["A","B","C","D"],"answerStr":"ABCD","rationale":"失神发作首选乙琥胺或丙戊酸钠；苯妥英钠、卡马西平、苯巴比妥、扑米酮对失神发作均无效。","expl":{"A":"正确，苯妥英钠对失神发作无效甚至加重。","B":"正确，卡马西平对失神发作无效。","C":"正确，苯巴比妥对失神发作无效。","D":"正确，扑米酮对失神发作无效。","E":"丙戊酸钠对失神发作有效，故不选。"}},{"id":"ch13_q21","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"X","num":21,"stem":"下列哪些药物在妊娠早期应用有致畸胎作用？","options":{"A":"苯妥英钠","B":"丙戊酸钠","C":"乙琥胺","D":"卡马西平","E":"扑米酮"},"answer":["A","B"],"answerStr":"AB","rationale":"苯妥英钠和丙戊酸钠妊娠早期应用有明显致畸作用；乙琥胺、卡马西平、扑米酮未被列为此类致畸药。","expl":{"A":"正确，苯妥英钠可致胎儿海因综合征。","B":"正确，丙戊酸钠可致神经管畸形。","C":"乙琥胺无明确致畸报道，不选。","D":"卡马西平未列入该题所指妊娠早期致畸药，不选。","E":"扑米酮无明确致畸报道，不选。"}},{"id":"ch13_q22","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"X","num":22,"stem":"下列哪些药物大剂量或长期使用可能引起再生障碍性贫血？","options":{"A":"乙琥胺","B":"卡马西平","C":"苯妥英钠","D":"地西泮","E":"扑米酮"},"answer":["A","B","C"],"answerStr":"ABC","rationale":"乙琥胺、卡马西平、苯妥英钠大剂量或长期应用均可抑制骨髓，引起再生障碍性贫血。","expl":{"A":"正确，乙琥胺可致再生障碍性贫血。","B":"正确，卡马西平可致再生障碍性贫血。","C":"正确，苯妥英钠可致再生障碍性贫血。","D":"地西泮不引起再生障碍性贫血，不选。","E":"扑米酮主要致巨幼红细胞性贫血，非再生障碍性贫血，不选。"}},{"id":"ch13_q23","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"X","num":23,"stem":"下列哪些药物可致巨幼红细胞贫血？","options":{"A":"扑米酮","B":"苯妥英钠","C":"地西泮","D":"丙戊酸钠","E":"乙琥胺"},"answer":["A","B"],"answerStr":"AB","rationale":"苯妥英钠和扑米酮长期应用可干扰叶酸吸收和代谢，引起巨幼红细胞性贫血。","expl":{"A":"正确，扑米酮可致巨幼红细胞性贫血。","B":"正确，苯妥英钠可致巨幼红细胞性贫血。","C":"地西泮不引起巨幼红细胞性贫血，不选。","D":"丙戊酸钠不引起巨幼红细胞性贫血，不选。","E":"乙琥胺可致再障，但非巨幼红细胞性贫血，不选。"}},{"id":"ch13_q24","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"X","num":24,"stem":"关于卡马西平作用叙述，下列哪些是正确的？","options":{"A":"能阻滞 Na＋通道","B":"能抑制癫痫病灶放电","C":"能阻滞周围神经原放电","D":"对精神运动性癫痫有良好疗效","E":"治疗舌咽神经痛"},"answer":["A","B","C","D","E"],"answerStr":"ABCDE","rationale":"卡马西平阻滞Na+通道、抑制癫痫病灶及外周神经元放电，对精神运动性癫痫疗效好并治舌咽神经痛，各项均正确。","expl":{"A":"正确，卡马西平能阻滞Na+通道。","B":"正确，能抑制癫痫病灶放电。","C":"正确，能抑制周围神经元放电。","D":"正确，对精神运动性癫痫有良好疗效。","E":"正确，可用于治疗舌咽神经痛。"}},{"id":"ch13_q25","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"X","num":25,"stem":"卡马西平的是","options":{"A":"作用机制与苯妥英钠相似","B":"对精神运动性发作有较好疗效","C":"对中枢疼痛综合症的效果优于苯妥英钠","D":"可作为大发作和部分性发作的首选药物","E":"对癫痫并发的躁狂、抑郁症有效"},"answer":["A","B","C","D","E"],"answerStr":"ABCDE","rationale":"卡马西平机制类似苯妥英钠，对精神运动性发作好、中枢疼痛综合征疗效优于苯妥英钠，并可用于大发作、部分性发作及躁狂抑郁。","expl":{"A":"正确，作用机制与苯妥英钠相似（阻滞Na+通道）。","B":"正确，对精神运动性发作有较好疗效。","C":"正确，对中枢疼痛综合征的效果优于苯妥英钠。","D":"正确，可作为大发作和部分性发作的首选药。","E":"正确，对癫痫并发的躁狂、抑郁症有效。"}},{"id":"ch13_q26","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"X","num":26,"stem":"下列哪些药物可治疗癫痫持续状态？","options":{"A":"地西泮","B":"卡马西平","C":"戊巴比妥钠","D":"苯巴比妥","E":"扑米酮"},"answer":["A","C","D"],"answerStr":"ACD","rationale":"地西泮静注是持续状态首选，苯巴比妥和戊巴比妥钠等巴比妥类也可静脉用于癫痫持续状态。","expl":{"A":"正确，地西泮静注是癫痫持续状态的首选药。","B":"卡马西平不宜用于癫痫持续状态，不选。","C":"正确，戊巴比妥钠可静注治疗癫痫持续状态。","D":"正确，苯巴比妥可用于治疗癫痫持续状态。","E":"扑米酮不用于癫痫持续状态，不选。"}},{"id":"ch13_q27","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"X","num":27,"stem":"下列哪些药物可治疗破伤风惊厥？","options":{"A":"地西泮","B":"苯巴比妥","C":"戊巴比妥钠","D":"乙琥胺","E":"卡马西平"},"answer":["A","B","C"],"answerStr":"ABC","rationale":"地西泮及巴比妥类（苯巴比妥、戊巴比妥钠）均有抗惊厥作用，可用于治疗破伤风惊厥。","expl":{"A":"正确，地西泮可治疗破伤风惊厥。","B":"正确，苯巴比妥可治疗破伤风惊厥。","C":"正确，戊巴比妥钠可治疗破伤风惊厥。","D":"乙琥胺仅用于失神小发作，对破伤风惊厥无效，不选。","E":"卡马西平不用于破伤风惊厥，不选。"}},{"id":"ch13_q28","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"X","num":28,"stem":"对小儿高热惊厥有效的药物有","options":{"A":"苯巴比妥","B":"水合氯醛","C":"地西泮","D":"苯妥英钠","E":"卡马西平"},"answer":["A","B","C"],"answerStr":"ABC","rationale":"苯巴比妥、水合氯醛、地西泮均可用于小儿高热惊厥的防治，苯妥英钠和卡马西平非常用。","expl":{"A":"正确，苯巴比妥可防治小儿高热惊厥。","B":"正确，水合氯醛可治疗小儿高热惊厥。","C":"正确，地西泮可治疗小儿高热惊厥。","D":"苯妥英钠对高热惊厥疗效差，不选。","E":"卡马西平不用于高热惊厥，不选。"}},{"id":"ch13_q29","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"X","num":29,"stem":"苯妥英钠可以治疗下列哪些疾病？","options":{"A":"快速型心律失常","B":"癫痫大发作","C":"三叉神经痛","D":"舌咽神经痛","E":"癫痫小发作"},"answer":["A","B","C","D"],"answerStr":"ABCD","rationale":"苯妥英钠可抗快速型心律失常，治疗癫痫大发作及三叉神经痛、舌咽神经痛，但对小发作无效。","expl":{"A":"正确，苯妥英钠可治疗快速型心律失常。","B":"正确，可治疗癫痫大发作。","C":"正确，可治疗三叉神经痛。","D":"正确，可治疗舌咽神经痛。","E":"癫痫小发作苯妥英钠无效甚至加重，不选。"}},{"id":"ch13_q30","chapter":"第十六章 抗癫痫药和抗惊厥药","chapterIdx":12,"type":"X","num":30,"stem":"硫酸镁的作用包括","options":{"A":"注射硫酸镁可产生降压作用","B":"注射硫酸镁可产生骨骼肌松弛作用","C":"注射和口服硫酸镁均可产生骨骼肌松弛作用","D":"口吸硫酸镁有导泻作用","E":"口服或用导管直接注入十二指肠，可引起利胆作用"},"answer":["A","B","D","E"],"answerStr":"ABDE","rationale":"注射硫酸镁可降压并松弛骨骼肌，口服有导泻作用，口服或十二指肠注入可利胆；口服不吸收，不产生肌松。","expl":{"A":"正确，注射硫酸镁可产生降压作用。","B":"正确，注射硫酸镁可产生骨骼肌松弛作用。","C":"口服硫酸镁不吸收，不产生骨骼肌松弛，此项错误。","D":"正确，口服硫酸镁有导泻作用。","E":"正确，口服或十二指肠注入可产生利胆作用。"}}]},{"title":"第十八章 抗精神失常药","questions":[{"id":"ch14_q01","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":1,"stem":"抗精神失常药是指","options":{"A":"治疗精神活动障碍的药物","B":"治疗精神分裂症的药物","C":"治疗躁狂症的药物","D":"治疗抑郁症的药物","E":"治疗焦虑症的药物"},"answer":["A"],"answerStr":"A","rationale":"抗精神失常药是用于治疗各种精神活动障碍的一类药物总称，涵盖抗精神病、抗躁狂、抗抑郁和抗焦虑等药物。","expl":{"A":"正确，抗精神失常药是治疗各类精神活动障碍药物的统称，范围最广。","B":"错误，治疗精神分裂症的药物是抗精神病药，仅属抗精神失常药的一类。","C":"错误，治疗躁狂症的药物是抗躁狂药，仅属抗精神失常药的一部分。","D":"错误，治疗抑郁症的药物是抗抑郁药，仅属抗精神失常药的一部分。","E":"错误，治疗焦虑症的药物是抗焦虑药，仅属抗精神失常药的一部分。"}},{"id":"ch14_q02","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":2,"stem":"氯丙嗪口服生物利用度低的原因是","options":{"A":"吸收少","B":"排泄快","C":"首关消除","D":"血浆蛋白结合率高","E":"分布容积大"},"answer":["C"],"answerStr":"C","rationale":"氯丙嗪口服吸收良好，但经肝脏首关消除明显，故生物利用度低。","expl":{"A":"错误，氯丙嗪口服吸收良好，生物利用度低并非吸收少所致。","B":"错误，排泄快不是氯丙嗪口服生物利用度低的主要原因。","C":"正确，氯丙嗪有明显首关消除，故口服生物利用度低。","D":"错误，血浆蛋白结合率高主要影响分布与游离浓度，与生物利用度低关系不大。","E":"错误，分布容积大反映组织分布广，不直接导致口服生物利用度低。"}},{"id":"ch14_q03","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":3,"stem":"作用最强的吩噻类药物是","options":{"A":"氯丙嗪","B":"奋乃静","C":"硫利达嗪","D":"氟奋乃静","E":"三氟拉嗪"},"answer":["D"],"answerStr":"D","rationale":"氟奋乃静属高效价吩噻嗪类，抗精神病作用最强，所需剂量小。","expl":{"A":"错误，氯丙嗪为低效价代表，抗精神病作用强度弱于氟奋乃静。","B":"错误，奋乃静作用比氯丙嗪强，但弱于氟奋乃静。","C":"错误，硫利达嗪抗精神病作用较弱，锥体外系反应也较轻。","D":"正确，氟奋乃静为高效价吩噻嗪类，抗精神病作用最强。","E":"错误，三氟拉嗪作用较强，但仍不及氟奋乃静。"}},{"id":"ch14_q04","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":4,"stem":"可用于治疗抑郁症的药物是","options":{"A":"五氟利多","B":"舒必利","C":"奋乃静","D":"氟哌啶醇","E":"氯氮平"},"answer":["B"],"answerStr":"B","rationale":"舒必利小剂量具有抗抑郁作用，可用于抑郁症的治疗。","expl":{"A":"错误，五氟利多是长效抗精神病药，用于精神分裂症的维持治疗。","B":"正确，舒必利小剂量有抗抑郁作用，可用于治疗抑郁症。","C":"错误，奋乃静为抗精神病药，主要用于精神分裂症。","D":"错误，氟哌啶醇为抗精神病药，用于精神分裂症、躁狂等。","E":"错误，氯氮平为抗精神病药，用于难治性精神分裂症。"}},{"id":"ch14_q05","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":5,"stem":"锥体外系反应较轻的药物是","options":{"A":"氯丙嗪","B":"奋乃静","C":"硫利达嗪","D":"氟奋乃静","E":"三氟拉嗪"},"answer":["C"],"answerStr":"C","rationale":"硫利达嗪抗精神病作用较弱，锥体外系反应也较轻。","expl":{"A":"错误，氯丙嗪锥体外系反应较明显。","B":"错误，奋乃静属高效价类，锥体外系反应明显。","C":"正确，硫利达嗪作用较弱，锥体外系反应较轻。","D":"错误，氟奋乃静锥体外系反应强。","E":"错误，三氟拉嗪锥体外系反应明显。"}},{"id":"ch14_q06","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":6,"stem":"下列哪种药物可以用于处理氯丙嗪引起的低血压？","options":{"A":"肾上腺素","B":"多巴胺","C":"麻黄碱","D":"去甲肾上腺素","E":"异丙肾上腺素"},"answer":["D"],"answerStr":"D","rationale":"氯丙嗪阻断α受体致低血压，应选用去甲肾上腺素等α受体激动药升压；肾上腺素升压作用被翻转，故禁用。","expl":{"A":"错误，氯丙嗪阻断α受体，肾上腺素升压作用被翻转，反使血压进一步下降。","B":"错误，多巴胺作用复杂，小剂量扩张血管，非处理氯丙嗪低血压的选择。","C":"错误，麻黄碱兼有α、β作用且升压作用可被α阻断削弱，非首选。","D":"正确，去甲肾上腺素激动α受体，可对抗氯丙嗪α阻断引起的低血压。","E":"错误，异丙肾上腺素激动β受体，扩张血管，不能升压。"}},{"id":"ch14_q07","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":7,"stem":"氯丙嗪的禁忌证是","options":{"A":"溃疡病","B":"癫痫","C":"肾功能不全","D":"痛风","E":"焦虑症"},"answer":["B"],"answerStr":"B","rationale":"氯丙嗪降低惊厥阈值，可诱发或加重癫痫，故癫痫患者禁用。","expl":{"A":"错误，氯丙嗪抗胆碱作用可抑制胃酸分泌，溃疡病并非禁忌。","B":"正确，氯丙嗪降低惊厥阈值，可诱发癫痫，癫痫患者禁用。","C":"错误，氯丙嗪主要经肝代谢，肾功能不全非其主要禁忌。","D":"错误，氯丙嗪与痛风无直接禁忌关系。","E":"错误，氯丙嗪有镇静作用，焦虑症并非禁忌。"}},{"id":"ch14_q08","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":8,"stem":"氯丙嗪不应作皮下注射的原因是","options":{"A":"吸收不规则","B":"局部刺激性强","C":"与蛋白质结合","D":"吸收太慢","E":"吸收太快"},"answer":["B"],"answerStr":"B","rationale":"氯丙嗪局部刺激性强，皮下注射易引起疼痛和组织损伤，故不作皮下注射。","expl":{"A":"错误，不作皮下注射的主要原因是局部刺激，而非吸收不规则。","B":"正确，氯丙嗪局部刺激性强，皮下注射可引起疼痛和组织损伤。","C":"错误，与蛋白质结合与给药途径选择无关。","D":"错误，并非因吸收太慢而不作皮下注射。","E":"错误，并非因吸收太快而不作皮下注射。"}},{"id":"ch14_q09","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":9,"stem":"氯丙嗪引起的视力模糊、心动过速和口干、便秘等是由于阻断","options":{"A":"多巴胺（DA）受体","B":"a 肾上腺素受体","C":"b 肾上腺素受体","D":"M胆碱受体","E":"N 胆碱受体"},"answer":["D"],"answerStr":"D","rationale":"视力模糊、心动过速、口干、便秘为阻断M胆碱受体引起的阿托品样作用。","expl":{"A":"错误，阻断DA受体主要引起锥体外系反应和内分泌改变。","B":"错误，阻断α肾上腺素受体主要引起体位性低血压。","C":"错误，氯丙嗪不阻断β肾上腺素受体。","D":"正确，阻断M胆碱受体引起视力模糊、口干、便秘、心动过速等。","E":"错误，阻断N胆碱受体主要影响神经节和骨骼肌，与上述表现不符。"}},{"id":"ch14_q10","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":10,"stem":"小剂量氯丙嗪镇吐作用的部位是","options":{"A":"呕吐中枢","B":"胃粘膜传入纤维","C":"黑质－纹状体通路","D":"结节－漏斗通路","E":"延脑催吐化学感觉区"},"answer":["E"],"answerStr":"E","rationale":"小剂量氯丙嗪抑制延髓催吐化学感受区（CTZ）而镇吐，大剂量才直接抑制呕吐中枢。","expl":{"A":"错误，大剂量氯丙嗪才直接抑制呕吐中枢。","B":"错误，氯丙嗪镇吐与胃粘膜传入纤维无关。","C":"错误，黑质-纹状体通路与锥体外系反应有关。","D":"错误，结节-漏斗通路与内分泌调节有关。","E":"正确，小剂量氯丙嗪抑制延髓催吐化学感受区（CTZ）而镇吐。"}},{"id":"ch14_q11","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":11,"stem":"氯丙嗪的药浓度最高的部位是","options":{"A":"血液","B":"肝脏","C":"肾脏","D":"脑","E":"心脏"},"answer":["D"],"answerStr":"D","rationale":"氯丙嗪脂溶性高，易透过血脑屏障，脑内浓度远高于血浆浓度。","expl":{"A":"错误，氯丙嗪血浆浓度低于脑内浓度。","B":"错误，肝脏为代谢部位，药物浓度不及脑。","C":"错误，肾脏为排泄器官，浓度非最高。","D":"正确，氯丙嗪脂溶性高、易入脑，脑内浓度可达血浆浓度的数十倍。","E":"错误，心脏浓度非最高。"}},{"id":"ch14_q12","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":12,"stem":"适用于伴有焦虑或焦虑性抑郁的精神分裂症的药物是","options":{"A":"氟哌啶醇","B":"奋乃静","C":"硫利达嗪","D":"氯普噻吨","E":"三氟拉嗪"},"answer":["D"],"answerStr":"D","rationale":"氯普噻吨兼具抗焦虑、抗抑郁作用，适用于伴有焦虑或焦虑性抑郁的精神分裂症。","expl":{"A":"错误，氟哌啶醇无明显抗焦虑、抗抑郁作用。","B":"错误，奋乃静无突出抗焦虑、抗抑郁作用。","C":"错误，硫利达嗪以镇静为主，无突出抗抑郁作用。","D":"正确，氯普噻吨有抗焦虑和抗抑郁作用，适用于伴焦虑或焦虑性抑郁的精神分裂症。","E":"错误，三氟拉嗪无抗抑郁作用。"}},{"id":"ch14_q13","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":13,"stem":"常用于治疗以兴奋躁动、幻觉、妄想为主的精神分裂症的药物是","options":{"A":"氟哌啶醇","B":"氟奋乃静","C":"硫利达嗪","D":"氯普噻吨","E":"三氟拉嗪"},"answer":["A"],"answerStr":"A","rationale":"氟哌啶醇抗精神病作用强，对兴奋躁动、幻觉、妄想为主的精神分裂症疗效好。","expl":{"A":"正确，氟哌啶醇作用强，对兴奋躁动、幻觉、妄想为主的精神分裂症效果好。","B":"错误，氟奋乃静主要用于慢性精神分裂症。","C":"错误，硫利达嗪作用较弱，以镇静为主。","D":"错误，氯普噻吨抗精神病作用较弱，用于伴焦虑抑郁者。","E":"错误，三氟拉嗪对躁动兴奋的控制不如氟哌啶醇。"}},{"id":"ch14_q14","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":14,"stem":"可作为安定麻醉术成分的药物是","options":{"A":"氟哌啶醇","B":"氟奋乃静","C":"氟哌利多","D":"氯普噻吨","E":"五氟利多"},"answer":["C"],"answerStr":"C","rationale":"氟哌利多与芬太尼合用组成神经安定镇痛术（安定麻醉术）。","expl":{"A":"错误，氟哌啶醇为抗精神病药，不作安定麻醉术成分。","B":"错误，氟奋乃静为长效抗精神病药，不作安定麻醉术成分。","C":"正确，氟哌利多与芬太尼合用组成神经安定镇痛术（安定麻醉术）。","D":"错误，氯普噻吨用于伴焦虑抑郁的精神分裂症，不作安定麻醉术成分。","E":"错误，五氟利多为长效抗精神病药，不作安定麻醉术成分。"}},{"id":"ch14_q15","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":15,"stem":"吩噻嗪类药物降压作用最强的是","options":{"A":"奋乃静","B":"氯丙嗪","C":"硫利达嗪","D":"氟奋乃静","E":"三氟拉嗪"},"answer":["B"],"answerStr":"B","rationale":"氯丙嗪阻断α肾上腺素受体作用明显，降压作用在吩噻嗪类中最强。","expl":{"A":"错误，奋乃静降压作用弱于氯丙嗪。","B":"正确，氯丙嗪阻断α受体作用强，降压作用在吩噻嗪类中最强。","C":"错误，硫利达嗪降压作用较弱。","D":"错误，氟奋乃静降压作用弱于氯丙嗪。","E":"错误，三氟拉嗪降压作用弱于氯丙嗪。"}},{"id":"ch14_q16","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":16,"stem":"氯丙嗪在正常人引起的作用是","options":{"A":"烦躁不安","B":"情绪高涨","C":"紧张失眠","D":"感情淡漠","E":"以上都不是"},"answer":["D"],"answerStr":"D","rationale":"氯丙嗪使正常人表现为安静、活动减少、感情淡漠、对周围事物缺乏兴趣。","expl":{"A":"错误，氯丙嗪有镇静作用，不引起烦躁不安。","B":"错误，氯丙嗪不引起情绪高涨。","C":"错误，氯丙嗪镇静，不引起紧张失眠。","D":"正确，氯丙嗪使正常人表现为感情淡漠、活动减少。","E":"错误，感情淡漠是氯丙嗪对正常人的典型作用，故以上都不是不成立。"}},{"id":"ch14_q17","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":17,"stem":"米帕明最常见的副作用是","options":{"A":"阿托品样作用","B":"变态反应","C":"中枢神经症状","D":"造血系统损害","E":"奎尼丁样作用"},"answer":["A"],"answerStr":"A","rationale":"米帕明阻断M胆碱受体，产生口干、便秘、视力模糊、尿潴留等阿托品样作用，最常见。","expl":{"A":"正确，米帕明阻断M胆碱受体，出现口干、便秘、视物模糊等阿托品样作用，最常见。","B":"错误，变态反应少见，非最常见副作用。","C":"错误，中枢神经症状可出现，但非最常见。","D":"错误，造血系统损害少见。","E":"错误，奎尼丁样心脏毒性可出现，但非最常见。"}},{"id":"ch14_q18","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":18,"stem":"氯丙嗪可引起下列哪种激素分泌？","options":{"A":"甲状腺激素","B":"催乳素","C":"促肾上腺皮质激素","D":"促性腺激素","E":"生长激素"},"answer":["B"],"answerStr":"B","rationale":"氯丙嗪阻断结节-漏斗通路DA受体，解除对催乳素分泌的抑制，使催乳素分泌增加。","expl":{"A":"错误，氯丙嗪不促进甲状腺激素分泌。","B":"正确，氯丙嗪阻断结节-漏斗通路DA受体，使催乳素分泌增加。","C":"错误，氯丙嗪不促进促肾上腺皮质激素分泌。","D":"错误，氯丙嗪抑制促性腺激素释放，而非促进其分泌。","E":"错误，氯丙嗪不促进生长激素分泌。"}},{"id":"ch14_q19","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":19,"stem":"使用胆碱受体阻断药反可使氯丙的哪种不良反应加重？","options":{"A":"帕金森综合症","B":"迟发性运动障碍","C":"静坐不能","D":"体位性低血压","E":"急性肌张障碍"},"answer":["B"],"answerStr":"B","rationale":"迟发性运动障碍与DA受体长期阻断后超敏有关，使用抗胆碱药可使其加重。","expl":{"A":"错误，帕金森综合征可用抗胆碱药（苯海索）缓解。","B":"正确，抗胆碱药可使迟发性运动障碍加重，故不宜使用。","C":"错误，静坐不能可用抗胆碱药缓解。","D":"错误，体位性低血压与抗胆碱药关系不大。","E":"错误，急性肌张力障碍可用抗胆碱药缓解。"}},{"id":"ch14_q20","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":20,"stem":"氟奋乃静的作用特点是","options":{"A":"抗精神病和降压作用都强","B":"抗精神病和锥体外系作用都强","C":"抗精神病和降压作用都弱","D":"抗精神病和锥体外系作用都弱","E":"抗精神现和镇静作用都强"},"answer":["B"],"answerStr":"B","rationale":"氟奋乃静为高效价类，抗精神病作用强，锥体外系反应也强，而降压、镇静作用弱。","expl":{"A":"错误，氟奋乃静降压作用弱。","B":"正确，氟奋乃静抗精神病作用强，锥体外系反应也强。","C":"错误，氟奋乃静抗精神病作用强而非弱。","D":"错误，氟奋乃静锥体外系作用强而非弱。","E":"错误，氟奋乃静镇静作用弱。"}},{"id":"ch14_q21","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":21,"stem":"氯丙嗪长期大剂量应用最严重的不良反应","options":{"A":"胃肠道反应","B":"体位性低血压","C":"中枢神经系统反应","D":"锥体外系反应","E":"变态反应"},"answer":["D"],"answerStr":"D","rationale":"锥体外系反应是氯丙嗪长期大剂量应用最常见且较严重的不良反应。","expl":{"A":"错误，胃肠道反应较轻，不突出。","B":"错误，体位性低血压多见于用药初期，易耐受。","C":"错误，中枢抑制（嗜睡）可逐渐耐受，不如锥体外系反应严重。","D":"正确，锥体外系反应是氯丙嗪长期大剂量最严重的不良反应。","E":"错误，变态反应少见。"}},{"id":"ch14_q22","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":22,"stem":"可用于治疗氯丙嗪引起的帕金森综合症的药物是","options":{"A":"多巴胺","B":"地西泮","C":"苯海索","D":"左旋多巴","E":"美多巴"},"answer":["C"],"answerStr":"C","rationale":"苯海索为中枢抗胆碱药，可缓解帕金森综合征；左旋多巴因DA受体被阻断而无效。","expl":{"A":"错误，多巴胺不能透过血脑屏障，无效。","B":"错误，地西泮无抗帕金森作用。","C":"正确，苯海索为中枢抗胆碱药，可对抗氯丙嗪引起的帕金森综合征。","D":"错误，左旋多巴因DA受体被氯丙嗪阻断而无效。","E":"错误，美多巴（左旋多巴+卡比多巴）同样无效。"}},{"id":"ch14_q23","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":23,"stem":"吩噻嗪类药物引起锥体外系反应的机制是阻断","options":{"A":"中脑－边缘叶通路 DA 受体","B":"结节－漏斗通路 DA 受体","C":"黑质－纹状体通路 DA 受体","D":"中脑－皮质通路 DA 受体","E":"中枢 M 胆碱受体"},"answer":["C"],"answerStr":"C","rationale":"阻断黑质-纹状体通路DA受体，使胆碱能功能相对亢进，产生锥体外系反应。","expl":{"A":"错误，阻断中脑-边缘叶通路DA受体与抗精神病作用有关。","B":"错误，阻断结节-漏斗通路DA受体与内分泌改变有关。","C":"正确，阻断黑质-纹状体通路DA受体引起锥体外系反应。","D":"错误，阻断中脑-皮质通路DA受体与抗精神病作用有关。","E":"错误，锥体外系反应源于DA受体阻断，并非直接阻断M胆碱受体。"}},{"id":"ch14_q24","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":24,"stem":"碳酸锂主要用于治疗","options":{"A":"躁狂症","B":"抑郁症","C":"精神分裂症","D":"焦虑症","E":"多动症"},"answer":["A"],"answerStr":"A","rationale":"碳酸锂为抗躁狂药，主要用于治疗躁狂症。","expl":{"A":"正确，碳酸锂是抗躁狂药，主要用于治疗躁狂症。","B":"错误，抑郁症主要用抗抑郁药，碳酸锂非首选。","C":"错误，精神分裂症主要用抗精神病药。","D":"错误，焦虑症主要用抗焦虑药。","E":"错误，多动症主要用中枢兴奋药。"}},{"id":"ch14_q25","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":25,"stem":"氯丙嗪对下列哪种病因所致的呕吐无效？","options":{"A":"癌症","B":"晕动病","C":"胃肠炎","D":"吗啡","E":"放射病"},"answer":["B"],"answerStr":"B","rationale":"氯丙嗪镇吐作用强，对多种原因呕吐有效，但对前庭性呕吐（晕动病）无效。","expl":{"A":"错误，氯丙嗪对癌症（化疗）引起的呕吐有效。","B":"正确，氯丙嗪对晕动病（前庭性呕吐）无效。","C":"错误，氯丙嗪对胃肠炎引起的呕吐有效。","D":"错误，氯丙嗪对吗啡等引起的呕吐有效。","E":"错误，氯丙嗪对放射病引起的呕吐有效。"}},{"id":"ch14_q26","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"A","num":26,"stem":"不属于三环类的抗抑郁药是","options":{"A":"米帕明","B":"地昔帕明","C":"马普替林","D":"阿米替林","E":"多塞平"},"answer":["C"],"answerStr":"C","rationale":"马普替林为四环类抗抑郁药，不属于三环类抗抑郁药。","expl":{"A":"错误，米帕明（丙米嗪）为三环类抗抑郁药。","B":"错误，地昔帕明为三环类抗抑郁药。","C":"正确，马普替林为四环类抗抑郁药，不属三环类。","D":"错误，阿米替林为三环类抗抑郁药。","E":"错误，多塞平为三环类抗抑郁药。"}},{"id":"ch14_q27","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"B","num":27,"stem":"氯丙嗪主要用于","options":{"A":"躁狂症","B":"抑郁症","C":"精神分裂症","D":"晕动病","E":"安定麻醉术"},"answer":["C"],"answerStr":"C","rationale":"氯丙嗪是经典抗精神病药，主要用于治疗精神分裂症。","expl":{"A":"错误，躁狂症主要用碳酸锂，氯丙嗪非首选。","B":"错误，抑郁症应用抗抑郁药。","C":"正确，氯丙嗪为经典抗精神病药，主要用于精神分裂症。","D":"错误，氯丙嗪对晕动病引起的呕吐无效。","E":"错误，安定麻醉术用氟哌利多与芬太尼。"}},{"id":"ch14_q28","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"B","num":28,"stem":"氟哌利多主要用于","options":{"A":"躁狂症","B":"抑郁症","C":"精神分裂症","D":"晕动病","E":"安定麻醉术"},"answer":["E"],"answerStr":"E","rationale":"氟哌利多与芬太尼合用组成神经安定镇痛术（安定麻醉术），是其最主要的临床用途。","expl":{"A":"错误，躁狂症主要用锂盐、氯丙嗪等，氟哌利多不用于躁狂症。","B":"错误，抑郁症用抗抑郁药治疗，氟哌利多无效。","C":"错误，精神分裂症主要用氯丙嗪、氟哌啶醇等，氟哌利多并非首选。","D":"错误，晕动病用东莨菪碱、苯海拉明等抗胆碱/抗组胺药。","E":"正确，氟哌利多与芬太尼合用组成神经安定镇痛术（安定麻醉术）。"}},{"id":"ch14_q29","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"B","num":29,"stem":"碳酸锂主要用于","options":{"A":"躁狂症","B":"抑郁症","C":"精神分裂症","D":"晕动病","E":"安定麻醉术"},"answer":["A"],"answerStr":"A","rationale":"碳酸锂为抗躁狂药，主要用于治疗躁狂症。","expl":{"A":"正确，碳酸锂是抗躁狂药，主要用于躁狂症的治疗和预防。","B":"错误，抑郁症用抗抑郁药，碳酸锂非首选。","C":"错误，精神分裂症用抗精神病药。","D":"错误，晕动病用抗组胺药、东莨菪碱等。","E":"错误，安定麻醉术用氟哌利多与芬太尼。"}},{"id":"ch14_q30","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"B","num":30,"stem":"米帕明主要用于","options":{"A":"躁狂症","B":"抑郁症","C":"精神分裂症","D":"晕动病","E":"安定麻醉术"},"answer":["B"],"answerStr":"B","rationale":"米帕明（丙米嗪）为三环类抗抑郁药，主要用于治疗抑郁症。","expl":{"A":"错误，躁狂症用碳酸锂。","B":"正确，米帕明为三环类抗抑郁药，主要用于抑郁症。","C":"错误，精神分裂症用抗精神病药。","D":"错误，晕动病用抗组胺药、东莨菪碱等。","E":"错误，安定麻醉术用氟哌利多与芬太尼。"}},{"id":"ch14_q31","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"B","num":31,"stem":"氯普噻吨主要用于","options":{"A":"躁狂症","B":"抑郁症","C":"精神分裂症","D":"晕动病","E":"安定麻醉术"},"answer":["C"],"answerStr":"C","rationale":"氯普噻吨为硫杂蒽类抗精神病药，主要用于伴有焦虑、抑郁的精神分裂症。","expl":{"A":"错误，躁狂症用碳酸锂。","B":"错误，抑郁症用抗抑郁药。","C":"正确，氯普噻吨为抗精神病药，主要用于伴焦虑抑郁的精神分裂症。","D":"错误，晕动病用抗组胺药、东莨菪碱等。","E":"错误，安定麻醉术用氟哌利多与芬太尼。"}},{"id":"ch14_q32","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"C","num":32,"stem":"碳酸锂","options":{"A":"阻断M胆碱","B":"阻断 DA 受体","C":"两者均可","D":"两者均否"},"answer":["D"],"answerStr":"D","rationale":"碳酸锂既不阻断M胆碱受体，也不阻断DA受体，其抗躁狂作用与影响神经递质代谢有关。","expl":{"A":"错误，碳酸锂不阻断M胆碱受体。","B":"错误，碳酸锂不阻断DA受体。","C":"错误，碳酸锂两者均不阻断。","D":"正确，碳酸锂不阻断M胆碱受体，也不阻断DA受体。"}},{"id":"ch14_q33","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"C","num":33,"stem":"米帕明","options":{"A":"阻断M胆碱","B":"阻断 DA 受体","C":"两者均可","D":"两者均否"},"answer":["A"],"answerStr":"A","rationale":"米帕明阻断M胆碱受体，产生阿托品样作用；不阻断DA受体。","expl":{"A":"正确，米帕明阻断M胆碱受体，引起口干、便秘、视力模糊等阿托品样作用。","B":"错误，米帕明不阻断DA受体。","C":"错误，米帕明仅阻断M胆碱受体，不阻断DA受体。","D":"错误，米帕明可阻断M胆碱受体，故非两者均否。"}},{"id":"ch14_q34","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"C","num":34,"stem":"氯丙嗪","options":{"A":"阻断M胆碱","B":"阻断 DA 受体","C":"两者均可","D":"两者均否"},"answer":["B"],"answerStr":"B","rationale":"氯丙嗪的抗精神病作用主要通过阻断DA受体实现，故本题按其主要机制选阻断DA受体。","expl":{"A":"错误，氯丙嗪虽有一定抗胆碱作用，但其代表机制是阻断DA受体，不按两者均可计。","B":"正确，氯丙嗪通过阻断中脑-边缘叶、中脑-皮质通路DA受体发挥抗精神病作用。","C":"错误，本题按氯丙嗪的主要作用机制计为阻断DA受体，非两者均可。","D":"错误，氯丙嗪确实阻断DA受体。"}},{"id":"ch14_q35","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"C","num":35,"stem":"氟哌啶醇","options":{"A":"阻断M胆碱","B":"阻断 DA 受体","C":"两者均可","D":"两者均否"},"answer":["B"],"answerStr":"B","rationale":"氟哌啶醇为丁酰苯类，通过强效阻断DA受体发挥抗精神病作用，无阻断M胆碱受体作用。","expl":{"A":"错误，氟哌啶醇无明显阻断M胆碱受体作用。","B":"正确，氟哌啶醇通过强效阻断DA受体发挥抗精神病作用。","C":"错误，氟哌啶醇主要阻断DA受体，不阻断M胆碱受体。","D":"错误，氟哌啶醇确实阻断DA受体。"}},{"id":"ch14_q36","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"X","num":36,"stem":"氯丙嗪扩张血管的原因包括","options":{"A":"阻断 a 肾上腺素受体","B":"阻断M胆碱受体","C":"抑制血管运动中枢","D":"减少NA的释放","E":"直接舒张血管平滑肌"},"answer":["A","C","D"],"answerStr":"ACD","rationale":"氯丙嗪通过阻断α受体、抑制血管运动中枢及减少去甲肾上腺素释放，共同引起血管扩张、血压下降。","expl":{"A":"正确，氯丙嗪阻断α肾上腺素受体，使血管扩张。","B":"错误，阻断M胆碱受体与扩张血管关系不大。","C":"正确，氯丙嗪抑制血管运动中枢，降低交感缩血管张力。","D":"正确，氯丙嗪减少去甲肾上腺素释放，降低血管收缩作用。","E":"错误，氯丙嗪扩张血管主要经受体阻断和中枢抑制，非直接舒张血管平滑肌。"}},{"id":"ch14_q37","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"X","num":37,"stem":"氯丙嗪的中枢药理作用包括","options":{"A":"昏迷病人","B":"癫痫","C":"严重肝功能损害","D":"高血压","E":"胃溃疡"},"answer":["A","B","D"],"answerStr":"ABD","rationale":"本题考查氯丙嗪的禁忌证：氯丙嗪可加重中枢抑制、降低惊厥阈值并影响心血管功能，故昏迷病人、癫痫及高血压患者禁用或慎用。","expl":{"A":"正确，氯丙嗪抑制中枢，昏迷病人（尤其中枢抑制药中毒）禁用，以免加重呼吸循环抑制。","B":"正确，氯丙嗪降低惊厥阈值，可诱发或加重癫痫，癫痫患者禁用。","C":"错误，氯丙嗪主要经肝代谢、可致肝损害，严重肝功能损害者须慎用，但本题未将其列为正确项。","D":"正确，氯丙嗪阻断α受体可致体位性低血压，高血压（心血管疾病）患者须慎用。","E":"错误，胃溃疡并非氯丙嗪禁忌，其抗胆碱作用反可减少胃酸分泌。"}},{"id":"ch14_q39","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"X","num":39,"stem":"治疗躁狂症的药物有","options":{"A":"碳酸锂","B":"马普替林","C":"氯丙嗪","D":"氟哌啶醇","E":"多塞平"},"answer":["A","C","D"],"answerStr":"ACD","rationale":"碳酸锂为抗躁狂药，氯丙嗪、氟哌啶醇等抗精神病药也可控制躁狂症的兴奋躁动。","expl":{"A":"正确，碳酸锂为经典抗躁狂药，是治疗躁狂症的首选。","B":"错误，马普替林为抗抑郁药，用于抑郁症。","C":"正确，氯丙嗪可控制躁狂症的兴奋躁动。","D":"正确，氟哌啶醇可有效控制躁狂发作的兴奋躁动。","E":"错误，多塞平为三环类抗抑郁药，用于抑郁症。"}},{"id":"ch14_q40","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"X","num":40,"stem":"氯丙嗪降温特点包括","options":{"A":"抑制体温调节中枢，使体温调节失灵","B":"不仅降低发热体温，也降低正常体温","C":"临床上配合物理降温用于低温麻醉","D":"对体温的影响与环境温度无关","E":"作为人工冬眠，使体温、代谢及耗氧量均降低"},"answer":["A","B","C","E"],"answerStr":"ABCE","rationale":"氯丙嗪抑制下丘脑体温调节中枢，使体温调节失灵，降低发热和正常体温，其降温作用受环境温度影响。","expl":{"A":"正确，氯丙嗪抑制下丘脑体温调节中枢，使体温调节功能失灵。","B":"正确，氯丙嗪不仅降低发热体温，也降低正常体温。","C":"正确，临床配合物理降温可用于低温麻醉。","D":"错误，氯丙嗪降温作用受环境温度影响，环境温度越低降温越明显。","E":"正确，作为人工冬眠成分，使体温、代谢及耗氧量均降低。"}},{"id":"ch14_q41","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"X","num":41,"stem":"氯丙嗪可阻断的受体包括","options":{"A":"DA 受体","B":"5－HT 受体","C":"M胆碱受体","D":"a 肾上腺素受体","E":"甲状腺素受体"},"answer":["A","B","C","D"],"answerStr":"ABCD","rationale":"氯丙嗪可阻断多种受体：DA受体、α肾上腺素受体、M胆碱受体、5-HT2受体及H1受体等，除甲状腺素受体外均正确。","expl":{"A":"正确，阻断中脑-边缘/皮质通路DA受体是氯丙嗪抗精神病作用的主要机制。","B":"正确，氯丙嗪可阻断5-HT2受体。","C":"正确，阻断M受体可产生口干、便秘、视力模糊等副作用。","D":"正确，阻断α受体可引起体位性低血压。","E":"错误，氯丙嗪不阻断甲状腺素受体。"}},{"id":"ch14_q42","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"X","num":42,"stem":"对抑郁症有效的药物有","options":{"A":"氯丙嗪","B":"氯普噻吨","C":"米帕明","D":"舒必利","E":"碳酸锂"},"answer":["B","C","D","E"],"answerStr":"BCDE","rationale":"氯普噻吨、米帕明、舒必利均有抗抑郁作用，碳酸锂对抑郁症（尤其双相）也有一定疗效。","expl":{"A":"错误，氯丙嗪为抗精神病药，无抗抑郁作用。","B":"正确，氯普噻吨兼具抗抑郁作用，可用于伴抑郁的精神分裂症。","C":"正确，米帕明为三环类抗抑郁药，对抑郁症有效。","D":"正确，舒必利小剂量有抗抑郁作用。","E":"正确，碳酸锂对抑郁症（尤其双相障碍）有一定治疗和预防作用。"}},{"id":"ch14_q43","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"X","num":43,"stem":"氯丙嗪的锥体外系反应有","options":{"A":"急性肌张力障碍","B":"体位性低血压","C":"静坐不能","D":"帕金森综合症","E":"迟发性运动障碍"},"answer":["A","C","D","E"],"answerStr":"ACDE","rationale":"锥体外系反应包括帕金森综合征、静坐不能、急性肌张力障碍和迟发性运动障碍；体位性低血压属心血管反应。","expl":{"A":"正确，急性肌张力障碍属锥体外系反应。","B":"错误，体位性低血压是阻断α受体所致的心血管反应，非锥体外系反应。","C":"正确，静坐不能属锥体外系反应。","D":"正确，帕金森综合征属锥体外系反应。","E":"正确，迟发性运动障碍属锥体外系反应。"}},{"id":"ch14_q44","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"X","num":44,"stem":"苯海索对氯丙嗪引起的哪些不良反应有效？","options":{"A":"急性肌张力障碍","B":"体位性低血压","C":"静坐不能","D":"帕金森综合症","E":"迟发性运动障碍"},"answer":["A","C","D"],"answerStr":"ACD","rationale":"苯海索为中枢抗胆碱药，可缓解帕金森综合征、急性肌张力障碍和静坐不能，对迟发性运动障碍反而加重。","expl":{"A":"正确，苯海索可缓解急性肌张力障碍。","B":"错误，苯海索不能纠正体位性低血压。","C":"正确，苯海索可缓解静坐不能。","D":"正确，苯海索可缓解帕金森综合征。","E":"错误，苯海索可使迟发性运动障碍加重，不宜使用。"}},{"id":"ch14_q45","chapter":"第十八章 抗精神失常药","chapterIdx":13,"type":"X","num":45,"stem":"与氯丙嗪抗精神病作用机制有关的DA神经通路有","options":{"A":"中脑－边缘叶通路","B":"黑质－纹状体通路","C":"结节－漏斗通路","D":"中脑－皮质通路","E":"脑干网状结构上行激活系统"},"answer":["A","D"],"answerStr":"AD","rationale":"氯丙嗪抗精神病作用主要与阻断中脑-边缘叶通路和中脑-皮质通路的DA受体有关。","expl":{"A":"正确，阻断中脑-边缘叶通路DA受体与抗精神病（阳性症状）作用有关。","B":"错误，阻断黑质-纹状体通路DA受体引起锥体外系反应。","C":"错误，阻断结节-漏斗通路DA受体引起内分泌改变。","D":"正确，阻断中脑-皮质通路DA受体与抗精神病（阴性症状）作用有关。","E":"错误，脑干网状结构上行激活系统与觉醒有关，非抗精神病作用机制。"}}]},{"title":"第十九章 镇痛药","questions":[{"id":"ch15_q01","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":1,"stem":"典型的镇痛药其特点是","options":{"A":"有镇痛、解热作用","B":"有镇痛、抗炎作用","C":"有镇痛、解热、抗炎作用","D":"有强大的镇痛作用，无成瘾性","E":"有强大的镇痛作用，反复应用容易成瘾"},"answer":["E"],"answerStr":"E","rationale":"典型镇痛药（阿片类）主要作用于中枢，镇痛作用强大，但反复应用易产生成瘾性，故选E。","expl":{"A":"错误，解热作用是解热镇痛抗炎药的特点，阿片类无解热作用。","B":"错误，阿片类无抗炎作用，抗炎属于阿司匹林类特点。","C":"错误，解热、抗炎均为解热镇痛抗炎药作用，阿片类不具备。","D":"错误，成瘾性是阿片类镇痛药的突出缺点，并非无成瘾性。","E":"正确，镇痛强大且反复应用易成瘾是典型镇痛药的特点。"}},{"id":"ch15_q02","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":2,"stem":"吗啡常用注射给药的原因是","options":{"A":"口服不吸收","B":"片剂不稳定","C":"易被肠道破坏","D":"首关消除明显","E":"口服刺激性大"},"answer":["D"],"answerStr":"D","rationale":"吗啡口服可吸收，但经肝脏首关消除明显，生物利用度低，故多采用注射给药。","expl":{"A":"错误，吗啡口服可被吸收，只是首关消除多。","B":"错误，与片剂稳定性无关。","C":"错误，吗啡主要在肝脏代谢，而非被肠道破坏。","D":"正确，首关消除明显使口服生物利用度低，故注射给药。","E":"错误，刺激性并非注射给药的主要原因。"}},{"id":"ch15_q03","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":3,"stem":"吗啡一次给药，镇痛作用可持续","options":{"A":"导水管周围灰质","B":"蓝斑核","C":"延脑的孤束核","D":"中脑盖前核","E":"边缘系统"},"answer":["B"],"answerStr":"B","rationale":"蓝斑核阿片受体与吗啡的欣快感、成瘾性及戒断症状密切相关（题干与选项存在错位，按正确答案解析）。","expl":{"A":"错误，导水管周围灰质是吗啡镇痛作用的主要部位。","B":"正确，蓝斑核与欣快、成瘾及戒断症状有关。","C":"错误，延脑孤束核与吗啡镇咳作用有关。","D":"错误，中脑盖前核与吗啡缩瞳作用有关。","E":"错误，边缘系统主要参与情绪等活动。"}},{"id":"ch15_q04","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":4,"stem":"吗啡镇咳的部位是","options":{"A":"迷走神经背核","B":"延脑的孤束核","C":"中脑盖前核","D":"导水管周围灰","E":"蓝斑核"},"answer":["B"],"answerStr":"B","rationale":"吗啡抑制延脑孤束核的咳嗽中枢，从而产生镇咳作用。","expl":{"A":"错误，迷走神经背核与镇咳无关。","B":"正确，延脑孤束核是吗啡镇咳的作用部位。","C":"错误，中脑盖前核是缩瞳作用部位。","D":"错误，导水管周围灰质是镇痛作用部位。","E":"错误，蓝斑核与欣快、成瘾有关。"}},{"id":"ch15_q05","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":5,"stem":"吗啡抑制呼吸的主要原因是","options":{"A":"作用于时水管周围灰质","B":"作用于蓝斑核","C":"降低呼吸中枢对血液 CO2 张力的敏感区","D":"作用于脑干极后区","E":"作用于迷走神经背核"},"answer":["C"],"answerStr":"C","rationale":"吗啡抑制呼吸主要是降低延脑呼吸中枢对血液CO2张力的敏感性，使呼吸变慢变浅。","expl":{"A":"错误，导水管周围灰质与镇痛作用有关。","B":"错误，蓝斑核与欣快、成瘾有关。","C":"正确，降低呼吸中枢对CO2敏感性是其抑制呼吸的原因。","D":"错误，脑干极后区与催吐作用有关。","E":"错误，迷走神经背核与呼吸抑制无关。"}},{"id":"ch15_q06","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":6,"stem":"吗啡缩瞳的原因是","options":{"A":"作用于中脑盖前核的阿片受体","B":"作用于导水管周围灰质","C":"作用于延脑孤束核的阿片受体","D":"作用于蓝斑核","E":"作用于边缘系统"},"answer":["A"],"answerStr":"A","rationale":"吗啡兴奋中脑盖前核阿片受体，进而兴奋动眼神经缩瞳核，引起瞳孔缩小。","expl":{"A":"正确，中脑盖前核阿片受体介导吗啡的缩瞳作用。","B":"错误，导水管周围灰质与镇痛有关。","C":"错误，延脑孤束核与镇咳有关。","D":"错误，蓝斑核与欣快、成瘾有关。","E":"错误，边缘系统与情绪活动有关。"}},{"id":"ch15_q07","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":7,"stem":"镇痛作用最强的药物是","options":{"A":"吗啡","B":"喷他佐辛","C":"芬太尼","D":"美沙酮","E":"可待因"},"answer":["C"],"answerStr":"C","rationale":"芬太尼镇痛作用强，约为吗啡的100倍，是所列药物中镇痛作用最强的。","expl":{"A":"错误，吗啡镇痛强但弱于芬太尼。","B":"错误，喷他佐辛镇痛效力仅为吗啡的1/3。","C":"正确，芬太尼镇痛约为吗啡的100倍，最强。","D":"错误，美沙酮镇痛强度与吗啡相当。","E":"错误，可待因镇痛约为吗啡的1/10，较弱。"}},{"id":"ch15_q08","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":8,"stem":"哌替啶比吗啡应用多的原因是","options":{"A":"无便秘作用","B":"呼吸抑制作用轻","C":"作用较慢，维持时间短","D":"成瘾性较吗啡轻","E":"对支气平滑肌无影响"},"answer":["D"],"answerStr":"D","rationale":"哌替啶的成瘾性较吗啡轻，且对平滑肌影响较小，故临床上较吗啡应用更广。","expl":{"A":"错误，哌替啶亦有便秘作用，只是较吗啡轻。","B":"错误，哌替啶同样可抑制呼吸。","C":"错误，哌替啶作用较快且维持时间短。","D":"正确，成瘾性较吗啡轻是哌替啶应用较多的原因。","E":"错误，哌替啶对支气管平滑肌也有一定影响。"}},{"id":"ch15_q09","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":9,"stem":"胆绞痛病人最好选用","options":{"A":"阿托品","B":"哌替啶","C":"氯丙嗪＋阿托品","D":"哌替啶＋阿托品","E":"阿司匹林＋阿托品．"},"answer":["D"],"answerStr":"D","rationale":"胆绞痛为平滑肌痉挛性疼痛，哌替啶镇痛、阿托品解除痉挛，合用效果最佳。","expl":{"A":"错误，阿托品只解痉，镇痛作用不足。","B":"错误，单用哌替啶镇痛但无解痉作用，且可提高胆道平滑肌张力。","C":"错误，氯丙嗪无解痉作用，不能替代哌替啶。","D":"正确，哌替啶镇痛配合阿托品解痉，为胆绞痛优选。","E":"错误，阿司匹林对内脏绞痛效果差。"}},{"id":"ch15_q10","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":10,"stem":"心源性哮喘可以选用","options":{"A":"肾上腺素","B":"沙丁胺醇","C":"地塞米松","D":"格列齐特","E":"吗啡"},"answer":["E"],"answerStr":"E","rationale":"吗啡扩张外周血管、降低心脏前后负荷，并抑制呼吸中枢，可缓解心源性哮喘。","expl":{"A":"错误，肾上腺素用于支气管哮喘或过敏性休克。","B":"错误，沙丁胺醇用于支气管哮喘。","C":"错误，地塞米松不用于心源性哮喘急性发作。","D":"错误，格列齐特是降血糖药。","E":"正确，吗啡可用于心源性哮喘。"}},{"id":"ch15_q11","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":11,"stem":"吗啡镇痛作用的主要部位是","options":{"A":"蓝斑核的阿片受体","B":"丘脑内侧、脑室及导水管周围灰质","C":"黑质－纹状体通路","D":"脑干网状结构","E":"大脑边缘系统"},"answer":["B"],"answerStr":"B","rationale":"吗啡主要作用于丘脑内侧、脑室及导水管周围灰质的阿片受体，产生镇痛作用。","expl":{"A":"错误，蓝斑核与欣快、成瘾有关。","B":"正确，丘脑内侧、脑室及导水管周围灰质是镇痛主要部位。","C":"错误，黑质-纹状体通路与锥体外系运动有关。","D":"错误，脑干网状结构与镇痛关系不大。","E":"错误，大脑边缘系统与情绪活动有关。"}},{"id":"ch15_q12","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":12,"stem":"吗啡的镇痛作用最适用于","options":{"A":"其他镇痛药无效时的急性锐痛","B":"神经痛","C":"脑外伤疼痛","D":"分娩止痛","E":"诊断未明的急腹症疼痛"},"answer":["A"],"answerStr":"A","rationale":"吗啡镇痛作用强，最适用于其他镇痛药无效的急性锐痛，如严重创伤、心肌梗死等剧痛。","expl":{"A":"正确，其他镇痛药无效的急性锐痛是吗啡的主要适应证。","B":"错误，吗啡对神经痛效果差。","C":"错误，脑外伤时吗啡可抑制呼吸、升高颅压，属禁用。","D":"错误，分娩止痛不宜用吗啡，以免抑制新生儿呼吸。","E":"错误，诊断未明的急腹症禁用吗啡，以免掩盖病情。"}},{"id":"ch15_q13","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":13,"stem":"二氢埃托啡镇痛作用的主要部位是","options":{"A":"壳核","B":"大脑边缘系统","C":"延脑苍白球","D":"丘脑内侧、脑室及导水管周围灰质","E":"丘脑内侧、脑室及导水管周围灰质"},"answer":["E"],"answerStr":"E","rationale":"二氢埃托啡与吗啡相似，其镇痛作用部位亦在丘脑内侧、脑室及导水管周围灰质。","expl":{"A":"错误，壳核属基底节，与镇痛无关。","B":"错误，大脑边缘系统与情绪活动有关。","C":"错误，苍白球属基底节，无“延脑苍白球”这一结构。","D":"正确，该部位为二氢埃托啡镇痛作用部位（与E相同）。","E":"正确，丘脑内侧、脑室及导水管周围灰质是镇痛主要部位。"}},{"id":"ch15_q14","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":14,"stem":"人工冬眠合剂的组成是","options":{"A":"哌替啶、氯丙嗪、异丙嗪","B":"派替啶、吗啡、异丙嗪","C":"哌替啶、芬太尼、氯丙嗪","D":"哌替啶、芬太尼、异丙嗪","E":"芬太尼、氯丙嗪、异丙嗪"},"answer":["A"],"answerStr":"A","rationale":"人工冬眠合剂Ⅰ号由哌替啶、氯丙嗪、异丙嗪组成。","expl":{"A":"正确，三者组成人工冬眠合剂Ⅰ号。","B":"错误，含吗啡而非氯丙嗪。","C":"错误，含芬太尼而非异丙嗪。","D":"错误，含芬太尼而非氯丙嗪。","E":"错误，含芬太尼而非哌替啶。"}},{"id":"ch15_q15","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":15,"stem":"镇痛作用较吗啡强 100 倍的药物是","options":{"A":"哌替啶","B":"安那度","C":"芬太尼","D":"可待因","E":"曲马朵"},"answer":["C"],"answerStr":"C","rationale":"芬太尼镇痛作用强，约为吗啡的80~100倍（常记为100倍）。","expl":{"A":"错误，哌替啶镇痛约为吗啡的1/10。","B":"错误，安那度镇痛较吗啡弱，起效快、维持短。","C":"正确，芬太尼镇痛较吗啡强约100倍。","D":"错误，可待因镇痛约为吗啡的1/10。","E":"错误，曲马朵镇痛强度与喷他佐辛相近，较弱。"}},{"id":"ch15_q16","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":16,"stem":"主要激动阿片 k、s 受体，又可拮抗 m 受体的药物是","options":{"A":"美沙酮","B":"吗啡","C":"喷他佐辛","D":"曲马朵","E":"二氢埃托啡"},"answer":["C"],"answerStr":"C","rationale":"喷他佐辛为激动-拮抗型镇痛药，主要激动κ、σ受体，同时又可拮抗μ受体。","expl":{"A":"错误，美沙酮为μ受体激动剂。","B":"错误，吗啡主要激动μ受体。","C":"正确，喷他佐辛激动κ、σ受体并拮抗μ受体。","D":"错误，曲马朵主要激动μ受体并抑制单胺再摄取。","E":"错误，二氢埃托啡为μ受体激动剂。"}},{"id":"ch15_q17","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":17,"stem":"在药政管理上已列入非麻醉品的镇痛药是","options":{"A":"哌替啶","B":"芬太尼","C":"安那度","D":"喷他佐辛","E":"美沙酮"},"answer":["D"],"answerStr":"D","rationale":"喷他佐辛成瘾性小，在药政管理上已列入非麻醉药品。","expl":{"A":"错误，哌替啶属麻醉药品管理。","B":"错误，芬太尼属麻醉药品管理。","C":"错误，安那度属麻醉药品管理。","D":"正确，喷他佐辛已列入非麻醉药品。","E":"错误，美沙酮属麻醉药品管理。"}},{"id":"ch15_q18","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":18,"stem":"与吗啡成瘾性及戒断症状有直接联系的部位是","options":{"A":"孤束核","B":"盖前核","C":"蓝斑核","D":"壳核","E":"迷走神经背核"},"answer":["C"],"answerStr":"C","rationale":"蓝斑核阿片受体与吗啡的欣快、成瘾及戒断症状有直接联系。","expl":{"A":"错误，孤束核与镇咳有关。","B":"错误，盖前核与缩瞳有关。","C":"正确，蓝斑核与成瘾及戒断症状直接相关。","D":"错误，壳核属基底节，与运动调节有关。","E":"错误，迷走神经背核与成瘾戒断无关。"}},{"id":"ch15_q19","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":19,"stem":"对吗啡急性中毒呼吸抑制有显著疗效的药和物是","options":{"A":"多巴胺","B":"肾上腺素","C":"咖啡因","D":"纳洛酮","E":"山梗菜碱"},"answer":["D"],"answerStr":"D","rationale":"纳洛酮为阿片受体拮抗剂，能迅速对抗吗啡的呼吸抑制，用于急性中毒解救。","expl":{"A":"错误，多巴胺用于休克等，不能拮抗阿片。","B":"错误，肾上腺素用于过敏性休克等。","C":"错误，咖啡因为中枢兴奋药，非特异性拮抗剂。","D":"正确，纳洛酮能迅速逆转吗啡呼吸抑制。","E":"错误，山梗菜碱为呼吸兴奋药，非阿片拮抗剂。"}},{"id":"ch15_q20","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":20,"stem":"镇痛作用最强的药物是","options":{"A":"吗啡","B":"芬太尼","C":"二氢埃托啡","D":"哌替啶","E":"美沙酮"},"answer":["C"],"answerStr":"C","rationale":"二氢埃托啡镇痛作用极强，强于吗啡和芬太尼，是所列药物中最强者。","expl":{"A":"错误，吗啡强但弱于芬太尼和二氢埃托啡。","B":"错误，芬太尼强于吗啡但弱于二氢埃托啡。","C":"正确，二氢埃托啡镇痛作用最强。","D":"错误，哌替啶镇痛较弱。","E":"错误，美沙酮镇痛与吗啡相当。"}},{"id":"ch15_q21","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":21,"stem":"喷他佐辛最突出的优点是","options":{"A":"适用于各种慢性钝痛","B":"可口服给药","C":"无呼吸抑制作用","D":"成瘾性很小，已列入非麻醉药口","E":"兴奋心血管系统"},"answer":["D"],"answerStr":"D","rationale":"喷他佐辛成瘾性很小，药政管理上已列入非麻醉药品，是其最突出的优点。","expl":{"A":"错误，适用于慢性疼痛是其用途之一，但非最突出优点。","B":"错误，可口服是其特点，但非最突出优点。","C":"错误，喷他佐辛仍有呼吸抑制作用。","D":"正确，成瘾性小、列入非麻醉药品是最突出优点。","E":"错误，兴奋心血管属不良反应而非优点。"}},{"id":"ch15_q22","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":22,"stem":"阿片受体的拮抗剂是","options":{"A":"哌替啶","B":"美沙酮","C":"喷他佐辛","D":"芬太尼","E":"以是都不是"},"answer":["E"],"answerStr":"E","rationale":"哌替啶、美沙酮、芬太尼为阿片受体激动剂，喷他佐辛为激动-拮抗剂，均非纯拮抗剂，故以上都不是。","expl":{"A":"错误，哌替啶为μ受体激动剂。","B":"错误，美沙酮为μ受体激动剂。","C":"错误，喷他佐辛为激动-拮抗剂，非纯拮抗剂。","D":"错误，芬太尼为μ受体激动剂。","E":"正确，所列药物均非纯阿片受体拮抗剂。"}},{"id":"ch15_q23","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":23,"stem":"阿片受体的拮抗剂是","options":{"A":"纳曲酮","B":"喷他佐辛","C":"可待因","D":"延胡索乙素","E":"罗通定"},"answer":["A"],"answerStr":"A","rationale":"纳曲酮与纳洛酮相似，为纯阿片受体拮抗剂。","expl":{"A":"正确，纳曲酮为阿片受体拮抗剂。","B":"错误，喷他佐辛为激动-拮抗剂。","C":"错误，可待因为μ受体激动剂。","D":"错误，延胡索乙素为非阿片类中枢镇痛药。","E":"错误，罗通定为延胡索乙素左旋体，非阿片拮抗剂。"}},{"id":"ch15_q24","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":24,"stem":"对吗啡成瘾者可迅速诱发戒断症状的药物是","options":{"A":"哌替啶","B":"曲马朵","C":"纳洛酮","D":"美沙酮","E":"以是都不是"},"answer":["C"],"answerStr":"C","rationale":"纳洛酮阻断阿片受体，可使吗啡成瘾者迅速诱发戒断症状。","expl":{"A":"错误，哌替啶可替代吗啡，缓解戒断症状。","B":"错误，曲马朵激动阿片受体，不诱发戒断。","C":"正确，纳洛酮可迅速诱发戒断症状。","D":"错误，美沙酮用于替代脱毒治疗。","E":"错误。"}},{"id":"ch15_q25","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":25,"stem":"吗啡无下列哪种不良反应？","options":{"A":"引起腹泻","B":"引起便秘","C":"抑制呼吸中枢","D":"抑制咳嗽中枢","E":"引起体们性低血压"},"answer":["A"],"answerStr":"A","rationale":"吗啡提高胃肠平滑肌张力并抑制蠕动，引起便秘而非腹泻。","expl":{"A":"正确，吗啡无腹泻不良反应，反而引起便秘。","B":"错误，便秘是吗啡常见不良反应。","C":"错误，呼吸抑制是吗啡主要不良反应。","D":"错误，吗啡可抑制咳嗽中枢。","E":"错误，吗啡扩张血管可致体位性低血压。"}},{"id":"ch15_q26","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":26,"stem":"与脑内阿片受体无关的镇痛药是","options":{"A":"哌替啶","B":"罗通定","C":"美沙酮","D":"喷他佐辛","E":"二氢埃托啡"},"answer":["B"],"answerStr":"B","rationale":"罗通定（延胡索乙素左旋体）的镇痛作用与脑内阿片受体无关，主要与中枢抑制有关。","expl":{"A":"错误，哌替啶通过阿片受体发挥镇痛。","B":"正确，罗通定镇痛不依赖阿片受体。","C":"错误，美沙酮通过阿片受体镇痛。","D":"错误，喷他佐辛作用于阿片受体。","E":"错误，二氢埃托啡激动阿片受体。"}},{"id":"ch15_q27","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":27,"stem":"下列哪种情况不宜用哌替啶镇痛？","options":{"A":"创伤性疼痛","B":"手术后疼痛","C":"慢性钝痛","D":"内脏绞痛","E":"晚期癌症痛"},"answer":["C"],"answerStr":"C","rationale":"慢性钝痛长期反复应用哌替啶易产生成瘾性，故不宜选用。","expl":{"A":"错误，创伤性疼痛可选用哌替啶。","B":"错误，手术后疼痛可选用哌替啶。","C":"正确，慢性钝痛不宜反复应用，以免成瘾。","D":"错误，内脏绞痛可配阿托品应用。","E":"错误，晚期癌症痛可应用。"}},{"id":"ch15_q28","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"A","num":28,"stem":"吗啡不具备下列哪种药理作用？","options":{"A":"引起恶心","B":"引起体位性低血压","C":"致颅压增高","D":"引起腹泻","E":"抑制呼吸"},"answer":["D"],"answerStr":"D","rationale":"吗啡抑制肠蠕动、提高平滑肌张力，引起便秘而非腹泻。","expl":{"A":"错误，吗啡兴奋催吐化学感受区可致恶心。","B":"错误，吗啡扩张血管可致体位性低血压。","C":"错误，吗啡抑制呼吸、CO2潴留可致颅内压增高。","D":"正确，吗啡引起便秘，不引起腹泻。","E":"错误，吗啡可抑制呼吸。"}},{"id":"ch15_q29","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"B","num":29,"stem":"吗啡作用于延脑孤束核的阿片受体产生","options":{"A":"欣快作用","B":"镇痛作用","C":"缩瞳作用","D":"镇咳作用","E":"便秘作用"},"answer":["D"],"answerStr":"D","rationale":"延脑孤束核与咳嗽反射有关，吗啡作用于此处阿片受体产生镇咳作用。","expl":{"A":"错误，欣快作用与蓝斑核有关。","B":"错误，镇痛作用与丘脑内侧、脑室及导水管周围灰质有关。","C":"错误，缩瞳作用与中脑盖前核有关。","D":"正确，延脑孤束核介导镇咳作用。","E":"错误，便秘与胃肠平滑肌阿片受体有关。"}},{"id":"ch15_q30","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"B","num":30,"stem":"吗啡作用于蓝斑核的阿片受体产生","options":{"A":"欣快作用","B":"镇痛作用","C":"缩瞳作用","D":"镇咳作用","E":"便秘作用"},"answer":["A"],"answerStr":"A","rationale":"蓝斑核阿片受体与情绪活动有关，吗啡兴奋后产生欣快作用。","expl":{"A":"正确，蓝斑核介导欣快作用。","B":"错误，镇痛部位在丘脑内侧、脑室及导水管周围灰质。","C":"错误，缩瞳部位在中脑盖前核。","D":"错误，镇咳部位在延脑孤束核。","E":"错误，便秘与胃肠平滑肌有关。"}},{"id":"ch15_q31","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"B","num":31,"stem":"吗啡作用于中脑盖前核的阿片受体产生","options":{"A":"欣快作用","B":"镇痛作用","C":"缩瞳作用","D":"镇咳作用","E":"便秘作用"},"answer":["C"],"answerStr":"C","rationale":"中脑盖前核与动眼神经缩瞳核相连，吗啡兴奋后引起缩瞳。","expl":{"A":"错误，欣快作用与蓝斑核有关。","B":"错误，镇痛部位在丘脑内侧、脑室及导水管周围灰质。","C":"正确，中脑盖前核介导缩瞳作用。","D":"错误，镇咳部位在延脑孤束核。","E":"错误，便秘与胃肠平滑肌有关。"}},{"id":"ch15_q32","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"B","num":32,"stem":"吗啡作用于脑室及导水管周围灰质的阿片受体产生","options":{"A":"欣快作用","B":"镇痛作用","C":"缩瞳作用","D":"镇咳作用","E":"便秘作用"},"answer":["B"],"answerStr":"B","rationale":"脑室及导水管周围灰质是吗啡产生镇痛作用的主要部位。","expl":{"A":"错误，欣快作用与蓝斑核有关。","B":"正确，脑室及导水管周围灰质介导镇痛。","C":"错误，缩瞳部位在中脑盖前核。","D":"错误，镇咳部位在延脑孤束核。","E":"错误，便秘与胃肠平滑肌有关。"}},{"id":"ch15_q33","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"B","num":33,"stem":"可用于镇痛或吗啡成瘾戒毒","options":{"A":"延胡索乙素","B":"纳洛酮","C":"喷他佐辛","D":"哌替啶","E":"二氢埃托啡"},"answer":["E"],"answerStr":"E","rationale":"二氢埃托啡镇痛作用强，且曾用于吗啡成瘾的脱瘾（戒毒）治疗。","expl":{"A":"错误，延胡索乙素镇痛弱，不用于戒毒。","B":"错误，纳洛酮为拮抗剂，用于中毒解救。","C":"错误，喷他佐辛不用于戒毒。","D":"错误，哌替啶本身成瘾，不用于戒毒。","E":"正确，二氢埃托啡可用于镇痛及戒毒。"}},{"id":"ch15_q34","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"B","num":34,"stem":"镇痛效果个体差异大","options":{"A":"延胡索乙素","B":"纳洛酮","C":"喷他佐辛","D":"哌替啶","E":"二氢埃托啡"},"answer":["C"],"answerStr":"C","rationale":"喷他佐辛的镇痛作用存在较大的个体差异。","expl":{"A":"错误，延胡索乙素个体差异并非其特点。","B":"错误，纳洛酮无镇痛作用。","C":"正确，喷他佐辛镇痛效果个体差异大。","D":"错误，哌替啶个体差异相对较小。","E":"错误，二氢埃托啡个体差异并非其特点。"}},{"id":"ch15_q35","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"B","num":35,"stem":"为阿片受体拮抗剂","options":{"A":"延胡索乙素","B":"纳洛酮","C":"喷他佐辛","D":"哌替啶","E":"二氢埃托啡"},"answer":["B"],"answerStr":"B","rationale":"纳洛酮为纯阿片受体拮抗剂。","expl":{"A":"错误，延胡索乙素不作用于阿片受体。","B":"正确，纳洛酮为阿片受体拮抗剂。","C":"错误，喷他佐辛为激动-拮抗剂。","D":"错误，哌替啶为μ受体激动剂。","E":"错误，二氢埃托啡为μ受体激动剂。"}},{"id":"ch15_q36","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"B","num":36,"stem":"有活血散瘀，行气止痛作用","options":{"A":"延胡索乙素","B":"纳洛酮","C":"喷他佐辛","D":"哌替啶","E":"二氢埃托啡"},"answer":["A"],"answerStr":"A","rationale":"延胡索乙素为中药延胡索的有效成分，具活血散瘀、行气止痛作用。","expl":{"A":"正确，延胡索乙素有活血散瘀、行气止痛之功。","B":"错误，纳洛酮为阿片受体拮抗剂，无此功效。","C":"错误，喷他佐辛无活血化瘀功效。","D":"错误，哌替啶无活血化瘀功效。","E":"错误，二氢埃托啡无活血化瘀功效。"}},{"id":"ch15_q37","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"C","num":37,"stem":"吗啡激动 m 受体产生","options":{"A":"镇痛作用","B":"缩瞳作用","C":"两者均有","D":"两者均无"},"answer":["C"],"answerStr":"C","rationale":"μ受体激动与镇痛和缩瞳均有关，故两者均有。","expl":{"A":"错误（不完整），μ受体激动还产生缩瞳。","B":"错误（不完整），μ受体激动还产生镇痛。","C":"正确，μ受体激动产生镇痛和缩瞳。","D":"错误。"}},{"id":"ch15_q38","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"C","num":38,"stem":"吗啡激动 k 受体产生","options":{"A":"镇痛作用","B":"缩瞳作用","C":"两者均有","D":"两者均无"},"answer":["A"],"answerStr":"A","rationale":"κ受体激动主要产生镇痛作用，不引起缩瞳。","expl":{"A":"正确，κ受体激动可产生镇痛作用。","B":"错误，κ受体激动不产生缩瞳。","C":"错误，κ受体不介导缩瞳。","D":"错误，κ受体介导镇痛。"}},{"id":"ch15_q39","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"C","num":39,"stem":"吗啡激动 s 受体产生","options":{"A":"镇痛作用","B":"缩瞳作用","C":"两者均有","D":"两者均无"},"answer":["D"],"answerStr":"D","rationale":"σ受体激动与镇痛、缩瞳均无关，主要与烦躁不安、幻觉等精神症状有关。","expl":{"A":"错误，σ受体激动不产生镇痛。","B":"错误，σ受体激动不产生缩瞳。","C":"错误。","D":"正确，σ受体与镇痛、缩瞳均无关。"}},{"id":"ch15_q40","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"C","num":40,"stem":"芬太尼","options":{"A":"镇压痛作用比吗啡强","B":"成瘾性比吗啡小","C":"两者均是","D":"两者均否"},"answer":["C"],"answerStr":"C","rationale":"芬太尼镇痛作用比吗啡强约100倍，且依赖性较吗啡小，故两者均是。","expl":{"A":"错误（不完整），芬太尼成瘾性也较吗啡小。","B":"错误（不完整），芬太尼镇痛作用也强于吗啡。","C":"正确，芬太尼镇痛强于吗啡且成瘾性较小。","D":"错误。"}},{"id":"ch15_q41","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"C","num":41,"stem":"罗通定","options":{"A":"镇压痛作用比吗啡强","B":"成瘾性比吗啡小","C":"两者均是","D":"两者均否"},"answer":["D"],"answerStr":"D","rationale":"罗通定镇痛作用比吗啡弱，且本身无成瘾性，故两者均否。","expl":{"A":"错误，罗通定镇痛作用弱于吗啡。","B":"错误，罗通定无成瘾性，而非仅较吗啡小。","C":"错误。","D":"正确，罗通定镇痛弱且无成瘾性。"}},{"id":"ch15_q42","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"C","num":42,"stem":"哌替啶","options":{"A":"欣快感","B":"镇咳作用","C":"两者均有","D":"两者均无"},"answer":["A"],"answerStr":"A","rationale":"哌替啶可产生欣快感，但无明显镇咳作用。","expl":{"A":"正确，哌替啶可产生欣快感。","B":"错误，哌替啶无明显镇咳作用。","C":"错误，哌替啶无镇咳作用。","D":"错误，哌替啶有欣快感。"}},{"id":"ch15_q43","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"C","num":43,"stem":"二氢埃托啡","options":{"A":"欣快感","B":"镇咳作用","C":"两者均有","D":"两者均无"},"answer":["C"],"answerStr":"C","rationale":"二氢埃托啡兼有欣快感和镇咳作用，故两者均有。","expl":{"A":"错误（不完整），二氢埃托啡也有镇咳作用。","B":"错误（不完整），二氢埃托啡也有欣快感。","C":"正确，二氢埃托啡两者均有。","D":"错误。"}},{"id":"ch15_q44","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"C","num":44,"stem":"吗啡","options":{"A":"欣快感","B":"镇咳作用","C":"两者均有","D":"两者均无"},"answer":["C"],"answerStr":"C","rationale":"吗啡既有欣快感又有镇咳作用，故两者均有。","expl":{"A":"错误（不完整），吗啡也有镇咳作用。","B":"错误（不完整），吗啡也有欣快感。","C":"正确，吗啡两者均有。","D":"错误。"}},{"id":"ch15_q45","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"X","num":45,"stem":"吗啡禁用于","options":{"A":"哺乳妇女止痛","B":"支气管哮喘病人","C":"肺心病病人","D":"肝功能严重减退病人","E":"颅脑损伤昏迷病人"},"answer":["A","B","C","D","E"],"answerStr":"ABCDE","rationale":"吗啡可透过乳汁、收缩支气管、抑制呼吸并经肝代谢，故哺乳妇女、哮喘、肺心病、严重肝损及颅脑损伤昏迷者均禁用。","expl":{"A":"正确，吗啡可进入乳汁，影响婴儿。","B":"正确，吗啡收缩支气管、抑制呼吸，哮喘禁用。","C":"正确，肺心病呼吸储备差，禁用吗啡。","D":"正确，吗啡经肝代谢，严重肝功能减退禁用。","E":"正确，颅脑损伤时吗啡抑制呼吸并升高颅压，禁用。"}},{"id":"ch15_q46","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"X","num":46,"stem":"吗啡的临床应用有","options":{"A":"心肌梗死引起的剧痛","B":"严重创伤痛","C":"心源性哮喘","D":"止泻","E":"与氯丙嗪、异丙嗪组成人工冬眠合剂"},"answer":["A","B","C","D"],"answerStr":"ABCD","rationale":"吗啡用于心肌梗死剧痛、严重创伤痛、心源性哮喘和止泻，但人工冬眠合剂用哌替啶而非吗啡。","expl":{"A":"正确，心肌梗死剧痛可用吗啡。","B":"正确，严重创伤痛可用吗啡。","C":"正确，心源性哮喘可用吗啡。","D":"正确，可用吗啡类（如复方樟脑酊）止泻。","E":"错误，人工冬眠合剂含哌替啶，不含吗啡。"}},{"id":"ch15_q47","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"X","num":47,"stem":"哌替啶的临床应用有","options":{"A":"创伤性疼痛","B":"内脏绞痛","C":"麻醉前给药","D":"与氯丙嗪、异丙嗪组成人工冬眠合剂","E":"心源性哮喘"},"answer":["B","C","D","E"],"answerStr":"BCDE","rationale":"哌替啶用于内脏绞痛、麻醉前给药、心源性哮喘，并与氯丙嗪、异丙嗪组成人工冬眠合剂；创伤性剧痛多选用吗啡。","expl":{"A":"错误，创伤性剧痛多选用吗啡镇痛。","B":"正确，内脏绞痛可配阿托品应用。","C":"正确，哌替啶用于麻醉前给药。","D":"正确，与氯丙嗪、异丙嗪组成冬眠合剂。","E":"正确，哌替啶可用于心源性哮喘。"}},{"id":"ch15_q48","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"X","num":48,"stem":"人工合成的镇痛药有","options":{"A":"安那度","B":"罗通定","C":"二氢埃托啡","D":"美沙酮","E":"纳洛酮"},"answer":["A","C","D"],"answerStr":"ACD","rationale":"安那度、二氢埃托啡、美沙酮为人工合成镇痛药；罗通定来源于天然植物，纳洛酮为拮抗剂。","expl":{"A":"正确，安那度为人工合成镇痛药。","B":"错误，罗通定来自延胡索，非人工合成。","C":"正确，二氢埃托啡为人工合成镇痛药。","D":"正确，美沙酮为人工合成镇痛药。","E":"错误，纳洛酮为拮抗剂，非镇痛药。"}},{"id":"ch15_q49","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"X","num":49,"stem":"喷他佐辛的特点有","options":{"A":"为苯并吗啡烷类衍生物","B":"主要激动 k 和s 受体，又可拮抗 m 受体","C":"镇痛效力为吗啡的 1/3","D":"对冠心病病人，静脉注射可增加心脏作功量","E":"成瘾性很小，在药政管理上已列入非麻醉药品"},"answer":["A","B","C","D","E"],"answerStr":"ABCDE","rationale":"喷他佐辛为苯并吗啡烷类衍生物，激动κ、σ受体并拮抗μ受体，镇痛为吗啡1/3，可增加心脏作功，成瘾性小已列入非麻醉药品。","expl":{"A":"正确，喷他佐辛属苯并吗啡烷类衍生物。","B":"正确，主要激动κ、σ受体并可拮抗μ受体。","C":"正确，镇痛效力约为吗啡的1/3。","D":"正确，对冠心病患者静注可增加心脏作功量。","E":"正确，成瘾性很小，已列入非麻醉药品。"}},{"id":"ch15_q50","chapter":"第十九章 镇痛药","chapterIdx":14,"type":"X","num":50,"stem":"阿片受体拮抗剂有","options":{"A":"纳洛酮","B":"二氢埃托啡","C":"芬太尼","D":"烯丙吗啡","E":"纳曲酮"},"answer":["A","E"],"answerStr":"AE","rationale":"纳洛酮和纳曲酮为纯阿片受体拮抗剂；烯丙吗啡为部分激动剂（激动-拮抗剂）。","expl":{"A":"正确，纳洛酮为纯阿片受体拮抗剂。","B":"错误，二氢埃托啡为μ受体激动剂。","C":"错误，芬太尼为μ受体激动剂。","D":"错误，烯丙吗啡为激动-拮抗剂，非纯拮抗剂。","E":"正确，纳曲酮为纯阿片受体拮抗剂。"}}]},{"title":"第二十章 解热镇痛抗炎药","questions":[{"id":"ch16_q01","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":1,"stem":"解热镇痛药的退热作用机制是","options":{"A":"抑制中枢 PG 合成","B":"抑制外周 PG 合成","C":"抑制中枢 PG 降解","D":"抑制外周 PG 降解","E":"增加中枢 PG 释放"},"answer":["A"],"answerStr":"A","rationale":"解热镇痛药通过抑制下丘脑体温调节中枢的环氧酶，减少中枢前列腺素（PG）合成，使异常升高的体温调定点恢复而退热。","expl":{"A":"正确，退热主要靠抑制下丘脑体温调节中枢的 PG 合成，使调定点下移。","B":"错误，抑制外周 PG 合成主要与抗炎镇痛有关，非退热主因。","C":"错误，本类药物不抑制中枢 PG 降解。","D":"错误，本类药物不抑制外周 PG 降解。","E":"错误，药物是减少而非增加中枢 PG 释放。"}},{"id":"ch16_q02","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":2,"stem":"解热镇痛药镇痛的主要作用部位在","options":{"A":"导水管周围灰质","B":"脊髓","C":"丘脑","D":"脑干","E":"外周"},"answer":["E"],"answerStr":"E","rationale":"解热镇痛药主要通过抑制外周炎症部位 PG 合成，降低痛觉感受器对缓激肽等致痛物质的敏感性而镇痛，作用部位在外周。","expl":{"A":"错误，导水管周围灰质是阿片类镇痛药的主要作用部位。","B":"错误，脊髓主要参与中枢性镇痛，非此类药主要部位。","C":"错误，丘脑是痛觉传导中枢，但非此类药主要作用部位。","D":"错误，脑干不是解热镇痛药镇痛的主要部位。","E":"正确，镇痛作用部位主要在外周炎症局部。"}},{"id":"ch16_q03","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":3,"stem":"解热镇痛药的镇痛作用机制是","options":{"A":"阻断传入神经的冲动传导","B":"降低感觉纤维感受器的敏感性","C":"阻止炎症时 PG 的合成","D":"激动阿片受体","E":"以上都不是"},"answer":["C"],"answerStr":"C","rationale":"解热镇痛药通过抑制环氧酶，减少炎症部位 PG 合成，消除 PG 对痛觉感受器的增敏作用而镇痛。","expl":{"A":"错误，其不阻断传入神经冲动传导，那是局麻药作用。","B":"错误，降低感受器敏感性是结果，根本机制是减少 PG。","C":"正确，阻止炎症时 PG 合成是其镇痛的核心机制。","D":"错误，激动阿片受体是阿片类镇痛药的机制。","E":"错误，C 项已准确说明其机制。"}},{"id":"ch16_q04","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":4,"stem":"治疗类风湿性关节炎的首选药的是","options":{"A":"水杨酸钠","B":"阿司匹林","C":"保泰松","D":"吲哚美辛","E":"对乙酰氨基酚"},"answer":["B"],"answerStr":"B","rationale":"阿司匹林抗炎抗风湿作用明确、疗效可靠且经验成熟，是治疗类风湿性关节炎的首选药物。","expl":{"A":"错误，水杨酸钠刺激性大，疗效与耐受性不及阿司匹林。","B":"正确，阿司匹林是治疗类风湿性关节炎的首选药。","C":"错误，保泰松毒性大，不作首选。","D":"错误，吲哚美辛不良反应多，不作首选。","E":"错误，对乙酰氨基酚抗炎作用很弱，不用于类风湿。"}},{"id":"ch16_q05","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":5,"stem":"可防止脑血栓形成的药物是","options":{"A":"水杨酸钠","B":"阿司匹林","C":"保泰松","D":"吲哚美辛","E":"布洛芬"},"answer":["B"],"answerStr":"B","rationale":"小剂量阿司匹林抑制血小板环氧酶，减少血栓素 A2 生成而抗血小板聚集，可防止脑血栓形成。","expl":{"A":"错误，水杨酸钠无明显抗血小板作用。","B":"正确，阿司匹林抗血小板聚集，可防止脑血栓形成。","C":"错误，保泰松无此明确用途。","D":"错误，吲哚美辛抑制 PG 合成但无临床抗血栓用途。","E":"错误，布洛芬无明确抗血栓形成作用。"}},{"id":"ch16_q06","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":6,"stem":"丙磺舒增加青霉素疗效的机制是","options":{"A":"减慢其在肝脏代谢","B":"增加其对细菌膜的通透性","C":"减少其在皮肤小管分泌排泄","D":"对细菌起双重杀菌作用","E":"增加其与细菌蛋白结合力"},"answer":["C"],"answerStr":"C","rationale":"丙磺舒与青霉素竞争肾小管有机酸分泌转运体，减少青霉素排泄、提高其血药浓度而增效。","expl":{"A":"错误，与减慢肝代谢无关。","B":"错误，不增加青霉素对细菌膜的通透性。","C":"正确，竞争性抑制肾小管分泌，减少青霉素排泄。","D":"错误，无双重杀菌作用。","E":"错误，不增加其与细菌蛋白的结合力。"}},{"id":"ch16_q07","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":7,"stem":"秋水仙碱治疗痛风的机制 是","options":{"A":"减少尿酸的生成","B":"促进尿酸的排泄","C":"抑制肾小管对尿酸的再吸收","D":"抑制黄嘌呤投氧化酶","E":"选择性消炎作用"},"answer":["E"],"answerStr":"E","rationale":"秋水仙碱抑制中性粒细胞趋化与吞噬、减少炎症介质释放，对痛风性关节炎有选择性抗炎作用，但不影响尿酸代谢。","expl":{"A":"错误，秋水仙碱不减少尿酸生成。","B":"错误，不促进尿酸排泄。","C":"错误，不抑制肾小管对尿酸的重吸收。","D":"错误，抑制黄嘌呤氧化酶的是别嘌醇。","E":"正确，通过选择性消炎作用缓解痛风急性发作。"}},{"id":"ch16_q08","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":8,"stem":"阿司匹林防止血栓形成的机制是","options":{"A":"激活环加氧酶，增加血栓素生成，抗血小板聚集及抗血栓形成","B":"抑制环加氧酶，减少前列环素生成，抗血小板聚集及抗血栓形成","C":"抑制环加氧酶，减少血栓素生成，抗血小板聚集及抗血栓形成","D":"抑制环氧酶，增加前列环素生成，抗血小板聚集及抗血栓形成","E":"激活环加氧酶，减少血栓素生成，抗血小板聚集及抗血栓形成"},"answer":["C"],"answerStr":"C","rationale":"小剂量阿司匹林不可逆抑制血小板环加氧酶，减少血栓素 A2 生成，从而抗血小板聚集、抗血栓形成。","expl":{"A":"错误，其抑制而非激活环加氧酶。","B":"错误，主要减少血栓素 A2 而非前列环素。","C":"正确，抑制环加氧酶、减少血栓素 A2，抗血小板聚集。","D":"错误，抑制环氧酶但并非增加前列环素生成。","E":"错误，其抑制而非激活环加氧酶。"}},{"id":"ch16_q09","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":9,"stem":"解热镇痛药的抗炎作用机制是","options":{"A":"促进炎症消散","B":"抑制炎症时PG的合成","C":"抑制抑黄嘌呤氧化酶","D":"促进PG从肾脏排泄","E":"激活黄嘌呤氧化酶"},"answer":["B"],"answerStr":"B","rationale":"解热镇痛抗炎药通过抑制环氧酶，减少炎症部位 PG 等致炎物质的合成而发挥抗炎作用。","expl":{"A":"错误，非直接促进炎症消散。","B":"正确，抑制炎症时 PG 合成是其抗炎的基本机制。","C":"错误，抑制黄嘌呤氧化酶是别嘌醇的作用。","D":"错误，与促进 PG 从肾脏排泄无关。","E":"错误，激活黄嘌呤氧化酶非其作用。"}},{"id":"ch16_q10","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":10,"stem":"阿司匹林与甲磺丁脲合用易引起低血糖反应是由于前者","options":{"A":"从血浆蛋白结合部位置换甲磺丁脲","B":"抑制肝药酶，减慢甲磺丁脲代谢","C":"加快胃粘膜血流,增加甲磺丁脲吸收","D":"酸化尿液增加甲磺丁脲在肾小管重吸收","E":"以是都不是"},"answer":["A"],"answerStr":"A","rationale":"阿司匹林血浆蛋白结合率高，可把甲磺丁脲从血浆蛋白结合部位置换出来，使其游离浓度升高而致低血糖。","expl":{"A":"正确，竞争性置换血浆蛋白结合，使游离甲磺丁脲增多。","B":"错误，主要经蛋白置换而非抑制其代谢。","C":"错误，与加快胃黏膜血流无关。","D":"错误，并非通过酸化尿液增加重吸收所致。","E":"错误，A 项已准确说明原因。"}},{"id":"ch16_q11","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":11,"stem":"保泰松降低强心甙作用的原因是","options":{"A":"增加其与血浆蛋白结合","B":"增加其排泄","C":"减少其吸收","D":"增加其代谢","E":"增加其分布容积"},"answer":["D"],"answerStr":"D","rationale":"保泰松为肝药酶诱导剂，可加速强心苷的代谢，使其血药浓度降低而作用减弱。","expl":{"A":"错误，不增加强心苷与血浆蛋白的结合。","B":"错误，并非增加其排泄所致。","C":"错误，并非减少其吸收。","D":"正确，诱导肝药酶、加速强心苷代谢而降低其作用。","E":"错误，并非增加其分布容积。"}},{"id":"ch16_q12","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":12,"stem":"胃溃疡病人宜选用下列哪种药物解热镇痛？","options":{"A":"吲哚美辛","B":"乙酰氨基酚","C":"吡罗昔康","D":"保泰松","E":"阿司匹林"},"answer":["B"],"answerStr":"B","rationale":"对乙酰氨基酚对胃黏膜刺激性小、几乎不抑制胃黏膜 PG 合成，胃肠反应轻，故胃溃疡患者宜选用。","expl":{"A":"错误，吲哚美辛胃肠刺激明显，不宜用于溃疡者。","B":"正确，对乙酰氨基酚胃刺激小，适合溃疡患者解热镇痛。","C":"错误，吡罗昔康有胃肠反应，不宜选用。","D":"错误，保泰松易致溃疡，禁用。","E":"错误，阿司匹林抑制胃 PG 并直接刺激胃黏膜，禁用。"}},{"id":"ch16_q13","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":13,"stem":"保泰松作用特点为","options":{"A":"解热镇痛作用强、抗炎抗风湿作用强、毒性小","B":"解热镇痛作用强、抗炎抗风湿作用弱、毒性小","C":"解热镇痛作用弱、抗炎抗风湿作用强、毒性小","D":"解热镇痛作用弱、抗炎抗风湿作用强、毒性大","E":"解热镇痛作用强、抗炎抗风湿作用强、毒性大"},"answer":["D"],"answerStr":"D","rationale":"保泰松解热镇痛作用弱，但抗炎抗风湿作用强，且不良反应多、毒性大。","expl":{"A":"错误，其解热镇痛作用弱且毒性大。","B":"错误，其抗炎抗风湿作用强而非弱。","C":"错误，其毒性大而非小。","D":"正确，解热镇痛弱、抗炎抗风湿强、毒性大。","E":"错误，其解热镇痛作用弱。"}},{"id":"ch16_q14","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":14,"stem":"代谢为有毒性代谢产物的药物是","options":{"A":"阿司匹林","B":"保泰松","C":"非那西丁","D":"吲哚美辛","E":"甲芬那酸"},"answer":["C"],"answerStr":"C","rationale":"非那西丁在体内代谢可生成对氨基苯乙醚等有毒产物，可引起高铁血红蛋白血症和肾损害。","expl":{"A":"错误，阿司匹林代谢产物无此明显毒性。","B":"错误，保泰松的毒性主要与药物本身相关。","C":"正确，非那西丁代谢生成有毒产物，可致高铁血红蛋白血症、肾毒性。","D":"错误，吲哚美辛无此特点。","E":"错误，甲芬那酸无此特点。"}},{"id":"ch16_q15","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":15,"stem":"布洛芬的主要特点是","options":{"A":"解热镇痛作用强","B":"口服吸收慢","C":"与血浆蛋白结合少","D":"胃肠反应较轻，易耐受","E":"半衰期长"},"answer":["D"],"answerStr":"D","rationale":"布洛芬抗炎镇痛疗效与阿司匹林相似，但胃肠反应较轻、患者较易耐受，是其主要特点。","expl":{"A":"错误，布洛芬解热镇痛作用与阿司匹林相似，并非特点为强。","B":"错误，布洛芬口服吸收快。","C":"错误，布洛芬血浆蛋白结合率高。","D":"正确，布洛芬胃肠反应较轻、易耐受。","E":"错误，布洛芬半衰期短（约 2 小时）。"}},{"id":"ch16_q16","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":16,"stem":"呋塞米（速尿）可引起水杨酸蓄积中毒的原因 是","options":{"A":"减慢其代谢","B":"减少其与血浆蛋白结合","C":"缩小其表观分布容积","D":"减少其排泄","E":"以上都不是"},"answer":["D"],"answerStr":"D","rationale":"水杨酸经肾小管有机酸分泌排泄，呋塞米竞争性抑制其分泌而减少排泄，导致水杨酸蓄积中毒。","expl":{"A":"错误，与减慢其代谢无关。","B":"错误，并非减少其与血浆蛋白结合。","C":"错误，并非缩小表观分布容积。","D":"正确，竞争肾小管分泌、减少水杨酸排泄而蓄积。","E":"错误，D 项已准确说明原因。"}},{"id":"ch16_q17","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":17,"stem":"保泰松禁用于高血压、心功能不全是由于该药引起","options":{"A":"水钠潴留","B":"激动 a 肾上腺素受体","C":"激动肾上腺素受体","D":"收缩血管","E":"兴奋心脏"},"answer":["A"],"answerStr":"A","rationale":"保泰松可促进肾小管对钠、水的重吸收，引起水钠潴留，从而加重高血压和心功能不全。","expl":{"A":"正确，保泰松致水钠潴留，加重高血压和心衰。","B":"错误，不激动 α 肾上腺素受体。","C":"错误，不激动肾上腺素受体。","D":"错误，不直接收缩血管。","E":"错误，不兴奋心脏。"}},{"id":"ch16_q18","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":18,"stem":"溃疡病禁用的药物是","options":{"A":"布洛芬","B":"对乙酰氨基酚","C":"保泰松","D":"非那西丁","E":"酮洛芬"},"answer":["C"],"answerStr":"C","rationale":"保泰松抑制 PG 合成并直接刺激胃黏膜，易诱发或加重溃疡及胃出血，溃疡病患者禁用。","expl":{"A":"错误，布洛芬胃肠反应较轻，相对可用。","B":"错误，对乙酰氨基酚胃刺激小，溃疡者可用。","C":"正确，保泰松胃肠刺激重、易致溃疡，溃疡病禁用。","D":"错误，非那西丁胃刺激较小。","E":"错误，酮洛芬虽刺激胃，但本题典型禁用者为保泰松。"}},{"id":"ch16_q19","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":19,"stem":"支气管哮喘病人禁用的药物是","options":{"A":"吡罗昔康","B":"阿司匹林","C":"丙磺舒","D":"布洛芬","E":"氯芬那酸"},"answer":["B"],"answerStr":"B","rationale":"阿司匹林抑制 PG 合成，使花生四烯酸转向脂氧酶途径、白三烯增多，可诱发“阿司匹林哮喘”，故哮喘者禁用。","expl":{"A":"错误，吡罗昔康非典型诱发“阿司匹林哮喘”的药物。","B":"正确，阿司匹林可诱发阿司匹林哮喘，哮喘者禁用。","C":"错误，丙磺舒不诱发哮喘。","D":"错误，布洛芬虽可诱发，但本题所指典型禁用者为阿司匹林。","E":"错误，氯芬那酸非典型诱发药物。"}},{"id":"ch16_q20","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":20,"stem":"癫痫病人禁用的药物是","options":{"A":"阿司匹林","B":"吲哚美辛","C":"水杨酸钠","D":"非那西丁","E":"布洛芬"},"answer":["B"],"answerStr":"B","rationale":"吲哚美辛中枢神经系统不良反应明显，可诱发或加重癫痫等神经精神症状，癫痫患者禁用。","expl":{"A":"错误，阿司匹林一般不诱发癫痫。","B":"正确，吲哚美辛中枢不良反应多、可诱发癫痫，癫痫者禁用。","C":"错误，水杨酸钠无此禁忌。","D":"错误，非那西丁无此禁忌。","E":"错误，布洛芬无此禁忌。"}},{"id":"ch16_q21","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":21,"stem":"孕妇禁用的药物是","options":{"A":"水杨酸钠","B":"阿司匹林","C":"保泰松","D":"吲哚美辛","E":"布洛芬"},"answer":["D"],"answerStr":"D","rationale":"吲哚美辛易通过胎盘并抑制 PG 合成，可致胎儿动脉导管早闭等损害，故孕妇禁用。","expl":{"A":"错误，水杨酸钠非本题所指典型孕妇禁用药物。","B":"错误，阿司匹林虽孕晚期慎用，但非本题所指。","C":"错误，保泰松非本题所指典型禁用药物。","D":"正确，吲哚美辛可致胎儿损害，孕妇禁用。","E":"错误，布洛芬非本题所指典型禁用药物。"}},{"id":"ch16_q22","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":22,"stem":"胃肠反应常见的药物有","options":{"A":"吲哚美辛","B":"保泰松","C":"布洛芬","D":"甲芬那酸","E":"水杨酸钠"},"answer":["C"],"answerStr":"C","rationale":"所列药物中，布洛芬对胃黏膜刺激较小、胃肠反应较轻且易耐受，是胃肠安全性较好的选择。","expl":{"A":"错误，吲哚美辛胃肠反应明显，可致溃疡和出血。","B":"错误，保泰松胃肠刺激重、易致溃疡。","C":"正确，布洛芬胃肠反应较轻、易耐受。","D":"错误，甲芬那酸胃肠反应较明显。","E":"错误，水杨酸钠刺激性大，胃肠反应较重。"}},{"id":"ch16_q23","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":23,"stem":"阿司匹林的不良反应不包括","options":{"A":"凝血障碍","B":"水钠潴留","C":"变态反应","D":"水杨酸反应","E":"瑞夷综合症"},"answer":["B"],"answerStr":"B","rationale":"阿司匹林常见不良反应包括胃肠道反应、凝血障碍、变态反应、水杨酸反应及瑞夷综合征，但不引起水钠潴留（水钠潴留见于保泰松）。","expl":{"A":"错误，凝血障碍是阿司匹林不良反应之一。","B":"正确，水钠潴留是保泰松等药物的反应，非阿司匹林所致。","C":"错误，变态反应是阿司匹林不良反应之一。","D":"错误，水杨酸反应是阿司匹林过量中毒的表现。","E":"错误，瑞夷综合征是阿司匹林的严重不良反应。"}},{"id":"ch16_q24","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":24,"stem":"羟基保泰松的临床应用不包括","options":{"A":"风湿性关节炎","B":"恶性肿瘤引起的发热","C":"急性痛风","D":"强直性脊柱","E":"寄生虫病引起的发热"},"answer":["C"],"answerStr":"C","rationale":"羟基保泰松主要用于风湿性关节炎、强直性脊柱炎及难治性发热，急性痛风不宜选用。","expl":{"A":"错误，风湿性关节炎是羟基保泰松的适应证。","B":"错误，可用于恶性肿瘤等引起的难治性发热。","C":"正确，急性痛风宜用秋水仙碱、吲哚美辛等，羟基保泰松不用于此。","D":"错误，强直性脊柱炎是其适应证。","E":"错误，可用于寄生虫病等引起的发热。"}},{"id":"ch16_q25","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"A","num":25,"stem":"不用于抗炎的药物是","options":{"A":"水杨酸钠","B":"羟基保泰松","C":"吲哚美辛","D":"布洛芬","E":"对乙酰氨基酚"},"answer":["E"],"answerStr":"E","rationale":"对乙酰氨基酚解热镇痛作用强，但抗炎作用很弱、几无抗炎抗风湿作用，故不用于抗炎。","expl":{"A":"错误，水杨酸钠有抗炎作用。","B":"错误，羟基保泰松抗炎作用强。","C":"错误，吲哚美辛抗炎作用强。","D":"错误，布洛芬有抗炎作用。","E":"正确，对乙酰氨基酚抗炎作用很弱，不用于抗炎。"}},{"id":"ch16_q26","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"B","num":26,"stem":"治疗风湿性、类风湿性关节炎和急性痛风","options":{"A":"吡罗昔康","B":"别嘌醇","C":"保泰松","D":"非那西丁","E":"阿司匹林"},"answer":["C"],"answerStr":"C","rationale":"保泰松抗炎抗风湿作用强，并可用于急性痛风，兼顾风湿性、类风湿性关节炎和急性痛风。","expl":{"A":"错误，吡罗昔康用于风湿性疾病，但急性痛风一般不用。","B":"错误，别嘌醇用于慢性痛风（减少尿酸生成）。","C":"正确，保泰松可治疗风湿、类风湿关节炎及急性痛风。","D":"错误，非那西丁抗炎作用很弱。","E":"错误，阿司匹林用于风湿，但急性痛风非其主要用途。"}},{"id":"ch16_q27","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"B","num":27,"stem":"具有血浆 T1/2 长、用药剂量小的强效抗炎镇痛作用","options":{"A":"吡罗昔康","B":"别嘌醇","C":"保泰松","D":"非那西丁","E":"阿司匹林"},"answer":["A"],"answerStr":"A","rationale":"吡罗昔康血浆半衰期长，每日一次小剂量即可维持强效抗炎镇痛作用。","expl":{"A":"正确，吡罗昔康半衰期长、用药剂量小。","B":"错误，别嘌醇是抗痛风药，非抗炎镇痛药。","C":"错误，保泰松虽半衰期长但毒性大，不强调小剂量。","D":"错误，非那西丁抗炎作用弱。","E":"错误，阿司匹林半衰期短、需频繁给药。"}},{"id":"ch16_q28","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"B","num":28,"stem":"解热镇痛和抗炎抗风湿作用均强","options":{"A":"吡罗昔康","B":"别嘌醇","C":"保泰松","D":"非那西丁","E":"阿司匹林"},"answer":["E"],"answerStr":"E","rationale":"阿司匹林解热镇痛作用显著，且较大剂量时抗炎抗风湿作用强，两者兼备。","expl":{"A":"错误，吡罗昔康以抗炎镇痛为主，解热作用不突出。","B":"错误，别嘌醇非解热镇痛抗炎药。","C":"错误，保泰松解热镇痛作用弱。","D":"错误，非那西丁抗炎抗风湿作用弱。","E":"正确，阿司匹林解热镇痛与抗炎抗风湿作用均强。"}},{"id":"ch16_q29","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"B","num":29,"stem":"解热镇痛作用强，抗炎作用很弱","options":{"A":"吡罗昔康","B":"别嘌醇","C":"保泰松","D":"非那西丁","E":"阿司匹林"},"answer":["D"],"answerStr":"D","rationale":"非那西丁解热镇痛作用强，但抗炎作用很弱，与其活性代谢物对乙酰氨基酚的特点一致。","expl":{"A":"错误，吡罗昔康抗炎镇痛作用强。","B":"错误，别嘌醇非此类药。","C":"错误，保泰松抗炎强而解热镇痛弱。","D":"正确，非那西丁解热镇痛强、抗炎作用很弱。","E":"错误，阿司匹林抗炎抗风湿作用强。"}},{"id":"ch16_q30","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"B","num":30,"stem":"防止慢性痛风性关节炎或肾病变","options":{"A":"吡罗昔康","B":"别嘌醇","C":"保泰松","D":"非那西丁","E":"阿司匹林"},"answer":["B"],"answerStr":"B","rationale":"别嘌醇抑制黄嘌呤氧化酶、减少尿酸生成、降低血尿酸，可防止慢性痛风性关节炎及痛风性肾病。","expl":{"A":"错误，吡罗昔康不降低尿酸。","B":"正确，别嘌醇减少尿酸生成，防治慢性痛风及其肾损害。","C":"错误，保泰松仅缓解急性痛风症状，不降尿酸。","D":"错误，非那西丁无此作用。","E":"错误，阿司匹林不降尿酸，小剂量还可减少尿酸排泄。"}},{"id":"ch16_q31","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"C","num":31,"stem":"阿司匹林","options":{"A":"解热镇痛","B":"抗炎抗风湿","C":"两者均可","D":"两者均否"},"answer":["C"],"answerStr":"C","rationale":"阿司匹林既有较强的解热镇痛作用，也有显著的抗炎抗风湿作用，两者兼具。","expl":{"A":"不完整，阿司匹林不仅有解热镇痛作用，还能抗炎抗风湿。","B":"不完整，阿司匹林不仅有抗炎抗风湿作用，也有解热镇痛作用。","C":"正确，阿司匹林既解热镇痛又抗炎抗风湿。","D":"错误，阿司匹林具有上述两类作用。"}},{"id":"ch16_q32","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"C","num":32,"stem":"对乙酰氨基酚","options":{"A":"解热镇痛","B":"抗炎抗风湿","C":"两者均可","D":"两者均否"},"answer":["A"],"answerStr":"A","rationale":"对乙酰氨基酚解热镇痛作用强、与阿司匹林相当，但抗炎抗风湿作用很弱。","expl":{"A":"正确，对乙酰氨基酚解热镇痛作用强。","B":"错误，对乙酰氨基酚抗炎抗风湿作用很弱，几无。","C":"错误，其抗炎作用很弱，不能两者兼有。","D":"错误，其解热镇痛作用明确。"}},{"id":"ch16_q33","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"C","num":33,"stem":"保泰松","options":{"A":"解热镇痛","B":"抗炎抗风湿","C":"两者均可","D":"两者均否"},"answer":["B"],"answerStr":"B","rationale":"保泰松抗炎抗风湿作用强，但解热镇痛作用弱，故仅具抗炎抗风湿作用。","expl":{"A":"错误，保泰松解热镇痛作用弱。","B":"正确，保泰松抗炎抗风湿作用强。","C":"错误，其解热镇痛作用弱，不能两者兼有。","D":"错误，其抗炎抗风湿作用明确且强。"}},{"id":"ch16_q34","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"C","num":34,"stem":"吲哚美辛","options":{"A":"解热镇痛","B":"抗炎抗风湿","C":"两者均可","D":"两者均否"},"answer":["C"],"answerStr":"C","rationale":"吲哚美辛解热镇痛和抗炎抗风湿作用均强，两者兼具。","expl":{"A":"不完整，吲哚美辛不仅能解热镇痛，抗炎抗风湿作用也强。","B":"不完整，吲哚美辛不仅有抗炎抗风湿作用，也有解热镇痛作用。","C":"正确，吲哚美辛解热镇痛与抗炎抗风湿作用均强。","D":"错误，吲哚美辛具有上述两类作用。"}},{"id":"ch16_q35","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"X","num":35,"stem":"治疗急性痛风的药物有","options":{"A":"保泰松","B":"羟基保泰松","C":"甲芬那酸","D":"秋水仙碱","E":"水杨酸钠"},"answer":["A","D"],"answerStr":"AD","rationale":"急性痛风发作可选用秋水仙碱（特效）及保泰松、吲哚美辛等缓解症状。","expl":{"A":"正确，保泰松可用于急性痛风缓解症状。","B":"错误，羟基保泰松不用于急性痛风。","C":"错误，甲芬那酸一般不用于急性痛风。","D":"正确，秋水仙碱是急性痛风的特效药。","E":"错误，水杨酸钠不用于急性痛风。"}},{"id":"ch16_q36","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"X","num":36,"stem":"引起＂阿司匹林哮喘＂的药物有","options":{"A":"羟基保泰松","B":"阿司匹林","C":"吲哚美辛","D":"布洛芬","E":"吡罗昔康"},"answer":["B","D"],"answerStr":"BD","rationale":"抑制环氧酶可使花生四烯酸转向脂氧酶途径、白三烯生成增多而诱发支气管哮喘，阿司匹林与布洛芬均可引起。","expl":{"A":"错误，羟基保泰松诱发哮喘少见，非典型。","B":"正确，阿司匹林可诱发“阿司匹林哮喘”。","C":"错误，吲哚美辛以中枢和胃肠反应为主，本题典型诱发者为阿司匹林、布洛芬。","D":"正确，布洛芬可诱发“阿司匹林哮喘”。","E":"错误，吡罗昔康非本题所指典型诱发药物。"}},{"id":"ch16_q37","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"X","num":37,"stem":"治疗慢性痛风的药物有","options":{"A":"保泰松","B":"别嘌醇","C":"布洛芬","D":"苯溴马隆","E":"丙磺舒"},"answer":["B","D","E"],"answerStr":"BDE","rationale":"慢性痛风需降低血尿酸：别嘌醇减少尿酸生成，苯溴马隆、丙磺舒促进尿酸排泄。","expl":{"A":"错误，保泰松仅用于急性痛风缓解症状。","B":"正确，别嘌醇减少尿酸生成，用于慢性痛风。","C":"错误，布洛芬不降尿酸，不用于慢性痛风。","D":"正确，苯溴马隆促进尿酸排泄，用于慢性痛风。","E":"正确，丙磺舒促进尿酸排泄，用于慢性痛风。"}},{"id":"ch16_q38","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"X","num":38,"stem":"阿司匹林的镇痛作用特点是","options":{"A":"镇痛作用部位主要在外周","B":"对慢性钝痛效果好","C":"镇痛作用机制是防止炎症时 PG 合成","D":"常与其他解热镇痛药配成复方使用","E":"对锐痛和内脏平滑肌绞痛也有效"},"answer":["A","B","C","D"],"answerStr":"ABCD","rationale":"阿司匹林镇痛部位在外周，对慢性钝痛效果好，机制为抑制炎症 PG 合成，常配成复方使用；但对锐痛和内脏绞痛效果差。","expl":{"A":"正确，镇痛作用部位主要在外周。","B":"正确，对慢性钝痛效果好。","C":"正确，机制是抑制炎症时 PG 合成。","D":"正确，常与其他解热镇痛药配成复方使用。","E":"错误，对锐痛和内脏平滑肌绞痛效果差。"}},{"id":"ch16_q39","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"X","num":39,"stem":"保泰松的禁忌证有","options":{"A":"糖尿病","B":"高血压","C":"溃疡病","D":"心功能不全","E":"肝肾功能不良"},"answer":["B","C","D","E"],"answerStr":"BCDE","rationale":"保泰松可致水钠潴留、胃肠溃疡及肝肾、血液毒性，故高血压、心功能不全、溃疡病及肝肾功能不良者禁用。","expl":{"A":"错误，糖尿病不是保泰松的禁忌证。","B":"正确，水钠潴留加重病情，高血压者禁用。","C":"正确，易诱发溃疡，溃疡病者禁用。","D":"正确，水钠潴留加重心衰，心功能不全者禁用。","E":"正确，肝肾功能不良者禁用。"}},{"id":"ch16_q40","chapter":"第二十章 解热镇痛抗炎药","chapterIdx":15,"type":"X","num":40,"stem":"阿司匹林引起胃出血和诱发胃溃疡的原因是","options":{"A":"凝血障碍","B":"变态反应","C":"局部刺激","D":"抑制 PG 合成","E":"水杨酸反应"},"answer":["C","D"],"answerStr":"CD","rationale":"阿司匹林直接刺激胃黏膜，并抑制胃黏膜 PG 合成、削弱其保护作用，共同导致胃出血和溃疡。","expl":{"A":"错误，凝血障碍是全身出血倾向，非胃溃疡的直接原因。","B":"错误，变态反应与胃溃疡无直接关系。","C":"正确，直接刺激胃黏膜是其原因之一。","D":"正确，抑制胃黏膜 PG 合成、削弱胃黏膜屏障是主要原因。","E":"错误，水杨酸反应是中枢毒性表现，与胃溃疡无直接关系。"}}]}]};
