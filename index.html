缩","C":"支气管平滑肌松弛","D":"糖原分解","E":"瞳孔缩小"},"answer":["A","C","D"],"answerStr":"ACD","rationale":"β受体激动使心率加快、支气管松弛、糖原分解。","expl":{"A":"正确，β1受体激动使心率加快。","B":"β2受体激动使血管舒张，非收缩。","C":"正确，β2受体激动使支气管平滑肌松弛。","D":"正确，β受体激动促进糖原分解。","E":"瞳孔缩小是M受体效应，非β受体。"}},{"id":"ch05_q30","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"X","num":30,"stem":"激动 β 受体，同时阻滞 α 受体可导致下列哪些效应","options":{"A":"子宫松弛","B":"支气管扩张","C":"血管扩张","D":"瞳孔散大","E":"以上均无"},"answer":["A","B","C"],"answerStr":"ABC","rationale":"激动β受体并阻滞α受体可致子宫松弛、支气管扩张、血管扩张。","expl":{"A":"正确，β2激动使子宫平滑肌松弛。","B":"正确，β2激动使支气管扩张。","C":"正确，β2激动使血管扩张，α阻滞也削弱血管收缩。","D":"阻滞α受体使辐射肌松弛而缩瞳，非散瞳。","E":"以上均无，错误。"}}]},{"title":"第六章 胆碱受体激动药","questions":[{"id":"ch06_q01","chapter":"第六章 胆碱受体激动药","chapterIdx":5,"type":"A","num":1,"stem":"毛果芸香碱对眼睛的作用是","options":{"A":"瞳孔缩小，升高眼内压，调节痉挛","B":"瞳孔缩小，降低眼内压，调节痉挛","C":"瞳孔扩大，升高眼内压，调节麻痹","D":"瞳孔扩大，降低眼内压，调节麻痹","E":"瞳孔缩小，降低眼内压，调节麻痹"},"answer":["B"],"answerStr":"B","rationale":"毛果芸香碱使瞳孔缩小、眼内压降低并致调节痉挛。","expl":{"A":"毛果芸香碱降低眼内压，非升高。","B":"正确，毛果芸香碱缩瞳、降眼压、调节痉挛。","C":"瞳孔扩大是阿托品类效应。","D":"瞳孔扩大、调节麻痹是阿托品类效应。","E":"毛果芸香碱致调节痉挛，非麻痹。"}},{"id":"ch06_q02","chapter":"第六章 胆碱受体激动药","chapterIdx":5,"type":"A","num":2,"stem":"毛果芸香碱的缩瞳机制是","options":{"A":"阻断虹膜 a 受体，开大肌松弛","B":"阻断虹膜 M 胆碱受体，括约肌松弛","C":"激动虹膜 a 受体，开大肌收缩","D":"激动虹膜 M 胆碱受体，括约肌收缩","E":"抑制胆碱酯酶，使乙酰胆碱增多"},"answer":["D"],"answerStr":"D","rationale":"毛果芸香碱激动虹膜瞳孔括约肌M受体使其收缩而缩瞳。","expl":{"A":"阻断α受体、开大肌松弛非毛果芸香碱机制。","B":"阻断M受体使括约肌松弛会引起扩瞳，非缩瞳。","C":"激动α受体使开大肌收缩引起扩瞳。","D":"正确，激动虹膜M受体使括约肌收缩而缩瞳。","E":"抑制胆碱酯酶是毒扁豆碱机制，非毛果芸香碱。"}},{"id":"ch06_q03","chapter":"第六章 胆碱受体激动药","chapterIdx":5,"type":"A","num":3,"stem":"下列关于卡巴胆碱作用错误的是","options":{"A":"激动 M 胆碱受体","B":"激动 N 胆碱受体","C":"用于术后腹气胀与尿潴留","D":"作用广泛，副作用大","E":"禁用于青光眼"},"answer":["C"],"answerStr":"C","rationale":"卡巴胆碱主要用于青光眼，用于术后腹气胀与尿潴留的是氨甲酰甲胆碱。","expl":{"A":"卡巴胆碱激动M胆碱受体，正确。","B":"卡巴胆碱也激动N胆碱受体，正确。","C":"正确，用于术后腹气胀与尿潴留是氨甲酰甲胆碱的用途。","D":"卡巴胆碱作用广泛、副作用大，正确。","E":"卡巴胆碱主要局部用于青光眼，并非禁用。"}},{"id":"ch06_q04","chapter":"第六章 胆碱受体激动药","chapterIdx":5,"type":"A","num":4,"stem":"氨甲酰胆碱临床主要用于","options":{"A":"青光眼","B":"术后腹气胀和尿潴留","C":"眼底检查","D":"解救有机磷农药中毒","E":"治疗室上性心动过速"},"answer":["A"],"answerStr":"A","rationale":"氨甲酰胆碱（卡巴胆碱）临床主要局部用于青光眼。","expl":{"A":"正确，氨甲酰胆碱主要局部点眼用于青光眼。","B":"用于术后腹气胀和尿潴留的是氨甲酰甲胆碱。","C":"眼底检查需散瞳，用阿托品等，非氨甲酰胆碱。","D":"解救有机磷中毒用阿托品和解磷定，非氨甲酰胆碱。","E":"治疗室上性心动过速用维拉帕米等，非氨甲酰胆碱。"}},{"id":"ch06_q05","chapter":"第六章 胆碱受体激动药","chapterIdx":5,"type":"A","num":5,"stem":"对于 ACh，下列叙述错误的是","options":{"A":"激动 M 、N-R","B":"无临床实用价值","C":"作用广泛","D":"化学性质稳定","E":"化学性质不稳定"},"answer":["D"],"answerStr":"D","rationale":"ACh化学性质不稳定，易被胆碱酯酶水解。","expl":{"A":"ACh可激动M、N受体，正确。","B":"ACh无临床实用价值，正确。","C":"ACh作用广泛，正确。","D":"正确，ACh化学性质不稳定，此题说法错误。","E":"ACh化学性质不稳定，正确。"}},{"id":"ch06_q06","chapter":"第六章 胆碱受体激动药","chapterIdx":5,"type":"A","num":6,"stem":"与毒扁豆碱相比，毛果芸香碱不具备哪种特点？","options":{"A":"遇光不稳定","B":"维持时间短","C":"刺激性小","D":"作用较弱","E":"水溶液稳定"},"answer":["A"],"answerStr":"A","rationale":"毛果芸香碱水溶液稳定，遇光不稳定是毒扁豆碱的特点。","expl":{"A":"正确，遇光不稳定是毒扁豆碱的特点，毛果芸香碱不具备。","B":"毛果芸香碱维持时间较短，具备。","C":"毛果芸香碱刺激性小，具备。","D":"毛果芸香碱作用较弱，具备。","E":"毛果芸香碱水溶液稳定，具备。"}},{"id":"ch06_q07","chapter":"第六章 胆碱受体激动药","chapterIdx":5,"type":"A","num":7,"stem":"切除支配虹膜的神经（即去神经眼）后再滴入毛果芸香碱，则应","options":{"A":"扩瞳","B":"缩瞳","C":"先扩瞳后缩瞳","D":"先缩瞳后扩瞳","E":"无影响"},"answer":["B"],"answerStr":"B","rationale":"毛果芸香碱直接激动M受体，去神经后仍可缩瞳。","expl":{"A":"扩瞳需激动α受体或阻断M受体，毛果芸香碱不引起。","B":"正确，去神经眼滴毛果芸香碱仍直接激动M受体而缩瞳。","C":"先扩瞳后缩瞳与毛果芸香碱作用不符。","D":"先缩瞳后扩瞳与毛果芸香碱作用不符。","E":"无影响错误，毛果芸香碱仍有缩瞳作用。"}},{"id":"ch06_q08","chapter":"第六章 胆碱受体激动药","chapterIdx":5,"type":"A","num":8,"stem":"小剂量 ACh 或 M-R 激动药无下列哪种作用","options":{"A":"缩瞳、降低眼内压","B":"腺体分泌增加","C":"胃肠、膀胱平滑肌兴奋","D":"骨骼肌收缩","E":"心脏抑制、血管扩张、血压下降"},"answer":["D"],"answerStr":"D","rationale":"骨骼肌收缩需激动N2受体，小剂量M激动药不引起。","expl":{"A":"缩瞳、降眼压是M激动效应。","B":"腺体分泌增加是M激动效应。","C":"胃肠、膀胱平滑肌兴奋是M激动效应。","D":"正确，骨骼肌收缩需N2受体，M激动药不引起。","E":"心脏抑制、血管扩张、血压下降是M激动效应。"}},{"id":"ch06_q09","chapter":"第六章 胆碱受体激动药","chapterIdx":5,"type":"A","num":9,"stem":"与毛果芸香碱相比，毒扁豆碱用于治疗青光眼的优点是","options":{"A":"作用强而久","B":"水溶液稳定","C":"毒副作用小","D":"不引起调节痉挛","E":"不会吸收中毒"},"answer":["A"],"answerStr":"A","rationale":"毒扁豆碱通过抑制胆碱酯酶间接发挥作用，作用强而持久。","expl":{"A":"正确，毒扁豆碱治青光眼作用强而久。","B":"毒扁豆碱水溶液不稳定，非优点。","C":"毒扁豆碱毒副作用较大。","D":"毒扁豆碱也引起调节痉挛。","E":"毒扁豆碱可吸收中毒。"}},{"id":"ch06_q10","chapter":"第六章 胆碱受体激动药","chapterIdx":5,"type":"A","num":10,"stem":"可直接激动 M 、N-R 的药物是","options":{"A":"氨甲酰甲胆碱","B":"氨甲酰胆碱","C":"毛果芸香碱","D":"毒扁豆碱","E":"加兰他敏"},"answer":["B"],"answerStr":"B","rationale":"氨甲酰胆碱可直接激动M和N受体。","expl":{"A":"氨甲酰甲胆碱主要激动M受体。","B":"正确，氨甲酰胆碱直接激动M、N受体。","C":"毛果芸香碱主要激动M受体。","D":"毒扁豆碱为胆碱酯酶抑制剂，非直接激动。","E":"加兰他敏为胆碱酯酶抑制剂。"}},{"id":"ch06_q11","chapter":"第六章 胆碱受体激动药","chapterIdx":5,"type":"B","num":11,"stem":"ACh 的作用是","options":{"A":"激动 M-R 及 N-R","B":"激动 M-R","C":"小剂量激动 N-R，大剂量阻断 N-R","D":"阻断 M-R 和 N-R","E":"阻断 M-R"},"answer":["A"],"answerStr":"A","rationale":"ACh可激动M和N受体。","expl":{"A":"正确，ACh激动M受体及N受体。","B":"仅激动M受体非ACh的完整作用。","C":"小剂量激动N、大剂量阻断N是烟碱的作用特点。","D":"阻断M和N受体是阿托品类的作用。","E":"仅阻断M受体非ACh作用。"}},{"id":"ch06_q12","chapter":"第六章 胆碱受体激动药","chapterIdx":5,"type":"B","num":12,"stem":"毛果芸香碱的作用是","options":{"A":"激动 M-R 及 N-R","B":"激动 M-R","C":"小剂量激动 N-R，大剂量阻断 N-R","D":"阻断 M-R 和 N-R","E":"阻断 M-R"},"answer":["B"],"answerStr":"B","rationale":"毛果芸香碱选择性激动M受体。","expl":{"A":"毛果芸香碱不激动N受体。","B":"正确，毛果芸香碱主要激动M受体。","C":"小剂量激动N、大剂量阻断N是烟碱特点。","D":"毛果芸香碱不阻断M、N受体。","E":"毛果芸香碱是激动M受体，非阻断。"}},{"id":"ch06_q13","chapter":"第六章 胆碱受体激动药","chapterIdx":5,"type":"B","num":13,"stem":"氨甲酰胆碱的作用是","options":{"A":"激动 M-R 及 N-R","B":"激动 M-R","C":"小剂量激动 N-R，大剂量阻断 N-R","D":"阻断 M-R 和 N-R","E":"阻断 M-R"},"answer":["A"],"answerStr":"A","rationale":"氨甲酰胆碱可激动M和N受体。","expl":{"A":"正确，氨甲酰胆碱激动M及N受体。","B":"仅激动M受体不完整。","C":"小剂量激动N、大剂量阻断N是烟碱特点。","D":"氨甲酰胆碱不阻断受体。","E":"氨甲酰胆碱是激动剂，非阻断。"}},{"id":"ch06_q14","chapter":"第六章 胆碱受体激动药","chapterIdx":5,"type":"B","num":14,"stem":"氨甲酰甲胆碱","options":{"A":"用于青光眼和虹膜炎","B":"用于术后腹气胀和尿潴留","C":"解救有机磷农药中毒","D":"无临床实用价值，但有毒理意义","E":"被胆碱酯酶水解，作科研工具药"},"answer":["B"],"answerStr":"B","rationale":"氨甲酰甲胆碱用于术后腹气胀和尿潴留。","expl":{"A":"用于青光眼和虹膜炎的是毛果芸香碱。","B":"正确，氨甲酰甲胆碱用于术后腹气胀和尿潴留。","C":"解救有机磷中毒用阿托品等。","D":"无临床价值、有毒理意义的是烟碱。","E":"被胆碱酯酶水解、作工具药的是ACh。"}},{"id":"ch06_q15","chapter":"第六章 胆碱受体激动药","chapterIdx":5,"type":"B","num":15,"stem":"烟碱","options":{"A":"用于青光眼和虹膜炎","B":"用于术后腹气胀和尿潴留","C":"解救有机磷农药中毒","D":"无临床实用价值，但有毒理意义","E":"被胆碱酯酶水解，作科研工具药"},"answer":["D"],"answerStr":"D","rationale":"烟碱无临床实用价值，但有毒理意义。","expl":{"A":"用于青光眼和虹膜炎的是毛果芸香碱。","B":"用于术后腹气胀尿潴留的是氨甲酰甲胆碱。","C":"解救有机磷中毒用阿托品。","D":"正确，烟碱无临床实用价值，但有毒理意义。","E":"被胆碱酯酶水解、作工具药的是ACh。"}},{"id":"ch06_q16","chapter":"第六章 胆碱受体激动药","chapterIdx":5,"type":"C","num":16,"stem":"治疗青光眼","options":{"A":"毛果芸香碱","B":"毒扁豆碱","C":"两者均是","D":"两者均否"},"answer":["C"],"answerStr":"C","rationale":"毛果芸香碱和毒扁豆碱均可缩瞳降眼压，用于青光眼。","expl":{"A":"毛果芸香碱用于青光眼。","B":"毒扁豆碱也用于青光眼。","C":"正确，两者均用于治疗青光眼。","D":"两者均否，错误。"}},{"id":"ch06_q17","chapter":"第六章 胆碱受体激动药","chapterIdx":5,"type":"C","num":17,"stem":"水溶液不稳定，需避光保存","options":{"A":"毛果芸香碱","B":"毒扁豆碱","C":"两者均是","D":"两者均否"},"answer":["B"],"answerStr":"B","rationale":"毒扁豆碱水溶液不稳定、遇光易氧化变色，需避光保存。","expl":{"A":"毛果芸香碱水溶液稳定。","B":"正确，毒扁豆碱水溶液不稳定，需避光保存。","C":"两者均是，错误。","D":"两者均否，错误。"}},{"id":"ch06_q18","chapter":"第六章 胆碱受体激动药","chapterIdx":5,"type":"X","num":18,"stem":"毛果芸香碱对眼的作用","options":{"A":"瞳孔缩小","B":"降低眼内压","C":"睫状肌松弛","D":"治虹膜炎","E":"对汗腺不敏感"},"answer":["A","B","C"],"answerStr":"ABC","rationale":"毛果芸香碱激动M受体，使瞳孔缩小、眼内压降低，并引起调节痉挛。","expl":{"A":"正确，毛果芸香碱激动瞳孔括约肌M受体而缩瞳。","B":"正确，缩瞳使前房角开放，房水回流，眼内压降低。","C":"正确，毛果芸香碱使睫状肌收缩、悬韧带松弛，引起调节痉挛。","D":"毛果芸香碱与扩瞳药交替用于虹膜炎以防粘连，并非直接治疗虹膜炎。","E":"毛果芸香碱促进汗腺和唾液腺分泌，对汗腺敏感而非不敏感。"}},{"id":"ch06_q19","chapter":"第六章 胆碱受体激动药","chapterIdx":5,"type":"X","num":19,"stem":"有关毒蕈碱的论述正确的有","options":{"A":"食用丝盖伞菌属和杯伞菌属蕈类后 30-60 分钟出现中毒","B":"中毒表现为流涎，流泪，恶心，呕吐，头痛，视觉障碍，腹部绞痛，腹泻","C":"中毒表现为心动过速，血压升高，易脑出血","D":"中毒表现为气管痉挛，呼吸困难，重者休克","E":"可用阿托品 每隔 30 分钟肌注 1-2mg"},"answer":["B","E"],"answerStr":"BE","rationale":"毒蕈碱中毒表现为M样症状，可用阿托品解救。","expl":{"A":"中毒多在食后30分钟至数小时出现，30-60分钟并非固定界限。","B":"正确，流涎、流泪、恶心、呕吐、腹痛、腹泻等为典型M样表现。","C":"毒蕈碱中毒表现为心动过缓、血压下降，非心动过速、血压升高。","D":"毒蕈碱中毒可致支气管痉挛、呼吸困难，但休克非其典型表现。","E":"正确，阿托品为M受体阻断药，可解救毒蕈碱中毒，需重复肌注。"}}]},{"title":"第七章 抗胆碱酯酶药和胆碱酯酶复活药","questions":[{"id":"ch07_q01","chapter":"第七章 抗胆碱酯酶药和胆碱酯酶复活药","chapterIdx":6,"type":"A","num":1,"stem":"新斯的明对下列效应器兴奋作用最强的是","options":{"A":"心血管","B":"腺体","C":"眼","D":"骨骼肌","E":"支气管平滑肌"},"answer":["D"],"answerStr":"D","rationale":"新斯的明除抑制胆碱酯酶外，还能直接兴奋骨骼肌运动终板上的N2受体，故对骨骼肌兴奋作用最强。","expl":{"A":"心血管：新斯的明对心血管作用较弱，不是其兴奋作用最强的效应器。","B":"腺体：新斯的明对腺体分泌促进作用弱，远不及骨骼肌。","C":"眼：新斯的明不易透过角膜，对眼的作用很弱。","D":"骨骼肌：正确，新斯的明直接兴奋N2受体并抑制胆碱酯酶，对骨骼肌作用最强。","E":"支气管平滑肌：新斯的明对支气管平滑肌作用较弱，并非最强。"}},{"id":"ch07_q02","chapter":"第七章 抗胆碱酯酶药和胆碱酯酶复活药","chapterIdx":6,"type":"A","num":2,"stem":"毒扁豆碱用于去神经的眼，产生的效应是","options":{"A":"瞳孔散大","B":"瞳孔缩小","C":"瞳孔无变化","D":"眼压升高","E":"调节麻痹"},"answer":["C"],"answerStr":"C","rationale":"毒扁豆碱为易逆性抗胆碱酯酶药，靠抑制AChE使乙酰胆碱蓄积起效；去神经眼无乙酰胆碱释放，故瞳孔无变化。","expl":{"A":"瞳孔散大：毒扁豆碱不散瞳，去神经眼无乙酰胆碱来源，不会散大。","B":"瞳孔缩小：去神经眼无乙酰胆碱释放，毒扁豆碱的间接作用无法缩瞳。","C":"瞳孔无变化：正确，毒扁豆碱依赖内源性乙酰胆碱，去神经眼故无效应。","D":"眼压升高：毒扁豆碱不升高眼压，去神经眼亦无此效应。","E":"调节麻痹：调节麻痹为阿托品类作用，毒扁豆碱致调节痉挛而非麻痹。"}},{"id":"ch07_q03","chapter":"第七章 抗胆碱酯酶药和胆碱酯酶复活药","chapterIdx":6,"type":"A","num":3,"stem":"新斯的明在临床上的主要用途是","options":{"A":"阵发性室上性心动过速","B":"阿托品中毒","C":"青光眼","D":"重症肌无力","E":"机械性肠梗阻"},"answer":["D"],"answerStr":"D","rationale":"新斯的明对骨骼肌选择性高，可兴奋N2受体增强肌力，是治疗重症肌无力的常用药物。","expl":{"A":"阵发性室上性心动过速：新斯的明虽可减慢心率，但非其主要用途。","B":"阿托品中毒：阿托品中毒多用毒扁豆碱解救，非新斯的明主要用途。","C":"青光眼：新斯的明不易入眼，青光眼用毒扁豆碱或毛果芸香碱。","D":"重症肌无力：正确，新斯的明增强骨骼肌收缩力，为重症肌无力常用药。","E":"机械性肠梗阻：机械性肠梗阻为禁忌，新斯的明促进蠕动可致肠穿孔。"}},{"id":"ch07_q04","chapter":"第七章 抗胆碱酯酶药和胆碱酯酶复活药","chapterIdx":6,"type":"A","num":4,"stem":"有机磷酸酯类中毒症状中，不属 M 样症状的是","options":{"A":"瞳孔缩小","B":"流涎流泪流汗","C":"腹痛腹泻","D":"肌颤","E":"小便失禁"},"answer":["D"],"answerStr":"D","rationale":"肌颤由运动神经末梢N2受体过度兴奋引起，属N样症状；其余选项均为M样症状。","expl":{"A":"瞳孔缩小：属M样症状，由缩瞳肌M受体兴奋引起。","B":"流涎流泪流汗：属M样症状，由腺体M受体兴奋所致。","C":"腹痛腹泻：属M样症状，由胃肠平滑肌M受体兴奋所致。","D":"肌颤：正确，肌颤为N样（N2受体）症状，不属M样。","E":"小便失禁：属M样症状，由膀胱逼尿肌M受体兴奋所致。"}},{"id":"ch07_q05","chapter":"第七章 抗胆碱酯酶药和胆碱酯酶复活药","chapterIdx":6,"type":"A","num":5,"stem":"碘解磷啶解救有机磷酸酯类（农药）中毒是因为","options":{"A":"能使失去活性的胆碱酯酶复活","B":"能直接对抗乙酰胆碱的作用","C":"有阻断 M 胆碱受体的作用","D":"有阻断 N 胆碱受体的作用","E":"能对抗有机磷酸酯分子中磷的毒性"},"answer":["A"],"answerStr":"A","rationale":"碘解磷定能与磷酰化胆碱酯酶结合，使被抑制的胆碱酯酶复活，恢复水解乙酰胆碱的能力。","expl":{"A":"能使失去活性的胆碱酯酶复活：正确，碘解磷定夺取与酶结合的磷酸基使其复活。","B":"能直接对抗乙酰胆碱的作用：碘解磷定不直接对抗乙酰胆碱，对抗M样作用靠阿托品。","C":"有阻断M胆碱受体的作用：碘解磷定无阻断M受体作用。","D":"有阻断N胆碱受体的作用：碘解磷定不阻断N受体。","E":"能对抗有机磷酸酯分子中磷的毒性：并非对抗磷本身毒性，而是复活被磷酰化的酶。"}},{"id":"ch07_q06","chapter":"第七章 抗胆碱酯酶药和胆碱酯酶复活药","chapterIdx":6,"type":"A","num":6,"stem":"抢救有机磷酸酯类中度以上中毒，最好应当使用","options":{"A":"阿托品","B":"解磷定","C":"解磷定和筒箭毒碱","D":"解磷定和阿托品","E":"阿托品和筒箭毒碱"},"answer":["D"],"answerStr":"D","rationale":"阿托品解除M样症状，解磷定复活胆碱酯酶并缓解N样（肌颤）症状，二者合用互补。","expl":{"A":"阿托品：单用阿托品不能复活胆碱酯酶，不能解除肌颤。","B":"解磷定：单用解磷定不能迅速对抗M样症状。","C":"解磷定和筒箭毒碱：筒箭毒碱阻断N2受体会加重呼吸肌麻痹，不可用。","D":"解磷定和阿托品：正确，二者合用兼顾M样与N样症状，疗效最佳。","E":"阿托品和筒箭毒碱：筒箭毒碱为肌松药，会加重中毒的呼吸抑制，禁用。"}},{"id":"ch07_q07","chapter":"第七章 抗胆碱酯酶药和胆碱酯酶复活药","chapterIdx":6,"type":"A","num":7,"stem":"属于胆碱酯酶复活药的药物是","options":{"A":"新斯的明","B":"氯磷定","C":"阿托品","D":"安贝氯铵","E":"毒扁豆碱"},"answer":["B"],"answerStr":"B","rationale":"氯磷定为常用胆碱酯酶复活药，可复活被有机磷磷酰化的胆碱酯酶。","expl":{"A":"新斯的明：为易逆性抗胆碱酯酶药，非复活药。","B":"氯磷定：正确，氯磷定属胆碱酯酶复活药。","C":"阿托品：为M受体阻断药，不复活胆碱酯酶。","D":"安贝氯铵：为易逆性抗胆碱酯酶药，非复活药。","E":"毒扁豆碱：为易逆性抗胆碱酯酶药，非复活药。"}},{"id":"ch07_q08","chapter":"第七章 抗胆碱酯酶药和胆碱酯酶复活药","chapterIdx":6,"type":"B","num":8,"stem":"易逆性抗胆碱酯酶药","options":{"A":"碘解磷定","B":"有机磷酸酯类","C":"毒扁豆碱","D":"氨甲酰胆碱","E":"乙酰胆碱"},"answer":["C"],"answerStr":"C","rationale":"毒扁豆碱与胆碱酯酶可逆结合、作用可自行恢复，属易逆性抗胆碱酯酶药。","expl":{"A":"碘解磷定：为胆碱酯酶复活药，非抗胆碱酯酶药。","B":"有机磷酸酯类：为难逆性抗胆碱酯酶药。","C":"毒扁豆碱：正确，毒扁豆碱属易逆性抗胆碱酯酶药。","D":"氨甲酰胆碱：为M、N受体激动药（拟胆碱药），非抗胆碱酯酶药。","E":"乙酰胆碱：为神经递质，非抗胆碱酯酶药。"}},{"id":"ch07_q09","chapter":"第七章 抗胆碱酯酶药和胆碱酯酶复活药","chapterIdx":6,"type":"B","num":9,"stem":"难逆性抗胆碱酯酶药","options":{"A":"碘解磷定","B":"有机磷酸酯类","C":"毒扁豆碱","D":"氨甲酰胆碱","E":"乙酰胆碱"},"answer":["B"],"answerStr":"B","rationale":"有机磷酸酯类与胆碱酯酶形成稳定的磷酰化酶、不易解离，属难逆性抑制。","expl":{"A":"碘解磷定：为胆碱酯酶复活药。","B":"有机磷酸酯类：正确，有机磷酸酯类为难逆性抗胆碱酯酶药。","C":"毒扁豆碱：为易逆性抗胆碱酯酶药。","D":"氨甲酰胆碱：为拟胆碱药，非抗胆碱酯酶药。","E":"乙酰胆碱：为神经递质，非抗胆碱酯酶药。"}},{"id":"ch07_q10","chapter":"第七章 抗胆碱酯酶药和胆碱酯酶复活药","chapterIdx":6,"type":"B","num":10,"stem":"胆碱酯酶复活药","options":{"A":"碘解磷定","B":"有机磷酸酯类","C":"毒扁豆碱","D":"氨甲酰胆碱","E":"乙酰胆碱"},"answer":["A"],"answerStr":"A","rationale":"碘解磷定为经典的胆碱酯酶复活药，可使磷酰化胆碱酯酶恢复活性。","expl":{"A":"碘解磷定：正确，碘解磷定属胆碱酯酶复活药。","B":"有机磷酸酯类：为难逆性抗胆碱酯酶药（毒物）。","C":"毒扁豆碱：为易逆性抗胆碱酯酶药。","D":"氨甲酰胆碱：为拟胆碱药。","E":"乙酰胆碱：为神经递质。"}},{"id":"ch07_q11","chapter":"第七章 抗胆碱酯酶药和胆碱酯酶复活药","chapterIdx":6,"type":"B","num":11,"stem":"加兰他敏用于","options":{"A":"有机磷酸酯中毒","B":"青光眼","C":"缓慢型心律失常","D":"脊髓前角灰白质炎","E":"胃肠平滑肌痉挛"},"answer":["D"],"answerStr":"D","rationale":"加兰他敏为易逆性抗胆碱酯酶药，可兴奋骨骼肌，用于脊髓灰质炎后遗症改善肌力。","expl":{"A":"有机磷酸酯中毒：加兰他敏抑酶会加重中毒，禁用。","B":"青光眼：青光眼用毒扁豆碱、毛果芸香碱等，非加兰他敏。","C":"缓慢型心律失常：非加兰他敏适应证。","D":"脊髓前角灰白质炎：正确，加兰他敏兴奋骨骼肌，用于该病后遗症。","E":"胃肠平滑肌痉挛：加兰他敏兴奋平滑肌，会加重痉挛，禁用。"}},{"id":"ch07_q12","chapter":"第七章 抗胆碱酯酶药和胆碱酯酶复活药","chapterIdx":6,"type":"B","num":12,"stem":"派姆用于","options":{"A":"有机磷酸酯中毒","B":"青光眼","C":"缓慢型心律失常","D":"脊髓前角灰白质炎","E":"胃肠平滑肌痉挛"},"answer":["A"],"answerStr":"A","rationale":"派姆（PAM）即碘解磷定，为胆碱酯酶复活药，专用于有机磷酸酯类中毒。","expl":{"A":"有机磷酸酯中毒：正确，PAM复活胆碱酯酶，用于有机磷酸酯中毒。","B":"青光眼：PAM不用于青光眼。","C":"缓慢型心律失常：PAM不用于心律失常。","D":"脊髓前角灰白质炎：该病用加兰他敏，非PAM。","E":"胃肠平滑肌痉挛：PAM无解痉作用。"}},{"id":"ch07_q13","chapter":"第七章 抗胆碱酯酶药和胆碱酯酶复活药","chapterIdx":6,"type":"B","num":13,"stem":"依色林用于","options":{"A":"有机磷酸酯中毒","B":"青光眼","C":"缓慢型心律失常","D":"脊髓前角灰白质炎","E":"胃肠平滑肌痉挛"},"answer":["B"],"answerStr":"B","rationale":"依色林（毒扁豆碱）抑制虹膜胆碱酯酶使乙酰胆碱蓄积，缩瞳降低眼压，用于青光眼。","expl":{"A":"有机磷酸酯中毒：依色林抑酶，加重中毒，禁用。","B":"青光眼：正确，依色林缩瞳降低眼压，用于青光眼。","C":"缓慢型心律失常：非依色林适应证。","D":"脊髓前角灰白质炎：该病用加兰他敏，非依色林。","E":"胃肠平滑肌痉挛：依色林兴奋平滑肌，加重痉挛，禁用。"}},{"id":"ch07_q14","chapter":"第七章 抗胆碱酯酶药和胆碱酯酶复活药","chapterIdx":6,"type":"C","num":14,"stem":"胆碱酯酶复活药","options":{"A":"阿托品","B":"解磷定","C":"两者均是","D":"两者均否"},"answer":["B"],"answerStr":"B","rationale":"解磷定是胆碱酯酶复活药；阿托品为M受体阻断药，不能复活胆碱酯酶。","expl":{"A":"阿托品：为M受体阻断药，不复活胆碱酯酶。","B":"解磷定：正确，解磷定复活磷酰化胆碱酯酶。","C":"两者均是：阿托品无复活胆碱酯酶作用。","D":"两者均否：解磷定确能复活胆碱酯酶。"}},{"id":"ch07_q15","chapter":"第七章 抗胆碱酯酶药和胆碱酯酶复活药","chapterIdx":6,"type":"C","num":15,"stem":"解救有机磷酸酯类中毒","options":{"A":"阿托品","B":"解磷定","C":"两者均是","D":"两者均否"},"answer":["C"],"answerStr":"C","rationale":"阿托品解除M样症状，解磷定复活胆碱酯酶并缓解肌颤，二者均为有机磷中毒解救药。","expl":{"A":"阿托品：可解除M样症状，是解毒药之一。","B":"解磷定：可复活胆碱酯酶，是解毒药之一。","C":"两者均是：正确，阿托品与解磷定均用于有机磷中毒解救。","D":"两者均否：二者均为有机磷中毒解救药。"}},{"id":"ch07_q16","chapter":"第七章 抗胆碱酯酶药和胆碱酯酶复活药","chapterIdx":6,"type":"X","num":16,"stem":"下列抗胆碱酯酶的药物是","options":{"A":"毒扁豆碱","B":"琥珀胆碱","C":"安贝氯铵","D":"丙胺太林","E":"后马托品"},"answer":["A","C"],"answerStr":"AC","rationale":"毒扁豆碱、安贝氯铵均为易逆性抗胆碱酯酶药；其余为胆碱受体阻断药或去极化肌松药。","expl":{"A":"毒扁豆碱：正确，毒扁豆碱为易逆性抗胆碱酯酶药。","B":"琥珀胆碱：为去极化型N2受体阻断药（肌松药），非抗胆碱酯酶药。","C":"安贝氯铵：正确，安贝氯铵为易逆性抗胆碱酯酶药。","D":"丙胺太林：为M受体阻断药，非抗胆碱酯酶药。","E":"后马托品：为M受体阻断药，非抗胆碱酯酶药。"}},{"id":"ch07_q17","chapter":"第七章 抗胆碱酯酶药和胆碱酯酶复活药","chapterIdx":6,"type":"X","num":17,"stem":"用于治疗重症肌无力可选用的药物","options":{"A":"新斯的明","B":"筒箭毒碱","C":"安贝氯铵","D":"依酚氯铵","E":"吡啶斯的明"},"answer":["A","C","E"],"answerStr":"ACE","rationale":"新斯的明、安贝氯铵、吡啶斯的明均为易逆性抗胆碱酯酶药，可增强骨骼肌收缩力，用于重症肌无力。","expl":{"A":"新斯的明：正确，新斯的明对骨骼肌选择性高，治重症肌无力。","B":"筒箭毒碱：阻断N2受体使肌无力，禁用。","C":"安贝氯铵：正确，安贝氯铵抗胆碱酯酶，用于重症肌无力。","D":"依酚氯铵：作用短暂，主要用于诊断，不作常规治疗。","E":"吡啶斯的明：正确，吡啶斯的明（吡斯的明）用于重症肌无力。"}},{"id":"ch07_q18","chapter":"第七章 抗胆碱酯酶药和胆碱酯酶复活药","chapterIdx":6,"type":"X","num":18,"stem":"氯磷定的特点","options":{"A":"水溶性高","B":"溶液较稳定","C":"可肌内注射或静脉给药","D":"经肾排泄较慢","E":"副作用较碘解磷定小"},"answer":["A","B","C","E"],"answerStr":"ABCE","rationale":"氯磷定水溶性高、溶液稳定，可肌注或静注，副作用较碘解磷定小，且经肾排泄较快。","expl":{"A":"水溶性高：正确，氯磷定水溶性高。","B":"溶液较稳定：正确，氯磷定溶液较碘解磷定稳定。","C":"可肌内注射或静脉给药：正确，氯磷定肌注、静注均可。","D":"经肾排泄较慢：错误，氯磷定经肾排泄较快。","E":"副作用较碘解磷定小：正确，氯磷定副作用较碘解磷定小。"}},{"id":"ch07_q19","chapter":"第七章 抗胆碱酯酶药和胆碱酯酶复活药","chapterIdx":6,"type":"X","num":19,"stem":"新斯的明可治疗","options":{"A":"重症肌无力","B":"术后肠胀气","C":"青光眼","D":"有机磷中毒","E":"阵发性室上性心动过速"},"answer":["A","B","E"],"answerStr":"ABE","rationale":"新斯的明兴奋骨骼肌治重症肌无力，兴奋胃肠平滑肌治术后肠胀气，兴奋迷走神经治室上性心动过速。","expl":{"A":"重症肌无力：正确，新斯的明增强骨骼肌力。","B":"术后肠胀气：正确，新斯的明促进肠蠕动，治术后腹气胀。","C":"青光眼：错误，新斯的明不易入眼，不用于青光眼。","D":"有机磷中毒：错误，新斯的明抑酶会加重有机磷中毒。","E":"阵发性室上性心动过速：正确，新斯的明兴奋迷走神经减慢心率。"}},{"id":"ch07_q20","chapter":"第七章 抗胆碱酯酶药和胆碱酯酶复活药","chapterIdx":6,"type":"X","num":20,"stem":"胆碱酯酶能与 ACh 结合的活性中心包括","options":{"A":"乙酰基","B":"带负电荷的阴离子部位","C":"带正电荷的阳离子部位","D":"酯解部位","E":"氨基部位"},"answer":["B","D"],"answerStr":"BD","rationale":"胆碱酯酶的活性中心由带负电荷的阴离子部位与酯解部位组成，分别结合乙酰胆碱的阳离子头和酯键。","expl":{"A":"乙酰基：是乙酰胆碱的结构部分，不是酶活性中心部位。","B":"带负电荷的阴离子部位：正确，阴离子部位吸引乙酰胆碱的季铵阳离子头。","C":"带正电荷的阳离子部位：错误，活性中心为阴离子部位，非阳离子。","D":"酯解部位：正确，酯解部位水解乙酰胆碱的酯键。","E":"氨基部位：错误，活性中心不含“氨基部位”。"}}]},{"title":"第八~九章 胆碱受体阻断药","questions":[{"id":"ch08_q01","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"A","num":1,"stem":"治疗胆绞痛宜选用","options":{"A":"阿托品","B":"阿托品+哌替啶","C":"哌替啶","D":"阿司匹林","E":"溴丙胺太林"},"answer":["B"],"answerStr":"B","rationale":"胆绞痛由胆道平滑肌及括约肌痉挛引起，应合用阿托品类解痉药与哌替啶镇痛。","expl":{"A":"阿托品：单用阿托品镇痛有限，重度胆绞痛需联合镇痛药。","B":"阿托品+哌替啶：正确，阿托品解痉、哌替啶镇痛，合用治胆绞痛。","C":"哌替啶：单用哌替啶可致胆道括约肌痉挛，不利于胆绞痛。","D":"阿司匹林：阿司匹林对内脏绞痛无效。","E":"溴丙胺太林：可解痉但镇痛弱，重度胆绞痛需合用哌替啶。"}},{"id":"ch08_q02","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"A","num":2,"stem":"针对下列药物，麻醉前用药的最佳选择是","options":{"A":"毛果芸香碱","B":"氨甲酰胆碱","C":"东莨菪碱","D":"后马托品","E":"阿托品"},"answer":["C"],"answerStr":"C","rationale":"东莨菪碱抑制腺体分泌且具中枢镇静作用，是麻醉前给药的最佳选择；后马托品仅用于眼科散瞳。","expl":{"A":"毛果芸香碱：拟胆碱药，缩瞳促分泌，不能用于麻醉前给药。","B":"氨甲酰胆碱：拟胆碱药，兴奋平滑肌、促分泌，禁用于麻醉前给药。","C":"东莨菪碱：正确，东莨菪碱抑腺体分泌并镇静，宜作麻醉前给药。","D":"后马托品：仅用于眼科散瞳检查，不作麻醉前给药。","E":"阿托品：亦可用于麻醉前给药，但无镇静作用，非最佳。"}},{"id":"ch08_q03","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"A","num":3,"stem":"阿托品抢救有机磷酯类中毒时能","options":{"A":"复活AchE","B":"促进Ach的排泄","C":"阻断M受体，解除M样作用","D":"阻断M受体和N2受体","E":"与有机磷结合成无毒产物而解毒"},"answer":["C"],"answerStr":"C","rationale":"阿托品通过阻断M受体解除有机磷中毒的M样症状（流涎、缩瞳、支气管痉挛等）；复活胆碱酯酶的是解磷定（氯解磷定），并非阿托品。","expl":{"A":"错误，复活胆碱酯酶的是解磷定（氯解磷定），阿托品无此作用。","B":"错误，阿托品不促进乙酰胆碱的排泄。","C":"正确，阿托品阻断M受体，解除有机磷中毒的M样症状。","D":"错误，治疗量阿托品主要阻断M受体，对N2受体无明显阻断作用。","E":"错误，与有机磷结合成无毒产物是肟类复活药（解磷定）的作用，阿托品不与有机磷结合。"}},{"id":"ch08_q04","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"A","num":4,"stem":"感染性休克用阿托品治疗时，哪种情况不能用","options":{"A":"血容量已补足","B":"酸中毒已纠正","C":"心率60次/分钟以下","D":"体温39℃以上","E":"房室传导阻滞"},"answer":["D"],"answerStr":"D","rationale":"感染性休克用阿托品时，体温过高（39℃以上）时禁用；补足血容量是应用前提而非禁忌。","expl":{"A":"血容量已补足：错误，补足血容量是使用阿托品的前提，并非禁忌。","B":"酸中毒已纠正：纠正酸中毒是治疗所需，非禁忌。","C":"心率60次/分钟以下：心率过慢时阿托品可增快心率，非禁忌。","D":"体温39℃以上：正确，体温过高时阿托品抑制散热，属禁忌。","E":"房室传导阻滞：阿托品可改善房室传导，非禁忌。"}},{"id":"ch08_q05","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"A","num":5,"stem":"治疗量阿托品一般不出现","options":{"A":"口干、乏汗","B":"皮肤潮红","C":"心率加快","D":"畏光，视力模糊","E":"烦躁不安，呼吸加快"},"answer":["E"],"answerStr":"E","rationale":"烦躁不安、呼吸加快属阿托品中毒表现，治疗量一般不出现；口干、心率加快治疗量即可出现。","expl":{"A":"口干、乏汗：治疗量阿托品即可引起口干、乏汗。","B":"皮肤潮红：较大剂量才引起皮肤潮红，治疗量一般不明显。","C":"心率加快：治疗量阿托品即可使心率轻度加快。","D":"畏光，视力模糊：治疗量散瞳可致畏光、视近物模糊。","E":"烦躁不安，呼吸加快：正确，此为中毒剂量表现，治疗量一般不出现。"}},{"id":"ch08_q06","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"A","num":6,"stem":"阿托品禁用于","options":{"A":"虹膜睫状体炎","B":"验光配镜","C":"胆绞痛","D":"青光眼","E":"感染性休克"},"answer":["D"],"answerStr":"D","rationale":"阿托品散瞳可升高眼压，故青光眼禁用；胆绞痛是阿托品的适应证而非禁忌。","expl":{"A":"虹膜睫状体炎：阿托品散瞳防止粘连，为适应证。","B":"验光配镜：儿童验光可用阿托品散瞳。","C":"胆绞痛：胆绞痛可用阿托品解痉，非禁忌。","D":"青光眼：正确，阿托品散瞳升高眼压，青光眼禁用。","E":"感染性休克：阿托品可用于感染性休克，非禁忌。"}},{"id":"ch08_q07","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"A","num":7,"stem":"常用于抗感染性休克的药是","options":{"A":"山莨菪碱","B":"溴丙胺太林","C":"贝那替秦","D":"哌仑西平","E":"东莨菪碱"},"answer":["A"],"answerStr":"A","rationale":"山莨菪碱改善微循环作用强、副作用小，常用于抗感染性休克；哌仑西平为治溃疡药。","expl":{"A":"山莨菪碱：正确，山莨菪碱改善微循环，常用于感染性休克。","B":"溴丙胺太林：用于胃肠痉挛、溃疡，不作抗休克。","C":"贝那替秦：用于伴焦虑的溃疡病，不作抗休克。","D":"哌仑西平：为M1受体阻断药，用于消化性溃疡，非抗休克药。","E":"东莨菪碱：亦可用于抗休克，但山莨菪碱更为常用。"}},{"id":"ch08_q08","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"A","num":8,"stem":"具有安定作用，适用于兼有焦虑症溃疡病人的是","options":{"A":"山莨菪碱","B":"溴丙胺太林","C":"贝那替秦","D":"哌仑西平","E":"东莨菪碱"},"answer":["C"],"answerStr":"C","rationale":"贝那替秦（胃复康）为叔胺类，兼具解痉抑酸与中枢安定作用，适用于伴焦虑症的溃疡病。","expl":{"A":"山莨菪碱：不易透过血脑屏障，无中枢安定作用。","B":"溴丙胺太林：为季铵类，口服难吸收，无中枢安定作用。","C":"贝那替秦：正确，贝那替秦有中枢安定作用，宜用于焦虑症溃疡。","D":"哌仑西平：为M1阻断药抑酸，无中枢安定作用。","E":"东莨菪碱：有中枢作用但非用于溃疡病。"}},{"id":"ch08_q09","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"A","num":9,"stem":"阿托品对眼的作用是","options":{"A":"扩瞳，视近物清楚","B":"扩瞳，调节痉挛","C":"扩瞳，降低眼内压","D":"扩瞳，调节麻痹","E":"缩瞳，调节麻痹"},"answer":["D"],"answerStr":"D","rationale":"阿托品阻断虹膜括约肌和睫状肌M受体，使瞳孔散大、调节麻痹。","expl":{"A":"扩瞳，视近物清楚：调节麻痹时视近物模糊，非清楚。","B":"扩瞳，调节痉挛：阿托品致调节麻痹，非痉挛。","C":"扩瞳，降低眼内压：阿托品散瞳使房水回流受阻，眼压升高。","D":"扩瞳，调节麻痹：正确，阿托品散瞳并使睫状肌麻痹。","E":"缩瞳，调节麻痹：阿托品散瞳，非缩瞳。"}},{"id":"ch08_q10","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"A","num":10,"stem":"阿托品最适于治疗的休克是","options":{"A":"失血性休克","B":"过敏性休克","C":"神经原性休克","D":"感染性休克","E":"心源性休克"},"answer":["D"],"answerStr":"D","rationale":"阿托品大剂量能解除小血管痉挛、改善微循环，最适于感染性休克。","expl":{"A":"失血性休克：以补充血容量为主，不宜用阿托品。","B":"过敏性休克：首选肾上腺素，非阿托品。","C":"神经原性休克：非阿托品最适适应证。","D":"感染性休克：正确，阿托品解除微血管痉挛，最适于感染性休克。","E":"心源性休克：非阿托品适应证。"}},{"id":"ch08_q11","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"A","num":11,"stem":"治疗量的阿托品可产生","options":{"A":"血压升高","B":"眼内压降低","C":"胃肠道平滑肌松驰","D":"镇静","E":"腺体分泌增加"},"answer":["C"],"answerStr":"C","rationale":"治疗量阿托品阻断胃肠M受体，松弛胃肠平滑肌，并抑制腺体分泌。","expl":{"A":"血压升高：治疗量阿托品对血压无明显影响。","B":"眼内压降低：阿托品散瞳使眼内压升高，非降低。","C":"胃肠道平滑肌松驰：正确，治疗量阿托品松弛胃肠平滑肌。","D":"镇静：治疗量阿托品无镇静，大剂量才兴奋中枢。","E":"腺体分泌增加：阿托品抑制腺体分泌，非增加。"}},{"id":"ch08_q12","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"A","num":12,"stem":"阿托品对有机磷酸酯类中毒症状无效的是","options":{"A":"流涎","B":"瞳孔缩小","C":"大小便失禁","D":"肌震颤","E":"腹痛"},"answer":["D"],"answerStr":"D","rationale":"肌震颤由运动终板N2受体过度兴奋所致，阿托品不阻断N2受体，故无效。","expl":{"A":"流涎：为M样症状，阿托品可解除。","B":"瞳孔缩小：为M样症状，阿托品可解除。","C":"大小便失禁：为M样症状，阿托品可解除。","D":"肌震颤：正确，肌震颤为N样症状，阿托品无效。","E":"腹痛：为M样症状，阿托品可解除。"}},{"id":"ch08_q13","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"A","num":13,"stem":"对于山莨菪碱的描述，错误的是","options":{"A":"可用于震颤麻痹症","B":"可用于感染性休克","C":"可用于内脏平滑肌绞痛","D":"副作用与阿托品相似","E":"其人工合成品为654-2"},"answer":["A"],"answerStr":"A","rationale":"山莨菪碱脂溶性低、难透过血脑屏障，无中枢抗震颤麻痹作用，故A项描述错误。","expl":{"A":"可用于震颤麻痹症：错误（答案），山莨菪碱难入脑，不能治震颤麻痹。","B":"可用于感染性休克：山莨菪碱改善微循环，可用于感染性休克，表述正确。","C":"可用于内脏平滑肌绞痛：山莨菪碱可解痉，用于内脏绞痛，表述正确。","D":"副作用与阿托品相似：山莨菪碱副作用与阿托品相似但较轻，表述正确。","E":"其人工合成品为654-2：山莨菪碱人工合成品为654-2，表述正确。"}},{"id":"ch08_q14","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"A","num":14,"stem":"与阿托品相比，后马托品对眼的作用特点是","options":{"A":"作用强","B":"扩瞳持久","C":"调节麻痹充分","D":"调节麻痹作用高峰出现较慢","E":"调节麻痹作用维持时间短"},"answer":["E"],"answerStr":"E","rationale":"后马托品扩瞳与调节麻痹作用较阿托品出现快、维持时间短，适于一般检查。","expl":{"A":"作用强：后马托品作用较阿托品弱。","B":"扩瞳持久：后马托品扩瞳维持时间短。","C":"调节麻痹充分：后马托品调节麻痹不如阿托品充分。","D":"调节麻痹作用高峰出现较慢：后马托品作用出现较快。","E":"调节麻痹作用维持时间短：正确，后马托品作用短暂，为检查用。"}},{"id":"ch08_q15","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"A","num":15,"stem":"对于胃康复，描述正确的是","options":{"A":"属季铵类","B":"具解痉及抑制胃酸分泌作用","C":"口服难吸收","D":"无中枢作用","E":"不适宜于兼有焦虑症的溃疡病病人"},"answer":["B"],"answerStr":"B","rationale":"胃复康（贝那替秦）为叔胺类，有解痉和抑制胃酸分泌作用，且口服易吸收、有中枢作用。","expl":{"A":"属季铵类：错误，胃复康为叔胺类。","B":"具解痉及抑制胃酸分泌作用：正确，胃复康兼有解痉与抑酸作用。","C":"口服难吸收：错误，胃复康为叔胺类，口服易吸收。","D":"无中枢作用：错误，胃复康有中枢安定作用。","E":"不适宜于兼有焦虑症的溃疡病病人：错误，胃复康正适于焦虑症溃疡病人。"}},{"id":"ch08_q16","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"A","num":16,"stem":"有关东莨菪碱的叙述，错误的是","options":{"A":"可抑制中枢","B":"具抗震颤麻痹作用","C":"对心血管作用较弱","D":"增加唾液分泌","E":"抗晕动病"},"answer":["D"],"answerStr":"D","rationale":"东莨菪碱抑制腺体分泌、减少唾液，故D项“增加唾液分泌”表述错误。","expl":{"A":"可抑制中枢：东莨菪碱有中枢抑制作用，表述正确。","B":"具抗震颤麻痹作用：东莨菪碱有抗震颤麻痹作用，表述正确。","C":"对心血管作用较弱：东莨菪碱对心血管作用较弱，表述正确。","D":"增加唾液分泌：错误（答案），东莨菪碱抑制腺体分泌，减少唾液。","E":"抗晕动病：东莨菪碱可防晕止吐，表述正确。"}},{"id":"ch08_q17","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"A","num":17,"stem":"对下列哪个部位平滑肌痉挛，阿托品的作用最好？","options":{"A":"支气管","B":"胃肠道","C":"胆道","D":"输尿管","E":"子宫"},"answer":["B"],"answerStr":"B","rationale":"阿托品对胃肠道平滑肌解痉作用最强，对胆道、输尿管、支气管等作用较弱。","expl":{"A":"支气管：阿托品对支气管解痉作用弱。","B":"胃肠道：正确，阿托品对胃肠平滑肌解痉作用最显著。","C":"胆道：对胆道作用较弱，胆绞痛常需合用哌替啶。","D":"输尿管：对输尿管作用弱。","E":"子宫：对子宫平滑肌作用很弱。"}},{"id":"ch08_q18","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"A","num":18,"stem":"各器官对阿托品阻断作用的敏感性不同，最先敏感者是","options":{"A":"心脏","B":"中枢","C":"腺体","D":"眼睛","E":"胃肠平滑肌"},"answer":["C"],"answerStr":"C","rationale":"腺体对阿托品最敏感，小剂量即可抑制分泌；眼、胃肠、心脏等敏感性依次较低。","expl":{"A":"心脏：心脏对阿托品敏感性低于腺体。","B":"中枢：治疗量对中枢影响小，敏感性低。","C":"腺体：正确，腺体对阿托品最敏感。","D":"眼睛：眼对阿托品敏感性低于腺体。","E":"胃肠平滑肌：胃肠平滑肌敏感性低于腺体。"}},{"id":"ch08_q19","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"B","num":19,"stem":"治疗感染性休克","options":{"A":"东莨菪碱","B":"山莨菪碱","C":"托吡卡胺","D":"丙胺太林","E":"依色林"},"answer":["B"],"answerStr":"B","rationale":"山莨菪碱改善微循环作用强、副作用小，为抗感染性休克常用药。","expl":{"A":"东莨菪碱：亦用于抗休克，但山莨菪碱更常用。","B":"山莨菪碱：正确，山莨菪碱改善微循环，治感染性休克。","C":"托吡卡胺：为散瞳药，用于眼底检查。","D":"丙胺太林：用于胃肠痉挛、溃疡。","E":"依色林：为拟胆碱药，不用于抗休克。"}},{"id":"ch08_q20","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"B","num":20,"stem":"用于麻醉前给药","options":{"A":"东莨菪碱","B":"山莨菪碱","C":"托吡卡胺","D":"丙胺太林","E":"依色林"},"answer":["A"],"answerStr":"A","rationale":"东莨菪碱抑制腺体分泌并有中枢镇静，常用于麻醉前给药。","expl":{"A":"东莨菪碱：正确，东莨菪碱抑分泌兼镇静，用于麻醉前给药。","B":"山莨菪碱：主要用于抗感染性休克、内脏绞痛。","C":"托吡卡胺：用于眼底检查散瞳。","D":"丙胺太林：用于溃疡、胃肠痉挛。","E":"依色林：拟胆碱药，不用于麻醉前给药。"}},{"id":"ch08_q21","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"B","num":21,"stem":"治疗青光眼","options":{"A":"东莨菪碱","B":"山莨菪碱","C":"托吡卡胺","D":"丙胺太林","E":"依色林"},"answer":["E"],"answerStr":"E","rationale":"依色林（毒扁豆碱）抑酶缩瞳、降低眼压，用于青光眼。","expl":{"A":"东莨菪碱：散瞳升高眼压，禁用于青光眼。","B":"山莨菪碱：散瞳升眼压，禁用于青光眼。","C":"托吡卡胺：散瞳药，禁用于青光眼。","D":"丙胺太林：非青光眼用药。","E":"依色林：正确，依色林缩瞳降眼压，用于青光眼。"}},{"id":"ch08_q22","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"B","num":22,"stem":"用于伴胃酸过多的溃疡病","options":{"A":"东莨菪碱","B":"山莨菪碱","C":"托吡卡胺","D":"丙胺太林","E":"依色林"},"answer":["D"],"answerStr":"D","rationale":"丙胺太林（普鲁本辛）为季铵类M阻断药，解痉并抑制胃酸分泌，用于溃疡病。","expl":{"A":"东莨菪碱：中枢作用强，不作溃疡病常规用药。","B":"山莨菪碱：主要用于抗休克、内脏绞痛。","C":"托吡卡胺：散瞳药，用于眼底检查。","D":"丙胺太林：正确，丙胺太林解痉抑酸，用于溃疡病。","E":"依色林：拟胆碱药，促进分泌，不用于溃疡病。"}},{"id":"ch08_q23","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"B","num":23,"stem":"用于眼底检查","options":{"A":"东莨菪碱","B":"山莨菪碱","C":"托吡卡胺","D":"丙胺太林","E":"依色林"},"answer":["C"],"answerStr":"C","rationale":"托吡卡胺散瞳作用快而短，是眼底检查常用散瞳药。","expl":{"A":"东莨菪碱：作用时间长，不作眼底检查首选。","B":"山莨菪碱：散瞳弱，不作眼底检查。","C":"托吡卡胺：正确，托吡卡胺散瞳快而短暂，用于眼底检查。","D":"丙胺太林：无散瞳用途。","E":"依色林：缩瞳药，不用于眼底检查散瞳。"}},{"id":"ch08_q24","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"C","num":24,"stem":"扩瞳","options":{"A":"毛果芸香碱","B":"阿托品","C":"两者均可","D":"两者均不可"},"answer":["B"],"answerStr":"B","rationale":"阿托品阻断虹膜括约肌M受体而扩瞳；毛果芸香碱激动M受体则缩瞳。","expl":{"A":"毛果芸香碱：缩瞳，非扩瞳。","B":"阿托品：正确，阿托品散瞳。","C":"两者均可：毛果芸香碱不扩瞳。","D":"两者均不可：阿托品可扩瞳。"}},{"id":"ch08_q25","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"C","num":25,"stem":"缩瞳","options":{"A":"毛果芸香碱","B":"阿托品","C":"两者均可","D":"两者均不可"},"answer":["A"],"answerStr":"A","rationale":"毛果芸香碱激动虹膜括约肌M受体而缩瞳；阿托品阻断M受体则散瞳。","expl":{"A":"毛果芸香碱：正确，毛果芸香碱缩瞳。","B":"阿托品：散瞳，不缩瞳。","C":"两者均可：阿托品不缩瞳。","D":"两者均不可：毛果芸香碱可缩瞳。"}},{"id":"ch08_q26","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"C","num":26,"stem":"影响视物","options":{"A":"毛果芸香碱","B":"阿托品","C":"两者均可","D":"两者均不可"},"answer":["C"],"answerStr":"C","rationale":"毛果芸香碱致调节痉挛、视远物模糊，阿托品致调节麻痹、视近物模糊，二者均影响视物。","expl":{"A":"毛果芸香碱：可致视远物模糊。","B":"阿托品：可致视近物模糊。","C":"两者均可：正确，二者均影响视物。","D":"两者均不可：二者均影响视物。"}},{"id":"ch08_q27","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"C","num":27,"stem":"调节麻痹","options":{"A":"毛果芸香碱","B":"阿托品","C":"两者均可","D":"两者均不可"},"answer":["B"],"answerStr":"B","rationale":"阿托品阻断睫状肌M受体致调节麻痹；毛果芸香碱则引起调节痉挛。","expl":{"A":"毛果芸香碱：致调节痉挛，非麻痹。","B":"阿托品：正确，阿托品致调节麻痹。","C":"两者均可：毛果芸香碱不致调节麻痹。","D":"两者均不可：阿托品可致调节麻痹。"}},{"id":"ch08_q28","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"C","num":28,"stem":"调节痉挛","options":{"A":"毛果芸香碱","B":"阿托品","C":"两者均可","D":"两者均不可"},"answer":["A"],"answerStr":"A","rationale":"毛果芸香碱激动睫状肌M受体致调节痉挛；阿托品则引起调节麻痹。","expl":{"A":"毛果芸香碱：正确，毛果芸香碱致调节痉挛。","B":"阿托品：致调节麻痹，非痉挛。","C":"两者均可：阿托品不致调节痉挛。","D":"两者均不可：毛果芸香碱可致调节痉挛。"}},{"id":"ch08_q29","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"X","num":29,"stem":"与阿托品相比，东莨菪碱有如下特点","options":{"A":"抑制中枢","B":"扩瞳、调节麻痹作用较弱","C":"抑制腺体分泌作用较强","D":"对心、血管系统作用较强","E":"抑制前庭神经内耳功能"},"answer":["A","C","E"],"answerStr":"ACE","rationale":"东莨菪碱抑制中枢、抑制腺体分泌强、抗晕动，但对心血管作用弱、扩瞳调节麻痹作用较强。","expl":{"A":"抑制中枢：正确，东莨菪碱有中枢抑制作用。","B":"扩瞳、调节麻痹作用较弱：错误，东莨菪碱扩瞳、调节麻痹作用较强。","C":"抑制腺体分泌作用较强：正确，东莨菪碱抑制腺体分泌比阿托品强。","D":"对心、血管系统作用较强：错误，东莨菪碱对心血管作用较弱。","E":"抑制前庭神经内耳功能：正确，东莨菪碱抑制前庭功能而抗晕动。"}},{"id":"ch08_q30","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"X","num":30,"stem":"阿托品滴眼后可产生下列效应","options":{"A":"扩瞳","B":"调节痉挛","C":"眼内压升高","D":"调节麻痹","E":"视近物清楚"},"answer":["A","C","D"],"answerStr":"ACD","rationale":"阿托品滴眼后扩瞳、调节麻痹，并使房水回流受阻、眼内压升高，视近物模糊。","expl":{"A":"扩瞳：正确，阿托品阻断虹膜括约肌M受体而扩瞳。","B":"调节痉挛：错误，阿托品致调节麻痹，非痉挛。","C":"眼内压升高：正确，扩瞳使房水回流受阻，眼压升高。","D":"调节麻痹：正确，阿托品麻痹睫状肌。","E":"视近物清楚：错误，调节麻痹时视近物模糊。"}},{"id":"ch08_q31","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"X","num":31,"stem":"患有青光眼的病人禁用的药物有","options":{"A":"东莨菪碱","B":"阿托品","C":"山莨菪碱","D":"后马托品","E":"托吡卡胺"},"answer":["A","B","C","D","E"],"answerStr":"ABCDE","rationale":"所列均为M受体阻断药，可散瞳升高眼压，青光眼均禁用。","expl":{"A":"东莨菪碱：正确，东莨菪碱散瞳升眼压，青光眼禁用。","B":"阿托品：正确，阿托品散瞳升眼压，青光眼禁用。","C":"山莨菪碱：正确，山莨菪碱散瞳升眼压，青光眼禁用。","D":"后马托品：正确，后马托品散瞳升眼压，青光眼禁用。","E":"托吡卡胺：正确，托吡卡胺散瞳升眼压，青光眼禁用。"}},{"id":"ch08_q32","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"X","num":32,"stem":"阿托品能解除有机磷酸酯类中毒时的哪些症状？","options":{"A":"M 样作用","B":"神经节兴奋症状","C":"肌颤","D":"部分中枢症状","E":"AChE 抑制症状"},"answer":["A","B","D"],"answerStr":"ABD","rationale":"阿托品阻断M受体解除M样症状和部分中枢症状，大剂量可阻断N1受体缓解神经节兴奋，但不能解除肌颤。","expl":{"A":"M样作用：正确，阿托品阻断M受体，解除M样症状。","B":"神经节兴奋症状：正确，大剂量阿托品阻断N1受体，缓解神经节兴奋。","C":"肌颤：错误，肌颤由N2受体介导，阿托品不能解除。","D":"部分中枢症状：正确，阿托品可缓解部分中枢症状。","E":"AChE抑制症状：错误，AChE抑制是中毒原因，阿托品不能恢复酶活性。"}},{"id":"ch08_q33","chapter":"第八~九章 胆碱受体阻断药","chapterIdx":7,"type":"X","num":33,"stem":"与阿托品相比，山莨菪碱的特点有","options":{"A":"易穿透血脑屏障","B":"抑制分泌和扩瞳作用弱","C":"解痉作用相似或略弱","D":"改善微循环作用较强","E":"毒性较大"},"answer":["B","C","D"],"answerStr":"BCD","rationale":"山莨菪碱不易透过血脑屏障，抑制分泌和扩瞳弱，解痉相似或略弱，改善微循环强，毒性小。","expl":{"A":"易穿透血脑屏障：错误，山莨菪碱难透过血脑屏障，中枢作用弱。","B":"抑制分泌和扩瞳作用弱：正确，山莨菪碱抑制分泌、扩瞳较阿托品弱。","C":"解痉作用相似或略弱：正确，山莨菪碱解痉作用与阿托品相似或略弱。","D":"改善微循环作用较强：正确，山莨菪碱改善微循环作用较强。","E":"毒性较大：错误，山莨菪碱毒性较阿托品小。"}}]},{"title":"第十章 肾上腺素受体激动药","questions":[{"id":"ch09_q01","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":1,"stem":"去甲肾上腺素治疗上消化道出血时的给药方法是","options":{"A":"静脉滴注","B":"皮下注射","C":"肌肉注射","D":"口服稀释液","E":"以上都不是"},"answer":["D"],"answerStr":"D","rationale":"去甲肾上腺素口服后收缩胃肠黏膜血管，达局部止血目的。","expl":{"A":"错误，静脉滴注用于抗休克升高血压，非上消化道出血的局部给药法。","B":"错误，皮下注射会引起注射部位血管强烈收缩而缺血坏死。","C":"错误，肌内注射同样引起局部缺血坏死，不宜使用。","D":"正确，口服稀释液使局部黏膜血管收缩而止血。","E":"错误，D为正确的给药方法。"}},{"id":"ch09_q02","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":2,"stem":"具有明显舒张肾血管，增加肾血流的药物是","options":{"A":"肾上腺素","B":"异丙肾上腺素","C":"麻黄碱","D":"多巴胺","E":"去甲肾上腺素"},"answer":["D"],"answerStr":"D","rationale":"多巴胺激动肾血管D1受体，扩张肾血管、增加肾血流量。","expl":{"A":"错误，肾上腺素以激动α受体收缩肾血管为主。","B":"错误，异丙肾上腺素主要扩张骨骼肌血管，对肾血管作用弱。","C":"错误，麻黄碱主要通过促递质释放升压，不直接舒张肾血管。","D":"正确，多巴胺激动肾D1受体，舒张肾血管、增加肾血流量。","E":"错误，去甲肾上腺素强烈收缩肾血管，减少肾血流。"}},{"id":"ch09_q03","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":3,"stem":"防治硬膜外麻醉引起的低血压宜先用","options":{"A":"肾上腺素","B":"去甲肾上腺素","C":"麻黄碱","D":"多巴胺","E":"异丙肾上腺素"},"answer":["C"],"answerStr":"C","rationale":"麻黄碱升压作用温和持久、可肌注给药，是防治硬膜外麻醉所致低血压的常用药。","expl":{"A":"错误，肾上腺素作用强而短暂，易致心律失常，不宜用于此。","B":"错误，去甲肾上腺素强烈收缩血管且需静滴，不适用。","C":"正确，麻黄碱升压温和持久，可皮下或肌注，适用于麻醉后低血压。","D":"错误，多巴胺主要增加肾血流，升压作用有限。","E":"错误，异丙肾上腺素扩张血管、增快心率，不用于升压。"}},{"id":"ch09_q04","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":4,"stem":"非儿茶酚胺类的药物是","options":{"A":"多巴胺","B":"异丙肾上腺素","C":"肾上腺素","D":"麻黄碱","E":"去甲肾上腺素"},"answer":["D"],"answerStr":"D","rationale":"麻黄碱化学结构无儿茶酚（邻苯二酚）核，属于非儿茶酚胺类药物。","expl":{"A":"错误，多巴胺属儿茶酚胺类。","B":"错误，异丙肾上腺素属儿茶酚胺类。","C":"错误，肾上腺素属儿茶酚胺类。","D":"正确，麻黄碱不含儿茶酚核，为非儿茶酚胺类，故可口服。","E":"错误，去甲肾上腺素属儿茶酚胺类。"}},{"id":"ch09_q05","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":5,"stem":"去甲肾上腺素与肾上腺素的下列哪项作用不同","options":{"A":"正性肌力作用","B":"兴奋 β 受体","C":"兴奋 α 受体","D":"对心率的影响","E":"被MAO 和COMT 灭活"},"answer":["D"],"answerStr":"D","rationale":"去甲肾上腺素整体因升压反射使心率减慢，肾上腺素兴奋心脏β1受体使心率加快，二者对心率影响不同。","expl":{"A":"错误，二者均有正性肌力作用。","B":"错误，二者均可兴奋β受体（主要为β1）。","C":"错误，二者均可兴奋α受体。","D":"正确，去甲肾上腺素反射性减慢心率，肾上腺素使心率加快。","E":"错误，二者均可被MAO和COMT灭活。"}},{"id":"ch09_q06","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":6,"stem":"去甲肾上腺素扩张冠状血管主要是由于","options":{"A":"激动 β2 受体","B":"激动 M 胆碱受体","C":"使心肌代谢产物增加","D":"激动 α2 受体","E":"以上都不是"},"answer":["C"],"answerStr":"C","rationale":"去甲肾上腺素收缩血管升高血压，使心肌代谢产物（如腺苷）增多，继发扩张冠脉。","expl":{"A":"错误，去甲肾上腺素对β2受体作用很弱。","B":"错误，去甲肾上腺素不激动M胆碱受体。","C":"正确，心肌代谢产物增加引起冠脉继发性扩张。","D":"错误，激动α2受体主要抑制递质释放，非直接扩冠脉。","E":"错误，C为正确答案。"}},{"id":"ch09_q07","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":7,"stem":"治疗房室传导阻滞的药物是","options":{"A":"肾上腺素","B":"去甲肾上腺素","C":"异丙肾上腺素","D":"阿拉明","E":"普萘洛尔"},"answer":["C"],"answerStr":"C","rationale":"异丙肾上腺素激动心脏β1受体，加快房室传导，用于治疗房室传导阻滞。","expl":{"A":"错误，肾上腺素虽兴奋心脏但易致心律失常，非房室阻滞首选。","B":"错误，去甲肾上腺素反射性减慢心率，不宜用于房室传导阻滞。","C":"正确，异丙肾上腺素兴奋β1受体，加速房室传导，用于房室传导阻滞。","D":"错误，阿拉明（间羟胺）为升压药，不改善房室传导。","E":"错误，普萘洛尔阻断β受体，反会加重房室传导阻滞。"}},{"id":"ch09_q08","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":8,"stem":"肾上腺素对血管作用的叙述，错误的是","options":{"A":"皮肤、粘膜血管收缩强","B":"微弱收缩脑和肺血管","C":"肾血管扩张","D":"骨骼肌血管扩张","E":"舒张冠状血管"},"answer":["C"],"answerStr":"C","rationale":"肾上腺素激动α受体使肾血管收缩，故“肾血管扩张”的说法错误。","expl":{"A":"错误，皮肤、黏膜血管在α受体作用下强烈收缩，该项叙述正确。","B":"错误，肾上腺素对脑、肺血管仅微弱收缩，该项叙述正确。","C":"正确，肾上腺素使肾血管收缩而非扩张，此项表述错误。","D":"错误，骨骼肌血管以β2受体为主，肾上腺素使之扩张，该项叙述正确。","E":"错误，肾上腺素经心肌代谢产物增多可舒张冠脉，该项叙述正确。"}},{"id":"ch09_q09","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":9,"stem":"异丙肾上腺素不具有肾上腺素的哪项作用","options":{"A":"松弛支气管平滑肌","B":"兴奋 β2 受体","C":"抑制组胺等过敏介质释放","D":"促进 CAMP 的产生","E":"收缩支气管粘膜血管"},"answer":["E"],"answerStr":"E","rationale":"异丙肾上腺素无α受体激动作用，不能收缩支气管黏膜血管，故此项为其所不具有。","expl":{"A":"错误，异丙肾上腺素激动β2受体可松弛支气管平滑肌，与肾上腺素相同。","B":"错误，二者均可兴奋β2受体。","C":"错误，二者均能抑制组胺等过敏介质释放。","D":"错误，二者激动β受体均促进cAMP产生。","E":"正确，异丙肾上腺素不激动α受体，不能收缩支气管黏膜血管。"}},{"id":"ch09_q10","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":10,"stem":"大剂量肾上腺素静注，血压的变化是","options":{"A":"收缩压和舒张压均缓慢、持久升高","B":"收缩压上升，舒张压不变或稍下降","C":"收缩压上升，舒张压上升，脉压变小","D":"收缩压上升，舒张压上升不明显，脉压增大","E":"收缩压上升，舒张压下降，脉压增大"},"answer":["C"],"answerStr":"C","rationale":"大剂量时α受体兴奋占优势，外周阻力显著升高，收缩压和舒张压均上升，脉压变小。","expl":{"A":"错误，肾上腺素作用快而短暂，并非缓慢持久。","B":"错误，大剂量时α受体占优势，舒张压也上升。","C":"正确，收缩压与舒张压均升高，且舒张压升高明显使脉压变小。","D":"错误，大剂量时舒张压升高明显，脉压变小而非增大。","E":"错误，大剂量时舒张压上升而非下降。"}},{"id":"ch09_q11","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":11,"stem":"小剂量去甲肾上腺素静脉滴注，血压变化是","options":{"A":"收缩压和舒张压均缓慢、持久升高","B":"收缩压上升，舒张压不变或稍下降","C":"收缩压上升，舒张压上升，脉压变小","D":"收缩压上升，舒张压上升不明显，脉压增大","E":"收缩压上升，舒张压下降，脉压增大"},"answer":["D"],"answerStr":"D","rationale":"小剂量去甲肾上腺素主要兴奋心脏β1受体，收缩压升高为主，舒张压升高不明显，脉压增大。","expl":{"A":"错误，小剂量去甲肾上腺素并非以升高舒张压为主。","B":"错误，去甲肾上腺素反射性减慢心率，并非心率增快。","C":"错误，小剂量时舒张压升高不明显。","D":"正确，收缩压升高、舒张压升高不明显，脉压增大。","E":"错误，去甲肾上腺素使收缩压上升而非下降。"}},{"id":"ch09_q12","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":12,"stem":"去甲肾上腺素静滴时间过长引起的最严重的不良反应是","options":{"A":"血压过高","B":"静滴部位出血坏死","C":"心率紊乱","D":"急性肾功能衰竭","E":"突然停药引起血压下降"},"answer":["D"],"answerStr":"D","rationale":"去甲肾上腺素强烈收缩肾血管，久滴可致肾缺血甚至急性肾衰竭，为最严重的不良反应。","expl":{"A":"错误，血压过高可通过调整剂量控制，不如肾衰竭严重。","B":"错误，静滴部位坏死由药液外漏引起，非久滴最严重者。","C":"错误，去甲肾上腺素较少引起严重心律失常。","D":"正确，强收缩肾血管致肾缺血、急性肾功能衰竭，最为严重。","E":"错误，突然停药血压下降不属久滴最严重的不良反应。"}},{"id":"ch09_q13","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":13,"stem":"反复使用麻黄碱产生快速耐受性的原因是","options":{"A":"诱导肝药酶，使其代谢加快","B":"受体敏感性下降","C":"去甲肾上腺素能神经末梢递质排空","D":"其代谢产物拮抗了麻黄碱的作用","E":"麻黄碱被 MAO 和 COMT 破坏"},"answer":["C"],"answerStr":"C","rationale":"麻黄碱通过促进去甲肾上腺素能神经末梢释放递质而起作用，反复用药递质耗竭产生快速耐受。","expl":{"A":"错误，快速耐受主要不是肝药酶诱导代谢加快所致。","B":"错误，受体敏感性下降非快速耐受的主要原因。","C":"正确，递质排空导致快速耐受。","D":"错误，其代谢产物并不拮抗麻黄碱的作用。","E":"错误，麻黄碱为非儿茶酚胺类，不易被MAO、COMT破坏。"}},{"id":"ch09_q14","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":14,"stem":"麻黄碱的特点是","options":{"A":"不易产生快速耐受性","B":"性质不稳定，口服无效","C":"性质稳定，口服有效","D":"具中枢抑制作用","E":"作用快、强"},"answer":["C"],"answerStr":"C","rationale":"麻黄碱为非儿茶酚胺类，化学性质稳定，口服有效，作用持久。","expl":{"A":"错误，麻黄碱易产生快速耐受性。","B":"错误，麻黄碱性质稳定，口服有效。","C":"正确，性质稳定、可口服，作用温和持久。","D":"错误，麻黄碱具有中枢兴奋作用而非抑制。","E":"错误，麻黄碱作用较肾上腺素弱而持久，并非快、强。"}},{"id":"ch09_q15","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":15,"stem":"既可直接激动 α 、β-R，又可促进去甲肾上腺素能神经末梢释放递质的药物是","options":{"A":"麻黄碱","B":"去甲肾上腺素","C":"肾上腺素","D":"异丙肾上腺素","E":"苯肾上腺素"},"answer":["A"],"answerStr":"A","rationale":"麻黄碱既能直接激动α、β受体，又能促进去甲肾上腺素能神经末梢释放递质。","expl":{"A":"正确，麻黄碱兼有直接激动受体和促进递质释放双重机制。","B":"错误，去甲肾上腺素为直接激动剂，不促进自身递质释放。","C":"错误，肾上腺素为直接激动剂，无促进递质释放作用。","D":"错误，异丙肾上腺素为直接β激动剂，不促进递质释放。","E":"错误，苯肾上腺素（去氧肾上腺素）为直接α1激动剂。"}},{"id":"ch09_q16","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":16,"stem":"去甲肾上腺素静脉滴注时间过长或剂量过大的主要危险是","options":{"A":"抑制心脏","B":"急性肾功能衰竭","C":"局部组织缺血坏死","D":"心律失常","E":"血压升高"},"answer":["B"],"answerStr":"B","rationale":"去甲肾上腺素静滴时间过长或剂量过大强烈收缩肾血管，可致急性肾衰竭，为主要危险。","expl":{"A":"错误，去甲肾上腺素不直接抑制心脏。","B":"正确，肾血管强烈收缩致肾缺血、急性肾功能衰竭。","C":"错误，局部组织缺血坏死主要由药液外漏引起。","D":"错误，心律失常并非其主要危险。","E":"错误，血压升高是治疗目的，控制适当并非主要危险。"}},{"id":"ch09_q17","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":17,"stem":"去氧肾上腺素对眼的作用是","options":{"A":"激动瞳孔开大肌上的 α-R","B":"阻断瞳孔括约肌上的 M-R","C":"明显升高眼内压","D":"可产生调节麻痹","E":"可产生调节痉挛"},"answer":["A"],"answerStr":"A","rationale":"去氧肾上腺素激动瞳孔开大肌α1受体，使之收缩而散瞳。","expl":{"A":"正确，激动瞳孔开大肌α受体产生散瞳，且不麻痹睫状肌。","B":"错误，去氧肾上腺素不阻断M受体。","C":"错误，去氧肾上腺素散瞳不伴明显升高眼压。","D":"错误，去氧肾上腺素不麻痹睫状肌，不产生调节麻痹。","E":"错误，去氧肾上腺素不产生调节痉挛。"}},{"id":"ch09_q18","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":18,"stem":"异丙肾上腺素没有下述哪种作用？","options":{"A":"松驰支气管平滑肌","B":"激动 β2-R","C":"收缩支气管粘膜血管","D":"促使 ATP 转变为 CAMP","E":"抑制组胺等过敏性物质的释放"},"answer":["C"],"answerStr":"C","rationale":"异丙肾上腺素为纯β受体激动剂，无α受体作用，故不能收缩支气管黏膜血管。","expl":{"A":"错误，异丙肾上腺素能松弛支气管平滑肌。","B":"错误，异丙肾上腺素可激动β2受体。","C":"正确，异丙肾上腺素不激动α受体，不能收缩支气管黏膜血管。","D":"错误，异丙肾上腺素可促进ATP转变为cAMP。","E":"错误，异丙肾上腺素可抑制组胺等过敏性物质释放。"}},{"id":"ch09_q19","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":19,"stem":"异丙肾上腺素治疗哮喘的常见不良反应是","options":{"A":"腹泻","B":"中枢兴奋","C":"直立性低血压","D":"心动过速","E":"脑血管意外"},"answer":["D"],"answerStr":"D","rationale":"异丙肾上腺素激动心脏β1受体，可引起心动过速，为其治疗哮喘的常见不良反应。","expl":{"A":"错误，异丙肾上腺素不引起腹泻。","B":"错误，异丙肾上腺素无显著中枢兴奋作用。","C":"错误，异丙肾上腺素不引起直立性低血压。","D":"正确，激动β1受体致心动过速、心悸，为常见不良反应。","E":"错误，异丙肾上腺素不引起脑血管意外。"}},{"id":"ch09_q20","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":20,"stem":"现有一新药，给人静脉注射后可产生轻度心动过速，但平均动脉血压无变化，还可减少汗腺分泌和扩瞳，不具有中枢效应，该药应属于","options":{"A":"α-R 阻断药","B":"β-R 激动药","C":"神经节 N 受体激动药","D":"神经节 N 受体阻断药","E":"以上均不是"},"answer":["E"],"answerStr":"E","rationale":"该药轻度增快心率、抑制汗腺分泌、扩瞳且无中枢作用，符合M胆碱受体阻断药（如阿托品）特点，不属于所列各类。","expl":{"A":"错误，α受体阻断药扩张血管降压，不抑制汗腺、不扩瞳。","B":"错误，β受体激动药增快心率但不抑制汗腺分泌、不扩瞳。","C":"错误，神经节N受体激动药不呈此特征。","D":"错误，神经节N受体阻断药致低血压及腺体抑制，但机制不符。","E":"正确，该药为M受体阻断药，不属于A~D任一类。"}},{"id":"ch09_q21","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":21,"stem":"静滴剂量过大，易致肾功能衰竭的药物是","options":{"A":"肾上腺素","B":"异丙肾上腺素","C":"去甲肾上腺素","D":"多巴胺","E":"麻黄碱"},"answer":["C"],"answerStr":"C","rationale":"去甲肾上腺素强烈收缩肾血管，静滴剂量过大易致肾缺血、急性肾功能衰竭。","expl":{"A":"错误，肾上腺素收缩肾血管作用相对较弱，不以此为主要危险。","B":"错误，异丙肾上腺素扩张血管，不收缩肾血管。","C":"正确，去甲肾上腺素强烈收缩肾血管，大剂量易致急性肾衰竭。","D":"错误，多巴胺舒张肾血管，不引起肾衰竭。","E":"错误，麻黄碱对肾血管影响小，不易致肾衰竭。"}},{"id":"ch09_q22","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":22,"stem":"肾上腺素与局麻药合用于局麻的目的是","options":{"A":"使局部血管收缩而止血","B":"预防过敏性休克的发生","C":"防止低血压的发生","D":"使局麻时间延长，减少吸收中毒","E":"使局部血管扩张，使局麻药吸收加快"},"answer":["D"],"answerStr":"D","rationale":"肾上腺素收缩局部血管，延缓局麻药吸收，可延长麻醉时间并减少吸收中毒。","expl":{"A":"错误，合用目的主要是延缓吸收而非直接止血。","B":"错误，肾上腺素不能预防局麻药引起的过敏性休克。","C":"错误，防止低血压并非合用的主要目的。","D":"正确，收缩局部血管使局麻时间延长、减少吸收中毒。","E":"错误，肾上腺素使局部血管收缩而非扩张。"}},{"id":"ch09_q23","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":23,"stem":"房室结功能衰竭伴心脏骤停的心跳复苏药最佳是","options":{"A":"氯化钙","B":"利多卡因","C":"去甲肾上腺素","D":"异丙肾上腺素","E":"苯上肾腺素"},"answer":["D"],"answerStr":"D","rationale":"异丙肾上腺素激动β1受体，加快房室传导、增快心率，适用于房室结功能衰竭伴心脏骤停的复苏。","expl":{"A":"错误，氯化钙用于低钙等，非房室阻滞复苏首选。","B":"错误，利多卡因为抗心律失常药，不用于心跳复苏。","C":"错误，去甲肾上腺素升压强但减慢心率，不适用。","D":"正确，异丙肾上腺素兴奋β1受体，加快传导与心率，宜用于复苏。","E":"错误，苯肾上腺素为升压药，不改善传导。"}},{"id":"ch09_q24","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":24,"stem":"去甲肾上腺素不同于肾上腺素之处是","options":{"A":"为儿茶酚胺类药物","B":"能激动 α-R","C":"能增加心肌耗氧量","D":"升高血压","E":"在整体情况下心率会减慢"},"answer":["E"],"answerStr":"E","rationale":"去甲肾上腺素升压作用强，反射性使心率减慢；肾上腺素整体使心率加快，此为二者重要区别。","expl":{"A":"错误，二者均属儿茶酚胺类。","B":"错误，二者均能激动α受体。","C":"错误，二者均可增加心肌耗氧量。","D":"错误，二者均可升高血压。","E":"正确，去甲肾上腺素整体反射性减慢心率，不同于肾上腺素。"}},{"id":"ch09_q25","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":25,"stem":"属 α 1-R 激动药的药物是","options":{"A":"去甲肾上腺素","B":"肾上腺素","C":"甲氧明","D":"间羟胺","E":"麻黄碱"},"answer":["C"],"answerStr":"C","rationale":"甲氧明选择性激动α1受体，为典型的α1受体激动药。","expl":{"A":"错误，去甲肾上腺素为α、β受体激动药，非选择性α1激动药。","B":"错误，肾上腺素为α、β受体激动药。","C":"正确，甲氧明选择性激动α1受体。","D":"错误，间羟胺主要促递质释放，兼直接激动α受体。","E":"错误，麻黄碱为α、β受体兼间接激动药。"}},{"id":"ch09_q26","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":26,"stem":"控制支气管哮喘急性发作宜选用","options":{"A":"麻黄碱","B":"异丙肾上腺素","C":"多巴胺","D":"间羟胺","E":"去甲肾上腺素"},"answer":["B"],"answerStr":"B","rationale":"异丙肾上腺素激动β2受体快速松弛支气管平滑肌，宜用于支气管哮喘急性发作。","expl":{"A":"错误，麻黄碱作用缓慢持久，用于轻症和预防。","B":"正确，异丙肾上腺素起效快，宜控制哮喘急性发作。","C":"错误，多巴胺主要影响心血管和肾，不用于哮喘。","D":"错误，间羟胺为升压药，不用于哮喘。","E":"错误，去甲肾上腺素收缩血管，不用于哮喘。"}},{"id":"ch09_q27","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":27,"stem":"肾上腺素禁用于","options":{"A":"支气管哮喘急性发作","B":"甲亢","C":"过敏性休克","D":"心脏骤停","E":"局部止血"},"answer":["B"],"answerStr":"B","rationale":"肾上腺素增快心率、升高代谢，可诱发甲亢危象及心律失常，故甲亢患者禁用。","expl":{"A":"错误，支气管哮喘急性发作是肾上腺素的适应证。","B":"正确，甲亢患者对儿茶酚胺敏感，肾上腺素可诱发危象，属禁忌。","C":"错误，过敏性休克是肾上腺素首选适应证。","D":"错误，心脏骤停可用肾上腺素复苏。","E":"错误，局部止血为肾上腺素的应用之一。"}},{"id":"ch09_q28","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"A","num":28,"stem":"主要用于支气管哮喘轻症治疗的药物是","options":{"A":"麻黄碱","B":"肾上腺素","C":"异丙肾上腺素","D":"阿托品","E":"去甲肾上腺素"},"answer":["A"],"answerStr":"A","rationale":"麻黄碱作用温和持久、可口服，适用于支气管哮喘轻症治疗及预防发作。","expl":{"A":"正确，麻黄碱作用缓和持久，宜用于哮喘轻症。","B":"错误，肾上腺素用于哮喘急性发作，非轻症首选。","C":"错误，异丙肾上腺素用于急性发作。","D":"错误，阿托品非哮喘治疗首选药。","E":"错误，去甲肾上腺素不用于哮喘。"}},{"id":"ch09_q29","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"B","num":29,"stem":"小剂量静滴肾上腺素可引起","options":{"A":"心率减慢，血压升高","B":"心率增快，脉压增大","C":"收缩压、舒张压明显升高，脉压变小","D":"增加收缩压、脉压，舒张肾血管","E":"收缩压下降，舒张压上升"},"answer":["B"],"answerStr":"B","rationale":"小剂量肾上腺素以兴奋β受体为主，心脏兴奋使心率增快，收缩压升高、舒张压略降，脉压增大。","expl":{"A":"错误，小剂量肾上腺素不引起心率减慢。","B":"正确，心率增快，收缩压升高而舒张压不变或稍降，脉压增大。","C":"错误，小剂量时舒张压不明显升高。","D":"错误，肾上腺素不舒张肾血管。","E":"错误，肾上腺素使收缩压上升而非下降。"}},{"id":"ch09_q30","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"B","num":30,"stem":"小剂量静滴去甲肾上腺素可引起","options":{"A":"心率减慢，血压升高","B":"心率增快，脉压增大","C":"收缩压、舒张压明显升高，脉压变小","D":"增加收缩压、脉压，舒张肾血管","E":"收缩压下降，舒张压上升"},"answer":["A"],"answerStr":"A","rationale":"小剂量去甲肾上腺素主要收缩血管升高血压，反射性使心率减慢。","expl":{"A":"正确，升压作用强，反射性兴奋迷走神经使心率减慢。","B":"错误，去甲肾上腺素反射性减慢心率，并非增快。","C":"错误，小剂量去甲肾上腺素舒张压升高不明显。","D":"错误，去甲肾上腺素收缩肾血管，不舒张。","E":"错误，去甲肾上腺素使收缩压上升而非下降。"}},{"id":"ch09_q31","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"B","num":31,"stem":"大剂量静滴去甲肾上腺素可引起","options":{"A":"心率减慢，血压升高","B":"心率增快，脉压增大","C":"收缩压、舒张压明显升高，脉压变小","D":"增加收缩压、脉压，舒张肾血管","E":"收缩压下降，舒张压上升"},"answer":["C"],"answerStr":"C","rationale":"大剂量去甲肾上腺素α受体作用占优势，外周阻力显著升高，收缩压、舒张压均明显升高，脉压变小。","expl":{"A":"错误，大剂量时血压明显升高并反射性减慢心率，非仅此。","B":"错误，大剂量时脉压变小而非增大。","C":"正确，收缩压、舒张压明显升高，脉压变小。","D":"错误，去甲肾上腺素收缩肾血管，不舒张。","E":"错误，去甲肾上腺素使收缩压上升。"}},{"id":"ch09_q32","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"B","num":32,"stem":"治疗量静滴多巴胺可引起","options":{"A":"心率减慢，血压升高","B":"心率增快，脉压增大","C":"收缩压、舒张压明显升高，脉压变小","D":"增加收缩压、脉压，舒张肾血管","E":"收缩压下降，舒张压上升"},"answer":["D"],"answerStr":"D","rationale":"治疗量多巴胺激动β1受体及D1受体，增加收缩压和脉压，并舒张肾血管。","expl":{"A":"错误，多巴胺一般不引起心率减慢。","B":"错误，多巴胺虽增收缩压与脉压，但更重要是舒张肾血管。","C":"错误，多巴胺舒张压升高不明显。","D":"正确，增加收缩压和脉压，并舒张肾血管增加肾血流。","E":"错误，多巴胺使收缩压上升而非下降。"}},{"id":"ch09_q33","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"B","num":33,"stem":"肾上腺素可用于","options":{"A":"过敏性休克","B":"出血性休克","C":"早期神经原性休克","D":"感染中毒性休克","E":"心源性休克"},"answer":["A"],"answerStr":"A","rationale":"肾上腺素激动α、β受体，升高血压、扩张支气管、抑制过敏介质释放，是过敏性休克首选药。","expl":{"A":"正确，肾上腺素为过敏性休克的首选药。","B":"错误，出血性休克以补液输血及去甲肾上腺素升压为主。","C":"错误，早期神经原性休克多用去甲肾上腺素。","D":"错误，感染中毒性休克在抗感染基础上可用阿托品等。","E":"错误，心源性休克需针对病因处理，不首选肾上腺素。"}},{"id":"ch09_q34","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"B","num":34,"stem":"去甲肾上腺素可用于","options":{"A":"过敏性休克","B":"出血性休克","C":"早期神经原性休克","D":"感染中毒性休克","E":"心源性休克"},"answer":["C"],"answerStr":"C","rationale":"去甲肾上腺素收缩血管升高血压，适用于早期神经原性休克时的低血压。","expl":{"A":"错误，过敏性休克首选肾上腺素。","B":"错误，出血性休克应补液输血，去甲肾上腺素非首选。","C":"正确，早期神经原性休克因血管扩张血压下降，去甲肾上腺素收缩血管升压适宜。","D":"错误，感染中毒性休克以阿托品等扩血管改善微循环为主。","E":"错误，心源性休克不宜单用去甲肾上腺素强升压。"}},{"id":"ch09_q35","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"B","num":35,"stem":"阿托品可用于","options":{"A":"过敏性休克","B":"出血性休克","C":"早期神经原性休克","D":"感染中毒性休克","E":"心源性休克"},"answer":["D"],"answerStr":"D","rationale":"感染中毒性休克存在微循环障碍，阿托品解除小血管痉挛、改善微循环，故可用于其治疗。","expl":{"A":"错误，过敏性休克首选肾上腺素。","B":"错误，出血性休克以补液输血为主。","C":"错误，早期神经原性休克多用去甲肾上腺素。","D":"正确，阿托品扩张血管改善微循环，用于感染中毒性休克。","E":"错误，心源性休克不首选阿托品。"}},{"id":"ch09_q36","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"C","num":36,"stem":"直接与受体结合","options":{"A":"多巴胺","B":"麻黄碱","C":"两者均是","D":"两者均否"},"answer":["C"],"answerStr":"C","rationale":"多巴胺直接激动多巴胺受体及α、β受体，麻黄碱亦能直接激动α、β受体，故两者均直接与受体结合。","expl":{"A":"错误，多巴胺可激动D1、β1等受体，但此项不完整。","B":"错误，麻黄碱亦可直接激动α、β受体，但此项不完整。","C":"正确，两者均能直接与受体结合。","D":"错误，两者均能直接与受体结合。"}},{"id":"ch09_q37","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"C","num":37,"stem":"促进去甲肾上腺素释放","options":{"A":"多巴胺","B":"麻黄碱","C":"两者均是","D":"两者均否"},"answer":["C"],"answerStr":"C","rationale":"多巴胺和麻黄碱均能促进去甲肾上腺素能神经末梢释放去甲肾上腺素。","expl":{"A":"错误，多巴胺可促进NA释放，但此项不完整。","B":"错误，麻黄碱可促进NA释放，但此项不完整。","C":"正确，两者均可促进去甲肾上腺素释放。","D":"错误，两者均能促进NA释放。"}},{"id":"ch09_q38","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"C","num":38,"stem":"激动 D1-R","options":{"A":"多巴胺","B":"麻黄碱","C":"两者均是","D":"两者均否"},"answer":["A"],"answerStr":"A","rationale":"多巴胺可激动肾血管等部位D1受体，麻黄碱无此作用。","expl":{"A":"正确，多巴胺激动D1受体，扩张肾血管。","B":"错误，麻黄碱主要激动α、β受体，不激动D1受体。","C":"错误，麻黄碱不激动D1受体。","D":"错误，多巴胺可激动D1受体。"}},{"id":"ch09_q39","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"C","num":39,"stem":"具排钠利尿作用","options":{"A":"多巴胺","B":"麻黄碱","C":"两者均是","D":"两者均否"},"answer":["A"],"answerStr":"A","rationale":"小剂量多巴胺激动肾D1受体，扩张肾血管、增加肾血流，产生排钠利尿作用。","expl":{"A":"正确，多巴胺增加肾血流，有排钠利尿作用。","B":"错误，麻黄碱无排钠利尿作用。","C":"错误，麻黄碱不具排钠利尿作用。","D":"错误，多巴胺具排钠利尿作用。"}},{"id":"ch09_q40","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"X","num":40,"stem":"儿茶酚胺类包括","options":{"A":"肾上腺素","B":"去甲肾上腺素","C":"异丙肾上腺素","D":"多巴胺","E":"麻黄碱"},"answer":["A","B","C","D"],"answerStr":"ABCD","rationale":"肾上腺素、去甲肾上腺素、异丙肾上腺素、多巴胺均含儿茶酚（邻苯二酚）核，属儿茶酚胺类；麻黄碱无儿茶酚核。","expl":{"A":"正确，肾上腺素属儿茶酚胺类。","B":"正确，去甲肾上腺素属儿茶酚胺类。","C":"正确，异丙肾上腺素属儿茶酚胺类。","D":"正确，多巴胺属儿茶酚胺类。","E":"错误，麻黄碱无儿茶酚核，属非儿茶酚胺类。"}},{"id":"ch09_q41","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"X","num":41,"stem":"可促进 NA 释放的药物是","options":{"A":"肾上腺素","B":"多巴胺","C":"麻黄碱","D":"间羟胺","E":"去甲肾上腺素"},"answer":["B","C","D"],"answerStr":"BCD","rationale":"多巴胺、麻黄碱、间羟胺均可促进去甲肾上腺素能神经末梢释放NA；肾上腺素、去甲肾上腺素为直接激动剂。","expl":{"A":"错误，肾上腺素直接激动受体，不促进NA释放。","B":"正确，多巴胺可促进NA释放。","C":"正确，麻黄碱可促进NA释放。","D":"正确，间羟胺可促进NA释放。","E":"错误，去甲肾上腺素为直接激动剂，不促进自身释放。"}},{"id":"ch09_q42","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"X","num":42,"stem":"间羟胺与 NA 相比有以下特点","options":{"A":"可肌注给药","B":"升压作用较弱但持久","C":"不易被 MAO 代谢","D":"不易引起心律失常","E":"收缩肾血管作用弱"},"answer":["A","B","C","D","E"],"answerStr":"ABCDE","rationale":"间羟胺升压作用较去甲肾上腺素弱而持久，可肌注，不易被MAO代谢，较少引起心律失常，收缩肾血管作用弱。","expl":{"A":"正确，间羟胺性质稳定，可肌注给药。","B":"正确，间羟胺升压作用较弱但持久。","C":"正确，间羟胺为非儿茶酚胺类，不易被MAO代谢。","D":"正确，间羟胺不易引起心律失常。","E":"正确，间羟胺收缩肾血管作用较NA弱。"}},{"id":"ch09_q43","chapter":"第十章 肾上腺素受体激动药","chapterIdx":8,"type":"X","num":43,"stem":"肾上腺素抢救过敏性休克的作用机制有","options":{"A":"增加心输出量","B":"升高外周阻力和血压","C":"松驰支气管平滑肌","D":"抑制组胺等过敏物质释放","E":"减轻支气管粘膜水肿"},"answer":["A","B","C","D","E"],"answerStr":"ABCDE","rationale":"肾上腺素激动α、β受体，增加心输出量、升高血压、松弛支气管平滑肌、抑制过敏介质释放并减轻黏膜水肿，从而抗过敏性休克。","expl":{"A":"正确，激动β1受体增强心肌收缩、增加心输出量。","B":"正确，激动α受体收缩血管，升高外周阻力和血压。","C":"正确，激动β2受体松弛支气管平滑肌。","D":"正确，抑制组胺等过敏介质释放。","E":"正确，收缩支气管黏膜血管，减轻黏膜水肿。"}}]},{"title":"第十一章 肾上腺素受体阻断药","questions":[{"id":"ch10_q01","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"A","num":1,"stem":"外周血管痉挛性疾病可选用何药治疗","options":{"A":"山莨菪碱","B":"异丙肾上腺素","C":"间羟胺","D":"普萘洛尔","E":"酚妥拉明"},"answer":["E"],"answerStr":"E","rationale":"酚妥拉明为α受体阻断药，能扩张血管、改善微循环，故可用于治疗外周血管痉挛性疾病。","expl":{"A":"山莨菪碱为M胆碱受体阻断药，主要解除内脏平滑肌痉挛，非外周血管痉挛性疾病首选。","B":"异丙肾上腺素为β受体激动药，虽可扩张血管，但不用于外周血管痉挛性疾病。","C":"间羟胺为α受体激动药，收缩血管，反而加重外周血管痉挛。","D":"普萘洛尔为β受体阻断药，可使外周血管收缩，不宜用于血管痉挛性疾病。","E":"正确，酚妥拉明阻断α受体、扩张血管，用于治疗外周血管痉挛性疾病。"}},{"id":"ch10_q02","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"A","num":2,"stem":"“ 肾上腺素升压作用的翻转”是指","options":{"A":"给予 β 受体阻断药后出现升压效应","B":"给予 α 受体阻断药后出现降压效应","C":"肾上腺素具有 α 、β 受体激动效应","D":"收缩上升，舒张压不变或下降","E":"由于升高血压，对脑血管的被动扩张作用"},"answer":["B"],"answerStr":"B","rationale":"α受体阻断药阻断α受体后，肾上腺素仅激动β2受体，血管扩张使血压下降，即升压作用翻转为降压。","expl":{"A":"错，给予β受体阻断药后肾上腺素仍以α作用为主，表现为升压而非降压。","B":"正确，阻断α受体后肾上腺素只兴奋β2受体，出现降压效应。","C":"此为肾上腺素本身的双重激动效应，并非升压翻转的含义。","D":"描述的是肾上腺素正常升压效应，与翻转无关。","E":"脑血管被动扩张是升压的后果之一，不属翻转作用。"}},{"id":"ch10_q03","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"A","num":3,"stem":"普萘洛尔不具有下述哪项药理作用","options":{"A":"阻断心脏 β1受体及支气管 β2 受体","B":"生物利用度低","C":"抑制肾素释放","D":"膜稳定作用","E":"内在拟交感作用"},"answer":["E"],"answerStr":"E","rationale":"普萘洛尔无内在拟交感活性，其余如阻断β1/β2受体、生物利用度低、抑制肾素释放及膜稳定作用均具备。","expl":{"A":"普萘洛尔非选择性阻断心脏β1及支气管β2受体，属于其作用。","B":"普萘洛尔首过消除明显，生物利用度低，属于其特征。","C":"普萘洛尔可阻断肾小球旁器β受体而抑制肾素释放。","D":"普萘洛尔有膜稳定（局麻）作用，属于其作用。","E":"正确，普萘洛尔无内在拟交感活性，故不具有此项。"}},{"id":"ch10_q04","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"A","num":4,"stem":"下列具有拟胆碱作用的药物是","options":{"A":"间羟胺","B":"多巴酚丁胺","C":"酚苄明","D":"酚妥拉明","E":"山莨菪碱"},"answer":["D"],"answerStr":"D","rationale":"酚妥拉明可激动M胆碱受体，产生拟胆碱样作用，如兴奋胃肠道平滑肌、促进蠕动。","expl":{"A":"间羟胺为α受体激动药，无拟胆碱作用。","B":"多巴酚丁胺为选择性β1受体激动药，无拟胆碱作用。","C":"酚苄明为α受体阻断药，无拟胆碱样作用。","D":"正确，酚妥拉明有拟胆碱样作用，可兴奋胃肠道平滑肌。","E":"山莨菪碱为M胆碱受体阻断药，具有抗胆碱而非拟胆碱作用。"}},{"id":"ch10_q05","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"A","num":5,"stem":"静注普萘洛尔后再静注下列哪一种药物可表现升压效应","options":{"A":"肾上腺素","B":"异丙肾上腺素","C":"氯丙嗪","D":"东莨菪碱","E":"新斯的明"},"answer":["A"],"answerStr":"A","rationale":"阻断β受体后，肾上腺素仅保留α受体激动作用，使血管收缩、血压升高。","expl":{"A":"正确，β受体被阻断后肾上腺素只激动α受体，表现为升压效应。","B":"异丙肾上腺素主要激动β受体，β受体被阻断后作用减弱，不升压。","C":"氯丙嗪为α受体阻断药，反引起降压，不表现升压。","D":"东莨菪碱为M受体阻断药，不产生升压效应。","E":"新斯的明为抗胆碱酯酶药，不引起升压。"}},{"id":"ch10_q06","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"A","num":6,"stem":"静滴去甲肾上腺素发生外漏，最佳的处理方式是","options":{"A":"局部注射局部麻醉药","B":"肌内注射酚妥拉明","C":"局部注射酚妥拉明","D":"局部注射 β 受体阻断药","E":"局部浸润用肤轻松软膏"},"answer":["C"],"answerStr":"C","rationale":"去甲肾上腺素外漏致局部血管强烈收缩、组织缺血坏死，应用α受体阻断药酚妥拉明局部浸润注射对抗。","expl":{"A":"局部麻醉药不能对抗去甲肾上腺素的血管收缩作用。","B":"酚妥拉明应局部浸润注射，而非肌内注射。","C":"正确，局部注射酚妥拉明阻断α受体、扩张血管，防止组织坏死。","D":"β受体阻断药无对抗α受体收缩血管的作用。","E":"肤轻松软膏为糖皮质激素，不能解除局部血管痉挛。"}},{"id":"ch10_q07","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"A","num":7,"stem":"酚妥拉明治疗充血性心力衰竭是因为","options":{"A":"能增强心肌收缩力","B":"有抗胆碱作用，心率加快","C":"利尿消肿，减轻心脏负担","D":"降低心肌耗氧量","E":"扩张血管，降低外周阻力，减轻心脏后负荷"},"answer":["E"],"answerStr":"E","rationale":"酚妥拉明阻断α受体并直接扩张血管，降低外周阻力、减轻心脏后负荷，从而改善心功能。","expl":{"A":"酚妥拉明主要扩张血管，并不直接增强心肌收缩力。","B":"抗胆碱作用并非其治疗心衰的主要机制。","C":"酚妥拉明无明显利尿作用，非通过消肿减负。","D":"扩张血管可反射性加快心率、增加耗氧，并非降低心肌耗氧量。","E":"正确，扩张血管降低外周阻力、减轻心脏后负荷。"}},{"id":"ch10_q08","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"A","num":8,"stem":"用于诊断嗜铬细胞瘤的药物是","options":{"A":"肾上腺素","B":"酚妥拉明","C":"阿托品","D":"组胺","E":"普萘洛尔"},"answer":["B"],"answerStr":"B","rationale":"酚妥拉明为α受体阻断药，可阻断儿茶酚胺的α受体升压作用；静脉注射酚妥拉明后血压明显下降者提示嗜铬细胞瘤，即酚妥拉明试验。","expl":{"A":"错误，肾上腺素激动α、β受体使血压升高，不能用于诊断。","B":"正确，酚妥拉明试验用于诊断嗜铬细胞瘤。","C":"错误，阿托品为M受体阻断药，与嗜铬细胞瘤诊断无关。","D":"错误，组胺虽可促使儿茶酚胺释放，但危险且不特异，不用于诊断。","E":"错误，普萘洛尔为β受体阻断药；在嗜铬细胞瘤未先用α阻断药时使用可致血压骤升，不能用于诊断。"}},{"id":"ch10_q09","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"A","num":9,"stem":"下列哪一种药物有拟胆碱和组胺样作用","options":{"A":"regitinE.","B":"phenoxybenzaminE.","C":"dobutaminE.","D":"araminE.","E":"anisodamine"},"answer":["A"],"answerStr":"A","rationale":"酚妥拉明（regitine，立其丁）具有拟胆碱样作用和组胺样作用。","expl":{"A":"正确，酚妥拉明（立其丁）有拟胆碱和组胺样作用。","B":"酚苄明为α受体阻断药，无拟胆碱和组胺样作用。","C":"多巴酚丁胺为β1受体激动药，无此作用。","D":"间羟胺为α受体激动药，无此作用。","E":"山莨菪碱为M受体阻断药，有抗胆碱作用，无拟胆碱及组胺样作用。"}},{"id":"ch10_q10","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"A","num":10,"stem":"给 β 受体阻断药，异丙肾上腺素的降压作用将会","options":{"A":"出现升压效应","B":"进一步降压","C":"先升压再降压","D":"减弱","E":"导致休克产生"},"answer":["D"],"answerStr":"D","rationale":"异丙肾上腺素的降压作用由激动β2受体引起，β受体被阻断后其作用减弱。","expl":{"A":"异丙肾上腺素主要激动β受体，β受体阻断后不会出现升压。","B":"β受体被阻断后异丙肾上腺素作用减弱，不会进一步降压。","C":"无先升后降效应，阻断后直接减弱。","D":"正确，β受体被阻断后异丙肾上腺素降压作用减弱。","E":"作用减弱不致导致休克。"}},{"id":"ch10_q11","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"A","num":11,"stem":"可选择性阻断 α 1-R 的药物是","options":{"A":"氯丙嗪","B":"异丙嗪","C":"肼屈嗪","D":"丙咪嗪","E":"哌唑嗪"},"answer":["E"],"answerStr":"E","rationale":"哌唑嗪为选择性α1受体阻断药，用于高血压及前列腺增生。","expl":{"A":"氯丙嗪为抗精神病药，虽有α受体阻断作用但非选择性。","B":"异丙嗪为H1受体阻断药，无选择性阻断α1受体作用。","C":"肼屈嗪为直接扩血管降压药，不阻断α1受体。","D":"丙咪嗪为抗抑郁药，不选择性阻断α1受体。","E":"正确，哌唑嗪选择性阻断α1受体。"}},{"id":"ch10_q12","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"A","num":12,"stem":"属长效类 α-R 阻断药的是","options":{"A":"酚妥拉明","B":"妥拉唑啉","C":"哌唑嗪","D":"酚苄明","E":"甲氧明"},"answer":["D"],"answerStr":"D","rationale":"酚苄明与α受体共价结合，阻断作用持久，属长效α受体阻断药。","expl":{"A":"酚妥拉明为短效α受体阻断药，作用短暂。","B":"妥拉唑啉为短效α受体阻断药。","C":"哌唑嗪为选择性α1受体阻断药，非长效类。","D":"正确，酚苄明与α受体共价结合、作用持久，属长效类。","E":"甲氧明为α受体激动药，非阻断药。"}},{"id":"ch10_q13","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"A","num":13,"stem":"可用于治疗外周血管痉挛性疾病的药物是","options":{"A":"阿托品","B":"山莨菪碱","C":"多巴胺","D":"肼屈嗪","E":"酚妥拉明"},"answer":["E"],"answerStr":"E","rationale":"酚妥拉明阻断α受体、扩张血管，是外周血管痉挛性疾病的常用药。","expl":{"A":"阿托品为M受体阻断药，不用于外周血管痉挛性疾病。","B":"山莨菪碱主要解除内脏平滑肌痉挛，不用于外周血管痉挛。","C":"多巴胺为α、β及多巴胺受体激动药，非外周血管痉挛性疾病常用药。","D":"肼屈嗪为直接扩血管降压药，非外周血管痉挛性疾病常用药。","E":"正确，酚妥拉明扩张血管，用于外周血管痉挛性疾病。"}},{"id":"ch10_q14","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"B","num":14,"stem":"可用于治疗青光眼的是","options":{"A":"酚妥拉明","B":"普萘洛尔","C":"噻吗洛尔","D":"拉贝洛尔","E":"妥拉唑啉"},"answer":["C"],"answerStr":"C","rationale":"噻吗洛尔为β受体阻断药，减少房水生成，滴眼用于治疗青光眼。","expl":{"A":"酚妥拉明为α受体阻断药，不用于青光眼治疗。","B":"普萘洛尔虽为β受体阻断药，但不用于滴眼治疗青光眼。","C":"正确，噻吗洛尔减少房水生成、降低眼压，治疗青光眼。","D":"拉贝洛尔为α、β受体阻断药，用于高血压，不用于青光眼。","E":"妥拉唑啉为α受体阻断药，不用于青光眼。"}},{"id":"ch10_q15","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"B","num":15,"stem":"可用于治疗甲亢的是","options":{"A":"酚妥拉明","B":"普萘洛尔","C":"噻吗洛尔","D":"拉贝洛尔","E":"妥拉唑啉"},"answer":["B"],"answerStr":"B","rationale":"普萘洛尔阻断β受体，可减轻甲亢所致的交感神经过度兴奋症状如心悸、震颤等。","expl":{"A":"酚妥拉明为α受体阻断药，不用于甲亢的辅助治疗。","B":"正确，普萘洛尔阻断β受体，缓解甲亢心悸、震颤等交感兴奋症状。","C":"噻吗洛尔为β受体阻断药，主要用于青光眼，非甲亢常规用药。","D":"拉贝洛尔为α、β受体阻断药，主要用于高血压。","E":"妥拉唑啉为α受体阻断药，不用于甲亢。"}},{"id":"ch10_q16","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"C","num":16,"stem":"支气管哮喘禁用","options":{"A":"普萘洛尔","B":"酚妥拉明","C":"两者均是","D":"两者均否"},"answer":["A"],"answerStr":"A","rationale":"普萘洛尔阻断支气管β2受体使支气管平滑肌收缩、加重哮喘，故支气管哮喘禁用。","expl":{"A":"正确，普萘洛尔阻断β2受体致支气管收缩，哮喘患者禁用。","B":"酚妥拉明为α受体阻断药，不引起支气管收缩，不属哮喘禁用。","C":"酚妥拉明不禁用于哮喘，故不选。","D":"普萘洛尔确应禁用，故不选。"}},{"id":"ch10_q17","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"C","num":17,"stem":"冠心病患者慎用","options":{"A":"普萘洛尔","B":"酚妥拉明","C":"两者均是","D":"两者均否"},"answer":["B"],"answerStr":"B","rationale":"酚妥拉明扩张血管、反射性加快心率并增加心肌耗氧，可诱发或加重心绞痛，故冠心病患者慎用。","expl":{"A":"普萘洛尔可降低心肌耗氧，对冠心病心绞痛有益，非慎用。","B":"正确，酚妥拉明反射性加快心率、增加心肌耗氧，冠心病患者慎用。","C":"普萘洛尔对冠心病有利，不属慎用，故不选。","D":"酚妥拉明确需慎用，故不选。"}},{"id":"ch10_q18","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"C","num":18,"stem":"具有拟胆碱样作用的药物是","options":{"A":"普萘洛尔","B":"酚妥拉明","C":"两者均是","D":"两者均否"},"answer":["B"],"answerStr":"B","rationale":"酚妥拉明具有拟胆碱样作用，可兴奋胃肠道平滑肌。","expl":{"A":"普萘洛尔无拟胆碱样作用。","B":"正确，酚妥拉明具有拟胆碱样作用。","C":"普萘洛尔无此作用，故不选。","D":"酚妥拉明有此作用，故不选。"}},{"id":"ch10_q19","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"C","num":19,"stem":"具有抗胆碱样作用的药物是","options":{"A":"普萘洛尔","B":"酚妥拉明","C":"两者均是","D":"两者均否"},"answer":["D"],"answerStr":"D","rationale":"普萘洛尔和酚妥拉明均无抗胆碱（M受体阻断）作用。","expl":{"A":"普萘洛尔无抗胆碱作用。","B":"酚妥拉明为拟胆碱而非抗胆碱作用。","C":"两者均无抗胆碱作用，故不选。","D":"正确，两者均无抗胆碱样作用。"}},{"id":"ch10_q20","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"C","num":20,"stem":"育亨宾","options":{"A":"α 1-R 阻断药","B":"α2-R 阻断药","C":"两者均是","D":"两者均否"},"answer":["B"],"answerStr":"B","rationale":"育亨宾为选择性α2受体阻断药。","expl":{"A":"育亨宾不阻断α1受体。","B":"正确，育亨宾选择性阻断α2受体。","C":"育亨宾仅阻断α2受体，故不选。","D":"育亨宾确为α2受体阻断药，故不选。"}},{"id":"ch10_q21","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"C","num":21,"stem":"酚妥拉明","options":{"A":"α 1-R 阻断药","B":"α2-R 阻断药","C":"两者均是","D":"两者均否"},"answer":["C"],"answerStr":"C","rationale":"酚妥拉明为非选择性α受体阻断药，同时阻断α1和α2受体。","expl":{"A":"酚妥拉明可阻断α1受体。","B":"酚妥拉明也可阻断α2受体。","C":"正确，酚妥拉明同时阻断α1和α2受体。","D":"酚妥拉明确能阻断α受体，故不选。"}},{"id":"ch10_q22","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"C","num":22,"stem":"哌唑嗪","options":{"A":"α 1-R 阻断药","B":"α2-R 阻断药","C":"两者均是","D":"两者均否"},"answer":["A"],"answerStr":"A","rationale":"哌唑嗪为选择性α1受体阻断药。","expl":{"A":"正确，哌唑嗪选择性阻断α1受体。","B":"哌唑嗪不阻断α2受体。","C":"哌唑嗪仅阻断α1受体，故不选。","D":"哌唑嗪确为α1受体阻断药，故不选。"}},{"id":"ch10_q23","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"C","num":23,"stem":"吲哚洛尔","options":{"A":"α 1-R 阻断药","B":"α2-R 阻断药","C":"两者均是","D":"两者均否"},"answer":["D"],"answerStr":"D","rationale":"吲哚洛尔为β受体阻断药，不阻断α1或α2受体。","expl":{"A":"吲哚洛尔不阻断α1受体。","B":"吲哚洛尔不阻断α2受体。","C":"吲哚洛尔不阻断α受体，故不选。","D":"正确，吲哚洛尔为β受体阻断药，两者均否。"}},{"id":"ch10_q24","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"X","num":24,"stem":"可以翻转肾上腺素升压作用的药物有","options":{"A":"阿替洛尔","B":"噻吗洛尔","C":"酚妥拉明","D":"妥拉唑林","E":"氯丙嗪"},"answer":["C","D","E"],"answerStr":"CDE","rationale":"酚妥拉明、妥拉唑林为α受体阻断药，氯丙嗪有α受体阻断作用，三者均可翻转肾上腺素升压作用。","expl":{"A":"阿替洛尔为选择性β1受体阻断药，不能翻转肾上腺素升压。","B":"噻吗洛尔为β受体阻断药，不能翻转升压。","C":"正确，酚妥拉明阻断α受体可翻转肾上腺素升压作用。","D":"正确，妥拉唑林为α受体阻断药，可翻转升压作用。","E":"正确，氯丙嗪有α受体阻断作用，可翻转肾上腺素升压。"}},{"id":"ch10_q25","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"X","num":25,"stem":"酚妥拉明的药理作用有","options":{"A":"直接舒张血管","B":"阻 α1 受体","C":"阻 α2 受体","D":"拟胆碱作用","E":"兼有阻 β 受体作用"},"answer":["A","B","C","D"],"answerStr":"ABCD","rationale":"酚妥拉明直接舒张血管，阻断α1和α2受体，并有拟胆碱作用。","expl":{"A":"正确，酚妥拉明可直接扩张血管。","B":"正确，酚妥拉明阻断α1受体。","C":"正确，酚妥拉明阻断α2受体。","D":"正确，酚妥拉明有拟胆碱样作用。","E":"酚妥拉明无阻断β受体作用。"}},{"id":"ch10_q26","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"X","num":26,"stem":"普萘洛尔能够阻断肾上腺素哪些作用","options":{"A":"心输出量增加","B":"瞳孔扩大","C":"支气管扩张","D":"血管收缩","E":"脂肪分解"},"answer":["A","C","E"],"answerStr":"ACE","rationale":"肾上腺素的心输出量增加(β1)、支气管扩张(β2)和脂肪分解(β)均由β受体介导，可被普萘洛尔阻断。","expl":{"A":"正确，心输出量增加经β1受体介导，可被普萘洛尔阻断。","B":"瞳孔扩大为α受体介导，普萘洛尔不能阻断。","C":"正确，支气管扩张经β2受体介导，可被阻断。","D":"血管收缩为α受体介导，普萘洛尔不能阻断。","E":"正确，脂肪分解经β受体介导，可被阻断。"}},{"id":"ch10_q27","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"X","num":27,"stem":"下列关于噻吗洛尔的描述中，哪些是正确的","options":{"A":"β 受体阻断作用强","B":"可以减少房水生成","C":"无缩瞳作用","D":"有调节痉挛作用","E":"常用其滴眼剂"},"answer":["A","B","C","E"],"answerStr":"ABCE","rationale":"噻吗洛尔β受体阻断作用强，可减少房水生成，无缩瞳和调节痉挛作用，常用其滴眼剂。","expl":{"A":"正确，噻吗洛尔β受体阻断作用强。","B":"正确，减少房水生成而降低眼压。","C":"正确，β受体阻断药不影响瞳孔大小，无缩瞳作用。","D":"错，噻吗洛尔无调节痉挛作用。","E":"正确，治疗青光眼常用其滴眼剂。"}},{"id":"ch10_q28","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"X","num":28,"stem":"选择性阻断 β1受体的药有","options":{"A":"阿替洛尔 （ atenolol）","B":"纳多洛尔 （nadolol）","C":"普萘洛尔 （propranolol）","D":"美托洛尔 （metoprolol）","E":"吲哚洛尔 (pindolol)"},"answer":["A","D"],"answerStr":"AD","rationale":"阿替洛尔和美托洛尔为选择性β1受体阻断药。","expl":{"A":"正确，阿替洛尔选择性阻断β1受体。","B":"纳多洛尔为非选择性β受体阻断药。","C":"普萘洛尔为非选择性β受体阻断药。","D":"正确，美托洛尔选择性阻断β1受体。","E":"吲哚洛尔为非选择性β受体阻断药。"}},{"id":"ch10_q29","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"X","num":29,"stem":"有内在拟交感活性的 β 受体阻断药有","options":{"A":"propranolol","B":"pindolol","C":"esmolol","D":"acebutolol","E":"metoprolol"},"answer":["B","D"],"answerStr":"BD","rationale":"吲哚洛尔和醋丁洛尔具有内在拟交感活性。","expl":{"A":"普萘洛尔无内在拟交感活性。","B":"正确，吲哚洛尔有内在拟交感活性。","C":"艾司洛尔几乎无内在拟交感活性。","D":"正确，醋丁洛尔有内在拟交感活性。","E":"美托洛尔无内在拟交感活性。"}},{"id":"ch10_q30","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"X","num":30,"stem":"酚妥拉明的不良反应有","options":{"A":"低血压","B":"腹痛腹泻","C":"心率失常","D":"过敏反应","E":"心绞痛"},"answer":["A","B","C","E"],"answerStr":"ABCE","rationale":"酚妥拉明常见不良反应包括低血压、胃肠兴奋所致的腹痛腹泻、心律失常，并可诱发心绞痛。","expl":{"A":"正确，扩血管及阻断α受体可致体位性低血压。","B":"正确，拟胆碱作用兴奋胃肠平滑肌可致腹痛腹泻。","C":"正确，反射性兴奋及β作用可致心律失常。","D":"酚妥拉明不良反应中无典型过敏反应。","E":"正确，反射性加快心率、增加耗氧可诱发心绞痛。"}},{"id":"ch10_q31","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"X","num":31,"stem":"对艾可洛尔的叙述正确的有","options":{"A":"是作用时间较长的 β 受体阻断药","B":"几乎无内在拟交感活性","C":"缺乏膜稳定作用","D":"可用于室上性快速型心率失常的紧急状态","E":"可短时用于伴心动过速、心衰的高血压的危急病例"},"answer":["B","C","D","E"],"answerStr":"BCDE","rationale":"艾司洛尔为超短效β受体阻断药，几乎无内在拟交感活性、缺乏膜稳定作用，可用于室上性快速型心律失常及伴心动过速、心衰的高血压危急病例。","expl":{"A":"错，艾司洛尔为超短效β受体阻断药，作用时间短。","B":"正确，艾司洛尔几乎无内在拟交感活性。","C":"正确，艾司洛尔缺乏膜稳定作用。","D":"正确，可用于室上性快速型心律失常的紧急状态。","E":"正确，可短时用于伴心动过速、心衰的高血压危急病例。"}},{"id":"ch10_q32","chapter":"第十一章 肾上腺素受体阻断药","chapterIdx":9,"type":"X","num":32,"stem":"对纳多洛尔叙述正确的是","options":{"A":"对 β1和对 β2 的亲和力大致相同","B":"阻断作用持续时间长，t1/210-12 小时","C":"肾功不全时需要 β 受体阻断药的首选","D":"可每天给一次药","E":"肾功不全时应调整剂量"},"answer":["A","B","C","D","E"],"answerStr":"ABCDE","rationale":"纳多洛尔为非选择性、长效β受体阻断药，半衰期长可每日一次给药，主要经肾排泄，肾功能不全时需调整剂量。","expl":{"A":"正确，纳多洛尔对β1、β2受体亲和力大致相同，属非选择性阻断药。","B":"正确，纳多洛尔半衰期约10~12小时，作用持久。","C":"正确，肾功能不全需用β受体阻断药时，纳多洛尔可作为选用药之一。","D":"正确，因作用持久，可每日给药一次。","E":"正确，纳多洛尔主要经肾排泄，肾功能不全时应调整剂量。"}}]},{"title":"第十四章 局部麻醉药","questions":[{"id":"ch11_q01","chapter":"第十四章 局部麻醉药","chapterIdx":10,"type":"A","num":1,"stem":"局麻药的作用机制","options":{"A":"阻滞 Na+内流","B":"阻滞 K+外流","C":"阻滞 CL-内流","D":"阻滞 Ca2+内流","E":"降低静息电位"},"answer":["A"],"answerStr":"A","rationale":"局麻药阻滞神经细胞膜Na+通道、抑制Na+内流，从而阻断神经冲动的产生和传导。","expl":{"A":"正确，局麻药阻滞Na+通道、抑制Na+内流。","B":"局麻药不阻滞K+外流。","C":"局麻药不阻滞Cl-内流。","D":"局麻药不阻滞Ca2+内流。","E":"局麻药不降低静息电位。"}},{"id":"ch11_q02","chapter":"第十四章 局部麻醉药","chapterIdx":10,"type":"A","num":2,"stem":"为延长局麻药的作用时间并减少吸收，宜采用的措施是","options":{"A":"增加局麻药的用量","B":"加大局麻药的浓度","C":"加入少量的去甲肾上腺素","D":"加入少量肾上腺素","E":"调节药物的 PH 至弱酸性"},"answer":["D"],"answerStr":"D","rationale":"局麻药液中加入少量肾上腺素可使局部血管收缩，延缓吸收、延长作用时间并减少毒性。","expl":{"A":"增加用量会加重毒性，不能减少吸收。","B":"加大浓度不能减少吸收，反增毒性。","C":"去甲肾上腺素收缩血管过强，易致组织缺血坏死，不宜加入。","D":"正确，加入少量肾上腺素收缩局部血管，减少吸收、延长作用。","E":"弱酸性pH不利于局麻药发挥作用，不能延长作用。"}},{"id":"ch11_q03","chapter":"第十四章 局部麻醉药","chapterIdx":10,"type":"A","num":3,"stem":"蛛网膜下腔麻醉前注射麻黄碱的意义是","options":{"A":"可预防呼吸抑制","B":"可预防发生心率失常","C":"可预防血压下降","D":"可减少局麻药在作用部位吸收","E":"可延长局麻药作用时间"},"answer":["C"],"answerStr":"C","rationale":"蛛网膜下腔麻醉易致交感神经阻滞、血管扩张而血压下降，术前注射麻黄碱可收缩血管、预防低血压。","expl":{"A":"麻黄碱不用于预防呼吸抑制。","B":"麻黄碱主要升血压，不是预防心律失常。","C":"正确，麻黄碱升血压，可预防腰麻所致的血压下降。","D":"麻黄碱不能减少局麻药在作用部位的吸收。","E":"麻黄碱不能延长局麻药作用时间。"}},{"id":"ch11_q04","chapter":"第十四章 局部麻醉药","chapterIdx":10,"type":"A","num":4,"stem":"局麻药过量中毒发生惊厥，宜选哪个药对抗","options":{"A":"硫酸镁","B":"异戊巴比妥钠","C":"水合氯醛","D":"苯巴比妥","E":"安定"},"answer":["E"],"answerStr":"E","rationale":"局麻药中毒致中枢兴奋、惊厥，首选地西泮（安定）静脉注射对抗。","expl":{"A":"硫酸镁用于子痫惊厥，非局麻药中毒惊厥首选。","B":"巴比妥类可对抗惊厥，但地西泮更常用、更安全。","C":"水合氯醛非局麻药中毒惊厥的首选。","D":"苯巴比妥可用但非首选，地西泮更常用。","E":"正确，地西泮是局麻药中毒惊厥的首选对抗药。"}},{"id":"ch11_q05","chapter":"第十四章 局部麻醉药","chapterIdx":10,"type":"A","num":5,"stem":"局麻作用时间最长的是","options":{"A":"lidocainE.","B":"procainE.","C":"tetracainE.","D":"popivacainE.","E":"bupivacaine"},"answer":["E"],"answerStr":"E","rationale":"布比卡因属长效局麻药，局麻作用时间在常用局麻药中最长。","expl":{"A":"利多卡因为中效局麻药。","B":"普鲁卡因为短效局麻药。","C":"丁卡因虽为长效局麻药，但作用时间仍短于布比卡因。","D":"罗哌卡因为长效局麻药，作用时间较长，但不及布比卡因。","E":"正确，布比卡因为长效局麻药，作用时间最长。"}},{"id":"ch11_q06","chapter":"第十四章 局部麻醉药","chapterIdx":10,"type":"A","num":6,"stem":"普鲁卡因不可用于哪种局麻","options":{"A":"蛛网膜下腔麻醉","B":"浸润麻醉","C":"表面麻醉","D":"传导麻醉","E":"硬膜外麻醉"},"answer":["C"],"answerStr":"C","rationale":"普鲁卡因穿透力弱，不能穿透完整黏膜，故不用于表面麻醉。","expl":{"A":"普鲁卡因可用于蛛网膜下腔麻醉。","B":"普鲁卡因可用于浸润麻醉。","C":"正确，普鲁卡因穿透力弱，不用于表面麻醉。","D":"普鲁卡因可用于传导麻醉。","E":"普鲁卡因可用于硬膜外麻醉。"}},{"id":"ch11_q07","chapter":"第十四章 局部麻醉药","chapterIdx":10,"type":"A","num":7,"stem":"局麻药在炎症组织中","options":{"A":"作用增强","B":"作用减弱","C":"易被灭活","D":"不受影响","E":"无麻醉作用"},"answer":["B"],"answerStr":"B","rationale":"炎症组织pH偏酸性，使局麻药解离型增多、非解离型减少，不易透过神经膜，故作用减弱。","expl":{"A":"炎症组织中局麻药作用减弱而非增强。","B":"正确，炎症组织pH降低，局麻药作用减弱。","C":"炎症组织不加速局麻药灭活。","D":"炎症组织的酸性环境影响局麻药作用。","E":"并非完全无麻醉作用，只是减弱。"}},{"id":"ch11_q08","chapter":"第十四章 局部麻醉药","chapterIdx":10,"type":"A","num":8,"stem":"关于利用多卡因具有的特征哪项是错误的","options":{"A":"能穿透粘膜，作用比普鲁卡因快、强、持久","B":"安全范围大","C":"引起过敏反应","D":"有抗心律失常作用","E":"可用于各种局麻方法"},"answer":["C"],"answerStr":"C","rationale":"利多卡因为酰胺类局麻药，一般不引起过敏反应，其余各项均符合利多卡因特点。","expl":{"A":"利多卡因能穿透黏膜，作用比普鲁卡因快、强、持久，正确。","B":"利多卡因安全范围大，正确。","C":"正确（错误项），利多卡因一般不引起过敏反应。","D":"利多卡因有抗心律失常作用，正确。","E":"利多卡因可用于各种局麻方法，正确。"}},{"id":"ch11_q09","chapter":"第十四章 局部麻醉药","chapterIdx":10,"type":"A","num":9,"stem":"比普鲁卡因作用强且毒性大的常用局麻药是","options":{"A":"利多卡因","B":"普鲁卡因","C":"布比卡因","D":"丁卡因","E":"可卡因"},"answer":["D"],"answerStr":"D","rationale":"丁卡因的作用及毒性均比普鲁卡因强，是常用的强效局麻药。","expl":{"A":"利多卡因作用比普鲁卡因强，但毒性不及丁卡因显著。","B":"普鲁卡因为参照药，作用、毒性均较弱。","C":"布比卡因作用强，但本题所指作用及毒性均强于普鲁卡因者为丁卡因。","D":"正确，丁卡因作用及毒性均比普鲁卡因强。","E":"可卡因毒性大但少用，非本题所指常用局麻药。"}},{"id":"ch11_q10","chapter":"第十四章 局部麻醉药","chapterIdx":10,"type":"A","num":10,"stem":"下列局部麻醉方法中，不应用普鲁卡因是","options":{"A":"浸润麻醉","B":"传导麻醉","C":"蛛网膜下隙麻醉","D":"硬膜外麻醉","E":"表面麻醉"},"answer":["E"],"answerStr":"E","rationale":"普鲁卡因穿透力差，不能用于表面麻醉。","expl":{"A":"普鲁卡因可用于浸润麻醉。","B":"普鲁卡因可用于传导麻醉。","C":"普鲁卡因可用于蛛网膜下隙麻醉。","D":"普鲁卡因可用于硬膜外麻醉。","E":"正确，普鲁卡因不用于表面麻醉。"}},{"id":"ch11_q11","chapter":"第十四章 局部麻醉药","chapterIdx":10,"type":"A","num":11,"stem":"影响局麻药作用的因素不包括","options":{"A":"神经纤维的粗细","B":"体液的pH","C":"药物的的浓度","D":"肝脏的功能","E":"血管收缩药"},"answer":["D"],"answerStr":"D","rationale":"神经纤维粗细、体液pH、药物浓度及血管收缩药均影响局麻作用，而肝脏功能不属于影响局麻药作用的因素。","expl":{"A":"神经纤维粗细影响局麻药作用，属影响因素。","B":"体液pH影响局麻药解离与穿透，属影响因素。","C":"药物浓度影响局麻作用，属影响因素。","D":"正确（不包括项），肝脏功能不是影响局麻药作用的因素。","E":"血管收缩药影响吸收与作用时间，属影响因素。"}},{"id":"ch11_q12","chapter":"第十四章 局部麻醉药","chapterIdx":10,"type":"B","num":12,"stem":"普鲁卡因","options":{"A":"可用于心律失常","B":"作用最弱","C":"毒性最大","D":"无血管扩张作用","E":"可升高血压"},"answer":["B"],"answerStr":"B","rationale":"在所列常用局麻药中，普鲁卡因的局麻作用最弱。","expl":{"A":"利多卡因可用于心律失常，普鲁卡因不用于心律失常。","B":"正确，普鲁卡因局麻作用最弱。","C":"丁卡因毒性最大，非普鲁卡因。","D":"普鲁卡因有轻度血管扩张作用。","E":"普鲁卡因不升高血压。"}},{"id":"ch11_q13","chapter":"第十四章 局部麻醉药","chapterIdx":10,"type":"B","num":13,"stem":"丁卡因","options":{"A":"可用于心律失常","B":"作用最弱","C":"毒性最大","D":"无血管扩张作用","E":"可升高血压"},"answer":["C"],"answerStr":"C","rationale":"丁卡因是常用局麻药中毒性最大者。","expl":{"A":"丁卡因不用于心律失常。","B":"丁卡因作用强，非最弱。","C":"正确，丁卡因毒性最大。","D":"丁卡因有血管扩张作用。","E":"丁卡因不升高血压。"}},{"id":"ch11_q14","chapter":"第十四章 局部麻醉药","chapterIdx":10,"type":"B","num":14,"stem":"利多卡因","options":{"A":"可用于心律失常","B":"作用最弱","C":"毒性最大","D":"无血管扩张作用","E":"可升高血压"},"answer":["A"],"answerStr":"A","rationale":"利多卡因有抗心律失常作用，可用于室性心律失常。","expl":{"A":"正确，利多卡因可用于心律失常。","B":"利多卡因作用较强，非最弱。","C":"利多卡因毒性较小，非最大。","D":"利多卡因有血管扩张作用。","E":"利多卡因不升高血压。"}},{"id":"ch11_q15","chapter":"第十四章 局部麻醉药","chapterIdx":10,"type":"C","num":15,"stem":"利多卡因","options":{"A":"浸润麻醉","B":"传导麻醉","C":"两者均可","D":"两者均否"},"answer":["B"],"answerStr":"B","rationale":"利多卡因穿透力强、作用快，常用于传导麻醉。","expl":{"A":"利多卡因虽可用于浸润麻醉，但本题配对答案为传导麻醉。","B":"正确，利多卡因可用于传导麻醉。","C":"本题利多卡因对应传导麻醉，不选两者均可。","D":"利多卡因可用于传导麻醉，不选两者均否。"}},{"id":"ch11_q16","chapter":"第十四章 局部麻醉药","chapterIdx":10,"type":"C","num":16,"stem":"布比卡因","options":{"A":"浸润麻醉","B":"传导麻醉","C":"两者均可","D":"两者均否"},"answer":["C"],"answerStr":"C","rationale":"布比卡因既可用于浸润麻醉，也可用于传导麻醉。","expl":{"A":"布比卡因可用于浸润麻醉。","B":"布比卡因可用于传导麻醉。","C":"正确，布比卡因两者均可。","D":"布比卡因可用于上述麻醉，故不选。"}},{"id":"ch11_q17","chapter":"第十四章 局部麻醉药","chapterIdx":10,"type":"C","num":17,"stem":"普鲁卡因","options":{"A":"浸润麻醉","B":"传导麻醉","C":"两者均可","D":"两者均否"},"answer":["C"],"answerStr":"C","rationale":"普鲁卡因可用于浸润麻醉和传导麻醉。","expl":{"A":"普鲁卡因可用于浸润麻醉。","B":"普鲁卡因可用于传导麻醉。","C":"正确，普鲁卡因两者均可。","D":"普鲁卡因两者均可用，故不选。"}},{"id":"ch11_q18","chapter":"第十四章 局部麻醉药","chapterIdx":10,"type":"C","num":18,"stem":"丁卡因","options":{"A":"浸润麻醉","B":"传导麻醉","C":"两者均可","D":"两者均否"},"answer":["D"],"answerStr":"D","rationale":"丁卡因毒性大、穿透力强，主要用于表面麻醉及腰麻，不用于浸润和传导麻醉。","expl":{"A":"丁卡因毒性大，不用于浸润麻醉。","B":"丁卡因不用于传导麻醉。","C":"丁卡因两者均不用，故不选。","D":"正确，丁卡因不用于浸润及传导麻醉。"}},{"id":"ch11_q19","chapter":"第十四章 局部麻醉药","chapterIdx":10,"type":"X","num":19,"stem":"局麻药、吸收过量可以引起的不良反应是","options":{"A":"血压上升","B":"心脏传导减慢","C":"中枢神经系统先兴奋后抑制","D":"心肌收缩性减弱","E":"呼吸麻痹"},"answer":["B","C","D","E"],"answerStr":"BCDE","rationale":"局麻药吸收过量可抑制心血管和中枢，表现为心脏传导减慢、心肌收缩力减弱、中枢先兴奋后抑制及呼吸麻痹；血压为下降而非上升。","expl":{"A":"局麻药过量使血管扩张、抑制心血管，表现为血压下降而非上升。","B":"正确，过量可抑制心脏传导。","C":"正确，中枢神经系统先兴奋后抑制。","D":"正确，过量可减弱心肌收缩性。","E":"正确，过量抑制呼吸中枢可致呼吸麻痹。"}},{"id":"ch11_q20","chapter":"第十四章 局部麻醉药","chapterIdx":10,"type":"X","num":20,"stem":"丁卡因有下列作用特点","options":{"A":"作用及毒性比普鲁卡因强约 10 倍","B":"亲脂性及穿透力强","C":"作用较持久","D":"作用快","E":"毒性小"},"answer":["A","B","C","D"],"answerStr":"ABCD","rationale":"丁卡因亲脂性和穿透力强，作用及毒性约为普鲁卡因的10倍，起效快、作用持久。","expl":{"A":"正确，丁卡因作用及毒性比普鲁卡因强约10倍。","B":"正确，丁卡因亲脂性及穿透力强。","C":"正确，丁卡因作用较持久。","D":"正确，丁卡因起效较快。","E":"错，丁卡因毒性大而非小。"}},{"id":"ch11_q21","chapter":"第十四章 局部麻醉药","chapterIdx":10,"type":"X","num":21,"stem":"影响局麻药作用的因素","options":{"A":"神经纤维的粗细","B":"细胞外液的 PH","C":"药物的浓度","D":"血管收缩药物","E":"局麻药的比重及病人的体位"},"answer":["A","B","C","D","E"],"answerStr":"ABCDE","rationale":"神经纤维粗细、细胞外液pH、药物浓度、血管收缩药以及局麻药比重和病人体位均影响局麻药作用。","expl":{"A":"正确，神经纤维粗细影响局麻药作用。","B":"正确，细胞外液pH影响局麻药解离与穿透。","C":"正确，药物浓度影响局麻作用。","D":"正确，血管收缩药影响吸收与作用时间。","E":"正确，局麻药比重及病人体位影响药液扩散与阻滞平面。"}}]},{"title":"第十五章 镇静催眠药","questions":[{"id":"ch12_q01","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":1,"stem":"地西泮的作用机制是","options":{"A":"不通过受体，直接抑制中枢","B":"作用于苯二氮卓受体，增加 GABA 与 GABA 受体的亲和力","C":"作用于 GABA 受体，增加体内抑制性递质的作用","D":"诱导生成一种新蛋白质而起作用","E":"以上都不是"},"answer":["C"],"answerStr":"C","rationale":"地西泮与苯二氮卓受体结合，增强中枢抑制性递质GABA的抑制作用，从而产生中枢抑制效应。","expl":{"A":"错，地西泮需经受体介导，并非直接抑制中枢。","B":"不选，地西泮直接结合的是苯二氮卓受体，增强GABA效应为核心机制。","C":"正确，地西泮通过增强抑制性递质GABA的作用发挥中枢抑制。","D":"错，诱导新蛋白质合成是糖皮质激素等的作用方式。","E":"错，C项符合地西泮作用机制。"}},{"id":"ch12_q02","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":2,"stem":"地西泮抗焦虑作用的主要部位是","options":{"A":"中脑网状结构","B":"下丘脑","C":"边缘系统","D":"大脑皮层","E":"纹状体"},"answer":["C"],"answerStr":"C","rationale":"苯二氮卓受体在边缘系统（海马、杏仁核）分布密集，地西泮抗焦虑作用的主要部位为边缘系统。","expl":{"A":"错，中脑网状结构主要与睡眠觉醒有关。","B":"错，下丘脑不是地西泮抗焦虑的主要部位。","C":"正确，边缘系统是地西泮抗焦虑作用的主要部位。","D":"错，大脑皮层非其抗焦虑主要作用部位。","E":"错，纹状体主要与锥体外系功能有关。"}},{"id":"ch12_q03","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":3,"stem":"苯巴比妥钠连续应用产生耐受性的主要原因是","options":{"A":"再分布于脂肪组织","B":"排泄加快","C":"被假性胆碱酯酶破坏","D":"被单胺氧化酶破坏","E":"诱导肝药酶使自身代谢加快"},"answer":["E"],"answerStr":"E","rationale":"苯巴比妥为肝药酶诱导剂，长期应用诱导肝药酶加速自身代谢，是产生耐受性的主要原因。","expl":{"A":"错，再分布于脂肪组织是硫喷妥钠作用短暂的原因。","B":"错，排泄加快并非耐受的主要原因。","C":"错，假性胆碱酯酶破坏的是琥珀胆碱。","D":"错，单胺氧化酶代谢的是儿茶酚胺类递质。","E":"正确，诱导肝药酶加速自身代谢导致耐受。"}},{"id":"ch12_q04","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":4,"stem":"下列药物中 t1/2 最长的是","options":{"A":"地西泮","B":"氯氮卓","C":"氟西泮","D":"奥可西泮","E":"三唑仑"},"answer":["C"],"answerStr":"C","rationale":"氟西泮及其活性代谢物半衰期长，总作用持续时间在所列药物中最长。","expl":{"A":"错，地西泮半衰期约20~80小时，较氟西泮短。","B":"错，氯氮卓为长效类但作用时间不及氟西泮。","C":"正确，氟西泮代谢物半衰期长，作用时间最长。","D":"错，奥沙西泮为短效苯二氮卓类。","E":"错，三唑仑为短效催眠药。"}},{"id":"ch12_q05","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":5,"stem":"有关地西泮的叙述，错误的为","options":{"A":"口服的肌注吸收迅速","B":"口服治疗量对呼吸及循环影响小","C":"能治疗癫痫持续状态","D":"较大量可引起全身麻醉","E":"其代谢产物也有作用"},"answer":["D"],"answerStr":"D","rationale":"地西泮无全身麻醉作用，即使较大剂量也不能引起全身麻醉，故D为错误叙述。","expl":{"A":"不选，地西泮口服吸收快而完全。","B":"不选，治疗量对呼吸循环影响小，较安全。","C":"不选，地西泮是癫痫持续状态的首选药之一。","D":"正确，地西泮无全身麻醉作用。","E":"不选，其代谢产物去甲地西泮等仍有活性。"}},{"id":"ch12_q06","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":6,"stem":"治疗新生儿黄疸并发惊厥宜选用","options":{"A":"水合氯醛","B":"异戊巴比妥","C":"地西泮","D":"苯巴比妥","E":"甲丙氨酶"},"answer":["D"],"answerStr":"D","rationale":"苯巴比妥能诱导肝药酶和葡萄糖醛酸转移酶，促进胆红素代谢，同时可抗惊厥，故首选。","expl":{"A":"错，水合氯醛对新生儿黄疸无利胆作用。","B":"错，异戊巴比妥不用于新生儿黄疸惊厥。","C":"错，地西泮可与胆红素竞争白蛋白，不宜选用。","D":"正确，苯巴比妥促进胆红素排泄且能抗惊厥。","E":"错，甲丙氨酯无此适应症。"}},{"id":"ch12_q07","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":7,"stem":"巴比妥类禁用于下列哪种病人","options":{"A":"高血压患者精神紧张","B":"甲亢病人兴奋失眠","C":"肺功能不全病人烦躁不安","D":"手术前病人恐惧心理","E":"神经官能症性失眠"},"answer":["C"],"answerStr":"C","rationale":"巴比妥类抑制呼吸中枢，肺功能不全者呼吸储备差，易诱发或加重呼吸抑制，故禁用。","expl":{"A":"错，精神紧张可用小剂量镇静。","B":"错，甲亢失眠可慎用镇静催眠药。","C":"正确，肺功能不全者禁用巴比妥类。","D":"错，手术前可用作麻醉前给药。","E":"错，神经官能症失眠可用巴比妥类。"}},{"id":"ch12_q08","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":8,"stem":"地西泮不用于","options":{"A":"焦虑症和焦虑性失眠","B":"麻醉前给药","C":"高热惊厥","D":"癫痫持续状态","E":"诱导麻醉"},"answer":["E"],"answerStr":"E","rationale":"地西泮无麻醉作用，不能用于诱导麻醉，诱导麻醉多选用硫喷妥钠。","expl":{"A":"错，地西泮可用于焦虑症及焦虑性失眠。","B":"错，地西泮可用作麻醉前给药。","C":"错，地西泮可用于高热惊厥。","D":"错，地西泮是癫痫持续状态首选药。","E":"正确，地西泮无麻醉作用，不用于诱导麻醉。"}},{"id":"ch12_q09","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":9,"stem":"苯二氮卓类中毒的特异解毒药是","options":{"A":"尼可刹米","B":"纳络酮","C":"氟马西尼","D":"钙剂","E":"美解眠"},"answer":["C"],"answerStr":"C","rationale":"氟马西尼是苯二氮卓受体的特异性拮抗剂，可竞争性拮抗苯二氮卓类的中毒效应。","expl":{"A":"错，尼可刹米为呼吸中枢兴奋药。","B":"错，纳洛酮是阿片受体拮抗剂。","C":"正确，氟马西尼为苯二氮卓类中毒的特效解毒药。","D":"错，钙剂与苯二氮卓中毒无关。","E":"错，美解眠主要用于巴比妥类中毒。"}},{"id":"ch12_q10","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":10,"stem":"苯巴比妥过量中毒，为了促使其快速排泄","options":{"A":"碱化尿液，使解离度增大，增加肾小管再吸收","B":"碱化尿液，使解离度减小，增加肾小管再吸收","C":"碱化尿液，使解离度增大，减少肾小管再吸收","D":"酸化尿液，使解离度增大，减少肾小管再吸收","E":"以上均不对"},"answer":["C"],"answerStr":"C","rationale":"苯巴比妥为弱酸性药物，碱化尿液使其解离度增大，肾小管重吸收减少，排泄加快。","expl":{"A":"错，碱化尿液是减少而非增加肾小管重吸收。","B":"错，碱化尿液使解离度增大而非减小。","C":"正确，碱化尿液增大解离度、减少重吸收促排泄。","D":"错，应碱化而非酸化尿液。","E":"错，C项正确。"}},{"id":"ch12_q11","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":11,"stem":"下列巴比妥类药物中，起效最快、维持最短的经物是","options":{"A":"苯巴比妥","B":"司可巴比妥","C":"硫喷妥","D":"巴比妥","E":"戊巴比妥"},"answer":["C"],"answerStr":"C","rationale":"硫喷妥脂溶性高，静脉注射后迅速入脑起效，随后快速再分布使作用短暂。","expl":{"A":"错，苯巴比妥为长效类。","B":"错，司可巴比妥为短效类。","C":"正确，硫喷妥起效最快、维持最短。","D":"错，巴比妥为长效类。","E":"错，戊巴比妥为中短效类。"}},{"id":"ch12_q12","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":12,"stem":"镇静催眠药中有抗癫痫作用的药物是","options":{"A":"苯巴比妥","B":"司可巴比妥","C":"巴比妥","D":"硫喷妥","E":"以是都不是"},"answer":["A"],"answerStr":"A","rationale":"苯巴比妥具有抗癫痫作用，可用于癫痫大发作和癫痫持续状态。","expl":{"A":"正确，苯巴比妥有抗癫痫作用。","B":"错，司可巴比妥无抗癫痫用途。","C":"错，巴比妥无抗癫痫用途。","D":"错，硫喷妥用于静脉麻醉。","E":"错，A项正确。"}},{"id":"ch12_q13","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":13,"stem":"对各型癫痫均有一定作用的苯二氮卓类药物是","options":{"A":"地西泮","B":"氯氮卓","C":"三唑仑","D":"氯硝西泮","E":"奥沙西泮"},"answer":["D"],"answerStr":"D","rationale":"氯硝西泮抗癫痫谱广，对各型癫痫均有较好疗效，是苯二氮卓类中抗癫痫作用突出者。","expl":{"A":"错，地西泮主要用于癫痫持续状态。","B":"错，氯氮卓少用于抗癫痫。","C":"错，三唑仑为催眠药，无抗癫痫用途。","D":"正确，氯硝西泮对各型癫痫均有一定作用。","E":"错，奥沙西泮无突出抗癫痫作用。"}},{"id":"ch12_q14","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":14,"stem":"苯二氮卓类受体的分布与何种中枢性抑制递质的分布一致？","options":{"A":"多巴胺","B":"脑啡肽","C":"咪唑啉","D":"i－氨基丁酸","E":"以上都不是"},"answer":["D"],"answerStr":"D","rationale":"苯二氮卓受体与GABAA受体相伴存在，其分布与抑制性递质γ-氨基丁酸（GABA）分布一致。","expl":{"A":"错，多巴胺与苯二氮卓受体分布不一致。","B":"错，脑啡肽属内阿片肽。","C":"错，咪唑啉受体与可乐定作用有关。","D":"正确，与γ-氨基丁酸（GABA）分布一致。","E":"错，D项正确。"}},{"id":"ch12_q15","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":15,"stem":"引起病人对巴比妥类药物成瘾的主要原因是","options":{"A":"使病人产生欣快感","B":"能诱导肝药酶","C":"抑制肝药酶","D":"停药后快动眼睡眠时间延长，梦魇增多","E":"以是都不是"},"answer":["D"],"answerStr":"D","rationale":"巴比妥类缩短快动眼睡眠，停药后快动眼睡眠反跳性延长、梦魇增多，促使病人继续用药而成瘾。","expl":{"A":"错，欣快感不是巴比妥类成瘾的主要原因。","B":"错，诱导肝药酶是产生耐受性的机制。","C":"错，巴比妥类为诱导而非抑制肝药酶。","D":"正确，停药后REM反跳、梦魇增多促进成瘾。","E":"错，D项正确。"}},{"id":"ch12_q16","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":16,"stem":"地西泮的药理作用不包括","options":{"A":"抗焦虑","B":"镇静催眠","C":"抗惊厥","D":"肌肉松弛","E":"抗晕动"},"answer":["E"],"answerStr":"E","rationale":"地西泮无抗晕动作用，抗晕动药主要为东莨菪碱、苯海拉明等。","expl":{"A":"错，地西泮有镇静催眠作用。","B":"错，地西泮有抗焦虑作用。","C":"错，地西泮有抗惊厥作用。","D":"错，地西泮有中枢性肌肉松弛作用。","E":"正确，地西泮无抗晕动作用。"}},{"id":"ch12_q17","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":17,"stem":"苯二氮卓类无下列哪种不良反应？","options":{"A":"头昏","B":"嗜睡","C":"乏力","D":"共济失调","E":"口干"},"answer":["E"],"answerStr":"E","rationale":"口干为抗胆碱药（阿托品类）的不良反应，苯二氮卓类无此不良反应。","expl":{"A":"错，头昏是苯二氮卓类常见不良反应。","B":"错，嗜睡是苯二氮卓类常见不良反应。","C":"错，乏力是苯二氮卓类常见不良反应。","D":"错，共济失调是苯二氮卓类不良反应。","E":"正确，口干非苯二氮卓类不良反应。"}},{"id":"ch12_q18","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":18,"stem":"地西泮的药理作用不包括","options":{"A":"镇静催眠","B":"抗焦虑","C":"抗震颤麻痹","D":"抗惊厥","E":"抗癫痫"},"answer":["C"],"answerStr":"C","rationale":"抗震颤麻痹是左旋多巴、苯海索等抗帕金森药的作用，地西泮无此作用。","expl":{"A":"错，地西泮有镇静催眠作用。","B":"错，地西泮有抗焦虑作用。","C":"正确，地西泮无抗震颤麻痹作用。","D":"错，地西泮有抗惊厥作用。","E":"错，地西泮有抗癫痫作用。"}},{"id":"ch12_q19","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":19,"stem":"下列哪和种情况不宜用巴比妥类催眠药？","options":{"A":"焦虑性失眠","B":"麻醉前给药","C":"高热惊厥","D":"肺心病引起的失眠","E":"癫痫"},"answer":["D"],"answerStr":"D","rationale":"肺心病患者呼吸功能不全，巴比妥类抑制呼吸中枢，故不宜用于其失眠。","expl":{"A":"错，焦虑性失眠可用巴比妥类。","B":"错，巴比妥类可作麻醉前给药。","C":"错，巴比妥类可用于高热惊厥。","D":"正确，肺心病失眠禁用巴比妥类。","E":"错，苯巴比妥可用于癫痫。"}},{"id":"ch12_q20","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":20,"stem":"下列哪种药物不属于巴比妥类？","options":{"A":"司可巴比妥","B":"鲁米那","C":"格鲁米特","D":"硫喷妥","E":"戊巴比妥"},"answer":["C"],"answerStr":"C","rationale":"格鲁米特（导眠能）属哌啶二酮类，不属于巴比妥类。","expl":{"A":"错，司可巴比妥为巴比妥类。","B":"错，鲁米那即苯巴比妥，属巴比妥类。","C":"正确，格鲁米特不属于巴比妥类。","D":"错，硫喷妥为巴比妥类。","E":"错，戊巴比妥为巴比妥类。"}},{"id":"ch12_q21","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":21,"stem":"巴比妥类产生镇静催眠作用的机理是","options":{"A":"抑制中脑及网状结构中的多突触通路","B":"抑制大脑边缘系统的海马和杏仁核","C":"抑制脑干网状结构上行激活系统","D":"抑制脑室－导水管周围灰质","E":"以上均不是"},"answer":["C"],"answerStr":"C","rationale":"巴比妥类主要抑制脑干网状结构上行激活系统，使大脑皮层由兴奋转入抑制而催眠。","expl":{"A":"错，抑制多突触通路与肌松有关。","B":"错，抑制边缘系统是苯二氮卓类抗焦虑部位。","C":"正确，抑制脑干网状结构上行激活系统。","D":"错，导水管周围灰质与镇痛有关。","E":"错，C项正确。"}},{"id":"ch12_q22","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":22,"stem":"关于 g－氨基丁酸（GABA）的描述，哪一种是错误的？","options":{"A":"GABA 是中枢神经系统的抑制性递质","B":"当脑内 GABA 水平降低时可引起惊厥发作","C":"地西泮的中枢性肌肉松弛作用与增强脊髓中 GABA 作用有关","D":"癫痫患者大脑皮质 GABA 含量减少，苯巴比妥的抗癫痫作用与其增加脑内GABA 含量有关","E":"丙戊酸钠是一种抑制 GABA 生物合成的药物"},"answer":["E"],"answerStr":"E","rationale":"丙戊酸钠抑制GABA转氨酶、减少GABA降解而升高脑内GABA含量，并非抑制其合成。","expl":{"A":"不选，GABA是中枢抑制性递质。","B":"不选，脑内GABA降低可致惊厥。","C":"不选，地西泮中枢肌松与增强脊髓GABA作用有关。","D":"不选，苯巴比妥可增加脑内GABA含量。","E":"正确，丙戊酸钠抑制GABA降解而非合成。"}},{"id":"ch12_q23","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":23,"stem":"没有成瘾作用的镇静催眠药是","options":{"A":"苯巴比妥","B":"水合氯醛","C":"甲丙氨酯","D":"地西泮","E":"以上都不是"},"answer":["E"],"answerStr":"E","rationale":"所列各类镇静催眠药长期应用均可产生耐受性和依赖性，均有成瘾作用。","expl":{"A":"错，苯巴比妥长期使用可成瘾。","B":"错，水合氯醛长期使用可成瘾。","C":"错，甲丙氨酯长期使用可成瘾。","D":"错，地西泮可产生依赖性。","E":"正确，以上药物均有成瘾作用。"}},{"id":"ch12_q24","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":24,"stem":"地西泮的抗焦虑作用主要是由于","options":{"A":"增强中枢神经递质 g－氨基丁酸的作用","B":"抑制脊髓多突触的反射作用","C":"抑制网状结构上行激活系统","D":"抑制大脑－丘脑异常电活动扩散","E":"阻断中脑－边缘系统的多巴胺通路"},"answer":["A"],"answerStr":"A","rationale":"地西泮抗焦虑作用主要与增强中枢抑制性递质GABA的作用有关。","expl":{"A":"正确，增强GABA的作用是其抗焦虑基础。","B":"错，抑制脊髓多突触反射是其中枢肌松机制。","C":"错，抑制网状结构上行激活系统是巴比妥类催眠机制。","D":"错，抑制异常电活动扩散与抗癫痫有关。","E":"错，阻断中脑-边缘多巴胺通路是抗精神病药机制。"}},{"id":"ch12_q25","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"A","num":25,"stem":"对快波睡眠时间影响小，成瘾性较轻的催眠药是","options":{"A":"苯巴比妥","B":"地西泮","C":"戊巴比妥","D":"苯妥英钠","E":"氯丙嗪"},"answer":["B"],"answerStr":"B","rationale":"苯二氮卓类对快波睡眠影响较小、成瘾性较轻，地西泮属于此类。","expl":{"A":"错，苯巴比妥明显缩短快波睡眠。","B":"正确，地西泮对快波睡眠影响小、成瘾轻。","C":"错，戊巴比妥属巴比妥类，缩短REM。","D":"错，苯妥英钠为抗癫痫药。","E":"错，氯丙嗪为抗精神病药。"}},{"id":"ch12_q26","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"B","num":26,"stem":"癫痫持续状态的首选药物","options":{"A":"地西泮","B":"硫喷妥钠","C":"水合氯醛","D":"吗啡","E":"硫酸镁"},"answer":["A"],"answerStr":"A","rationale":"地西泮静脉注射起效快、安全，是癫痫持续状态的首选药物。","expl":{"A":"正确，地西泮为癫痫持续状态首选。","B":"错，硫喷妥钠用于静脉麻醉。","C":"错，水合氯醛非首选。","D":"错，吗啡可抑制呼吸，不宜用于癫痫。","E":"错，硫酸镁用于子痫。"}},{"id":"ch12_q27","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"B","num":27,"stem":"作静脉麻醉的首选药","options":{"A":"地西泮","B":"硫喷妥钠","C":"水合氯醛","D":"吗啡","E":"硫酸镁"},"answer":["B"],"answerStr":"B","rationale":"硫喷妥钠起效快、作用短，是临床常用的静脉麻醉药。","expl":{"A":"错，地西泮无麻醉作用。","B":"正确，硫喷妥钠为静脉麻醉首选药。","C":"错，水合氯醛为催眠药。","D":"错，吗啡为镇痛药。","E":"错，硫酸镁为抗惊厥药。"}},{"id":"ch12_q28","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"B","num":28,"stem":"心源性哮喘的首选药","options":{"A":"地西泮","B":"硫喷妥钠","C":"水合氯醛","D":"吗啡","E":"硫酸镁"},"answer":["D"],"answerStr":"D","rationale":"吗啡可扩张外周血管、减轻心脏前后负荷并缓解呼吸困难，是心源性哮喘的首选药。","expl":{"A":"错，地西泮不是心源性哮喘首选。","B":"错，硫喷妥钠为麻醉药。","C":"错，水合氯醛为催眠药。","D":"正确，吗啡是心源性哮喘首选药。","E":"错，硫酸镁用于子痫。"}},{"id":"ch12_q29","chapter":"第十五章 镇静催眠药","chapterIdx":11,"type":"B","num":29,"stem":"治疗子痫的首选药物","options":{"A":"地西泮","B":"硫喷妥钠","C":"水合氯醛","D":"吗啡","E":"硫酸镁"},"answ
