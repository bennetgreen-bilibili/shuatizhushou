// ---- 进度存储 (localStorage) ----
var PROG_KEY = 'pharm_progress_v2';
var OLD_WRONG_KEY = 'pharm_wrong_qids_v1';
function defaultProgress(){ return { wrong: [], stats: {} }; }
function getProgress(){
  var p = null;
  try { p = JSON.parse(localStorage.getItem(PROG_KEY)); } catch(e){ p = null; }
  if(!p || typeof p !== 'object' || !Array.isArray(p.wrong) || !p.stats || typeof p.stats !== 'object'){
    // migrate from old wrong-list key
    var old = [];
    try { old = JSON.parse(localStorage.getItem(OLD_WRONG_KEY)); } catch(e){ old = []; }
    p = { wrong: (Array.isArray(old) ? old : []), stats: {} };
    saveProgress(p);
  }
  return p;
}
function saveProgress(p){ try { localStorage.setItem(PROG_KEY, JSON.stringify(p)); } catch(e){} }
function getWrong(){ return getProgress().wrong; }
function isWrong(id){ return getProgress().wrong.indexOf(id) >= 0; }
function addWrong(id){
  var p = getProgress();
  if(p.wrong.indexOf(id) < 0){ p.wrong.push(id); saveProgress(p); }
  updateProgressUI();
}
function removeWrong(id){
  var p = getProgress();
  p.wrong = p.wrong.filter(function(x){ return x !== id; });
  saveProgress(p);
  updateProgressUI();
}
function clearWrong(){
  var p = getProgress(); p.wrong = []; saveProgress(p);
  updateProgressUI(); buildList();
}
function recordAnswer(id, ok){
  var p = getProgress();
  var st = p.stats[id] || { c: 0, w: 0 };
  if(ok){ st.c++; } else { st.w++; }
  p.stats[id] = st;
  saveProgress(p);
}
function getStat(id){ return getProgress().stats[id]; }
function updateProgressUI(){
  var p = getProgress();
  document.getElementById('wrongCount').textContent = p.wrong.length;
  document.getElementById('answeredCount').textContent = Object.keys(p.stats).length;
  document.getElementById('wrongPill').style.display = p.wrong.length > 0 ? '' : 'none';
}

// ---- 导出 / 导入进度 ----
function exportProgress(){
  var p = getProgress();
  var payload = { app: "药理学选择题训练", version: 2, totalQuestions: allQuestions.length, wrong: p.wrong, stats: p.stats, exportedAt: new Date().toISOString() };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  var d = new Date();
  a.download = '药理学进度_' + d.getFullYear() + ('0'+(d.getMonth()+1)).slice(-2) + ('0'+d.getDate()).slice(-2) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 500);
}
function importProgress(file){
  var reader = new FileReader();
  reader.onload = function(e){
    try {
      var data = JSON.parse(e.target.result);
      if(!data || typeof data !== 'object') throw new Error('bad');
      var wrong = Array.isArray(data.wrong) ? data.wrong : [];
      var stats = (data.stats && typeof data.stats === 'object') ? data.stats : {};
      // sanitize: keep only known question ids
      wrong = wrong.filter(function(id){ return !!byIdMap[id]; });
      var cleanStats = {};
      for(var id in stats){ if(byIdMap[id]) cleanStats[id] = stats[id]; }
      saveProgress({ wrong: wrong, stats: cleanStats });
      updateProgressUI();
      buildList();
      alert('导入成功：错题 ' + wrong.length + ' 道，已答 ' + Object.keys(cleanStats).length + ' 道。');
    } catch(err){
      alert('导入失败：文件格式不正确，请选择导出的 .json 进度文件。');
    }
  };
  reader.readAsText(file);
}

var state = {list:[], idx:0, answered:false, selected:{}, correctCount:0, answeredCount:0};

function isMulti(q){ return (q.type === 'X') || (q.answer && q.answer.length > 1); }

function buildSelect(){
  var sel = document.getElementById('chapSelect');
  sel.innerHTML = '<option value="all">全部章节（'+allQuestions.length+' 题）</option>';
  chapters.forEach(function(ch, i){
    var o = document.createElement('option');
    o.value = i;
    o.textContent = ch.title + '（'+ch.questions.length+' 题）';
    sel.appendChild(o);
  });
}
function buildList(){
  var chap = document.getElementById('chapSelect').value;
  var type = document.getElementById('typeSelect').value;
  var prog = document.getElementById('progSelect').value;
  var p = getProgress();
  var qs = allQuestions.slice();
  if(chap !== 'all'){ var ci = parseInt(chap,10); qs = qs.filter(function(x){ return x.chapter === chapters[ci].title; }); }
  if(type === 'single'){ qs = qs.filter(function(x){ return !isMulti(x.q); }); }
  else if(type === 'multi'){ qs = qs.filter(function(x){ return isMulti(x.q); }); }
  if(prog === 'unanswered'){ qs = qs.filter(function(x){ return !p.stats[x.q.id]; }); }
  else if(prog === 'answered'){ qs = qs.filter(function(x){ return !!p.stats[x.q.id]; }); }
  if(document.getElementById('wrongChk').checked){
    qs = qs.filter(function(x){ return p.wrong.indexOf(x.q.id) >= 0; });
  }
  if(document.getElementById('shuffleChk').checked){
    qs = qs.slice();
    for(var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  }
  state.list = qs;
  state.idx = 0; state.correctCount = 0; state.answeredCount = 0;
  document.getElementById('summaryCard').classList.remove('show');
  document.getElementById('questionCard').style.display = '';
  render();
}
function render(){
  var card = document.getElementById('questionCard');
  var sum = document.getElementById('summaryCard');
  if(state.list.length === 0){
    card.style.display = '';
    sum.classList.remove('show');
    document.getElementById('progressBar').style.width = '0%';
    var msg;
    if(document.getElementById('wrongChk').checked){ msg = '<div class="empty"><div class="big">📒</div>错题本还是空的。<br>先去做题，答错的题目会自动收进错题本。</div>'; }
    else if(document.getElementById('progSelect').value === 'unanswered'){ msg = '<div class="empty"><div class="big">🎉</div>当前筛选下没有未做的题了。<br>换「全部进度」可以再刷一遍。</div>'; }
    else { msg = '<div class="empty"><div class="big">📭</div>当前筛选条件下没有题目。</div>'; }
    card.innerHTML = msg;
    return;
  }
  if(state.idx >= state.list.length){
    showSummary(); return;
  }
  var item = state.list[state.idx];
  var q = item.q;
  state.answered = false;
  state.selected = {};
  var wrong = isWrong(q.id);
  var st = getStat(q.id);
  var statusBadge;
  if(wrong){ statusBadge = '<span class="badge wrong-tag">📒 错题</span>'; }
  else if(st){ statusBadge = '<span class="badge ok-tag">✅ 已答对</span>'; }
  else { statusBadge = '<span class="badge new-tag">🆕 未做</span>'; }
  document.getElementById('qMeta').innerHTML =
    '<span class="badge '+q.type+'">'+q.type+' 型</span>'+
    (q.type==='X'?'<span class="badge X">多选</span>':'<span class="badge">单选</span>')+
    statusBadge +
    '<span>'+(state.idx+1)+' / '+state.list.length+' 题</span>';
  document.getElementById('qScore').textContent = '本章：'+item.chapter;
  document.getElementById('stem').textContent = (q.num?(''+q.num+'. '):'') + q.stem;
  var multi = isMulti(q);
  document.getElementById('multiHint').style.display = multi?'':'none';
  var optsEl = document.getElementById('options');
  optsEl.innerHTML = '';
  var letters = Object.keys(q.options);
  letters.forEach(function(L){
    var d = document.createElement('div');
    d.className = 'opt';
    d.setAttribute('data-l', L);
    d.innerHTML = '<div class="k">'+L+'</div><div class="t">'+esc(q.options[L])+'</div>';
    d.onclick = function(){ if(state.answered) return; toggle(L, multi); };
    optsEl.appendChild(d);
  });
  document.getElementById('submitBtn').style.display = '';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('explain').classList.remove('show');
  document.getElementById('wrongNote').classList.remove('show');
  document.getElementById('progressBar').style.width = Math.round(state.idx/state.list.length*100)+'%';
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toggle(L, multi){
  if(multi){ state.selected[L] = !state.selected[L]; }
  else { state.selected = {}; state.selected[L] = true; }
  var opts = document.querySelectorAll('#options .opt');
  opts.forEach(function(o){
    var l = o.getAttribute('data-l');
    o.classList.toggle('selected', !!state.selected[l]);
  });
}
function submit(){
  if(state.answered) return;
  var item = state.list[state.idx];
  var q = item.q;
  var chosen = Object.keys(state.selected).filter(function(L){ return state.selected[L]; }).sort();
  var ans = q.answer.slice().sort();
  var ok = chosen.join('') === ans.join('');
  state.answered = true;
  state.answeredCount++;
  if(ok) state.correctCount++;

  // 记录进度（已答 + 对错）
  recordAnswer(q.id, ok);
  var wasWrong = isWrong(q.id);
  if(ok){
    if(wasWrong && document.getElementById('autoRemoveChk').checked){
      removeWrong(q.id);
      document.getElementById('wrongNote').textContent = '✔ 已答对，已从错题本移除。';
      document.getElementById('wrongNote').classList.add('show');
    }
  } else {
    addWrong(q.id);
    document.getElementById('wrongNote').textContent = '✘ 已加入错题本，可勾选「只看错题」集中复习。';
    document.getElementById('wrongNote').classList.add('show');
  }
  updateProgressUI();

  var opts = document.querySelectorAll('#options .opt');
  opts.forEach(function(o){
    o.classList.add('disabled');
    var l = o.getAttribute('data-l');
    if(ans.indexOf(l)>=0){ o.classList.add('correct'); }
    else if(state.selected[l]){ o.classList.add('wrong'); }
  });
  var v = document.getElementById('verdict');
  v.textContent = ok ? '✔ 回答正确' : '✘ 回答错误';
  v.className = 'verdict ' + (ok?'ok':'no');
  document.getElementById('rationale').textContent = q.rationale || '';
  var el = document.getElementById('expList');
  el.innerHTML = '';
  Object.keys(q.options).forEach(function(L){
    var txt = (q.expl && q.expl[L]) || '';
    if(!txt) return;
    var row = document.createElement('div');
    row.className = 'exp-item ' + (ans.indexOf(L)>=0?'is-ok':'is-no');
    row.innerHTML = '<div class="ek">'+L+'</div><div>'+esc(txt)+'</div>';
    el.appendChild(row);
  });
  document.getElementById('explain').classList.add('show');
  document.getElementById('submitBtn').style.display = 'none';
  var nb = document.getElementById('nextBtn');
  nb.style.display = '';
  nb.textContent = (state.idx >= state.list.length-1) ? '查看总结 →' : '下一题 →';
}
function next(){
  if(!state.answered) return;
  state.idx++;
  render();
}
function showSummary(){
  document.getElementById('questionCard').style.display='none';
  var sum = document.getElementById('summaryCard');
  sum.classList.add('show');
  document.getElementById('sTotal').textContent = state.list.length;
  document.getElementById('sCorrect').textContent = state.correctCount;
  document.getElementById('sWrong').textContent = state.answeredCount - state.correctCount;
  var rate = state.answeredCount ? Math.round(state.correctCount/state.answeredCount*100) : 0;
  document.getElementById('sRate').textContent = rate+'%';
  document.getElementById('progressBar').style.width = '100%';
}

document.getElementById('chapSelect').onchange = buildList;
document.getElementById('typeSelect').onchange = buildList;
document.getElementById('progSelect').onchange = buildList;
document.getElementById('shuffleChk').onchange = buildList;
document.getElementById('wrongChk').onchange = buildList;
document.getElementById('autoRemoveChk').onchange = function(){};
document.getElementById('clearWrongBtn').onclick = clearWrong;
document.getElementById('restartBtn').onclick = buildList;
document.getElementById('submitBtn').onclick = submit;
document.getElementById('nextBtn').onclick = next;
document.getElementById('againBtn').onclick = buildList;
document.getElementById('exportBtn').onclick = exportProgress;
document.getElementById('importBtn').onclick = function(){ document.getElementById('importFile').click(); };
document.getElementById('importFile').onchange = function(e){ if(e.target.files && e.target.files[0]) importProgress(e.target.files[0]); e.target.value=''; };

updateProgressUI();
buildSelect();
buildList();
})();
</script>
</body>
