<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>药理学选择题训练</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1f2937; --sub:#6b7280;
  --brand:#2563eb; --brand-2:#1d4ed8; --ok:#16a34a; --ok-bg:#ecfdf5;
  --bad:#dc2626; --bad-bg:#fef2f2; --line:#e5e7eb; --accent:#f59e0b;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.top{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;padding:18px 22px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.top h1{margin:0;font-size:20px;font-weight:700}
.top .sub{margin:4px 0 0;font-size:13px;opacity:.95}
.top .sub .pill{background:rgba(255,255,255,.22);padding:1px 9px;border-radius:999px;margin-left:8px;font-weight:600;display:inline-block}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 60px}
.controls{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.controls label{font-size:13px;color:var(--sub);display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.controls select,.controls button{font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.controls button:hover{border-color:var(--brand)}
.btn-primary{background:var(--brand)!important;color:#fff!important;border:none!important;font-weight:600}
.btn-primary:hover{background:var(--brand-2)!important}
.btn-ghost{background:#fff!important}
.btn-danger{color:var(--bad)!important;border-color:#fecaca!important}
.btn-danger:hover{border-color:var(--bad)!important}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#eef2ff;color:var(--brand);font-weight:600;margin-right:6px;vertical-align:2px}
.badge.X{background:#fef3c7;color:#b45309}
.badge.C{background:#fce7f3;color:#be185d}
.badge.B{background:#e0f2fe;color:#0369a1}
.badge.wrong-tag{background:var(--bad-bg);color:var(--bad)}
.badge.ok-tag{background:var(--ok-bg);color:var(--ok)}
.badge.new-tag{background:#f3f4f6;color:#9ca3af}
.progress{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:16px}
.progress>div{height:100%;background:var(--brand);transition:width .2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:16px}
.q-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.q-meta{font-size:13px;color:var(--sub)}
.stem{font-size:17px;font-weight:600;margin-bottom:6px}
.opt{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin:8px 0;cursor:pointer;transition:all .12s;background:#fff}
.opt:hover{border-color:var(--brand);background:#f8faff}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:#eef2ff;color:var(--brand);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt .t{font-size:15px;word-break:break-word}
.opt.selected{border-color:var(--brand);background:#eef4ff;box-shadow:0 0 0 1px var(--brand)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.disabled{cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.actions button{font-size:15px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
.explain{display:none;margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.explain.show{display:block}
.explain .verdict{font-size:16px;font-weight:700;margin-bottom:10px}
.explain .verdict.ok{color:var(--ok)}
.explain .verdict.no{color:var(--bad)}
.explain .rationale{background:#f8fafc;border-left:4px solid var(--brand);padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:14px}
.exp-item{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:14px}
.exp-item:last-child{border-bottom:none}
.exp-item .ek{flex:none;width:22px;height:22px;border-radius:6px;background:#eef2ff;color:var(--brand);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.exp-item.is-ok .ek{background:var(--ok);color:#fff}
.exp-item.is-no .ek{background:var(--bad);color:#fff}
.wrong-note{margin-top:10px;font-size:13px;color:var(--sub);background:#fff7ed;border:1px solid #fed7aa;padding:8px 12px;border-radius:8px;display:none}
.wrong-note.show{display:block}
.summary{display:none}
.summary.show{display:block}
.stat-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.stat{flex:1;min-width:120px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}
.stat .n{font-size:26px;font-weight:800;color:var(--brand)}
.stat .l{font-size:13px;color:var(--sub)}
.empty{padding:40px;text-align:center;color:var(--sub)}
.empty .big{font-size:40px;margin-bottom:8px}
.foot{color:var(--sub);font-size:12px;text-align:center;margin-top:20px}
.hint{font-size:13px;color:var(--sub);margin-top:6px}
@media(max-width:600px){.stem{font-size:16px}.opt .t{font-size:14px}.controls{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<div class="top">
  <h1>药理学选择题训练</h1>
  <div class="sub">大学药理学各章节习题 · 每题附选项讲解<span class="pill">已答 <span id="answeredCount">0</span> 题</span><span class="pill" id="wrongPill" style="display:none">📒 错题 <span id="wrongCount">0</span></span></div>
</div>
<div class="wrap">

  <div class="controls" id="controls">
    <label>章节：
      <select id="chapSelect"></select>
    </label>
    <label>题型：
      <select id="typeSelect">
        <option value="all">全部题型</option>
        <option value="single">单选（A/B/C 型）</option>
        <option value="multi">多选（X 型）</option>
      </select>
    </label>
    <label>进度：
      <select id="progSelect">
        <option value="all">全部进度</option>
        <option value="unanswered">只看未做</option>
        <option value="answered">只看已做</option>
      </select>
    </label>
    <label><input type="checkbox" id="shuffleChk"> 随机</label>
    <label><input type="checkbox" id="wrongChk"> 📒 只看错题</label>
    <label title="在错题本中答对后自动移除该题"><input type="checkbox" id="autoRemoveChk" checked> 答对移出错题本</label>
    <button id="exportBtn" class="btn-ghost">导出进度</button>
    <button id="importBtn" class="btn-ghost">导入进度</button>
    <button id="clearWrongBtn" class="btn-ghost btn-danger">清空错题本</button>
    <button id="restartBtn" class="btn-ghost">重新开始</button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none">
  </div>

  <div class="progress"><div id="progressBar"></div></div>

  <div id="questionCard" class="card">
    <div class="q-head">
      <div class="q-meta" id="qMeta"></div>
      <div class="q-meta" id="qScore"></div>
    </div>
    <div class="stem" id="stem"></div>
    <div id="options"></div>
    <div class="hint" id="multiHint" style="display:none">（多选题：请选择所有正确答案后提交）</div>
    <div class="actions" id="actions">
      <button id="submitBtn" class="btn-primary">提交答案</button>
      <button id="nextBtn" style="display:none">下一题 →</button>
    </div>
    <div class="wrong-note" id="wrongNote"></div>
    <div class="explain" id="explain">
      <div class="verdict" id="verdict"></div>
      <div class="rationale" id="rationale"></div>
      <div id="expList"></div>
    </div>
  </div>

  <div id="summaryCard" class="card summary">
    <h2 style="margin-top:0">练习总结</h2>
    <div class="stat-row">
      <div class="stat"><div class="n" id="sTotal">0</div><div class="l">本轮题数</div></div>
      <div class="stat"><div class="n" id="sCorrect">0</div><div class="l">答对</div></div>
      <div class="stat"><div class="n" id="sWrong">0</div><div class="l">答错</div></div>
      <div class="stat"><div class="n" id="sRate">0%</div><div class="l">正确率</div></div>
    </div>
    <button id="againBtn" class="btn-primary" style="font-size:15px;padding:10px 18px;border-radius:10px;border:none;cursor:pointer">再来一轮</button>
  </div>

  <div class="foot">数据来源：药理学各章节习题（选择题部分）· 由程序自动解析并补充讲解，仅供复习参考<br>进度保存在本机浏览器；用「导出进度」可备份到文件，换设备后用「导入进度」恢复</div>
</div>

<script>
window.QUIZ_DATA = {"chapters":[{"title":"第一章 药理学总论－绪言","questions":[{"id":"ch01_q01","chapter":"第一章 药理学总论－绪言","chapterIdx":0,"type":"A","num":1,"stem":"药效学是研究","options":{"A":"药物的临床疗效","B":"提高药物疗效的途径","C":"如何改善药物质量","D":"机体如何对药物进行处理","E":"在药物影响下机体细胞功能如何发生变化"},"answer":["E"],"answerStr":"E","rationale":"药效学研究药物对机体的作用及其机制，即药物影响下机体细胞功能发生的变化，故为E。","expl":{"A":"临床疗效是药物治疗疾病的效果，属疗效评价，非药效学的研究对象。","B":"提高药物疗效的途径属药物治疗学范畴，不是药效学的定义。","C":"改善药物质量属药物分析或制剂范畴，与药效学无关。","D":"机体如何处理药物是药动学的研究内容，非药效学。","E":"正确，药效学研究药物对机体的作用，即机体细胞功能在药物影响下的变化。"}},{"id":"ch01_q02","chapter":"第一章 药理学总论－绪言","chapterIdx":0,"type":"A","num":2,"stem":"药动学是研究","options":{"A":"机体如何对药物进行处理","B":"药物如何影响机体","C":"药物在体内的时间变化","D":"合理用药的治疗方案","E":"药物效应动力学"},"answer":["A"],"answerStr":"A","rationale":"药动学研究机体对药物的处置过程，即药物在体内的吸收、分布、代谢和排泄，故为A。","expl":{"A":"正确，药动学研究机体对药物的吸收、分布、代谢和排泄等处理过程。","B":"药物如何影响机体是药效学的内容，非药动学。","C":"药物在体内的时间变化只是药动学的一部分，表述不完整。","D":"合理用药的治疗方案属临床药理学与治疗学，非药动学定义。","E":"药物效应动力学即药效学，与药动学是两个不同学科，此选项错误。"}},{"id":"ch01_q03","chapter":"第一章 药理学总论－绪言","chapterIdx":0,"type":"A","num":3,"stem":"新药进行临床试验必须提供","options":{"A":"系统药理研究数据","B":"新药作用谱","C":"临床前研究资料","D":"LD50","E":"急慢性毒理研究数据"},"answer":["C"],"answerStr":"C","rationale":"新药开展临床试验前须完成临床前研究并提供资料，经批准后方可进行，故为C。","expl":{"A":"系统药理研究数据属临床前研究的一部分，不足以代表全部必备资料。","B":"新药作用谱仅是药效学内容之一，不能单独作为临床试验依据。","C":"正确，临床试验须以充分的临床前研究资料（药效、药动、毒理）为依据。","D":"LD50只是急性毒性指标之一，不能单独代表临床前资料。","E":"急慢性毒理研究数据仅属毒理学部分，非临床试验所需的全部资料。"}}]},{"title":"第二章 药物效应动力学","questions":[{"id":"ch02_q01","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":1,"stem":"药物作用的基本表现是是机体器官组织","options":{"A":"功能升高或兴奋","B":"功能降低或抑制","C":"兴奋和/或抑制","D":"产生新的功能","E":"A 和 D"},"answer":["C"],"answerStr":"C","rationale":"药物作用的基本表现是使机体功能兴奋或抑制，或两者兼有，故为C。","expl":{"A":"功能升高或兴奋只是兴奋作用，未包括抑制作用，不全面。","B":"功能降低或抑制仅指抑制作用，遗漏了兴奋作用。","C":"正确，药物对机体的基本作用表现为兴奋和（或）抑制。","D":"药物不能使机体产生新的功能，只能调节原有功能，此说法错误。","E":"A与D均不全面或不正确，故不是答案。"}},{"id":"ch02_q02","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":2,"stem":"药物的副反应是与治疗效应同时发生的不良反应，此时的药物剂量是","options":{"A":"大于治疗量","B":"小于治疗量","C":"治疗剂量","D":"极量","E":"以上都不对"},"answer":["C"],"answerStr":"C","rationale":"副反应是药物在治疗剂量下出现的与治疗目的无关的作用，故为C。","expl":{"A":"大于治疗量属中毒量，引起的是毒性反应而非副反应。","B":"小于治疗量常无效，一般不引起副反应。","C":"正确，副反应发生在治疗剂量，是与治疗效应同时出现的不良反应。","D":"极量是最大治疗量，超出常致毒性反应，副反应概念不限于此。","E":"以上均不对，不符合副反应的定义。"}},{"id":"ch02_q03","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":3,"stem":"半数有效量是指","options":{"A":"临床有效量","B":"LD50","C":"引起 50%阳性反应的剂量","D":"效应强度","E":"以上都不是"},"answer":["C"],"answerStr":"C","rationale":"半数有效量（ED50）指引起50%阳性反应（半数有效）的剂量，故为C。","expl":{"A":"临床有效量是临床用药剂量，并非ED50的严格定义。","B":"LD50是半数致死量，属毒性指标，非有效量。","C":"正确，ED50即引起50%阳性反应（半数有效）的剂量。","D":"效应强度指药物作用强度，与半数有效量含义不同。","E":"以上都不是，因C为正确答案。"}},{"id":"ch02_q04","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":4,"stem":"药物半数致死量（LD50）是指","options":{"A":"致死量的一半","B":"中毒量的一半","C":"杀死半数病原微生物的剂量","D":"杀死半数寄生虫的剂量","E":"引起半数动物死亡的剂量"},"answer":["E"],"answerStr":"E","rationale":"LD50指能使半数实验动物死亡的剂量，用于评价药物急性毒性，故为E。","expl":{"A":"致死量的一半是字面误读，LD50不是简单除以2。","B":"中毒量的一半同样属误读，LD50是统计半数死亡的剂量。","C":"杀死半数病原微生物的剂量属抗菌药物评价概念，非LD50。","D":"杀死半数寄生虫的剂量是杀虫药评价指标，非LD50定义。","E":"正确，LD50是引起半数动物死亡的剂量。"}},{"id":"ch02_q05","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":5,"stem":"药物的极量是指","options":{"A":"一次量","B":"一日量","C":"疗程总量","D":"单位时间内注入量","E":"以上都不对"},"answer":["E"],"answerStr":"E","rationale":"极量是药典规定的最大治疗量（最大有效量），非一次量、一日量等，故以上都不对。","expl":{"A":"极量不是一次量，一次量指单次给药剂量。","B":"极量不是一日量，一日量指每日总剂量。","C":"疗程总量是整个疗程的累计剂量，与极量无关。","D":"单位时间内注入量是给药速度，与极量无关。","E":"正确，极量是最大治疗量，以上各项均不符合其定义。"}},{"id":"ch02_q07","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":7,"stem":"药物的治疗指数是","options":{"A":"ED50/LD50","B":"LD50/ED50","C":"LD5/ED95","D":"ED99/LD1","E":"ED95/LD5"},"answer":["B"],"answerStr":"B","rationale":"治疗指数为LD50与ED50的比值（TI=LD50/ED50），比值越大越安全，故为B。","expl":{"A":"ED50/LD50是治疗指数的倒数，不是治疗指数。","B":"正确，治疗指数TI=LD50/ED50。","C":"LD5/ED95是与安全范围相关的比值，非治疗指数。","D":"ED99/LD1无此标准定义。","E":"ED95/LD5不是治疗指数。"}},{"id":"ch02_q08","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":8,"stem":"药物与受体结合后，可激动受体，也可阻断受体，取决于","options":{"A":"药物是否具有亲和力","B":"药物是否具有内在活性","C":"药物的酸碱度","D":"药物的脂溶性","E":"药物的极性大小"},"answer":["B"],"answerStr":"B","rationale":"药物与受体结合后能否激动受体取决于其是否具有内在活性，故为B。","expl":{"A":"亲和力决定能否结合，但不决定是激动还是阻断。","B":"正确，有内在活性则激动受体，无内在活性则阻断受体。","C":"酸碱度影响药物解离与吸收，与激动或阻断无关。","D":"脂溶性影响药物跨膜，与激动或阻断无关。","E":"极性大小与跨膜有关，不影响内在活性。"}},{"id":"ch02_q09","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":9,"stem":"竞争性拮抗剂的特点是","options":{"A":"无亲和力，无内在活性","B":"有亲和力，无内在活性","C":"有亲和力，有内在活性","D":"无亲和力，有内在活性","E":"以上均不是"},"answer":["B"],"answerStr":"B","rationale":"竞争性拮抗剂有亲和力能与受体结合，但无内在活性，故不产生效应，为B。","expl":{"A":"无亲和力则不能与受体结合，不符合竞争性拮抗剂。","B":"正确，竞争性拮抗剂有亲和力而无内在活性。","C":"有亲和力且有内在活性的是激动药。","D":"无亲和力有内在活性在药理上不成立。","E":"以上均不是，因B正确。"}},{"id":"ch02_q10","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":10,"stem":"药物作用的双重性是指","options":{"A":"治疗作用和副作用","B":"对因治疗和对症治疗","C":"治疗作用和毒性作用","D":"治疗作用和不良反应","E":"局部作用和吸收作用"},"answer":["D"],"answerStr":"D","rationale":"药物作用双重性指药物既有治疗作用，又有不良反应，故为D。","expl":{"A":"治疗作用和副作用只是双重性的一部分，不完整。","B":"对因治疗和对症治疗同属治疗作用，非双重性。","C":"治疗作用和毒性作用未涵盖全部不良反应。","D":"正确，药物作用双重性即治疗作用与不良反应并存。","E":"局部作用和吸收作用属作用部位分类，与双重性无关。"}},{"id":"ch02_q11","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":11,"stem":"属于后遗效应的是","options":{"A":"青霉素过敏性休克","B":"地高辛引起的心律性失常","C":"呋塞米所致的心律失常","D":"保泰松所致的肝肾损害","E":"巴比妥类药催眠后所致的次晨宿醉现象"},"answer":["E"],"answerStr":"E","rationale":"后遗效应指停药后血药浓度已降至阈浓度以下仍残存的药理效应，巴比妥次晨宿醉属之。","expl":{"A":"青霉素过敏性休克属变态反应，非后遗效应。","B":"地高辛引起心律失常属毒性反应。","C":"呋塞米所致心律失常属毒性反应（电解质紊乱）。","D":"保泰松所致肝肾损害属毒性反应或药源性疾病。","E":"正确，巴比妥类催眠后次晨宿醉为典型后遗效应。"}},{"id":"ch02_q12","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":12,"stem":"量效曲线可以为用药提供下列哪种参考？","options":{"A":"药物的安全范围","B":"药物的疗效大小","C":"药物的毒性性质","D":"药物的体内过程","E":"药物的给药方案"},"answer":["E"],"answerStr":"E","rationale":"量效曲线可确定有效剂量与最大效应等，为制定给药方案提供依据，故为E。","expl":{"A":"安全范围需结合量效与毒效曲线，单独量效曲线不足。","B":"疗效大小（效能）只是量效曲线信息之一，非最全面选项。","C":"毒性性质需毒性试验与毒效曲线，非量效曲线所能提供。","D":"体内过程是药动学内容，量效曲线不反映。","E":"正确，量效曲线可指导剂量选择，为制定给药方案提供参考。"}},{"id":"ch02_q13","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":13,"stem":"药物的内在活性（效应力）是指","options":{"A":"药物穿透生物膜的能力","B":"药物对受体的亲合能力","C":"药物水溶性大小","D":"受体激动时的反应强度","E":"药物脂溶性大小"},"answer":["D"],"answerStr":"D","rationale":"内在活性（效应力）指药物激动受体后产生效应的能力，即受体激动时的反应强度，故为D。","expl":{"A":"穿透生物膜能力与脂溶性、跨膜有关，非内在活性。","B":"对受体的亲和能力是亲和力，非内在活性。","C":"水溶性大小影响溶解与吸收，与内在活性无关。","D":"正确，内在活性是药物激动受体引起反应的能力（反应强度）。","E":"脂溶性大小与跨膜有关，非内在活性。"}},{"id":"ch02_q14","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":14,"stem":"安全范围是指","options":{"A":"有效剂量的范围","B":"最小中毒量与治疗量间的距离","C":"最小治疗量至最小致死量间的距离","D":"ED95 与 LD5 间的距离","E":"最小治疗量与最小中毒量间的距离"},"answer":["E"],"answerStr":"E","rationale":"安全范围指最小治疗量与最小中毒量之间的距离，距离越大越安全，故为E。","expl":{"A":"有效剂量范围是有效量区间，非安全范围。","B":"最小中毒量与治疗量间距离表述含糊，非标准定义。","C":"最小治疗量至最小致死量间距过大，非安全范围定义。","D":"ED95与LD5间距是实验安全范围表示（安全系数），非本题标准定义。","E":"正确，安全范围是最小治疗量与最小中毒量之间的距离。"}},{"id":"ch02_q15","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":15,"stem":"副作用是在下述哪种剂量时产生的不良反应？","options":{"A":"中毒量","B":"治疗量","C":"无效量","D":"极量","E":"致死量"},"answer":["B"],"answerStr":"B","rationale":"副作用是治疗量下出现的与治疗目的无关的反应，故为B。","expl":{"A":"中毒量产生的是毒性反应，非副作用。","B":"正确，副作用在治疗剂量下产生。","C":"无效量不产生药理效应，也无副作用。","D":"极量虽在治疗范围内，但副作用概念仍指治疗量。","E":"致死量引起死亡，非副作用。"}},{"id":"ch02_q16","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":16,"stem":"可用于表示药物安全性的参数","options":{"A":"阈剂量","B":"效能","C":"效价强度","D":"治疗指数","E":"LD50"},"answer":["D"],"answerStr":"D","rationale":"治疗指数（LD50/ED50）是评价药物安全性的重要参数，故为D。","expl":{"A":"阈剂量是刚产生效应的剂量，与安全性无直接关系。","B":"效能反映最大效应，不直接表示安全性。","C":"效价强度反映剂量大小关系，非安全性指标。","D":"正确，治疗指数越大，药物越安全。","E":"LD50单独只能说明毒性，需与ED50结合才表示安全性。"}},{"id":"ch02_q17","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":17,"stem":"药原性疾病是","options":{"A":"严重的不良反应","B":"停药反应","C":"变态反应","D":"较难恢复的不良反应","E":"特异质反应"},"answer":["D"],"answerStr":"D","rationale":"药源性疾病是药物引起的较难恢复的机体损害（疾病），故为D。","expl":{"A":"严重不良反应未必都构成药源性疾病，概念不完全等同。","B":"停药反应是突然停药引起的，非药源性疾病。","C":"变态反应只是药源性疾病的一种类型。","D":"正确，药源性疾病指药物引起的较难恢复的损害（疾病）。","E":"特异质反应是遗传异常所致，非药源性疾病总称。"}},{"id":"ch02_q18","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":18,"stem":"药物的最大效能反映药物的","options":{"A":"内在活性","B":"效应强度","C":"亲和力","D":"量效关系","E":"时效关系"},"answer":["A"],"answerStr":"A","rationale":"药物的最大效能（效能）取决于其内在活性，内在活性高则最大效应大，故为A。","expl":{"A":"正确，效能反映药物的内在活性，内在活性越大最大效应越大。","B":"效应强度即效能本身，题目问其反映的本质，应为内在活性。","C":"亲和力影响效价强度，不决定最大效能。","D":"量效关系是描述效应的关系曲线，非效能反映的对象。","E":"时效关系描述效应随时间变化，与最大效能无直接关系。"}},{"id":"ch02_q19","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":19,"stem":"肾上腺素受体属于","options":{"A":"G 蛋白偶联受体","B":"含离子通道的受体","C":"具有酪氨酸激酶活性的受体","D":"细胞内受体","E":"以上均不是"},"answer":["A"],"answerStr":"A","rationale":"肾上腺素受体（α、β受体）属于G蛋白偶联受体（GPCR），故为A。","expl":{"A":"正确，α、β肾上腺素受体均为G蛋白偶联受体。","B":"含离子通道的受体如N胆碱受体（配体门控离子通道），非肾上腺素受体。","C":"具酪氨酸激酶活性的受体如胰岛素受体，非肾上腺素受体。","D":"细胞内受体如甾体激素受体，肾上腺素受体位于细胞膜上。","E":"以上均不是，因A正确。"}},{"id":"ch02_q20","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":20,"stem":"拮抗参数 pA2 的定义是","options":{"A":"使激动剂的效应增加 1 倍时竞争性拮抗剂浓度的负对数","B":"使激动剂的剂量增加 1 倍时竞争性拮抗剂浓度的负对数","C":"使激动剂的效应增加 1 倍时激动剂浓度的负对数","D":"使激动剂的效应不变时竞争性拮抗剂浓度的负对数","E":"使激动剂的效应增加 1 倍时非竞争性拮抗剂浓度的负对数"},"answer":["B"],"answerStr":"B","rationale":"pA2是使激动药剂量加倍仍维持原效应时竞争性拮抗药浓度的负对数，故为B。","expl":{"A":"pA2定义涉及激动药剂量加倍而非效应加倍，A错误。","B":"正确，pA2为使激动药剂量增加1倍而效应不变时拮抗药浓度的负对数。","C":"pA2是拮抗药浓度而非激动药浓度的负对数。","D":"效应不变是前提之一，但定义还要求激动药剂量加倍。","E":"pA2针对竞争性拮抗药，而非非竞争性拮抗药。"}},{"id":"ch02_q21","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":21,"stem":"药理效应是","options":{"A":"药物的初始作用","B":"药物作用的结果","C":"药物的特异性","D":"药物的选择性","E":"药物的临床疗效"},"answer":["B"],"answerStr":"B","rationale":"药理效应是药物作用的结果（机体功能变化的表现），故为B。","expl":{"A":"初始作用是药物作用的起始环节，非效应本身。","B":"正确，药理效应是药物作用引起的机体反应（结果）。","C":"特异性指药物对特定靶点的选择性作用，非效应。","D":"选择性是药物作用的范围特性，非效应。","E":"临床疗效是效应中对治疗有利的部分，非全部药理效应。"}},{"id":"ch02_q22","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":22,"stem":"储备受体是","options":{"A":"药物未结合的受体","B":"药物不结合的受体","C":"与药物结合过的受体","D":"药物难结合的受体","E":"与药物解离了的受体"},"answer":["A"],"answerStr":"A","rationale":"储备受体（spare receptor）指产生最大效应时仍未被药物占据（未结合）的受体，故为A。","expl":{"A":"正确，储备受体是药物未结合（未被占据）的受体。","B":"药物不结合的受体表述绝对，储备受体是可被结合但未结合的受体。","C":"与药物结合过的受体已被占据，非储备受体。","D":"药物难结合的受体概念不准确，储备受体是可结合受体。","E":"与药物解离了的受体已释放，非储备受体的定义。"}},{"id":"ch02_q23","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":23,"stem":"pD2 是","options":{"A":"解离常数的负对数","B":"拮抗常数的负对数","C":"解离常数","D":"拮抗常数","E":"平衡常数"},"answer":["A"],"answerStr":"A","rationale":"pD2是药物-受体复合物解离常数的负对数，反映亲和力，故为A。","expl":{"A":"正确，pD2=-logKD，即解离常数的负对数。","B":"拮抗常数（KB）的负对数为pA2，非pD2。","C":"pD2是负对数，不是解离常数本身。","D":"拮抗常数是KB，与pD2无关。","E":"平衡常数表述笼统，非pD2的准确定义。"}},{"id":"ch02_q24","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":24,"stem":"关于受体二态模型学说的叙述，下列哪项是错误的？","options":{"A":"拮抗药对 R 及 R*的亲和力不等","B":"受体蛋白有可以互变的构型状态。即静息态（R）和活动态（R*）","C":"静息时平衡趋势向于 R","D":"激动药只与 R*有较大亲和力","E":"部分激动药与 R 及 R*都能结合，但对 R*的亲和力大于对 R 的亲和力"},"answer":["D"],"answerStr":"D","rationale":"激动药对R*亲和力较大，但并非“只与”R*结合，也可与静息态R结合，故D叙述错误。","expl":{"A":"正确，拮抗药对R及R*亲和力不等（对R亲和力较大）。","B":"正确，受体蛋白有静息态R和活动态R*两种可互变构型。","C":"正确，静息时受体平衡偏向R态。","D":"错误，激动药并非只与R*结合，对R也有一定亲和力，只是对R*亲和力较大。","E":"正确，部分激动药对R及R*均能结合，对R*亲和力大于R。"}},{"id":"ch02_q25","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":25,"stem":"质反应的累加曲线是","options":{"A":"对称 S 型曲线","B":"长尾 S 型曲线","C":"直线","D":"双曲线","E":"正态分布曲线"},"answer":["A"],"answerStr":"A","rationale":"质反应累加量效曲线呈对称的S型曲线，故为A。","expl":{"A":"正确，质反应累加量效曲线为对称S型曲线。","B":"长尾S型是量反应（纵坐标效应、横坐标剂量）曲线。","C":"直线不是质反应累加曲线的形态。","D":"双曲线不符合量效曲线特征。","E":"正态分布曲线是质反应频数分布，非累加量效曲线。"}},{"id":"ch02_q26","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":26,"stem":"从下列 pD2 值中可知，与受体亲和力最小的是","options":{"A":"1","B":"2","C":"4","D":"5","E":"6"},"answer":["A"],"answerStr":"A","rationale":"pD2越大亲和力越大，故pD2=1时亲和力最小，为A。","expl":{"A":"正确，pD2值最小（1），故亲和力最小。","B":"pD2=2大于1，亲和力较大。","C":"pD2=4，亲和力更大。","D":"pD2=5，亲和力更大。","E":"pD2=6，亲和力最大。"}},{"id":"ch02_q27","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":27,"stem":"从下列 pA2 值可知拮抗作用最强的是","options":{"A":"0.1","B":"0.5","C":"1.0","D":"1.5","E":"1.6"},"answer":["E"],"answerStr":"E","rationale":"pA2越大表示拮抗药作用越强，故pA2=1.6者拮抗最强，为E。","expl":{"A":"0.1最小，拮抗作用最弱。","B":"0.5较小，拮抗作用弱。","C":"1.0居中，拮抗作用较弱。","D":"1.5较大，但小于1.6。","E":"正确，pA2值最大（1.6），拮抗作用最强。"}},{"id":"ch02_q28","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":28,"stem":"某降压药停药后血压剧烈回升，此种现象称为","options":{"A":"变态反应","B":"停药反应","C":"后遗效应","D":"特异质反应","E":"毒性反应"},"answer":["B"],"answerStr":"B","rationale":"停药后血压剧烈回升是长期用药突然停药引起的反跳，属停药反应，故为B。","expl":{"A":"变态反应与免疫有关，非停药所致。","B":"正确，突然停药致血压反跳属停药反应（反跳现象）。","C":"后遗效应是血药浓度降至阈下后残存的效应，非反跳。","D":"特异质反应与遗传异常有关，非停药反应。","E":"毒性反应是剂量过大所致，非停药引起。"}},{"id":"ch02_q29","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":29,"stem":"下列关于激动药的描述，错误的是","options":{"A":"有内在活性","B":"与受体有亲和力","C":"量效曲线呈 S 型","D":"pA2 值越大作用越强","E":"与受体迅速解离"},"answer":["D"],"answerStr":"D","rationale":"pA2是拮抗药的拮抗参数，不是评价激动药作用的指标，故D错误。","expl":{"A":"正确，激动药具有内在活性。","B":"正确，激动药与受体有亲和力。","C":"正确，激动药量效曲线呈S型。","D":"错误，pA2是竞争性拮抗药的作用强度参数，与激动药作用强弱无关。","E":"正确，激动药与受体结合后可迅速解离（可逆）。"}},{"id":"ch02_q30","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"A","num":30,"stem":"下列关于受体的叙述，正确的是","options":{"A":"受体是首先与药物结合并起反应的细胞成分","B":"受体都是细胞膜上的蛋白质","C":"受体是遗传基因生成的，其分布密度是固定不变的","D":"受体与配基或激动药结合后都引起兴奋性效应","E":"药物都是通过激动或抑制相应受体而发挥作用的"},"answer":["A"],"answerStr":"A","rationale":"受体是首先与药物结合并引起反应的细胞成分（靶点），故A正确。","expl":{"A":"正确，受体是药物首先结合并触发效应的细胞成分。","B":"受体不全在细胞膜上，还有细胞内受体（如甾体激素受体）。","C":"受体密度可受调节（上调或下调），非固定不变。","D":"激动受体可产生兴奋也可产生抑制效应，非都兴奋。","E":"药物并非都通过受体作用，有些直接作用于酶、离子通道等。"}},{"id":"ch02_q31","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"B","num":31,"stem":"高敏性是指","options":{"A":"药物引起的反应与个体体质有关，与用药剂量无关","B":"等量药物引起和一般病人相似但强度更高的药理效应或毒性","C":"用药一段时间后，病人对药物产生精神上依赖，中断用药，出现主观不适","D":"长期用药，需逐渐增加剂量，才可保持药效不减","E":"长期用药，产生生理上依赖，停药后出现戒断症状"},"answer":["B"],"answerStr":"B","rationale":"高敏性指等量药物引起比一般人更强的药理效应或毒性，故为B。","expl":{"A":"与体质有关且与剂量无关的是过敏或特异质反应，非高敏性。","B":"正确，高敏性是个体对等量药物反应增强。","C":"精神依赖、中断不适是习惯性，非高敏性。","D":"逐渐增量保持药效是耐受性，非高敏性。","E":"生理依赖、停药戒断是成瘾性，非高敏性。"}},{"id":"ch02_q32","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"B","num":32,"stem":"过敏反应是指","options":{"A":"药物引起的反应与个体体质有关，与用药剂量无关","B":"等量药物引起和一般病人相似但强度更高的药理效应或毒性","C":"用药一段时间后，病人对药物产生精神上依赖，中断用药，出现主观不适","D":"长期用药，需逐渐增加剂量，才可保持药效不减","E":"长期用药，产生生理上依赖，停药后出现戒断症状"},"answer":["A"],"answerStr":"A","rationale":"过敏反应（变态反应）与个体体质（免疫）有关，与剂量关系不大，故为A。","expl":{"A":"正确，过敏反应与体质有关，剂量关系不大（极微量即可发生）。","B":"等量药物反应增强是高敏性，非过敏反应。","C":"精神依赖、主观不适是习惯性，非过敏反应。","D":"逐渐增量是耐受性，非过敏反应。","E":"生理依赖、戒断症状是成瘾性，非过敏反应。"}},{"id":"ch02_q33","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"B","num":33,"stem":"习惯性是指","options":{"A":"药物引起的反应与个体体质有关，与用药剂量无关","B":"等量药物引起和一般病人相似但强度更高的药理效应或毒性","C":"用药一段时间后，病人对药物产生精神上依赖，中断用药，出现主观不适","D":"长期用药，需逐渐增加剂量，才可保持药效不减","E":"长期用药，产生生理上依赖，停药后出现戒断症状"},"answer":["C"],"answerStr":"C","rationale":"习惯性指用药一段时间后产生精神依赖，中断用药出现主观不适，故为C。","expl":{"A":"与体质有关且与剂量无关的是过敏反应。","B":"等量药物反应增强是高敏性。","C":"正确，习惯性表现为精神依赖，停药后有主观不适。","D":"逐渐增量是耐受性，非习惯性。","E":"生理依赖、戒断症状是成瘾性，非习惯性。"}},{"id":"ch02_q34","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"B","num":34,"stem":"耐受性是指","options":{"A":"药物引起的反应与个体体质有关，与用药剂量无关","B":"等量药物引起和一般病人相似但强度更高的药理效应或毒性","C":"用药一段时间后，病人对药物产生精神上依赖，中断用药，出现主观不适","D":"长期用药，需逐渐增加剂量，才可保持药效不减","E":"长期用药，产生生理上依赖，停药后出现戒断症状"},"answer":["D"],"answerStr":"D","rationale":"耐受性指长期用药后需逐渐增加剂量才能维持原有效果，故为D。","expl":{"A":"与体质有关且与剂量无关的是过敏反应。","B":"等量药物反应增强是高敏性。","C":"精神依赖是习惯性，非耐受性。","D":"正确，耐受性表现为需逐渐增量才能保持药效不减。","E":"生理依赖、戒断症状是成瘾性，非耐受性。"}},{"id":"ch02_q35","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"B","num":35,"stem":"成瘾性是指","options":{"A":"药物引起的反应与个体体质有关，与用药剂量无关","B":"等量药物引起和一般病人相似但强度更高的药理效应或毒性","C":"用药一段时间后，病人对药物产生精神上依赖，中断用药，出现主观不适","D":"长期用药，需逐渐增加剂量，才可保持药效不减","E":"长期用药，产生生理上依赖，停药后出现戒断症状"},"answer":["E"],"answerStr":"E","rationale":"成瘾性指长期用药产生生理依赖，停药后出现戒断症状，故为E。","expl":{"A":"与体质有关且与剂量无关的是过敏反应。","B":"等量药物反应增强是高敏性。","C":"精神依赖是习惯性，非成瘾性。","D":"逐渐增量是耐受性，非成瘾性。","E":"正确，成瘾性为生理依赖，停药出现戒断症状。"}},{"id":"ch02_q36","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"B","num":36,"stem":"起后继信息传导系统作用","options":{"A":"受体","B":"第二信使","C":"激动药","D":"结合体","E":"拮抗药"},"answer":["B"],"answerStr":"B","rationale":"第二信使（如cAMP、IP3）在受体激活后传递、放大信息，起后继信息传导作用，故为B。","expl":{"A":"受体是识别并结合配体、启动信号的部位，非后继传导系统。","B":"正确，第二信使承担受体后的信息传导作用。","C":"激动药是激活受体的配体，非传导系统。","D":"结合体仅结合配体，无传导功能。","E":"拮抗药阻断受体，不传导信号。"}},{"id":"ch02_q37","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"B","num":37,"stem":"能与配体结合触发效应","options":{"A":"受体","B":"第二信使","C":"激动药","D":"结合体","E":"拮抗药"},"answer":["A"],"answerStr":"A","rationale":"受体能与配体（如激素、递质）特异性结合并触发效应，故为A。","expl":{"A":"正确，受体与配体结合后触发细胞效应。","B":"第二信使不直接结合配体，而是传导信号。","C":"激动药是与受体结合的配体，非与配体结合者。","D":"结合体虽与配体结合但不触发效应。","E":"拮抗药与受体结合不触发效应。"}},{"id":"ch02_q38","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"B","num":38,"stem":"能与受体结合触发效应","options":{"A":"受体","B":"第二信使","C":"激动药","D":"结合体","E":"拮抗药"},"answer":["C"],"answerStr":"C","rationale":"激动药能与受体结合并激动受体，触发效应，故为C。","expl":{"A":"受体是与配体结合触发效应，题干为“与受体结合”。","B":"第二信使不直接与受体结合触发效应。","C":"正确，激动药与受体结合后触发效应。","D":"结合体与配体结合但不触发效应。","E":"拮抗药与受体结合但不触发效应。"}},{"id":"ch02_q39","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"B","num":39,"stem":"能与配体结合不能触发效应","options":{"A":"受体","B":"第二信使","C":"激动药","D":"结合体","E":"拮抗药"},"answer":["D"],"answerStr":"D","rationale":"结合体（如配体结合蛋白）能与配体结合，但不具备触发效应的能力，故为D。","expl":{"A":"受体与配体结合可触发效应，非不能触发。","B":"第二信使传导信号，不直接结合配体。","C":"激动药与受体结合触发效应。","D":"正确，结合体仅与配体结合，不能触发效应。","E":"拮抗药是与受体结合不触发效应，非与配体结合。"}},{"id":"ch02_q40","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"B","num":40,"stem":"起放大分化和整合作用","options":{"A":"受体","B":"第二信使","C":"激动药","D":"结合体","E":"拮抗药"},"answer":["B"],"answerStr":"B","rationale":"第二信使系统可对信号进行放大、分化和整合，故为B。","expl":{"A":"受体主要识别信号，不负责放大整合。","B":"正确，第二信使起放大、分化和整合信息的作用。","C":"激动药激活受体，非信号整合系统。","D":"结合体仅结合配体，无整合功能。","E":"拮抗药阻断受体，无放大整合作用。"}},{"id":"ch02_q41","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"B","num":41,"stem":"能与受体结合不触发效应","options":{"A":"受体","B":"第二信使","C":"激动药","D":"结合体","E":"拮抗药"},"answer":["E"],"answerStr":"E","rationale":"拮抗药能与受体结合（占据受体），但无内在活性，不触发效应，故为E。","expl":{"A":"受体与配体结合可触发效应。","B":"第二信使传导信号，非结合受体。","C":"激动药与受体结合触发效应。","D":"结合体是与配体结合，非与受体结合。","E":"正确，拮抗药与受体结合但不触发效应。"}},{"id":"ch02_q42","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"B","num":42,"stem":"对称 S 型的量效曲线应为","options":{"A":"纵坐标为效应，横坐标为剂量","B":"纵坐标为剂量，横坐标为效应","C":"纵坐标为效应，横坐标为对数剂量","D":"纵坐标为对数剂量，横坐标为效应","E":"纵坐标为对数剂量，横坐标为对数效应"},"answer":["C"],"answerStr":"C","rationale":"以效应为纵坐标、对数剂量为横坐标作图，量效曲线呈对称S型，故为C。","expl":{"A":"纵坐标为效应、横坐标为剂量时得长尾S型，非对称S型。","B":"纵、横坐标颠倒，不符合。","C":"正确，纵坐标为效应、横坐标为对数剂量时曲线为对称S型。","D":"纵、横坐标颠倒，不符合。","E":"纵坐标为对数剂量非标准作图方式。"}},{"id":"ch02_q43","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"B","num":43,"stem":"长尾 S 型的量效曲线应为","options":{"A":"纵坐标为效应，横坐标为剂量","B":"纵坐标为剂量，横坐标为效应","C":"纵坐标为效应，横坐标为对数剂量","D":"纵坐标为对数剂量，横坐标为效应","E":"纵坐标为对数剂量，横坐标为对数效应"},"answer":["A"],"answerStr":"A","rationale":"以效应为纵坐标、剂量（非对数）为横坐标时，量效曲线呈长尾S型，故为A。","expl":{"A":"正确，纵坐标为效应、横坐标为剂量时呈长尾S型。","B":"纵、横坐标颠倒，不符合。","C":"横坐标为对数剂量时是对称S型，非长尾S型。","D":"纵、横坐标颠倒，不符合。","E":"纵坐标为对数剂量非标准作图方式。"}},{"id":"ch02_q44","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"B","num":44,"stem":"属毒性反应的是","options":{"A":"患者服治疗量的伯氨喹所致的溶血反应","B":"强心甙所致的心律失常","C":"四环素和氯霉素所致的二重感染","D":"阿托品在治疗量解除胃肠痉挛时所致的口干、心悸","E":"巴比妥类药物所致的次晨宿醉现象"},"answer":["B"],"answerStr":"B","rationale":"强心苷（强心甙）中毒引起的心律失常属剂量过大所致的毒性反应，故为B。","expl":{"A":"伯氨喹溶血属特异质反应（G6PD缺乏），非毒性反应。","B":"正确，强心苷所致心律失常是其毒性反应。","C":"四环素、氯霉素二重感染属继发反应，非毒性反应。","D":"阿托品口干、心悸属副作用，非毒性反应。","E":"巴比妥次晨宿醉属后遗效应，非毒性反应。"}},{"id":"ch02_q45","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"B","num":45,"stem":"属后遗效应的是","options":{"A":"患者服治疗量的伯氨喹所致的溶血反应","B":"强心甙所致的心律失常","C":"四环素和氯霉素所致的二重感染","D":"阿托品在治疗量解除胃肠痉挛时所致的口干、心悸","E":"巴比妥类药物所致的次晨宿醉现象"},"answer":["E"],"answerStr":"E","rationale":"巴比妥类催眠后次晨宿醉是血药浓度已降至阈下仍残存的效应，属后遗效应，故为E。","expl":{"A":"伯氨喹溶血属特异质反应。","B":"强心苷心律失常属毒性反应。","C":"二重感染属继发反应。","D":"阿托品口干、心悸属副作用。","E":"正确，巴比妥次晨宿醉为后遗效应。"}},{"id":"ch02_q46","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"B","num":46,"stem":"属继发反应的是","options":{"A":"患者服治疗量的伯氨喹所致的溶血反应","B":"强心甙所致的心律失常","C":"四环素和氯霉素所致的二重感染","D":"阿托品在治疗量解除胃肠痉挛时所致的口干、心悸","E":"巴比妥类药物所致的次晨宿醉现象"},"answer":["C"],"answerStr":"C","rationale":"四环素、氯霉素致菌群失调引起二重感染是药物作用后的继发后果，属继发反应，故为C。","expl":{"A":"伯氨喹溶血属特异质反应。","B":"强心苷心律失常属毒性反应。","C":"正确，广谱抗生素引起二重感染属继发反应。","D":"阿托品口干、心悸属副作用。","E":"巴比妥次晨宿醉属后遗效应。"}},{"id":"ch02_q47","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"B","num":47,"stem":"属特异质反应的是","options":{"A":"患者服治疗量的伯氨喹所致的溶血反应","B":"强心甙所致的心律失常","C":"四环素和氯霉素所致的二重感染","D":"阿托品在治疗量解除胃肠痉挛时所致的口干、心悸","E":"巴比妥类药物所致的次晨宿醉现象"},"answer":["A"],"answerStr":"A","rationale":"伯氨喹在治疗量引起溶血是G6PD缺乏的遗传异常所致，属特异质反应，故为A。","expl":{"A":"正确，治疗量伯氨喹致溶血（G6PD缺乏）属特异质反应。","B":"强心苷心律失常属毒性反应。","C":"二重感染属继发反应。","D":"阿托品口干、心悸属副作用。","E":"巴比妥次晨宿醉属后遗效应。"}},{"id":"ch02_q48","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"B","num":48,"stem":"属副作用的是","options":{"A":"患者服治疗量的伯氨喹所致的溶血反应","B":"强心甙所致的心律失常","C":"四环素和氯霉素所致的二重感染","D":"阿托品在治疗量解除胃肠痉挛时所致的口干、心悸","E":"巴比妥类药物所致的次晨宿醉现象"},"answer":["D"],"answerStr":"D","rationale":"阿托品治疗量解除胃肠痉挛时的口干、心悸是与治疗目的无关的反应，属副作用，故为D。","expl":{"A":"伯氨喹溶血属特异质反应。","B":"强心苷心律失常属毒性反应。","C":"二重感染属继发反应。","D":"正确，阿托品治疗量致口干、心悸属副作用。","E":"巴比妥次晨宿醉属后遗效应。"}},{"id":"ch02_q49","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"C","num":49,"stem":"受体激动剂的特点中应包括","options":{"A":"对受体有较强的亲和力","B":"对受体有较强的内在活性","C":"两者都有","D":"两者都无"},"answer":["C"],"answerStr":"C","rationale":"受体激动剂既有较强亲和力，又有较强内在活性，故两者都有。","expl":{"A":"激动剂确需亲和力，但仅选亲和力不完整。","B":"激动剂确需内在活性，但仅选内在活性不完整。","C":"正确，激动剂兼具较强亲和力和较强内在活性。","D":"两者都无不符合激动剂特征。"}},{"id":"ch02_q50","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"C","num":50,"stem":"部分激动剂的特点中应包括","options":{"A":"对受体有较强的亲和力","B":"对受体有较强的内在活性","C":"两者都有","D":"两者都无"},"answer":["A"],"answerStr":"A","rationale":"部分激动剂对受体有较强亲和力，但内在活性较弱，故为A。","expl":{"A":"正确，部分激动剂亲和力较强，但内在活性弱。","B":"部分激动剂内在活性弱，非较强内在活性。","C":"两者都有不符合部分激动剂（内在活性弱）。","D":"两者都无不符合，因其有亲和力。"}},{"id":"ch02_q51","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"C","num":51,"stem":"受体阻断剂的特点中可包括","options":{"A":"对受体有较强的亲和力","B":"对受体有较强的内在活性","C":"两者都有","D":"两者都无"},"answer":["A"],"answerStr":"A","rationale":"受体阻断剂（拮抗药）对受体有较强亲和力，但无内在活性，故为A。","expl":{"A":"正确，阻断剂有较强亲和力但无内在活性。","B":"阻断剂无内在活性，故B不符合。","C":"两者都有不符合阻断剂。","D":"两者都无不符合，因其有亲和力。"}},{"id":"ch02_q52","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"C","num":52,"stem":"表示拮抗药的作用强度用","options":{"A":"pA2","B":"pD2","C":"两者均是","D":"两者均无"},"answer":["A"],"answerStr":"A","rationale":"pA2是表示竞争性拮抗药作用强度的参数，故为A。","expl":{"A":"正确，pA2表示拮抗药作用强度。","B":"pD2表示激动药与受体亲和力，非拮抗强度。","C":"两者均是错误，pD2不表示拮抗强度。","D":"两者均无错误，pA2正是拮抗强度参数。"}},{"id":"ch02_q53","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"C","num":53,"stem":"表示药物与受体的亲和力用","options":{"A":"pA2","B":"pD2","C":"两者均是","D":"两者均无"},"answer":["B"],"answerStr":"B","rationale":"pD2（-logKD）表示药物与受体的亲和力，故为B。","expl":{"A":"pA2表示拮抗药作用强度，非亲和力。","B":"正确，pD2表示药物与受体的亲和力。","C":"两者均是错误，pA2不表示亲和力。","D":"两者均无错误，pD2正是亲和力参数。"}},{"id":"ch02_q54","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"C","num":54,"stem":"表示受体动力学的参数用","options":{"A":"pA2","B":"pD2","C":"两者均是","D":"两者均无"},"answer":["C"],"answerStr":"C","rationale":"pA2和pD2均为受体动力学（受体-药物相互作用）参数，故两者均是。","expl":{"A":"pA2是拮抗参数，属受体动力学参数，但仅选A不完整。","B":"pD2是亲和力参数，属受体动力学参数，但仅选B不完整。","C":"正确，pA2和pD2均为受体动力学参数。","D":"两者均无错误。"}},{"id":"ch02_q55","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"C","num":55,"stem":"表示药物与受体结合的内在活性用","options":{"A":"pA2","B":"pD2","C":"两者均是","D":"两者均无"},"answer":["D"],"answerStr":"D","rationale":"内在活性用α（效应力）或最大效应表示，pA2和pD2均不表示内在活性，故两者均无。","expl":{"A":"pA2表示拮抗强度，不表示内在活性。","B":"pD2表示亲和力，不表示内在活性。","C":"两者均是错误。","D":"正确，pA2和pD2均不表示内在活性。"}},{"id":"ch02_q56","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"X","num":56,"stem":"有关量效关系的描述，正确的是","options":{"A":"在一定范围内，药理效应强度与血浆药物浓度呈正相关","B":"量反应的量效关系皆呈常态分布曲线","C":"质反应的量效关系皆呈常态分布曲线","D":"LD50 与 ED50 均是量反应中出现的剂量","E":"量效曲线可以反映药物效能和效价强度"},"answer":["A","E"],"answerStr":"AE","rationale":"一定范围内效应强度与血药浓度正相关，量效曲线可反映效能和效价强度，故为AE。","expl":{"A":"正确，一定范围内药理效应强度与血药浓度呈正相关。","B":"量反应量效曲线为长尾S型或双曲线，非正态分布。","C":"质反应频数分布呈正态分布，其累加量效曲线为S型，非正态分布。","D":"LD50与ED50是质反应的参数，非量反应。","E":"正确，量效曲线可反映药物效能和效价强度。"}},{"id":"ch02_q57","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"X","num":57,"stem":"质反应的特点有","options":{"A":"频数分布曲线为正态分布曲线","B":"无法计算出 ED50","C":"用全或无、阳性或阴性表示","D":"可用死亡与生存、惊厥与不惊厥表示","E":"累加量效曲线为 S 型量效曲线"},"answer":["A","C","D","E"],"answerStr":"ACDE","rationale":"质反应以全或无表示，频数分布呈正态，累加曲线为S型，并可计算ED50，故为ACDE。","expl":{"A":"正确，质反应频数分布曲线为正态分布。","B":"质反应可计算ED50（半数有效量），此说法错误。","C":"正确，质反应以全或无、阳性或阴性表示。","D":"正确，可用死亡与生存、惊厥与不惊厥等表示。","E":"正确，质反应累加量效曲线为S型。"}},{"id":"ch02_q58","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"X","num":58,"stem":"药物作用包括","options":{"A":"引起机体功能或形态改变","B":"引起机体体液成分改变","C":"抑制或杀灭入侵的病原微生物或寄生虫","D":"改变机体的反应性","E":"补充体内营养物质或激素的不足"},"answer":["A","B","C","D","E"],"answerStr":"ABCDE","rationale":"药物作用包括改变机体功能形态、体液成分、抑制病原微生物、改变反应性及补充物质等，全对。","expl":{"A":"正确，药物可改变机体功能或形态。","B":"正确，药物可改变机体体液成分。","C":"正确，药物可抑制或杀灭病原微生物、寄生虫。","D":"正确，药物可改变机体反应性。","E":"正确，药物可补充体内营养物质或激素的不足。"}},{"id":"ch02_q59","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"X","num":59,"stem":"药物与受体结合的特性有","options":{"A":"高度特异性","B":"高度亲和力","C":"可逆性","D":"饱和性","E":"高度效应力"},"answer":["A","B","C","D"],"answerStr":"ABCD","rationale":"药物与受体结合具特异性、亲和力、可逆性和饱和性，效应力（内在活性）非结合特性，故为ABCD。","expl":{"A":"正确，药物与受体结合具高度特异性。","B":"正确，具高度亲和力。","C":"正确，结合可逆。","D":"正确，结合具饱和性。","E":"效应力是激动受体产生效应的能力，非结合特性。"}},{"id":"ch02_q60","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"X","num":60,"stem":"下列正确的描述是","options":{"A":"药物可通过受体发挥效应","B":"药物激动受体即表现为兴奋效应","C":"安慰剂不会产生治疗作用","D":"药物化学结构相似，则作用相似","E":"药效与被占领的受体数目成正比"},"answer":["A","E"],"answerStr":"AE","rationale":"药物可通过受体发挥效应，且按占领学说药效与被占领受体数目成正比，故为AE。","expl":{"A":"正确，药物可通过受体发挥效应。","B":"激动受体可为兴奋也可为抑制，非皆表现为兴奋。","C":"安慰剂可产生安慰剂效应（如镇痛），非无治疗作用。","D":"化学结构相似作用未必相似，拮抗药与激动药结构相近而作用相反。","E":"正确，按占领学说药效与被占领受体数目成正比。"}},{"id":"ch02_q61","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"X","num":61,"stem":"下列有关亲和力的描述，正确的是","options":{"A":"亲和力是药物与受体结合的能力","B":"亲和力是药物与受体结合后引起效应的能力","C":"亲和力越大，则药物效价越强","D":"亲和力越大，则药物效能越强","E":"亲和力越大，则药物作用维持时间越长"},"answer":["A","C"],"answerStr":"AC","rationale":"亲和力是药物与受体结合的能力，亲和力越大效价越强，故为AC。","expl":{"A":"正确，亲和力是药物与受体结合的能力。","B":"结合后引起效应的能力是内在活性，非亲和力。","C":"正确，亲和力越大，药物效价强度越大。","D":"效能由内在活性决定，非亲和力。","E":"作用维持时间与药动学有关，非亲和力。"}},{"id":"ch02_q62","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"X","num":62,"stem":"药效动力学的内容包括","options":{"A":"药物的作用与临床疗效","B":"给药方法和用量","C":"药物的剂量与量效关系","D":"药物的作用机制","E":"药物的不良反应和禁忌症"},"answer":["A","C","D","E"],"answerStr":"ACDE","rationale":"药效学研究作用、剂量与量效关系、作用机制及不良反应等，给药方法用量属药动学或治疗学，故为ACDE。","expl":{"A":"正确，药效学包括药物作用与临床疗效。","B":"给药方法和用量属药动学或临床用药范畴，非药效学主要内容。","C":"正确，药效学包括剂量与量效关系。","D":"正确，药效学包括药物作用机制。","E":"正确，药效学包括不良反应和禁忌症。"}},{"id":"ch02_q63","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"X","num":63,"stem":"竞争性拮抗剂的特点有","options":{"A":"本身可产生效应","B":"降低激动剂的效价","C":"降低激动剂的效能","D":"可使激动剂的量效曲线平行右移","E":"可使激动剂的量效曲线平行左移"},"answer":["B","D"],"answerStr":"BD","rationale":"竞争性拮抗剂无内在活性，降低激动药效价，使其量效曲线平行右移，故为BD。","expl":{"A":"竞争性拮抗剂本身无内在活性，不产生效应。","B":"正确，竞争性拮抗剂降低激动药的效价强度。","C":"加大激动药剂量可恢复最大效应，不降低效能。","D":"正确，使激动药量效曲线平行右移。","E":"量效曲线是右移而非左移。"}},{"id":"ch02_q64","chapter":"第二章 药物效应动力学","chapterIdx":1,"type":"X","num":64,"stem":"可作为用药安全性的指标有","options":{"A":"TD50/ED50","B":"极量","C":"ED95~TD5 之间的距离","D":"TC50/EC50","E":"常用剂量范围"},"answer":["A","C","D"],"answerStr":"ACD","rationale":"TD50/ED50（治疗指数）、ED95~TD5距离（安全范围）和TC50/EC50均为安全性指标，故为ACD。","expl":{"A":"正确，TD50/ED50即治疗指数，是安全性指标。","B":"极量是最大治疗量，非评价安全性的比值或范围指标。","C":"正确，ED95~TD5之间距离为安全范围。","D":"正确，TC50/EC50为化疗药物的治疗指数。","E":"常用剂量范围不是安全性评价指标。"}}]},{"title":"第三章 药物代谢动力学","questions":[{"id":"ch03_q01","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":1,"stem":"某弱酸药物 pka=3.4,在血浆中解离百分率约","options":{"A":"10%","B":"90%","C":"99%","D":"99.9%","E":"99.99%"},"answer":["E"],"answerStr":"E","rationale":"血浆pH约7.4，比弱酸pKa3.4高约4个单位，弱酸在碱性环境几乎全部解离，解离度约99.99%。","expl":{"A":"10%，错误，血浆偏碱性，弱酸解离远高于此值。","B":"90%，偏小，未达弱酸在血浆中的实际解离度。","C":"99%，仍偏小，实际接近全部解离。","D":"99.9%，仍略偏小。","E":"正确，pH与pKa相差4个单位，解离约99.99%。"}},{"id":"ch03_q02","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":2,"stem":"阿司匹林的 pKa 是 3.5,它在 pH 为 7.5 肠液中可吸收约","options":{"A":"1%","B":"0. 1%","C":"0.01%","D":"10%","E":"99%"},"answer":["C"],"answerStr":"C","rationale":"阿司匹林为弱酸，在pH7.5肠液中几乎全部解离，非解离（可吸收）型仅约0.01%。","expl":{"A":"1%，偏大。","B":"0.1%，偏大。","C":"正确，非解离型约1/(1+10^4)≈0.01%。","D":"10%，错误，肠液碱性使弱酸解离多、吸收少。","E":"99%，错误，这是解离型比例而非可吸收型。"}},{"id":"ch03_q03","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":3,"stem":"某弱碱性药在 pH5 时，非解离部分为 90.9%，该药 pKa 的接近数值","options":{"A":"2","B":"3","C":"4","D":"5","E":"6"},"answer":["E"],"answerStr":"E","rationale":"按弱碱性药 pKa=pH+lg(解离/非解离) 计算：若解离部分为90.9%，则 pKa=5+lg(90.9/9.1)=5+1=6。（原题写“非解离部分为90.9%”应为“解离部分”之笔误。）","expl":{"A":"错误，pKa≈2 时在 pH5 几乎全解离，与题设不符。","B":"错误，pKa≈3 时解离程度更大，与题设不符。","C":"错误，pKa≈4 对应“非解离90.9%”，但原答案按“解离90.9%”取值。","D":"错误，pKa≈5 时解离与未解离各约50%。","E":"正确，解离90.9%时 pKa=pH+lg(解离/非解离)=5+1=6。"}},{"id":"ch03_q04","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":4,"stem":"下列情况可称为首关消除：","options":{"A":"苯巴比妥钠肌注后被肝药酶代谢，使血中浓度降低","B":"硝酸甘油舌下给药，自口腔粘膜吸收，经肝代谢后药效降低","C":"青霉素口服后被胃酸破坏，使吸收入血的药量减少","D":"普萘洛尔口服，经肝代谢，使进入体循环的药量减少"},"answer":["D"],"answerStr":"D","rationale":"首关消除指口服药物经肠壁和肝脏代谢后进入体循环的药量减少，普萘洛尔口服有明显首关消除。","expl":{"A":"苯巴比妥钠肌注不经门静脉，属一般代谢而非首关消除。","B":"硝酸甘油舌下给药不经首关，经肝代谢是吸收后的代谢。","C":"青霉素口服被胃酸破坏属胃肠道破坏，非首关消除。","D":"正确，口服经肝代谢使进入体循环药量减少，符合首关消除。"}},{"id":"ch03_q05","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":5,"stem":"弱酸性药物从胃肠道吸收的主要部位是：","options":{"A":"胃粘膜","B":"小肠","C":"横结肠","D":"乙状结肠","E":"十二指肠"},"answer":["B"],"answerStr":"B","rationale":"弱酸性药物虽在胃中多呈非解离型易吸收，但小肠吸收面积大、血流丰富，是主要吸收部位。","expl":{"A":"胃粘膜，虽利于弱酸吸收但面积小，非主要部位。","B":"正确，小肠面积大、血流丰富，是主要吸收部位。","C":"横结肠，非主要吸收部位。","D":"乙状结肠，非主要吸收部位。","E":"十二指肠仅是小肠一部分，整体主要部位为小肠。"}},{"id":"ch03_q06","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":6,"stem":"临床上可用丙磺舒以增加青霉素的疗效,原因是","options":{"A":"在杀菌作用上有协同作用","B":"二者竞争肾小管的分泌通道","C":"对细菌代谢有双重阻断作用","D":"延缓抗药性产生","E":"以上都不对"},"answer":["B"],"answerStr":"B","rationale":"丙磺舒与青霉素竞争肾小管有机酸分泌通道，减慢青霉素排泄，提高血药浓度而增强疗效。","expl":{"A":"杀菌协同，错误，机制并非协同杀菌。","B":"正确，二者竞争肾小管分泌通道，延缓青霉素排泄。","C":"双重阻断，错误，与细菌代谢双重阻断无关。","D":"延缓抗药性，非其主要机制。","E":"以上都不对，错误。"}},{"id":"ch03_q07","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":7,"stem":"药物的 t1/2 是指","options":{"A":"药物的血药浓度下降一半所需时间","B":"药物的稳态血药浓度下降一半所需时间","C":"与药物的血浆浓度下降一半相关，单位为小时","D":"与药物的血浆浓度下降一半相关，单位为克","E":"药物的血浆蛋白结合率下降一半所需剂量"},"answer":["A"],"answerStr":"A","rationale":"t1/2指血浆药物浓度下降一半所需的时间。","expl":{"A":"正确，半衰期即血药浓度下降一半所需时间。","B":"错误，半衰期针对血药浓度下降，不限稳态浓度。","C":"错误，半衰期单位不固定为小时，可为分钟、天等。","D":"错误，半衰期为时间量，单位“克”明显错误。","E":"错误，半衰期与血浆蛋白结合率无关。"}},{"id":"ch03_q08","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":8,"stem":"某催眠药的 t1/2 为 1 小时，给予 100mg 剂量后，病人在体内药物只剩 12.5mg 时便清醒过来，该病人睡了","options":{"A":"2h","B":"3h","C":"4h","D":"5h","E":"0.5h"},"answer":["B"],"answerStr":"B","rationale":"100mg经3个半衰期依次降为50、25、12.5mg，每个t1/2为1小时，共3小时。","expl":{"A":"2h，此时体内剩25mg，尚未清醒。","B":"正确，100mg经3个半衰期降至12.5mg，历时3h。","C":"4h，此时剩6.25mg，时间偏长。","D":"5h，偏长。","E":"0.5h，体内尚余约70mg，错误。"}},{"id":"ch03_q09","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":9,"stem":"药物的作用强度，主要取决于","options":{"A":"药物在血液中的浓度","B":"在靶器官的浓度大小","C":"药物排泄的速率大小","D":"药物与血浆蛋白结合率之高低","E":"以上都对"},"answer":["B"],"answerStr":"B","rationale":"药物作用强度主要取决于作用部位（靶器官、靶组织）的药物浓度。","expl":{"A":"血药浓度仅间接相关，非直接决定因素。","B":"正确，靶器官浓度直接决定作用强度。","C":"排泄速率影响持续时间，非作用强度。","D":"蛋白结合率影响游离浓度，非直接决定强度。","E":"以上都对，错误。"}},{"id":"ch03_q10","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":10,"stem":"一次静注给药后约经过几个血浆 t1/2 可自机体排出达 95%以上","options":{"A":"3 个","B":"4 个","C":"5 个","D":"6 个","E":"7 个"},"answer":["C"],"answerStr":"C","rationale":"经5个半衰期药物消除约97%（>95%），接近完全消除。","expl":{"A":"3个，消除约87.5%，不足95%。","B":"4个，消除约93.75%，略不足95%。","C":"正确，5个半衰期消除约96.9%，大于95%。","D":"6个，消除更多但非最少所需。","E":"7个，偏多。"}},{"id":"ch03_q11","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":11,"stem":"弱酸性药物与抗酸药物同服时，比单用该弱酸性药物","options":{"A":"在胃中解离增多，自胃吸收增多","B":"在胃中解离减少，自胃吸收增多","C":"在胃中解离减少，自胃吸收减少","D":"在胃中解离增多，自胃吸收减少","E":"无变化"},"answer":["D"],"answerStr":"D","rationale":"抗酸药升高胃内pH，使弱酸性药物解离增多、非解离型减少，故吸收减少。","expl":{"A":"解离增多则吸收应减少，此说矛盾。","B":"解离方向与吸收方向均反。","C":"解离减少的说法错误。","D":"正确，pH升高使弱酸解离增多，非解离型减少，吸收减少。","E":"无变化，错误。"}},{"id":"ch03_q12","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":12,"stem":"甲药与血浆蛋白的结合率为 95%，乙药的血浆蛋白结合率为 85%，甲药单用时血浆 t1/2为 4h，如甲药与乙药合用，则甲药血浆 t1/2 为","options":{"A":"小于 4h","B":"不变","C":"大于 4h","D":"大于 8h","E":"大于10h"},"answer":["B"],"answerStr":"B","rationale":"t1/2由消除速率常数与表观分布容积决定，蛋白结合率高低不直接决定半衰期，竞争置换不使t1/2改变。","expl":{"A":"小于4h，错误。","B":"正确，蛋白结合率差异不改变消除半衰期。","C":"大于4h，错误。","D":"大于8h，错误。","E":"大于10h，错误。"}},{"id":"ch03_q13","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":13,"stem":"常用剂量恒量恒速给药最后形成的血药浓度为","options":{"A":"有效血浓度","B":"稳态血浓度","C":"峰浓度","D":"阈浓度","E":"中毒浓度"},"answer":["B"],"answerStr":"B","rationale":"恒量恒速给药，经4~5个半衰期血药浓度达稳态（坪浓度）。","expl":{"A":"有效血浓度，是浓度范围而非最终浓度。","B":"正确，恒量恒速给药最终形成稳态血浓度。","C":"峰浓度，是单次给药后的最高浓度。","D":"阈浓度，是起效的最低浓度。","E":"中毒浓度，是过量所致。"}},{"id":"ch03_q14","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":14,"stem":"药物产生作用的快慢取决于","options":{"A":"药物的吸收速度","B":"药物的排泄速度","C":"药物的转运方式","D":"药物的光学异构体","E":"药物的代谢速度"},"answer":["A"],"answerStr":"A","rationale":"药物起效快慢主要取决于吸收速度，吸收越快，血药浓度上升越快、起效越快。","expl":{"A":"正确，吸收速度决定起效快慢。","B":"排泄速度影响持续时间，非起效快慢。","C":"转运方式影响吸收分布，非直接决定起效。","D":"光学异构体影响活性，非起效快慢。","E":"代谢速度影响持续时间，非起效快慢。"}},{"id":"ch03_q15","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":15,"stem":"苯巴比妥中毒时应用碳酸氢钠的目的是","options":{"A":"加速药物从尿液的排泄","B":"加速药物从尿液的代谢灭活","C":"加速药物由脑组织向血浆的转移","D":"A 和 C","E":"A 和 B"},"answer":["D"],"answerStr":"D","rationale":"苯巴比妥为弱酸性药，碳酸氢钠碱化尿液使药物解离增加、肾小管重吸收减少而加速排泄；同时碱化血液促使药物由脑组织向血浆转移，故二者兼有。","expl":{"A":"正确，碱化尿液减少弱酸性药在肾小管的重吸收，加速其从尿液排泄。","B":"错误，碳酸氢钠影响的是排泄而非加速药物代谢灭活。","C":"正确，碱化血液使药物在血中解离增多、不易透过血脑屏障，促使药物由脑组织向血浆转移。","D":"正确，碱化尿液加速排泄与碱化血液促药物向血浆转移，二者兼有。","E":"错误，B项不正确，故“A和B”不能作为完整答案。"}},{"id":"ch03_q16","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":16,"stem":"某药在体内可被肝药酶转化，与酶抑制剂合用时比单独应用的效应","options":{"A":"增强","B":"减弱","C":"不变","D":"无效","E":"相反"},"answer":["A"],"answerStr":"A","rationale":"酶抑制剂抑制肝药酶，减慢药物代谢灭活，使药效增强。","expl":{"A":"正确，酶抑制使代谢减慢，药效增强。","B":"减弱，错误，方向相反。","C":"不变，错误。","D":"无效，错误。","E":"相反，错误。"}},{"id":"ch03_q17","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":17,"stem":"每个 t1/2 恒量给药一次，约经过几个血浆 t1/2 可达稳态血浓度","options":{"A":"1 个","B":"3 个","C":"5 个","D":"7 个","E":"9 个"},"answer":["C"],"answerStr":"C","rationale":"恒量恒速给药，约经4~5个半衰期可达稳态血浓度。","expl":{"A":"1个，远不足。","B":"3个，达87.5%，尚未达稳态。","C":"正确，约5个半衰期达稳态血浓度。","D":"7个，偏多。","E":"9个，偏多。"}},{"id":"ch03_q18","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":18,"stem":"某药 t1/2 为 8h ，一天给药三次，达到稳态血浓度的时间是","options":{"A":"16h","B":"30h","C":"24h","D":"40h","E":"50h"},"answer":["D"],"answerStr":"D","rationale":"t1/2为8h，达稳态约需5个半衰期，即40h。","expl":{"A":"16h，仅2个半衰期。","B":"30h，约3.75个半衰期，不足。","C":"24h，仅3个半衰期。","D":"正确，5×8=40h。","E":"50h，偏多。"}},{"id":"ch03_q19","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":19,"stem":"药物的时量曲线下面积反映","options":{"A":"在一定时间内药物的分布情况","B":"药物的血浆 t1/2 长短","C":"在一定时间内药物消除的量","D":"在一定时间内药物吸收入血的相对量","E":"药物达到稳态浓度时所需要的时间"},"answer":["D"],"answerStr":"D","rationale":"时量曲线下面积（AUC）反映药物吸收入血的相对量，可用于计算生物利用度。","expl":{"A":"分布情况，错误。","B":"t1/2长短，错误，t1/2由消除速率决定。","C":"消除的量，错误，AUC反映体内药量的时间积分。","D":"正确，AUC反映药物吸收入血的相对量。","E":"达稳态时间，错误。"}},{"id":"ch03_q20","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":20,"stem":"静脉注射某药 0.5mg，达到稳态时测定其血浆药物浓度为 0.7ηg/ml，其表观分布容积约为","options":{"A":"0.5L","B":"7L","C":"50L","D":"70L","E":"700L"},"answer":["E"],"answerStr":"E","rationale":"Vd=剂量/血药浓度，0.5mg=5×10⁵ng，除以0.7ng/ml约为714L，接近700L。","expl":{"A":"0.5L，远小于实际值。","B":"7L，偏小。","C":"50L，偏小。","D":"70L，偏小。","E":"正确，约714L≈700L。"}},{"id":"ch03_q21","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":21,"stem":"对于肾功能低下者，用药时主要考虑","options":{"A":"药物自肾脏的转运","B":"药物在肝脏的转化","C":"胃肠对药物的吸收","D":"药物与血浆蛋白的结合率","E":"个体差异"},"answer":["A"],"answerStr":"A","rationale":"肾功能低下者药物经肾排泄减慢，用药需重点考虑药物自肾脏的转运（排泄）。","expl":{"A":"正确，肾功能低下主要影响药物经肾转运排泄。","B":"肝脏转化，非肾功能低下者的首要考虑。","C":"胃肠吸收，影响较小。","D":"蛋白结合率，非主要考虑。","E":"个体差异，不具针对性。"}},{"id":"ch03_q22","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":22,"stem":"二室模型的药物分布于","options":{"A":"血液与体液","B":"血液与尿液","C":"心脏与肝脏","D":"中央室与周边室","E":"肺脏与肾脏"},"answer":["D"],"answerStr":"D","rationale":"二室模型将机体分为中央室（血液及血流丰富组织）与周边室。","expl":{"A":"血液与体液，非二室模型划分。","B":"血液与尿液，错误。","C":"心脏与肝脏，错误。","D":"正确，分为中央室与周边室。","E":"肺脏与肾脏，错误。"}},{"id":"ch03_q23","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":23,"stem":"血浆 t1/2 是指哪种情况下降一半的时间","options":{"A":"血浆稳态浓度","B":"有效血浓度","C":"血浆浓度","D":"血浆蛋白结合率","E":"阈浓度"},"answer":["C"],"answerStr":"C","rationale":"血浆t1/2指血浆药物浓度下降一半所需的时间。","expl":{"A":"血浆稳态浓度，错误。","B":"有效血浓度，错误。","C":"正确，指血浆浓度下降一半的时间。","D":"血浆蛋白结合率，错误。","E":"阈浓度，错误。"}},{"id":"ch03_q24","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":24,"stem":"关于坪值，错误的描述是","options":{"A":"血药浓度相对地稳定在一定水平称坪值，平均血药浓度称坪浓度","B":"通常用药间隔时间约为一个血浆半衰期时,需经 4~5 个 t1/2 才能达到坪值","C":"坪浓度的高低与每日总量成正比，在每日总量相等时，用药次数不改变坪浓度","D":"坪浓度的高限（峰）和低限（谷）的差距与每次用药量成正比","E":"首次用突击剂量，不能使血药浓度迅速达到坪浓度"},"answer":["E"],"answerStr":"E","rationale":"首次突击剂量（负荷剂量）正是为迅速达到坪浓度而设，故E描述错误。","expl":{"A":"正确，坪值指血药浓度相对稳定水平。","B":"正确，约经4~5个t1/2达坪值。","C":"正确，坪浓度与每日总量成正比。","D":"正确，峰谷差距与每次用药量成正比。","E":"错误，突击剂量可使血药浓度迅速达坪浓度。"}},{"id":"ch03_q25","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":25,"stem":"药物的零级动力学消除是指","options":{"A":"药物完全消除至零","B":"单位时间内消除恒量的药物","C":"药物的吸收量与消除量达到平衡","D":"药物的消除速率常数为零","E":"单位时间内消除恒定比例的药物"},"answer":["B"],"answerStr":"B","rationale":"零级动力学消除指单位时间内消除恒定数量的药物，与浓度无关。","expl":{"A":"完全消除至零，属字面误解。","B":"正确，单位时间内消除恒量药物。","C":"吸收与消除平衡，错误。","D":"消除速率常数为零，错误。","E":"恒定比例消除，这是一级动力学。"}},{"id":"ch03_q26","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":26,"stem":"按一级动力学消除的药物，其血浆 t1/2 等于","options":{"A":"0.301/kE.","B":"2.303/kE.","C":"ke/0.693","D":"0.693/kE.","E":"ke/2.303"},"answer":["D"],"answerStr":"D","rationale":"一级动力学消除的药物t1/2=0.693/ke（ke为消除速率常数）。","expl":{"A":"0.301/ke，系数错误。","B":"2.303/ke，系数错误。","C":"ke/0.693，分子分母颠倒。","D":"正确，t1/2=0.693/ke。","E":"ke/2.303，错误。"}},{"id":"ch03_q27","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":27,"stem":"离子障指的是","options":{"A":"离子型药物可自由穿过，而非离子型药物则不能穿过","B":"非离子型药物不可自由穿过，离子型的也不能穿过","C":"非离子型药物可自由穿过，离子型的也能穿过","D":"非离子型药物可自由穿过，而离子型的则不能穿过","E":"以上都不是"},"answer":["D"],"answerStr":"D","rationale":"离子障指生物膜只允许非离子型（脂溶性）药物自由通过，离子型药物难以穿过。","expl":{"A":"相反，离子型不能自由穿过。","B":"错误，非离子型可自由穿过。","C":"错误，离子型不能穿过。","D":"正确，非离子型可自由穿过而离子型不能。","E":"以上都不是，错误。"}},{"id":"ch03_q28","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":28,"stem":"pka 是","options":{"A":"药物 90%解离时的 pH 值","B":"药物不解离时的 pH 值","C":"50%药物解离时的 pH 值","D":"药物全部长解离时的 pH 值","E":"酸性药物解离常数值的负对数"},"answer":["E"],"answerStr":"E","rationale":"pKa是解离常数Ka的负对数，即pKa=-lgKa。","expl":{"A":"90%解离时的pH，错误。","B":"不解离时的pH，错误，pKa时仍有50%解离。","C":"是pKa的性质而非定义，定义应为负对数。","D":"错误，pKa时药物50%解离而非全部解离。","E":"正确，pKa是解离常数值的负对数。"}},{"id":"ch03_q29","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":29,"stem":"某病人应用双香豆素治疗血栓栓塞性疾病，后因失眠加用苯巴比妥，结果病人的凝血酶原时间比未加苯巴比妥时缩短，这是因为","options":{"A":"苯巴比妥对抗双香豆素的作用","B":"苯巴比妥诱导肝药酶使双香豆素代谢加速","C":"苯巴比妥抑制凝血酶","D":"病人对双香豆素产生了耐药性","E":"苯巴比妥抗血小板聚集"},"answer":["B"],"answerStr":"B","rationale":"苯巴比妥为肝药酶诱导剂，加速双香豆素代谢，抗凝作用减弱，凝血酶原时间缩短。","expl":{"A":"直接对抗，错误，机制是酶诱导加速代谢。","B":"正确，苯巴比妥诱导肝药酶使双香豆素代谢加速。","C":"抑制凝血酶，错误。","D":"耐药性，错误。","E":"抗血小板聚集，错误。"}},{"id":"ch03_q30","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":30,"stem":"药物进入循环后首先","options":{"A":"作用于靶器官","B":"在肝脏代谢","C":"由肾脏排泄","D":"储存在脂肪","E":"与血浆蛋白结合"},"answer":["E"],"answerStr":"E","rationale":"药物进入体循环后首先与血浆蛋白可逆结合，形成结合型与游离型动态平衡。","expl":{"A":"作用于靶器官，需先分布，非首先。","B":"肝脏代谢，非首先。","C":"肾脏排泄，非首先。","D":"储存在脂肪，非首先。","E":"正确，首先与血浆蛋白结合。"}},{"id":"ch03_q31","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":31,"stem":"药物的生物转化和排泄速度决定其","options":{"A":"副作用的多少","B":"最大效应的高低","C":"作用持续时间的长短","D":"起效的快慢","E":"后遗效应的大小"},"answer":["C"],"answerStr":"C","rationale":"生物转化和排泄决定药物消除，从而决定药物作用持续时间的长短。","expl":{"A":"副作用的多少，错误。","B":"最大效应，取决于剂量与受体。","C":"正确，代谢和排泄决定作用持续时间。","D":"起效快慢，取决于吸收速度。","E":"后遗效应大小，非直接决定。"}},{"id":"ch03_q32","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":32,"stem":"时量曲线的峰值浓度表明","options":{"A":"药物吸收速度与消除速度相等","B":"药物吸收过程已完成","C":"药物在体内分布已达到平衡","D":"药物消除过程才开始","E":"药物的疗效最好"},"answer":["A"],"answerStr":"A","rationale":"时量曲线达峰时吸收速度与消除速度相等，此后消除占优势。","expl":{"A":"正确，峰浓度时吸收与消除速度相等。","B":"吸收已完成，错误，达峰时吸收仍在进行。","C":"分布已平衡，错误，非此含义。","D":"消除才开始，错误。","E":"疗效最好，错误。"}},{"id":"ch03_q33","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":33,"stem":"药物的排泄途径不包括","options":{"A":"汗腺","B":"肾脏","C":"胆汁","D":"肺","E":"肝脏"},"answer":["E"],"answerStr":"E","rationale":"肝脏是代谢器官而非排泄途径，药物主要经肾、胆汁、肺、汗腺等排泄。","expl":{"A":"汗腺，属排泄途径（汗液）。","B":"肾脏，是主要排泄途径。","C":"胆汁，属排泄途径。","D":"肺，属排泄途径（呼气）。","E":"正确，肝脏是代谢器官，不属于排泄途径。"}},{"id":"ch03_q34","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":34,"stem":"关于肝药酶的描述，错误的是","options":{"A":"属 P-450 酶系统","B":"其活性有限","C":"易发生竞争性抑制","D":"个体差异大","E":"只代谢 20 余种药物"},"answer":["E"],"answerStr":"E","rationale":"肝药酶（CYP450）底物广泛，可代谢数百种药物，远不止20余种。","expl":{"A":"正确，属P-450酶系统。","B":"正确，其活性有限。","C":"正确，易发生竞争性抑制。","D":"正确，个体差异大。","E":"错误，肝药酶可代谢众多药物，远不止20余种。"}},{"id":"ch03_q35","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":35,"stem":"已知某药按一级动力学消除，上午 9 时测得血药浓度为 100μg/ml，晚 6 时测得的血药浓度为12.5μg/ml，则此药的 t1/2 为","options":{"A":"4h","B":"2h","C":"6h","D":"3h","E":"9h"},"answer":["D"],"answerStr":"D","rationale":"9时到18时共9小时，浓度100→50→25→12.5μg/ml，经3个半衰期，故t1/2=3h。","expl":{"A":"4h，错误。","B":"2h，错误。","C":"6h，错误。","D":"正确，9小时经3个半衰期，t1/2=3h。","E":"9h，错误。"}},{"id":"ch03_q36","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"A","num":36,"stem":"某药的时量关系为：该药的消除规律是","options":{"A":"一级动力学消除","B":"一级转为零级动力学消除","C":"零级动力学消除","D":"零级转为一级动力学消除","E":"无恒定半衰期"},"answer":["A"],"answerStr":"A","rationale":"一级动力学消除时血药浓度按恒定比例下降，半衰期恒定，是多数药物治疗量下的消除规律。","expl":{"A":"正确，一级动力学按恒定比例消除、t1/2恒定。","B":"错误。","C":"错误，零级动力学为恒量消除。","D":"错误。","E":"错误，一级动力学有恒定半衰期。"}},{"id":"ch03_q37","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"B","num":37,"stem":"单位时间内药物消除的百分速率","options":{"A":"消除速率常数","B":"清除率","C":"半衰期","D":"一级动力学消除","E":"零级动力学消除"},"answer":["A"],"answerStr":"A","rationale":"消除速率常数ke表示单位时间内药物消除的百分速率（一级动力学中）。","expl":{"A":"正确，消除速率常数即单位时间消除的百分速率。","B":"清除率，是单位时间清除的血浆体积。","C":"半衰期，是浓度下降一半的时间。","D":"一级动力学消除，是消除类型。","E":"零级动力学消除，是消除类型。"}},{"id":"ch03_q38","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"B","num":38,"stem":"单位时间内能将多少体积血中的某药全部消除净","options":{"A":"消除速率常数","B":"清除率","C":"半衰期","D":"一级动力学消除","E":"零级动力学消除"},"answer":["B"],"answerStr":"B","rationale":"清除率定义为单位时间内能将多少体积血中药物全部清除净。","expl":{"A":"消除速率常数，是百分速率。","B":"正确，清除率指单位时间清除的血浆体积。","C":"半衰期，是时间概念。","D":"一级动力学消除，是类型。","E":"零级动力学消除，是类型。"}},{"id":"ch03_q39","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"B","num":39,"stem":"作为药物制剂质量指标","options":{"A":"生物利用度","B":"血浆蛋白结合率","C":"消除速率常数","D":"剂量","E":"吸收速度"},"answer":["A"],"answerStr":"A","rationale":"生物利用度反映药物进入体循环的速度和程度，是评价制剂质量的重要指标。","expl":{"A":"正确，生物利用度是制剂质量指标。","B":"血浆蛋白结合率，非制剂质量指标。","C":"消除速率常数，是药动学参数而非制剂指标。","D":"剂量，非制剂质量指标。","E":"吸收速度，仅属生物利用度的一部分。"}},{"id":"ch03_q40","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"B","num":40,"stem":"影响表观分布容积大小","options":{"A":"生物利用度","B":"血浆蛋白结合率","C":"消除速率常数","D":"剂量","E":"吸收速度"},"answer":["B"],"answerStr":"B","rationale":"血浆蛋白结合率影响药物在血浆与组织间的分布，从而影响表观分布容积。","expl":{"A":"生物利用度，影响吸收而非Vd。","B":"正确，蛋白结合率高者Vd较小。","C":"消除速率常数，影响t1/2。","D":"剂量，不改变Vd。","E":"吸收速度，非Vd的决定因素。"}},{"id":"ch03_q41","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"B","num":41,"stem":"决定半衰期长短","options":{"A":"生物利用度","B":"血浆蛋白结合率","C":"消除速率常数","D":"剂量","E":"吸收速度"},"answer":["C"],"answerStr":"C","rationale":"半衰期t1/2=0.693/ke，由消除速率常数决定。","expl":{"A":"生物利用度，影响吸收量。","B":"血浆蛋白结合率，影响Vd。","C":"正确，消除速率常数决定半衰期长短。","D":"剂量，不决定t1/2。","E":"吸收速度，影响起效快慢。"}},{"id":"ch03_q42","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"B","num":42,"stem":"决定起效快慢","options":{"A":"生物利用度","B":"血浆蛋白结合率","C":"消除速率常数","D":"剂量","E":"吸收速度"},"answer":["E"],"answerStr":"E","rationale":"起效快慢取决于药物吸收速度，吸收越快血药浓度上升越快。","expl":{"A":"生物利用度，影响吸收量。","B":"血浆蛋白结合率，影响分布。","C":"消除速率常数，影响消除。","D":"剂量，影响作用强度。","E":"正确，吸收速度决定起效快慢。"}},{"id":"ch03_q43","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"B","num":43,"stem":"决定作用强弱","options":{"A":"生物利用度","B":"血浆蛋白结合率","C":"消除速率常数","D":"剂量","E":"吸收速度"},"answer":["D"],"answerStr":"D","rationale":"在有效范围内作用强弱主要取决于剂量，剂量越大作用越强。","expl":{"A":"生物利用度，影响吸收量。","B":"血浆蛋白结合率，影响分布。","C":"消除速率常数，影响消除。","D":"正确，剂量决定作用强弱。","E":"吸收速度，影响起效快慢。"}},{"id":"ch03_q44","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"B","num":44,"stem":"给药间隔大","options":{"A":"血药浓度波动小","B":"血药浓度波动大","C":"血药浓度不波动","D":"血药浓度高","E":"血药浓度低"},"answer":["B"],"answerStr":"B","rationale":"给药间隔越大，血药浓度在峰谷之间波动越大。","expl":{"A":"波动小，错误，与间隔大成反。","B":"正确，给药间隔大则血药浓度波动大。","C":"不波动，错误。","D":"高，非直接结果。","E":"低，非直接结果。"}},{"id":"ch03_q45","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"B","num":45,"stem":"给药间隔小","options":{"A":"血药浓度波动小","B":"血药浓度波动大","C":"血药浓度不波动","D":"血药浓度高","E":"血药浓度低"},"answer":["A"],"answerStr":"A","rationale":"给药间隔越小，血药浓度波动越小。","expl":{"A":"正确，给药间隔小则血药浓度波动小。","B":"波动大，错误。","C":"不波动，错误。","D":"高，非直接结果。","E":"低，非直接结果。"}},{"id":"ch03_q46","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"B","num":46,"stem":"静脉滴注","options":{"A":"血药浓度波动小","B":"血药浓度波动大","C":"血药浓度不波动","D":"血药浓度高","E":"血药浓度低"},"answer":["C"],"answerStr":"C","rationale":"恒速静脉滴注时血药浓度平稳上升至稳态后保持恒定，不出现波动。","expl":{"A":"波动小，不准确，应为不波动。","B":"波动大，错误。","C":"正确，静滴达稳态后血药浓度不波动。","D":"高，非直接结果。","E":"低，非直接结果。"}},{"id":"ch03_q47","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"B","num":47,"stem":"给药剂量小","options":{"A":"血药浓度波动小","B":"血药浓度波动大","C":"血药浓度不波动","D":"血药浓度高","E":"血药浓度低"},"answer":["E"],"answerStr":"E","rationale":"给药剂量小，血药浓度相应较低。","expl":{"A":"波动小，非剂量所决定。","B":"波动大，错误。","C":"不波动，错误。","D":"高，与剂量小相反。","E":"正确，剂量小则血药浓度低。"}},{"id":"ch03_q48","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"B","num":48,"stem":"给药剂量大","options":{"A":"血药浓度波动小","B":"血药浓度波动大","C":"血药浓度不波动","D":"血药浓度高","E":"血药浓度低"},"answer":["D"],"answerStr":"D","rationale":"给药剂量大，血药浓度相应较高。","expl":{"A":"波动小，非剂量所决定。","B":"波动大，错误。","C":"不波动，错误。","D":"正确，剂量大则血药浓度高。","E":"低，与剂量大相反。"}},{"id":"ch03_q49","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"C","num":49,"stem":"影响 t1/2","options":{"A":"表观分布容积","B":"血浆清除率","C":"两者均是","D":"两者均否"},"answer":["C"],"answerStr":"C","rationale":"t1/2=0.693×Vd/CL，同时受表观分布容积和血浆清除率影响。","expl":{"A":"表观分布容积，影响t1/2但不完整。","B":"血浆清除率，影响t1/2但不完整。","C":"正确，两者均影响t1/2。","D":"错误。"}},{"id":"ch03_q50","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"C","num":50,"stem":"受肝肾功能影响","options":{"A":"表观分布容积","B":"血浆清除率","C":"两者均是","D":"两者均否"},"answer":["B"],"answerStr":"B","rationale":"血浆清除率主要由肝（代谢）和肾（排泄）功能决定，而表观分布容积主要受蛋白结合与组织分布影响。","expl":{"A":"表观分布容积，受肝肾功能影响较小。","B":"正确，血浆清除率受肝肾功能影响。","C":"错误。","D":"错误。"}},{"id":"ch03_q51","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"C","num":51,"stem":"受血浆蛋白结合影响","options":{"A":"表观分布容积","B":"血浆清除率","C":"两者均是","D":"两者均否"},"answer":["A"],"answerStr":"A","rationale":"血浆蛋白结合率影响药物分布，结合率高则游离少、表观分布容积小。","expl":{"A":"正确，表观分布容积受血浆蛋白结合影响。","B":"血浆清除率，主要受肝肾功能影响。","C":"错误。","D":"错误。"}},{"id":"ch03_q52","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"C","num":52,"stem":"影响消除速率常数","options":{"A":"表观分布容积","B":"血浆清除率","C":"两者均是","D":"两者均否"},"answer":["C"],"answerStr":"C","rationale":"ke=CL/Vd，消除速率常数同时受血浆清除率和表观分布容积影响。","expl":{"A":"表观分布容积，影响ke但不完整。","B":"血浆清除率，影响ke但不完整。","C":"正确，两者均影响消除速率常数。","D":"错误。"}},{"id":"ch03_q53","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"C","num":53,"stem":"药物主动转运的竞争性抑制可影响","options":{"A":"药物的药理学活性","B":"药效的持续时间","C":"两者均影响","D":"两者均不影响"},"answer":["B"],"answerStr":"B","rationale":"主动转运的竞争性抑制（如丙磺舒与青霉素）减慢排泄，延长药效持续时间，但不改变药物内在活性。","expl":{"A":"药理学活性，不改变药物内在活性。","B":"正确，竞争抑制减慢排泄，延长药效持续时间。","C":"错误。","D":"错误。"}},{"id":"ch03_q54","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"C","num":54,"stem":"药物与血浆蛋白结合的竞争性可影响","options":{"A":"药物的药理学活性","B":"药效的持续时间","C":"两者均影响","D":"两者均不影响"},"answer":["C"],"answerStr":"C","rationale":"血浆蛋白结合的竞争置换使游离药物增多，既增强药理活性又加速消除而缩短持续时间。","expl":{"A":"药理学活性，受影响但不完整。","B":"药效持续时间，受影响但不完整。","C":"正确，两者均受影响。","D":"错误。"}},{"id":"ch03_q55","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"C","num":55,"stem":"药物的肝肠循环可影响","options":{"A":"药物的药理学活性","B":"药效的持续时间","C":"两者均影响","D":"两者均不影响"},"answer":["B"],"answerStr":"B","rationale":"肝肠循环使药物经胆汁排泄后又重吸收，延长药效持续时间，但不改变药物内在活性。","expl":{"A":"药理学活性，不改变内在活性。","B":"正确，肝肠循环延长药效持续时间。","C":"错误。","D":"错误。"}},{"id":"ch03_q56","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"C","num":56,"stem":"药物的生物转化可影响","options":{"A":"药物的药理学活性","B":"药效的持续时间","C":"两者均影响","D":"两者均不影响"},"answer":["C"],"answerStr":"C","rationale":"生物转化既可活化或灭活药物（影响活性），又决定消除速度（影响持续时间）。","expl":{"A":"药理学活性，受影响但不完整。","B":"药效持续时间，受影响但不完整。","C":"正确，两者均受影响。","D":"错误。"}},{"id":"ch03_q57","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"X","num":57,"stem":"药物与血浆蛋白结合","options":{"A":"有利于药物进一步吸收","B":"有利于药物从肾脏排泄","C":"加快药物发生作用","D":"两种蛋白结合率高的药物易发生竞争置换现象","E":"血浆蛋白量低者易发生药物中毒"},"answer":["A","D","E"],"answerStr":"ADE","rationale":"药物与血浆蛋白结合为可逆结合，结合型可作贮库利于进一步吸收，结合率高者易竞争置换，血浆蛋白低者游离药物增多易中毒。","expl":{"A":"正确，结合减少游离药物，利于药物继续吸收。","B":"错误，结合型不被肾小球滤过，不利于排泄。","C":"错误，结合型暂时失活，减慢起效。","D":"正确，蛋白结合率高的药物易发生竞争置换。","E":"正确，血浆蛋白低时游离药物增多易中毒。"}},{"id":"ch03_q58","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"X","num":58,"stem":"关于一级动力学的描述，正确的是","options":{"A":"消除速率与当时药浓一次方成正比","B":"定量消除","C":"c-t 为直线","D":"t1/2 恒定","E":"大多数药物在治疗量时均为一级动力学"},"answer":["A","D","E"],"answerStr":"ADE","rationale":"一级动力学消除速率与血药浓度一次方成正比，t1/2恒定，多数药物治疗量下符合此规律。","expl":{"A":"正确，消除速率与当时药浓一次方成正比。","B":"错误，定量消除是零级动力学的特点。","C":"错误，c-t在半对数坐标上才是直线。","D":"正确，t1/2恒定。","E":"正确，多数药物治疗量下为一级动力学。"}},{"id":"ch03_q59","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"X","num":59,"stem":"表观分布容积的意义有","options":{"A":"反映药物吸收的量","B":"反映药物分布的广窄程度","C":"反映药物排泄的过程","D":"反映药物消除的速度","E":"估算欲达到有效药浓应投药量"},"answer":["B","E"],"answerStr":"BE","rationale":"表观分布容积反映药物分布的广窄程度，并可据此估算达到有效浓度所需剂量。","expl":{"A":"错误，Vd不反映药物吸收的量。","B":"正确，Vd反映药物分布的广窄程度。","C":"错误，Vd不反映排泄过程。","D":"错误，Vd不反映消除速度。","E":"正确，可用于估算达到有效药浓的投药量。"}},{"id":"ch03_q60","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"X","num":60,"stem":"属于药动学参数的有","options":{"A":"一级动力学","B":"半衰期","C":"表观分布容积","D":"二室模型","E":"生物利用度"},"answer":["B","C","E"],"answerStr":"BCE","rationale":"半衰期、表观分布容积、生物利用度均属药动学参数，而一级动力学和二室模型属模型类型。","expl":{"A":"错误，一级动力学是消除类型而非参数。","B":"正确，半衰期是药动学参数。","C":"正确，表观分布容积是药动学参数。","D":"错误，二室模型是模型而非参数。","E":"正确，生物利用度是药动学参数。"}},{"id":"ch03_q61","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"X","num":61,"stem":"经生物转化后的药物","options":{"A":"可具有活性","B":"有利于肾小管重吸收","C":"脂溶性增加","D":"失去药理活性","E":"极性升高"},"answer":["A","D","E"],"answerStr":"ADE","rationale":"药物经生物转化后可活化（前药）或灭活，一般极性升高、水溶性增加、脂溶性降低，不利于重吸收。","expl":{"A":"正确，前药经转化后可具有活性。","B":"错误，极性升高不利于肾小管重吸收。","C":"错误，脂溶性通常降低而非增加。","D":"正确，多数药物经转化后失去药理活性。","E":"正确，转化后极性升高。"}},{"id":"ch03_q62","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"X","num":62,"stem":"药物消除 t1/2 的影响因素有","options":{"A":"首关消除","B":"血浆蛋白结合率","C":"表观分布容积","D":"血浆清除率","E":"曲线下面积"},"answer":["C","D"],"answerStr":"CD","rationale":"t1/2=0.693×Vd/CL，故其影响因素为表观分布容积和血浆清除率。","expl":{"A":"错误，首关消除影响吸收量。","B":"错误，蛋白结合率不直接决定t1/2。","C":"正确，表观分布容积影响t1/2。","D":"正确，血浆清除率影响t1/2。","E":"错误，曲线下面积不决定t1/2。"}},{"id":"ch03_q63","chapter":"第三章 药物代谢动力学","chapterIdx":2,"type":"X","num":63,"stem":"药物与血浆蛋白结合的特点是","options":{"A":"暂时失去药理活性","B":"具可逆性","C":"特异性低","D":"结合点有限","E":"两药间可产生竞争性置换作用"},"answer":["A","B","C","D","E"],"answerStr":"ABCDE","rationale":"药物与血浆蛋白结合具有可逆性、饱和性、特异性低、暂时失活，且两药间可竞争性置换。","expl":{"A":"正确，结合型暂时失去药理活性。","B":"正确，结合具可逆性。","C":"正确，结合特异性低。","D":"正确，结合点有限（饱和性）。","E":"正确，两药间可产生竞争性置换。"}}]},{"title":"第四章 影响药物效应的因素","questions":[{"id":"ch04_q01","chapter":"第四章 影响药物效应的因素","chapterIdx":3,"type":"A","num":1,"stem":"患者长期服用口服避孕药后失效,可能是因为","options":{"A":"同时服用肝药酶诱导剂","B":"同时服用肝药酶抑制剂","C":"产生耐受性","D":"产生耐药性","E":"首关消除改变"},"answer":["A"],"answerStr":"A","rationale":"肝药酶诱导剂可加速口服避孕药代谢，使血药浓度下降而致避孕失败。","expl":{"A":"正确，肝药酶诱导剂加快避孕药代谢，降低其血药浓度而失效。","B":"肝药酶抑制剂减慢代谢、增强药效，不会导致避孕失败。","C":"耐受性指机体反应性降低，与避孕药被加速代谢的机制不符。","D":"耐药性针对病原体或肿瘤细胞，不适用于口服避孕药。","E":"首关消除改变并非长期服药后失效的常见原因。"}},{"id":"ch04_q02","chapter":"第四章 影响药物效应的因素","chapterIdx":3,"type":"A","num":2,"stem":"安慰剂是一种","options":{"A":"可以增加疗效的药物","B":"阳性对照药","C":"口服制剂","D":"使病人在精神上得到鼓励和安慰的药物","E":"不具有药理活性的剂型"},"answer":["E"],"answerStr":"E","rationale":"安慰剂是不含药理活性成分的制剂，主要通过心理作用产生效果。","expl":{"A":"安慰剂本身无药理活性，不能增加药物的实际疗效。","B":"安慰剂多作阴性对照药，而非阳性对照药。","C":"安慰剂不限于口服，剂型多样。","D":"使病人精神上得到安慰是其作用表现，并非安慰剂的定义。","E":"正确，安慰剂是不含活性成分、无药理活性的剂型。"}},{"id":"ch04_q03","chapter":"第四章 影响药物效应的因素","chapterIdx":3,"type":"A","num":3,"stem":"药物滥用是指","options":{"A":"医生用药不当","B":"未掌握药物适应症","C":"大量长期使用某种药物","D":"无病情根据的长期自我用药","E":"采用不恰当的剂量"},"answer":["D"],"answerStr":"D","rationale":"药物滥用指无医疗指征、非治疗目的的长期自行用药。","expl":{"A":"医生用药不当属于不合理处方，非药物滥用。","B":"未掌握适应证是处方错误，不属药物滥用。","C":"大量长期用药不一定是滥用，关键在于有无病情根据。","D":"正确，无病情根据的长期自我用药即药物滥用。","E":"采用不恰当剂量属用药差错，并非滥用。"}},{"id":"ch04_q04","chapter":"第四章 影响药物效应的因素","chapterIdx":3,"type":"A","num":4,"stem":"药物的配伍禁忌是指","options":{"A":"吸收后和血浆蛋白结合","B":"体外配伍过程中发生的物理和化学变化","C":"肝药酶活性的抑制","D":"两种药物在体内产生拮抗作用","E":"以上都不是"},"answer":["B"],"answerStr":"B","rationale":"配伍禁忌指药物在体外混合时发生的物理化学变化。","expl":{"A":"与血浆蛋白结合属体内分布过程，是药动学相互作用。","B":"正确，配伍禁忌是体外配伍时发生的物理化学变化。","C":"肝药酶抑制属体内代谢性相互作用。","D":"两药在体内拮抗属药效学相互作用。","E":"以上都不是，错误。"}},{"id":"ch04_q05","chapter":"第四章 影响药物效应的因素","chapterIdx":3,"type":"A","num":5,"stem":"长期应用某药后需要增加剂量才能奏效，这种现象称为","options":{"A":"耐药性","B":"耐受性","C":"成瘾性","D":"习惯性","E":"适应性"},"answer":["B"],"answerStr":"B","rationale":"机体对药物敏感性降低、需加大剂量才能奏效，称为耐受性。","expl":{"A":"耐药性指病原体或肿瘤细胞对药物敏感性降低。","B":"正确，长期用药后机体反应性降低、需增量即耐受性。","C":"成瘾性指停药后出现戒断症状的精神与躯体依赖。","D":"习惯性仅为精神依赖，无严重生理功能紊乱。","E":"适应性不是描述药物反应的专用术语。"}},{"id":"ch04_q06","chapter":"第四章 影响药物效应的因素","chapterIdx":3,"type":"A","num":6,"stem":"利用药物协同作用的目的是","options":{"A":"增加药物在肝脏的代谢","B":"增加药物在受体水平的拮抗","C":"增加药物的吸收","D":"增加药物的排泄","E":"增加药物的疗效"},"answer":["E"],"answerStr":"E","rationale":"药物协同作用使合用后效应增强，其目的即为提高疗效。","expl":{"A":"增加肝代谢会降低血药浓度，非协同目的。","B":"受体水平拮抗属拮抗作用，非协同。","C":"增加吸收不是协同作用的核心目的。","D":"增加排泄会降低药效，非协同目的。","E":"正确，利用协同作用旨在增强药物疗效。"}},{"id":"ch04_q07","chapter":"第四章 影响药物效应的因素","chapterIdx":3,"type":"A","num":7,"stem":"遗传异常主要表现在","options":{"A":"对药物肾脏排泄的异常","B":"对药物体内转化的异常","C":"对药物体内分布的异常","D":"对药物胃肠吸收的异常","E":"对药物引起的效应异常"},"answer":["E"],"answerStr":"E","rationale":"遗传异常最终表现为机体对药物效应的异常改变。","expl":{"A":"肾排泄异常仅为遗传影响的局部表现，不全面。","B":"体内转化异常只是遗传影响的一个方面。","C":"分布异常也只是遗传影响的局部表现。","D":"胃肠吸收异常仅为遗传影响的局部表现。","E":"正确，遗传异常主要表现为对药物引起的效应异常。"}},{"id":"ch04_q08","chapter":"第四章 影响药物效应的因素","chapterIdx":3,"type":"A","num":8,"stem":"影响药动学相互作用的方式不包括","options":{"A":"肝脏生物转化","B":"吸收","C":"血浆蛋白结合","D":"排泄","E":"生理性拮抗"},"answer":["E"],"answerStr":"E","rationale":"生理性拮抗属药效学相互作用，不属于药动学相互作用。","expl":{"A":"肝脏生物转化属药动学的代谢环节。","B":"吸收属药动学环节。","C":"血浆蛋白结合属药动学的分布环节。","D":"排泄属药动学环节。","E":"正确，生理性拮抗属药效学范畴，不属药动学相互作用。"}},{"id":"ch04_q09","chapter":"第四章 影响药物效应的因素","chapterIdx":3,"type":"B","num":9,"stem":"短时间内反复应用数次药效递减直至消失","options":{"A":"耐受性","B":"耐药性","C":"成瘾性","D":"习惯性","E":"快速耐受性"},"answer":["E"],"answerStr":"E","rationale":"短时间内反复用药后药效迅速递减乃至消失，即快速耐受性。","expl":{"A":"耐受性多需较长期用药后才出现。","B":"耐药性针对病原体或肿瘤细胞。","C":"成瘾性表现为停药后出现戒断症状。","D":"习惯性仅为精神依赖。","E":"正确，短时反复用药药效迅速递减为快速耐受性。"}},{"id":"ch04_q10","chapter":"第四章 影响药物效应的因素","chapterIdx":3,"type":"B","num":10,"stem":"病原体及肿瘤细胞对化学治疗药物的敏感性降低","options":{"A":"耐受性","B":"耐药性","C":"成瘾性","D":"习惯性","E":"快速耐受性"},"answer":["B"],"answerStr":"B","rationale":"病原体及肿瘤细胞对化疗药物敏感性降低称为耐药性。","expl":{"A":"耐受性是机体对药物的反应性降低。","B":"正确，病原体及肿瘤细胞敏感性降低即耐药性。","C":"成瘾性为停药后出现戒断症状。","D":"习惯性仅为精神依赖。","E":"快速耐受性指短时用药药效迅速递减。"}},{"id":"ch04_q11","chapter":"第四章 影响药物效应的因素","chapterIdx":3,"type":"B","num":11,"stem":"长期用药后突然停药发生严重的生理功能紊乱","options":{"A":"耐受性","B":"耐药性","C":"成瘾性","D":"习惯性","E":"快速耐受性"},"answer":["C"],"answerStr":"C","rationale":"长期用药后突然停药出现严重生理功能紊乱，是成瘾性的表现。","expl":{"A":"耐受性指需增加剂量才能奏效。","B":"耐药性针对病原体或肿瘤细胞。","C":"正确，停药后严重生理功能紊乱是成瘾性的戒断反应。","D":"习惯性仅精神依赖，无严重生理紊乱。","E":"快速耐受性指短时反复用药药效递减。"}},{"id":"ch04_q12","chapter":"第四章 影响药物效应的因素","chapterIdx":3,"type":"C","num":12,"stem":"维拉帕米","options":{"A":"肝药酶抑制","B":"遗传异常影响效应","C":"两者均有","D":"两者均无"},"answer":["D"],"answerStr":"D","rationale":"维拉帕米为钙通道阻滞药，既非典型肝药酶抑制剂，也无遗传异常影响效应。","expl":{"A":"肝药酶抑制并非维拉帕米的特点。","B":"遗传异常影响效应并非维拉帕米的特点。","C":"两者均有，错误。","D":"正确，维拉帕米两者均无。"}},{"id":"ch04_q13","chapter":"第四章 影响药物效应的因素","chapterIdx":3,"type":"C","num":13,"stem":"伯氨喹","options":{"A":"肝药酶抑制","B":"遗传异常影响效应","C":"两者均有","D":"两者均无"},"answer":["B"],"answerStr":"B","rationale":"伯氨喹在G6PD缺乏者中可诱发溶血，属遗传异常影响效应。","expl":{"A":"肝药酶抑制不是伯氨喹的主要作用。","B":"正确，G6PD缺乏者用伯氨喹易致溶血，属遗传异常影响效应。","C":"两者均有，错误。","D":"两者均无，错误。"}},{"id":"ch04_q14","chapter":"第四章 影响药物效应的因素","chapterIdx":3,"type":"C","num":14,"stem":"异烟肼","options":{"A":"肝药酶抑制","B":"遗传异常影响效应","C":"两者均有","D":"两者均无"},"answer":["C"],"answerStr":"C","rationale":"异烟肼既抑制肝药酶，又存在乙酰化快慢型的遗传多态性。","expl":{"A":"肝药酶抑制是异烟肼的特点之一。","B":"遗传异常影响效应（乙酰化快慢型）亦为其特点。","C":"正确，异烟肼两者均有。","D":"两者均无，错误。"}},{"id":"ch04_q15","chapter":"第四章 影响药物效应的因素","chapterIdx":3,"type":"C","num":15,"stem":"西米替丁","options":{"A":"肝药酶抑制","B":"遗传异常影响效应","C":"两者均有","D":"两者均无"},"answer":["A"],"answerStr":"A","rationale":"西咪替丁是典型的肝药酶抑制剂。","expl":{"A":"正确，西咪替丁抑制肝药酶，减慢药物代谢。","B":"遗传异常影响效应并非西咪替丁的特点。","C":"两者均有，错误。","D":"两者均无，错误。"}},{"id":"ch04_q16","chapter":"第四章 影响药物效应的因素","chapterIdx":3,"type":"X","num":16,"stem":"联合应用两种以上药物的目的在于","options":{"A":"减少单味药用量","B":"减少不良反应","C":"增强疗效","D":"延缓耐药性发生","E":"改变遗传异常表现的快及慢代谢型"},"answer":["A","B","C"],"answerStr":"ABC","rationale":"联合用药可增强疗效、减少不良反应并减少单味药用量。","expl":{"A":"正确，联合用药可减少单味药用量。","B":"正确，合理联合可减少不良反应。","C":"正确，联合用药可增强疗效。","D":"延缓耐药性主要用于抗感染药物，非一般联合用药的普遍目的。","E":"改变遗传快慢代谢型不是联合用药的目的。"}},{"id":"ch04_q17","chapter":"第四章 影响药物效应的因素","chapterIdx":3,"type":"X","num":17,"stem":"连续用药后，机体对药物的反应发生改变，包括","options":{"A":"耐药性","B":"耐受性","C":"依赖性","D":"药物慢代谢型","E":"快速耐受"},"answer":["B","C","E"],"answerStr":"BCE","rationale":"连续用药后机体反应改变包括耐受性、依赖性和快速耐受性。","expl":{"A":"耐药性针对病原体或肿瘤细胞，非机体对药物的反应改变。","B":"正确，耐受性是连续用药后机体反应性降低。","C":"正确，依赖性是连续用药后机体产生的状态。","D":"药物慢代谢型属遗传多态性，非连续用药所致。","E":"正确，快速耐受是短时反复用药的反应改变。"}},{"id":"ch04_q18","chapter":"第四章 影响药物效应的因素","chapterIdx":3,"type":"X","num":18,"stem":"舌下给药的特点是","options":{"A":"可避免肝肠循环","B":"可避免胃酸破坏","C":"吸收极慢","D":"可避免首过效应","E":"吸收较迅速"},"answer":["B","C","D","E"],"answerStr":"BCDE","rationale":"舌下给药不经消化道和门静脉，可避免胃酸破坏与首过效应，吸收较口服迅速。","expl":{"A":"肝肠循环指药物经胆汁排入肠后再被吸收，与舌下给药途径无直接关系。","B":"正确，舌下给药不经胃，可避免胃酸破坏。","C":"正确，舌下给药经口腔黏膜吸收，吸收量有限、速度慢于静脉给药。","D":"正确，舌下给药不经门静脉和肝脏，可避免首过效应。","E":"正确，舌下给药较口服吸收迅速，起效快。"}},{"id":"ch04_q19","chapter":"第四章 影响药物效应的因素","chapterIdx":3,"type":"X","num":19,"stem":"联合用药可发生的作用包括","options":{"A":"拮抗作用","B":"配伍禁忌","C":"协同作用","D":"个体差异","E":"药剂当量"},"answer":["A","B","C"],"answerStr":"ABC","rationale":"联合用药可产生协同作用、拮抗作用及配伍禁忌。","expl":{"A":"正确，联合用药可发生拮抗作用。","B":"正确，联合用药体外配伍可发生配伍禁忌。","C":"正确，联合用药可发生协同作用。","D":"个体差异是机体自身特点，非联合用药产生的作用。","E":"药剂当量属制剂学概念，非联合用药产生的作用。"}},{"id":"ch04_q20","chapter":"第四章 影响药物效应的因素","chapterIdx":3,"type":"X","num":20,"stem":"影响药代动力学的因素有","options":{"A":"胃肠吸收","B":"血浆蛋白结合","C":"干扰神经递质的转运","D":"肾脏排泄","E":"肝脏生物转化"},"answer":["A","B","D","E"],"answerStr":"ABDE","rationale":"影响药动学的因素包括吸收、分布（蛋白结合）、代谢和排泄。","expl":{"A":"正确，胃肠吸收影响药物的吸收过程。","B":"正确，血浆蛋白结合影响药物分布。","C":"干扰神经递质转运属药效学作用，非药动学因素。","D":"正确，肾脏排泄影响药物消除。","E":"正确，肝脏生物转化影响药物代谢。"}}]},{"title":"第五章 传出神经系统药物概论","questions":[{"id":"ch05_q01","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"A","num":1,"stem":"下列哪种效应不是通过激动 M 受体实现的","options":{"A":"心率减慢","B":"胃肠道平滑肌收缩","C":"胃肠道括约肌收缩","D":"膀胱括约肌舒张","E":"瞳孔括约肌收缩"},"answer":["C"],"answerStr":"C","rationale":"激动M受体使胃肠道括约肌舒张而非收缩，故C不是M受体效应。","expl":{"A":"心率减慢是激动心脏M受体的效应。","B":"胃肠道平滑肌收缩是M受体激动效应。","C":"正确，M受体激动使胃肠道括约肌舒张，而非收缩。","D":"膀胱括约肌舒张是M受体激动效应。","E":"瞳孔括约肌收缩是M受体激动效应。"}},{"id":"ch05_q02","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"A","num":2,"stem":"胆碱能神经不包括","options":{"A":"交感、副交感神经节前纤维","B":"交感神经节后纤维的大部分","C":"副交感神经节后纤维","D":"运动神经","E":"支配汗腺的分泌神经"},"answer":["B"],"answerStr":"B","rationale":"交感神经节后纤维大部分为肾上腺素能纤维，不属胆碱能神经。","expl":{"A":"交感、副交感节前纤维均为胆碱能纤维。","B":"正确，交感节后纤维大部分属肾上腺素能，不属胆碱能神经。","C":"副交感节后纤维为胆碱能纤维。","D":"运动神经为胆碱能神经。","E":"支配汗腺的分泌神经为交感节后胆碱能纤维。"}},{"id":"ch05_q03","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"A","num":3,"stem":"骨骼肌血管平滑肌上有","options":{"A":"α 受体、β 受体、无 M 受体","B":"α 受体、M 受体、无 β 受体","C":"α 受体、β 受体及M 受体","D":"α 受体、无 β 受体及 M 受体","E":"M 受体、无 α 受体及 β 受体"},"answer":["C"],"answerStr":"C","rationale":"骨骼肌血管平滑肌同时分布有α、β和M受体。","expl":{"A":"骨骼肌血管有M受体，并非无M受体。","B":"骨骼肌血管有β受体，并非无β受体。","C":"正确，骨骼肌血管平滑肌上同时有α、β及M受体。","D":"骨骼肌血管有β和M受体，并非无β及M受体。","E":"骨骼肌血管亦有α、β受体，并非仅M受体。"}},{"id":"ch05_q04","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"A","num":4,"stem":"乙酰胆碱作用消失主要依赖于","options":{"A":"摄取 1","B":"摄取 2","C":"胆碱乙酰转移酶的作用","D":"胆碱酯酶水解","E":"以上都不对"},"answer":["D"],"answerStr":"D","rationale":"乙酰胆碱释放后主要被胆碱酯酶水解而失活。","expl":{"A":"摄取1是去甲肾上腺素的消除方式，非ACh。","B":"摄取2也是去甲肾上腺素的消除方式，非ACh。","C":"胆碱乙酰转移酶催化ACh合成，非分解。","D":"正确，ACh作用消失主要依赖胆碱酯酶水解。","E":"以上都不对，错误。"}},{"id":"ch05_q05","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"A","num":5,"stem":"能选择性的与毒蕈碱结合的胆碱受体称为","options":{"A":"M 受体","B":"N 受体","C":"α 受体","D":"β 受体","E":"DA 受体"},"answer":["A"],"answerStr":"A","rationale":"能选择性被毒蕈碱激动并与之结合的胆碱受体称M受体。","expl":{"A":"正确，与毒蕈碱选择性结合的胆碱受体为M受体。","B":"N受体与烟碱选择性结合。","C":"α受体属肾上腺素受体，非胆碱受体。","D":"β受体属肾上腺素受体。","E":"DA受体是多巴胺受体。"}},{"id":"ch05_q06","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"A","num":6,"stem":"下列哪种效应是通过激动 M-R 实现的？","options":{"A":"膀胱括约肌收缩","B":"骨骼肌收缩","C":"虹膜辐射肌收缩","D":"汗腺分泌","E":"睫状肌舒张"},"answer":["D"],"answerStr":"D","rationale":"汗腺分泌受M受体激动支配，故属M受体效应。","expl":{"A":"膀胱括约肌在M激动时是舒张，非收缩。","B":"骨骼肌收缩经N2受体，非M受体。","C":"虹膜辐射肌收缩是α受体效应（扩瞳）。","D":"正确，汗腺分泌由交感节后胆碱能纤维经M受体介导。","E":"睫状肌在M激动时收缩，非舒张。"}},{"id":"ch05_q07","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"A","num":7,"stem":"ACh 作用的消失，主要","options":{"A":"被突触前膜再摄取","B":"是扩散入血液中被肝肾破坏","C":"被神经未梢的胆碱乙酰化酶水解","D":"被神经突触部位的胆碱酯酶水解","E":"在突触间隙被 MAO 所破坏"},"answer":["D"],"answerStr":"D","rationale":"ACh释放后主要被突触部位的胆碱酯酶水解失活。","expl":{"A":"被突触前膜再摄取是NA的消除方式，非ACh。","B":"扩散入血被肝肾破坏并非ACh失活的主要方式。","C":"胆碱乙酰化酶催化合成，非水解。","D":"正确，ACh主要被突触部位的胆碱酯酶水解。","E":"MAO主要破坏单胺类递质，非ACh。"}},{"id":"ch05_q08","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"A","num":8,"stem":"M 样作用是指","options":{"A":"烟碱样作用","B":"心脏兴奋、血管扩张、平滑肌松驰","C":"骨骼肌收缩","D":"血管收缩、扩瞳","E":"心脏抑制、腺体分泌增加、胃肠平滑肌收缩"},"answer":["E"],"answerStr":"E","rationale":"M样作用指心脏抑制、腺体分泌增加、胃肠平滑肌收缩等表现。","expl":{"A":"烟碱样作用由N受体介导，非M样作用。","B":"心脏兴奋、血管扩张、平滑肌松弛非M样作用组合。","C":"骨骼肌收缩为N样作用。","D":"血管收缩、扩瞳是α受体效应。","E":"正确，心脏抑制、腺体分泌增加、胃肠平滑肌收缩为M样作用。"}},{"id":"ch05_q09","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"A","num":9,"stem":"在囊泡内合成 NA 的前身物质是","options":{"A":"酪氨酸","B":"多巴","C":"多巴胺","D":"肾上腺素","E":"5-羟色胺"},"answer":["C"],"answerStr":"C","rationale":"囊泡内的多巴胺经多巴胺β-羟化酶转化为去甲肾上腺素，故前身是多巴胺。","expl":{"A":"酪氨酸是多巴的前体，在胞质中转化。","B":"多巴在胞质中经脱羧生成多巴胺。","C":"正确，囊泡内合成NA的直接前身物质是多巴胺。","D":"肾上腺素由NA甲基化而来，非NA前身。","E":"5-羟色胺与NA合成无关。"}},{"id":"ch05_q10","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"A","num":10,"stem":"下列哪种表现不属于 β-R 兴奋效应","options":{"A":"支气管舒张","B":"血管扩张","C":"心脏兴奋","D":"瞳孔扩大","E":"肾素分泌"},"answer":["D"],"answerStr":"D","rationale":"瞳孔扩大由α受体介导（辐射肌收缩），不属β受体兴奋效应。","expl":{"A":"支气管舒张是β2受体兴奋效应。","B":"骨骼肌、冠脉血管扩张是β2受体效应。","C":"心脏兴奋是β1受体效应。","D":"正确，瞳孔扩大为α受体效应，非β受体兴奋表现。","E":"肾素分泌由β1受体介导。"}},{"id":"ch05_q11","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"A","num":11,"stem":"某受体被激动后，引起支气管平滑肌松驰，此受体为：","options":{"A":"α-R","B":"β1-R","C":"β2-R","D":"M-R","E":"N1-R"},"answer":["C"],"answerStr":"C","rationale":"支气管平滑肌松弛由β2受体激动介导。","expl":{"A":"α受体激动使血管收缩等，不引起支气管舒张。","B":"β1受体主要兴奋心脏，非支气管。","C":"正确，激动β2受体使支气管平滑肌松弛。","D":"M受体激动使支气管收缩。","E":"N1受体位于自主神经节，非支气管平滑肌。"}},{"id":"ch05_q12","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"A","num":12,"stem":"去甲肾上腺素减慢心率的机制是","options":{"A":"直接负性频率作用","B":"抑制窦房结","C":"阻断窦房结的 β 1-R","D":"外周阻力升高致间接刺激压力感受器","E":"激动心脏 M-R"},"answer":["D"],"answerStr":"D","rationale":"NA收缩血管使外周阻力升高、血压上升，反射性兴奋压力感受器减慢心率。","expl":{"A":"NA对心脏为直接正性频率作用，非负性。","B":"NA不直接抑制窦房结。","C":"NA不阻断窦房结β1受体。","D":"正确，外周阻力升高刺激压力感受器，反射性减慢心率。","E":"NA不激动心脏M受体。"}},{"id":"ch05_q13","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"A","num":13,"stem":"多巴胺 β-羟化酶主要存在于","options":{"A":"去甲肾上腺素能神经末梢膨体内","B":"去甲肾上腺素能神经末梢囊泡内","C":"去甲肾上腺素能神经突触间隙","D":"胆碱能神经突触间隙","E":"胆碱能神经突触前膜"},"answer":["B"],"answerStr":"B","rationale":"多巴胺β-羟化酶存在于去甲肾上腺素能神经末梢的囊泡内。","expl":{"A":"该酶位于囊泡内，并非末梢膨体胞质。","B":"正确，多巴胺β-羟化酶存在于囊泡内。","C":"突触间隙不含该酶。","D":"胆碱能神经不含多巴胺β-羟化酶。","E":"胆碱能神经突触前膜不含该酶。"}},{"id":"ch05_q14","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"A","num":14,"stem":"α-R 分布占优势的效应器是","options":{"A":"皮肤、粘膜、内脏血管","B":"冠状动脉血管","C":"肾血管","D":"脑血管","E":"肌肉血管"},"answer":["A"],"answerStr":"A","rationale":"皮肤、黏膜、内脏血管以α受体占优势，激动时收缩。","expl":{"A":"正确，皮肤、黏膜、内脏血管α受体占优势。","B":"冠脉以β2受体占优势，非α。","C":"肾血管α受体亦较多，但皮肤黏膜内脏血管更典型。","D":"脑血管受体复杂，α不占绝对优势。","E":"肌肉血管以β2受体占优势。"}},{"id":"ch05_q15","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"A","num":15,"stem":"关于 N2-R 结构和偶联的叙述，正确的是","options":{"A":"属 G-蛋白偶联受体","B":"由 3 个亚单位组成","C":"肽链的 N-端在细胞膜外，C-端在细胞内","D":"为 7 次跨膜的肽链","E":"属配体、门控通道型受体"},"answer":["E"],"answerStr":"E","rationale":"N2受体属配体门控离子通道型受体，非G蛋白偶联。","expl":{"A":"N2受体非G蛋白偶联受体。","B":"N2受体由5个亚单位组成，非3个。","C":"N受体亚单位N端、C端均在细胞外，此说法错误。","D":"7次跨膜是G蛋白偶联受体特点，N2受体亚单位仅4次跨膜。","E":"正确，N2受体属配体门控通道型受体。"}},{"id":"ch05_q16","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"B","num":16,"stem":"睫状肌的优势受体是","options":{"A":"α-R","B":"β 1-R","C":"β2-R","D":"M-R","E":"N-R"},"answer":["D"],"answerStr":"D","rationale":"睫状肌主要受M受体支配，激动时收缩。","expl":{"A":"α受体不支配睫状肌。","B":"β1受体不支配睫状肌。","C":"β2受体不支配睫状肌。","D":"正确，睫状肌的优势受体是M受体。","E":"N受体不在睫状肌。"}},{"id":"ch05_q17","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"B","num":17,"stem":"肾血管的优势受体是","options":{"A":"α-R","B":"β 1-R","C":"β2-R","D":"M-R","E":"N-R"},"answer":["A"],"answerStr":"A","rationale":"肾血管以α受体占优势。","expl":{"A":"正确，肾血管的优势受体是α受体。","B":"β1受体主要分布于心脏。","C":"β2受体主要分布于支气管和骨骼肌血管。","D":"M受体不分布于肾血管。","E":"N受体位于神经节和骨骼肌。"}},{"id":"ch05_q18","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"B","num":18,"stem":"骨骼肌血管的优势受体是","options":{"A":"α-R","B":"β 1-R","C":"β2-R","D":"M-R","E":"N-R"},"answer":["C"],"answerStr":"C","rationale":"骨骼肌血管以β2受体占优势，激动时舒张。","expl":{"A":"骨骼肌血管α受体较少，非优势。","B":"β1受体主要在心脏。","C":"正确，骨骼肌血管的优势受体是β2受体。","D":"骨骼肌血管有M受体但非优势。","E":"N受体不在骨骼肌血管。"}},{"id":"ch05_q19","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"B","num":19,"stem":"抑制突触前膜 NA 释放的受体是","options":{"A":"D1","B":"D2","C":"α 1","D":"α2","E":"N1"},"answer":["D"],"answerStr":"D","rationale":"突触前膜α2受体兴奋可抑制NA释放，起负反馈作用。","expl":{"A":"D1受体与NA释放无直接关系。","B":"D2受体与NA释放无直接关系。","C":"α1受体主要介导血管收缩等效应。","D":"正确，激动突触前膜α2受体可抑制NA释放。","E":"N1受体位于神经节。"}},{"id":"ch05_q20","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"B","num":20,"stem":"促进肾上腺髓质释放 NA 、AD 的受体是","options":{"A":"D1","B":"D2","C":"α 1","D":"α2","E":"N1"},"answer":["E"],"answerStr":"E","rationale":"肾上腺髓质受交感节前胆碱能纤维支配，其N1受体激动促进分泌。","expl":{"A":"D1受体不参与肾上腺髓质分泌。","B":"D2受体不参与肾上腺髓质分泌。","C":"α1受体不促进肾上腺髓质释放。","D":"α2受体不促进肾上腺髓质释放。","E":"正确，激动N1受体促进肾上腺髓质释放NA、AD。"}},{"id":"ch05_q21","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"B","num":21,"stem":"与锥体外运动有关的受体是","options":{"A":"D1","B":"D2","C":"α 1","D":"α2","E":"N1"},"answer":["B"],"answerStr":"B","rationale":"黑质-纹状体通路的多巴胺D2受体与锥体外系运动功能有关。","expl":{"A":"D1受体与锥体外系运动关系相对较小。","B":"正确，D2受体与锥体外系运动功能密切相关。","C":"α1受体与锥体外系运动无关。","D":"α2受体与锥体外系运动无关。","E":"N1受体与锥体外系运动无关。"}},{"id":"ch05_q22","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"C","num":22,"stem":"M-R 激动时","options":{"A":"胃肠蠕动加强","B":"心脏收缩加快","C":"两者都是","D":"两者都不是"},"answer":["A"],"answerStr":"A","rationale":"M受体激动使胃肠蠕动加强，但使心脏收缩减慢减弱。","expl":{"A":"正确，M受体激动使胃肠蠕动加强。","B":"M受体激动使心脏收缩减慢减弱，非加快。","C":"两者都是，错误。","D":"两者都不是，错误。"}},{"id":"ch05_q23","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"C","num":23,"stem":"N1-R 激动时","options":{"A":"胃肠蠕动加强","B":"心脏收缩加快","C":"两者都是","D":"两者都不是"},"answer":["C"],"answerStr":"C","rationale":"N1受体激动兴奋自主神经节，使胃肠蠕动加强且心脏收缩加快。","expl":{"A":"胃肠蠕动加强是N1激动效应之一。","B":"心脏收缩加快也是N1激动效应之一。","C":"正确，N1激动使胃肠蠕动加强且心脏收缩加快。","D":"两者都不是，错误。"}},{"id":"ch05_q24","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"C","num":24,"stem":"α-R 激动时","options":{"A":"胃肠蠕动加强","B":"心脏收缩加快","C":"两者都是","D":"两者都不是"},"answer":["D"],"answerStr":"D","rationale":"α受体激动主要收缩血管，不直接加强胃肠蠕动和心脏收缩。","expl":{"A":"α激动不加强胃肠蠕动。","B":"α激动不加快心脏收缩。","C":"两者都是，错误。","D":"正确，α受体激动两者都不是。"}},{"id":"ch05_q25","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"X","num":25,"stem":"去甲肾上腺素消除的方式是","options":{"A":"单胺氧化酶破坏","B":"环加氧酶氧 化","C":"儿茶酚氧位甲基转移酶破坏","D":"经突触前膜摄取","E":"磷酸二酯酶代谢"},"answer":["A","C","D"],"answerStr":"ACD","rationale":"NA主要经突触前膜摄取及MAO、COMT破坏而消除。","expl":{"A":"正确，MAO可氧化破坏NA。","B":"环加氧酶参与前列腺素合成，不代谢NA。","C":"正确，COMT可破坏NA。","D":"正确，NA经突触前膜摄取是主要消除方式。","E":"磷酸二酯酶分解cAMP，不代谢NA。"}},{"id":"ch05_q26","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"X","num":26,"stem":"M 受体兴奋时的效应是","options":{"A":"腺体分泌增加","B":"胃肠平滑肌收缩","C":"瞳孔缩小","D":"A-V 传导加快","E":"心率减慢"},"answer":["A","B","C","E"],"answerStr":"ABCE","rationale":"M受体兴奋表现为腺体分泌、胃肠收缩、缩瞳和心率减慢。","expl":{"A":"正确，M受体兴奋使腺体分泌增加。","B":"正确，M受体兴奋使胃肠平滑肌收缩。","C":"正确，M受体兴奋使瞳孔括约肌收缩、瞳孔缩小。","D":"M受体兴奋使房室传导减慢，非加快。","E":"正确，M受体兴奋使心率减慢。"}},{"id":"ch05_q27","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"X","num":27,"stem":"关于去甲肾上腺素的描述，哪些是正确的","options":{"A":"主要兴奋a 受体","B":"是肾上腺素能神经释放的递质","C":"升压时易出现双向反应","D":"在整体情况下出现心率减慢","E":"引起冠状动脉收缩"},"answer":["A","B","D"],"answerStr":"ABD","rationale":"NA主要兴奋α受体、是肾上腺素能递质，整体升压时反射性心率减慢。","expl":{"A":"正确，NA主要兴奋α受体。","B":"正确，NA是肾上腺素能神经释放的递质。","C":"双向反应（先升后降）是肾上腺素的特点，NA无。","D":"正确，NA升压后经压力感受器反射性减慢心率。","E":"NA整体使冠脉血流量增加，不引起冠脉收缩。"}},{"id":"ch05_q28","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"X","num":28,"stem":"N 受体激动时可引起","options":{"A":"自主神经节兴奋","B":"肾上腺髓质分泌","C":"骨骼肌收缩","D":"汗腺分泌减少","E":"递质释放减少"},"answer":["A","B","C"],"answerStr":"ABC","rationale":"N受体激动可兴奋自主神经节、促进肾上腺髓质分泌并收缩骨骼肌。","expl":{"A":"正确，N1受体激动使自主神经节兴奋。","B":"正确，N1受体激动促进肾上腺髓质分泌。","C":"正确，N2受体激动使骨骼肌收缩。","D":"N受体激动使汗腺分泌增加，非减少。","E":"N受体激动促进递质释放，非减少。"}},{"id":"ch05_q29","chapter":"第五章 传出神经系统药物概论","chapterIdx":4,"type":"X","num":29,"stem":"β 受体激动是可产生下列那些效应","options":{"A":"心率加快","B":"血管收
